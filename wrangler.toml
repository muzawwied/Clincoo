# Cloudflare Pages — project: clincoo (app.clincoo.buzz)
# ⛔ JANGAN deploy langsung dari sini! Produksi terhubung auto-deploy dengan repo git (branch main).
# Deploy produksi HANYA lewat: git commit + git push origin main (build otomatis).
# wrangler pages deploy hanya untuk project preview/mirror — upload langsung ke produksi akan menimpa
# build dari git dengan versi basi dan merusak halaman (sudah terjadi berkali-kali). Lihat README.md.
# Secrets & extra bindings dikelola di dashboard Pages.
name = "clincoo"
compatibility_date = "2024-09-01"
pages_build_output_dir = "."

[[d1_databases]]
binding = "DB"
database_name = "clincoo-db"
database_id = "49b6fed3-a237-46e3-ab2b-b0de31cc862b"

[[d1_databases]]
binding = "WALLET_DB"
database_name = "wallet-db"
database_id = "59e17832-235d-4bb4-b09e-a7f5f9c1f8db"

[ai]
binding = "AI"
