    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap');
        
        html, body {
            height: 100dvh;
            height: -webkit-fill-available;
            overflow: hidden;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: #ffffff; 
            color: #000000;
            -webkit-tap-highlight-color: transparent;
        }

        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: #e5e7eb;
            border-radius: 10px;
        }

        .gradient-line {
            height: 1px;
            width: 100%;
            background: linear-gradient(90deg, rgba(255,255,255,1) 0%, rgba(156,163,175,0.3) 50%, rgba(255,255,255,1) 100%);
        }

        .fade-in {
            animation: fadeIn 0.3s ease-in-out forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(5px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .typing-cursor::after {
            content: '|';
            animation: blink 1s step-start infinite;
            color: #9ca3af;
            margin-left: 2px;
        }
        
        .typing-cursor > p:last-child {
            display: inline;
        }

        @keyframes blink {
            50% { opacity: 0; }
        }

        .shiny-text {
            background: linear-gradient(110deg, #000000 35%, #9ca3af 50%, #000000 65%);
            background-size: 200% auto;
            color: transparent;
            -webkit-background-clip: text;
            background-clip: text;
            animation: shine 3s linear infinite;
        }

        @keyframes shine {
            0% { background-position: 200% center; }
            100% { background-position: -200% center; }
        }

        .font-montserrat {
            font-family: 'Montserrat', sans-serif;
        }

        .shimmer-search {
            display: inline-flex;
            align-items: center;
            gap: 0.375rem;
            background: linear-gradient(90deg, #6b7280 0%, #d1d5db 50%, #6b7280 100%);
            background-size: 200% auto;
            color: transparent;
            -webkit-background-clip: text;
            background-clip: text;
            animation: shimmerText 2s linear infinite;
            font-weight: 500;
            font-size: 0.95rem;
        }

        @keyframes shimmerText {
            0% { background-position: -200% center; }
            100% { background-position: 200% center; }
        }

        /* ===== Baris "thinking" — satu baris, transparan, ikon titik + teks shimmer ===== */
        .ai-think-line {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            background: transparent;
            max-width: 100%;
        }
        .ai-think-dots { display: inline-flex; gap: 0.2rem; flex: none; }
        .ai-think-dots span {
            width: 0.32rem; height: 0.32rem; border-radius: 9999px; background: #9ca3af;
            animation: aiDotPulse 1.3s ease-in-out infinite;
        }
        .ai-think-dots span:nth-child(2) { animation-delay: 0.18s; }
        .ai-think-dots span:nth-child(3) { animation-delay: 0.36s; }
        @keyframes aiDotPulse { 0%, 80%, 100% { opacity: 0.3; } 40% { opacity: 1; } }
        .ai-think-text {
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%;
            font-size: 0.9rem; font-weight: 500;
            background: linear-gradient(90deg, #6b7280 0%, #f3f4f6 50%, #6b7280 100%);
            background-size: 200% auto;
            color: transparent;
            -webkit-background-clip: text;
            background-clip: text;
            animation: shimmerText 2s linear infinite;
        }

        @keyframes bounceDot {
            0%, 80%, 100% { transform: scale(0.6); opacity: 0.4; }
            40% { transform: scale(1); opacity: 1; }
        }

        .bouncing-dots {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 4px 0;
        }

        .bouncing-dot {
            width: 5px;
            height: 5px;
            background-color: #374151;
            border-radius: 50%;
            animation: bounceDot 1.4s infinite ease-in-out both;
        }

        .bouncing-dot:nth-child(1) { animation-delay: 0s; }
        .bouncing-dot:nth-child(2) { animation-delay: 0.2s; }
        .bouncing-dot:nth-child(3) { animation-delay: 0.4s; }

        details > summary {
            list-style: none;
        }
        details > summary::-webkit-details-marker {
            display: none;
        }

        .hljs {

        .code-container::-webkit-scrollbar {

        .md-content h1 { font-size: 1.5rem; font-weight: 700; margin-top: 1.5rem; margin-bottom: 0.75rem; color: #000; }
        .md-content h2 { font-size: 1.25rem; font-weight: 700; margin-top: 1.25rem; margin-bottom: 0.5rem; color: #000; }
        .md-content h3 { font-size: 1.125rem; font-weight: 700; margin-top: 1rem; margin-bottom: 0.5rem; color: #000; }
        .md-content h4, .md-content h5, .md-content h6 { font-size: 1rem; font-weight: 600; margin-top: 1rem; margin-bottom: 0.5rem; color: #000; }
        .md-content p { margin-bottom: 0.5rem; }
        .md-content p:last-child { margin-bottom: 0; }
        .md-content ul { list-style-type: disc; margin-left: 1.25rem; margin-bottom: 0.5rem; }
        .md-content ol { list-style-type: decimal; margin-left: 1.25rem; margin-bottom: 0.5rem; }
        .md-content li { margin-bottom: 0.35rem; }
        .md-content { max-width: 100%; overflow-wrap: break-word; word-wrap: break-word; }
        .md-content * { max-width: 100%; }
        .md-content code:not(.hljs) { 
            background-color: #eef0f3; 
            color: #52525b; 
            padding: 0.125rem 0.375rem; 
            border-radius: 0.25rem; 
            font-size: 0.875rem; 
            font-family: monospace; 
            word-break: break-word; 
            border: 1px solid #e2e4e8;
        }
        body.dark-mode .md-content code:not(.hljs) {
            background-color: #1c1c1f;
            color: #d4d4d8;
            border: 1px solid #2c2c31;
        }
        .md-content pre { margin: 0; }
        .md-content blockquote { border-left: 4px solid #d1d5db; padding-left: 1rem; color: #4b5563; font-style: italic; margin-bottom: 1rem; }
        .md-content a { color: #111827; text-decoration: underline; text-decoration-color: rgba(17,24,39,0.35); text-decoration-thickness: 1px; text-underline-offset: 2px; font-weight: 500; transition: text-decoration-color 0.15s ease; }
        .md-content a:hover { text-decoration-color: rgba(17,24,39,0.75); }
        body.dark-mode .md-content a { color: #f3f4f6; text-decoration-color: rgba(243,244,246,0.35); }
        body.dark-mode .md-content a:hover { text-decoration-color: rgba(243,244,246,0.8); }
        /* FIX kontras dark mode: heading Markdown (h1-h6) di pesan AI dulu hardcode
           color:#000 tanpa versi dark — teks hitam di atas background hitam, tak
           terbaca sama sekali. Sekalian benerin blockquote & kolom tabel pertama
           yang punya masalah kontras serupa di dark mode. */
        body.dark-mode .md-content h1, body.dark-mode .md-content h2, body.dark-mode .md-content h3,
        body.dark-mode .md-content h4, body.dark-mode .md-content h5, body.dark-mode .md-content h6 { color: #f9fafb !important; }
        body.dark-mode .md-content blockquote { border-left-color: #3f3f46; color: #a1a1aa; }
        body.dark-mode .md-content tbody td:first-child { background-color: #18181b; }
        /* Safety-net: pastikan SELURUH teks pesan AI selalu kontras di dark mode,
           apa pun elemen Markdown-nya (p, li, td, dst) — tanpa !important supaya
           warna khusus (link, code, error) yang sudah diatur di atas tetap menang. */
        body.dark-mode .md-content { color: #f3f4f6; }
        .md-content strong { font-weight: 700; }
        .md-content em { font-style: italic; }
        .md-content tbody td:first-child { font-weight: 600; background-color: #f9fafb; }

        .header-glass {
            background: linear-gradient(to bottom, rgba(247, 247, 249, 0.92) 0%, rgba(247, 247, 249, 0.55) 70%, rgba(247, 247, 249, 0) 100%);
            mask-image: linear-gradient(to bottom, black 70%, transparent 100%);
            -webkit-mask-image: linear-gradient(to bottom, black 70%, transparent 100%);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }
        body.dark-mode .header-glass {
            background: linear-gradient(to bottom, rgba(0, 0, 0, 0.95) 0%, rgba(0, 0, 0, 0.7) 65%, rgba(0, 0, 0, 0) 100%) !important;
        }

        .tc-spin { display: inline-block; animation: tc-spin-anim 0.9s linear infinite; }
        @keyframes tc-spin-anim { to { transform: rotate(360deg); } }

        /* Skeleton loading untuk gambar yang sedang dibuat -- abu2 bawaan Clincoo, modern & rapi */
        .img-skeleton { width: 100%; aspect-ratio: 1 / 1; border-radius: 0.75rem; background: linear-gradient(100deg, #eef0f3 30%, #f8f9fb 50%, #eef0f3 70%); background-size: 200% 100%; animation: imgSkeletonShimmer 1.4s ease-in-out infinite; }
        body.dark-mode .img-skeleton { background: linear-gradient(100deg, #1c1c1f 30%, #2a2a30 50%, #1c1c1f 70%); background-size: 200% 100%; }
        @keyframes imgSkeletonShimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }

        .hide-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .hide-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        /* Banner kuota AI habis */
        #quota-retry-btn { background: #ffffff; border: 1px solid #d1d5db; color: #111827; }
        body.dark-mode #quota-retry-btn { background: #000000; border-color: #444444; color: #ffffff; }
        body.dark-mode #quota-retry-btn:hover { background: #1a1a1a; }
        /* Dark mode */
        body.dark-mode { background: #000000 !important; color: #ffffff !important; }
        .tool-task-text { color: #6b7280; }
        .tool-task-text.err { color: #dc2626; }
        body.dark-mode .tool-task-text { color: #9ca3af !important; }
        body.dark-mode .tool-task-text.err { color: #f87171 !important; }

        /* "Menjalankan Tugas" — TANPA kartu: nempel bersih ke background halaman,
           tidak ada border/shadow/box terpisah. Hanya untuk tool workspace/aksi nyata
           (bukan sekadar pencarian info — lihat isInfoOnlyToolCalls di JS). */
        .toolcalls-card { border: none; border-radius: 0; background: transparent; overflow: visible; box-shadow: none; }
        body.dark-mode .toolcalls-card { border: none; background: transparent; box-shadow: none; }
        /* Monokrom abu2, bersih — terinspirasi pill "Thought for Xs" tapi beda: pakai
           badge lingkaran outline (bukan icon polos) + teks tetap menyertakan jumlah langkah. */
        .toolcalls-summary { display: flex; align-items: center; gap: 8px; width: 100%; padding: 6px 0; margin: 0; background: none; border: none; cursor: pointer; text-align: left; font-size: 13px; font-weight: 500; color: #6b7280; transition: opacity 0.15s ease; }
        .toolcalls-summary:hover { opacity: 0.75; }
        body.dark-mode .toolcalls-summary { color: #9ca3af; }
        body.dark-mode .toolcalls-summary:hover { opacity: 0.8; }
        /* Bare icon tanpa lingkaran/box — persis gaya pill "Thought for Xs": ikon polos + teks + chevron, monokrom abu2 bawaan Clincoo (tanpa ungu). */
        .toolcalls-badge { display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0; color: #6b7280; }
        body.dark-mode .toolcalls-badge { color: #9ca3af; }
        .toolcalls-badge.err { color: #a35555; }
        body.dark-mode .toolcalls-badge.err { color: #c98080; }
        .toolcalls-summary .tc-chevron { margin-left: auto; transition: transform 0.18s ease; color: #9ca3af; }
        .toolcalls-summary.open .tc-chevron { transform: rotate(180deg); }
        .toolcalls-livebar { height: 2px; width: 100%; background: linear-gradient(90deg, transparent 0%, #6366f1 30%, #8b5cf6 50%, #6366f1 70%, transparent 100%); background-size: 220% 100%; animation: tc-sweep 1.6s ease-in-out infinite; }
        @keyframes tc-sweep { 0% { background-position: 120% 0; } 100% { background-position: -120% 0; } }
        .toolcalls-list { display: flex; flex-direction: column; border-top: none; border-left: 2px solid #eef0f3; margin-left: 12px; padding-left: 6px; animation: tc-fadein 0.2s ease; }
        @keyframes tc-fadein { from { opacity: 0; transform: translateY(-3px); } to { opacity: 1; transform: none; } }
        body.dark-mode .toolcalls-list { border-left-color: #26262b; }
        .toolcalls-item { border-bottom: 1px solid #f0f2f5; }
        body.dark-mode .toolcalls-item { border-bottom-color: #1e1e22; }
        .toolcalls-item:last-child { border-bottom: none; }
        .toolcalls-item-header { display: flex; align-items: center; gap: 9px; width: 100%; padding: 8px 13px; background: none; border: none; cursor: pointer; text-align: left; font-size: 12.5px; font-weight: 500; color: #4b5563; }
        body.dark-mode .toolcalls-item-header { color: #9ca3af; }
        .toolcalls-item-header:hover { color: #111827; }
        .toolcalls-item-header.err { color: #dc2626; }
        body.dark-mode .toolcalls-item-header.err { color: #f87171 !important; }
        .toolcalls-item-header .tc-chevron { margin-left: auto; transition: transform 0.15s ease; color: #c2c8d0; flex-shrink: 0; }
        .toolcalls-item-header.open .tc-chevron { transform: rotate(180deg); }
        .toolcalls-item-label { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .toolcalls-item-detail { padding: 0 13px 10px 34px; display: flex; flex-direction: column; gap: 6px; }
        .toolcalls-detail-block { border-radius: 10px; overflow: hidden; background: #1e1e1e; border: 1px solid #2a2a2e; }
        .toolcalls-detail-label { display: flex; align-items: center; justify-content: space-between; padding: 5px 10px; font-size: 10.5px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.03em; color: #9ca3af; background: #171717; }
        .toolcalls-detail-copy { background: none; border: none; color: #9ca3af; cursor: pointer; padding: 2px; display: flex; align-items: center; }
        .toolcalls-detail-copy:hover { color: #ffffff; }
        .toolcalls-detail-pre { margin: 0; padding: 8px 10px; font-size: 11.5px; line-height: 1.5; color: #e5e7eb; white-space: pre-wrap; word-break: break-word; max-height: 220px; overflow-y: auto; font-family: 'SF Mono', Consolas, monospace; }
        /* Chip "Lanjutkan" pada checkpoint kehabisan token */
        .checkpoint-chip { display: inline-flex; align-items: center; gap: 7px; margin-top: 10px; padding: 8px 16px; border-radius: 999px; border: 1px solid #e0e4ea; background: #ffffff; color: #111827; font-size: 13px; font-weight: 600; cursor: pointer; box-shadow: 0 1px 3px rgba(15,23,42,0.06); transition: all 0.18s ease; }
        .checkpoint-chip:hover { border-color: #6366f1; color: #6366f1; transform: translateY(-1px); box-shadow: 0 3px 10px rgba(99,102,241,0.14); }
        .checkpoint-chip i { font-size: 15px; }
        body.dark-mode .checkpoint-chip { background: #1a1a1e; border-color: #2c2c33; color: #e5e7eb; }
        /* Kartu POLLING: stepper berurutan — 1 pertanyaan terbuka, lainnya terkunci,
           garis penghubung antar nomor mengisi saat terjawab. Netral, tanpa ungu. */
        .poll-card { margin-top: 0.375rem; border: none; background: transparent; padding: 0.125rem 0 0; }
        .poll-card-head { font-size: 12.5px; font-weight: 600; color: #4b5563; margin-bottom: 0.5rem; }
        .poll-steps { display: flex; flex-direction: column; }
        .poll-step { position: relative; display: flex; gap: 0.625rem; padding-bottom: 0.875rem; }
        .poll-step:last-child { padding-bottom: 0.25rem; }
        .poll-rail { position: absolute; left: 10px; top: 26px; bottom: 2px; width: 2px; background: #e5e7eb; border-radius: 2px; }
        .poll-rail.done { background: #111827; }
        .poll-node { position: relative; z-index: 1; flex-shrink: 0; width: 22px; height: 22px; border-radius: 999px; background: #ffffff; border: 2px solid #d1d5db; color: #9ca3af; font-size: 11px; font-weight: 600; display: inline-flex; align-items: center; justify-content: center; }
        .poll-step.active .poll-node { background: #111827; border-color: #111827; color: #ffffff; }
        .poll-step.answered .poll-node { background: #111827; border-color: #111827; color: #ffffff; font-size: 10px; }
        .poll-step.locked { opacity: 0.5; }
        .poll-step.locked .poll-node { background: #f3f4f6; }
        .poll-step-body { min-width: 0; flex: 1; }
        .poll-step-q { font-size: 13.5px; font-weight: 500; color: #1f2937; line-height: 1.45; padding-top: 1px; }
        .poll-step.locked .poll-step-q { font-weight: 400; color: #6b7280; }
        .poll-opts { margin-top: 0.5rem; display: flex; flex-direction: column; gap: 0.375rem; }
        .poll-opt { display: flex; align-items: center; gap: 0.5rem; width: 100%; text-align: left; padding: 0.5rem 0.625rem; border-radius: 10px; background: #ffffff; border: 1px solid #e5e7eb; font-size: 13px; color: #1f2937; cursor: pointer; transition: background 0.15s ease, border-color 0.15s ease; }
        .poll-opt:hover { background: #f3f4f6; border-color: #d1d5db; }
        .poll-opt-letter { flex-shrink: 0; width: 20px; height: 20px; border-radius: 6px; background: #f3f4f6; border: 1px solid #e5e7eb; color: #4b5563; font-size: 11px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center; }
        .poll-opt.other { border-style: dashed; color: #6b7280; }
        .poll-manual { margin-top: 0.5rem; display: flex; gap: 0.5rem; align-items: center; }
        .poll-manual input { flex: 1; min-width: 0; border: 1px solid #d1d5db; border-radius: 999px; background: #ffffff; color: #1f2937; font-size: 13px; padding: 0.5rem 0.875rem; outline: none; transition: border-color 0.15s ease; font-family: inherit; }
        .poll-manual input:focus { border-color: #111827; }
        .poll-manual button { flex-shrink: 0; border: none; border-radius: 999px; background: #111827; color: #ffffff; font-size: 12px; font-weight: 600; padding: 0.5rem 0.9rem; cursor: pointer; }

        if (typeof window !== 'undefined') {
            window.process = window.process || { env: {} };
        }

        // Shared Notification System
        const NOTIF_KEY = 'clinqoo_notifications';
        function getNotifications() { try { return JSON.parse(localStorage.getItem(NOTIF_KEY) || '[]'); } catch(e) { return []; } }
        function saveNotifications(n) { localStorage.setItem(NOTIF_KEY, JSON.stringify(n)); }
        function addNotification(source, message) {
          const n = getNotifications();
          n.unshift({ id: Date.now(), source, message, timestamp: new Date().toISOString(), read: false });
          if (n.length > 50) n.length = 50;
          saveNotifications(n);
        }
        function markNotifRead(id) {
          const n = getNotifications();
          const item = n.find(x => x.id === id);
          if (item) item.read = true;
          saveNotifications(n);
        }

        const chatContainer = document.getElementById('chat-container');
        const chatInput = document.getElementById('main-prompt-input');
        const btnAction = document.getElementById('submit-prompt-btn');
        const btnPlus = document.getElementById('add-btn');
        const fileUpload = document.getElementById('real-file-input');
        const filePreviewContainer = document.getElementById('file-preview-container');
        const uploadMenu = document.getElementById('upload-menu');
        const uploadFileBtn = document.getElementById('upload-file-btn');
        
        const sidebarToggle = document.getElementById('sidebar-toggle');
        const sidebarPopup = document.getElementById('sidebar-popup');
        const sidebarOverlay = document.getElementById('sidebar-overlay');

        sidebarToggle.addEventListener('click', () => {
            const isOpen = !sidebarPopup.classList.contains('-translate-x-full');
            if (isOpen) {
                sidebarPopup.classList.add('-translate-x-full');
                sidebarOverlay.classList.remove('opacity-100');
                sidebarOverlay.classList.add('opacity-0');
                setTimeout(() => sidebarOverlay.classList.add('hidden'), 300);
            } else {
                sidebarOverlay.classList.remove('hidden');
                setTimeout(() => {
                    sidebarOverlay.classList.remove('opacity-0');
                    sidebarOverlay.classList.add('opacity-100');
                    sidebarPopup.classList.remove('-translate-x-full');
                }, 10);
            }
        });

        sidebarOverlay.addEventListener('click', () => {
            sidebarPopup.classList.add('-translate-x-full');
            sidebarOverlay.classList.remove('opacity-100');
            sidebarOverlay.classList.add('opacity-0');
            setTimeout(() => sidebarOverlay.classList.add('hidden'), 300);
        });

        let currentAttachments = [];
        
        let isGenerating = false;
        let typingInterval = null;
        let currentAiMessageId = null;
        let currentStatusInterval = null;
        let abortController = null;
        let autoScrollActive = true;
        let isUserInteracting = false;
        let lastScrollTop = 0;
        let imageGenerationTimeout = null;
        
        let messages = [];

        // ===== MODE LOCALSTORAGE + CLOUD SYNC =====
        // Riwayat chat disimpan di browser (cache lokal, instan) DAN disinkronkan ke
        // cloud per akun+proyek — jadi chat di HP A muncul juga di HP B (login sama).
        // Guest (tanpa login) hanya pakai localStorage.
        const LS_CHAT_PREFIX = 'clinqoo_ls_chat_';
        // base API dihitung lokal (TOOL_API_BASE dideklarasi lebih bawah, hindari TDZ)
        const CHAT_LOG_API = (['clincoo-be2.pages.dev','localhost','127.0.0.1'].indexOf(location.hostname) === -1) ? 'https://clincoo-be2.pages.dev/api/chat-log' : '/api/chat-log';
        function lsChatKey() {
            let pid = (typeof currentProjectId !== 'undefined' && currentProjectId) ? String(currentProjectId) : 'global';
            return LS_CHAT_PREFIX + pid;
        }
        function lsChatAtKey() {
            return 'clinqoo_ls_chat_at_' + ((typeof currentProjectId !== 'undefined' && currentProjectId) ? String(currentProjectId) : 'global');
        }
        function authHeaders() {
            try {
                var tok = localStorage.getItem('clinqoo_auth_token') || localStorage.getItem('clinqoo_token') || '';
                return tok ? { 'Content-Type': 'application/json', Authorization: 'Bearer ' + tok } : { 'Content-Type': 'application/json' };
            } catch (e) { return { 'Content-Type': 'application/json' }; }
        }
        function currentPidForSync() {
            return (typeof currentProjectId !== 'undefined' && currentProjectId) ? String(currentProjectId) : 'global';
        }
        // Debounce push ke cloud: tiap saveChatLog menjadwalkan sync (cukup 1x per jeda)
        let chatCloudTimer = null;
        function queueChatCloudSave() {
            clearTimeout(chatCloudTimer);
            chatCloudTimer = setTimeout(pushChatCloud, 4000);
        }
        function pushChatCloud() {
            clearTimeout(chatCloudTimer);
            chatCloudTimer = null;
            const payload = {
                project_id: currentPidForSync(),
                client_at: Date.now(),
                messages: messages.filter(m => m && !m.isHidden && (m.text || (m.pollQuestions && m.pollQuestions.length) || (m.toolCalls && m.toolCalls.length))).map(m => ({
                    id: m.id, role: m.role, text: m.text, time: m.time || null,
                    completed: !!m.completed, stoppedByUser: !!m.stoppedByUser,
                    pollQuestions: (m.pollQuestions || []).slice(0, 6),
                    pollState: m.pollState || null,
                    toolCalls: (m.toolCalls || []).slice(0, 12).map(t => ({
                        name: t.name, args: t.args, ok: t.ok, result: String(t.result || '').slice(0, 400)
                    }))
                }))
            };
            // keepalive: request tetap terkirim saat halaman ditutup / pindah halaman
            fetch(CHAT_LOG_API, { method: 'POST', headers: authHeaders(), body: JSON.stringify(payload), keepalive: true }).catch(function() {});
        }
        // Muat log cloud: dipakai saat cache lokal kosong ATAU cloud lebih baru
        // (chat dikirim dari perangkat lain dengan akun yang sama).
        function pullChatCloud() {
            const pid = currentPidForSync();
            let localAt = 0;
            try { localAt = parseInt(localStorage.getItem(lsChatAtKey()) || '0', 10) || 0; } catch (e) {}
            fetch(CHAT_LOG_API + '?project_id=' + encodeURIComponent(pid), { headers: authHeaders() })
                .then(function(r) { return r.ok ? r.json() : Promise.reject(); })
                .then(function(d) {
                    if (!d || !Array.isArray(d.messages) || d.messages.length === 0) return;
                    if (isGenerating) return; // jangan timpa chat yang sedang berjalan
                    const cloudAt = Number(d.updated_at) || 0;
                    if (cloudAt <= localAt && messages.length > 0) return; // lokal lebih baru / sama
                    messages = d.messages;
                    renderMessages();
                    scrollToBottom(true);
                    try { saveChatLog(); } catch (e) {}
                })
                .catch(function() {});
        }
        function saveChatLog() {
            try {
                // FIX: toolCalls ikut disimpan (dulu HILANG saat pindah halaman — makanya
                // AI "mengulang progres dari awal" saat user kembali: progres menulis file
                // dll tidak terbaca, pesan dianggap kosong lalu digenerate ulang).
                const log = messages.filter(m => m && !m.isHidden && (m.text || (m.pollQuestions && m.pollQuestions.length) || (m.toolCalls && m.toolCalls.length) || (m.attachments && m.attachments.length))).map(m => ({
                    id: m.id, role: m.role, text: m.text, time: m.time || null,
                    isProcessing: !!m.isProcessing,
                    midPhase: !!m.midPhase,
                    completed: !!m.completed,
                    stoppedByUser: !!m.stoppedByUser,
                    pollQuestions: (m.pollQuestions || []).slice(0, 6),
                    pollState: m.pollState || null,
                    toolCalls: (m.toolCalls || []).map(t => ({
                        name: t.name, args: t.args, ok: t.ok,
                        result: String(t.result || '').slice(0, 400)
                    }))
                }));
                localStorage.setItem(lsChatKey(), JSON.stringify(log));
                try { localStorage.setItem(lsChatAtKey(), String(Date.now())); } catch(e2) {}
                queueChatCloudSave(); // sinkron ke cloud (debounced)
            } catch(e) {}
        }
        function loadChatLog() {
            try {
                const raw = localStorage.getItem(lsChatKey());
                if (!raw) return false;
                const log = JSON.parse(raw);
                if (Array.isArray(log) && log.length > 0) { messages = log; return true; }
            } catch(e) {}
            return false;
        }

        function balanceMarkdown(text) {
            if (!text) return text;
            let result = text;
            const codeBlocks = (result.match(/```/g) || []).length;
            if (codeBlocks % 2 !== 0) result += '\n```';

            let temp4 = result.replace(/```[\s\S]*?```/g, '');
            let backtickCount = (temp4.match(/`/g) || []).length;
            if (backtickCount % 2 !== 0) result += '`';
            return result;
        }

        if (window.marked) {
            marked.use({

                gfm: true,

                    },

                    },
                    tablecell(content, flags) {

                    },

                        let lang = typeof code_or_token === 'string' ? lang_opt : (code_or_token.lang || '');
                        lang = (lang || '').trim();
                        let finalLang = lang;
                        let highlightedCode = code.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
                        
                        if (window.hljs) {

                        const displayLang = finalLang ? (finalLang.charAt(0).toUpperCase() + finalLang.slice(1)) : 'Code / File';
                        const encodedRaw = encodeURIComponent(code);

                        const runnableLangs = ['python', 'javascript', 'js', 'java', 'c', 'cpp', 'php', 'ruby', 'go', 'rust', 'html'];

                                <i class="ph-bold ph-eye text-[18px]"></i>

                        }

                        return `
                            <div class="my-4 bg-[#1e1e1e] rounded-[16px] overflow-hidden shadow-[0_5px_15px_rgba(0,0,0,0.1)] w-full max-w-full border border-gray-800 pointer-events-auto">
                                <div class="flex items-center justify-between px-4 py-3 bg-[#2d2d2d] border-b border-gray-700">

                                    <div class="flex items-center gap-2">
                                        ${runButton}

                                            <i class="ph ph-cloud-arrow-down text-[18px]"></i>
                                        </button>

                                            <i class="ph ph-copy text-[18px]"></i>

                                    <pre style="margin:0; min-width: 100%; width: max-content;"><code class="hljs text-[13.5px] font-mono leading-relaxed bg-transparent p-0 text-gray-300" style="white-space: pre; display: block; padding-bottom: 0.25rem; min-width: 100%;">${highlightedCode}</code></pre>

        // --- Security helpers (anti-XSS) ---
        function escText(s) {
            return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
        }
        function escUrl(u) {
            const s = String(u || '');
            return (/^(https?:|data:image\/)/i.test(s)) ? escText(s) : '';
        }
        function formatMarkdown(text) {
            if (!text) return '';
            try {
                const html = marked.parse(text);
                // Perbaikan keamanan: jika DOMPurify gagal dimuat dari CDN, JANGAN
                // pernah render HTML mentah (pintu XSS). Render sebagai teks polos.
                if (!window.DOMPurify) return escText(text);
                return DOMPurify.sanitize(html);
            } catch (e) {
                return escText(text);
            }
        }

        // Teks polos tanpa sintaks markdown — dipakai untuk aiName/aiDesc proyek
        // (kartu proyek menampilkan teks apa adanya, bukan HTML terformat, jadi
        // '**tebal**' / '_miring_' / heading / tautan harus dibuang dulu).
        function stripMdSyntax(text) {
            if (!text) return '';
            return String(text)
                .replace(/```[\s\S]*?```/g, ' ')
                .replace(/`([^`]+)`/g, '$1')
                .replace(/!\[[^\]]*\]\([^)]*\)/g, '')
                .replace(/\[([^\]]+)\]\([^)]*\)/g, '$1')
                .replace(/^#{1,6}\s+/gm, '')
                .replace(/(\*\*|__)(.*?)\1/g, '$2')
                .replace(/(\*|_)(.*?)\1/g, '$2')
                .replace(/~~(.*?)~~/g, '$1')
                .replace(/^\s*[-*+]\s+/gm, '')
                .replace(/\s+/g, ' ')
                .trim();
        }

        function showGlobalTooltip(element, text) {
            document.querySelectorAll('.global-tooltip').forEach(el => el.remove());
            const rect = element.getBoundingClientRect();
            const tooltip = document.createElement('div');
            tooltip.className = 'global-tooltip fixed bg-black text-white text-[11px] font-semibold px-2.5 py-1.5 rounded shadow-lg whitespace-nowrap pointer-events-none z-[9999] fade-in';
            tooltip.innerText = text;
            const arrow = document.createElement('div');
            arrow.className = 'absolute top-full left-1/2 -translate-x-1/2 border-4 border-transparent border-t-black';
            tooltip.appendChild(arrow);
            document.body.appendChild(tooltip);
            const tooltipRect = tooltip.getBoundingClientRect();
            tooltip.style.left = `${rect.left + (rect.width / 2) - (tooltipRect.width / 2)}px`;
            tooltip.style.top = `${rect.top - tooltipRect.height - 8}px`;
            setTimeout(() => {
                tooltip.style.opacity = '0';
                tooltip.style.transition = 'opacity 0.2s ease-out';
                setTimeout(() => tooltip.remove(), 200);
            }, 1200);
        }

        function copyCodeBlock(btnElement) {
            const encodedCode = btnElement.getAttribute('data-code');
            const code = decodeURIComponent(encodedCode);
            const textArea = document.createElement("textarea");
            textArea.value = code;
            document.body.appendChild(textArea);
            textArea.select();
            try {
                document.execCommand('copy');
                showGlobalTooltip(btnElement, 'Disalin');
            } catch (err) {}
            document.body.removeChild(textArea);
        }

        function downloadCode(btnElement, lang) {
            const encodedCode = btnElement.getAttribute('data-code');
            const code = decodeURIComponent(encodedCode);
            const extMap = {
                'python': 'py', 'javascript': 'js', 'html': 'html', 'css': 'css', 
                'java': 'java', 'cpp': 'cpp', 'c': 'c', 'php': 'php', 'ruby': 'rb',
                'json': 'json', 'typescript': 'ts', 'bash': 'sh', 'shell': 'sh',
                'go': 'go', 'rust': 'rs', 'csv': 'csv', 'sql': 'sql', 'xml': 'xml'
            };
            const ext = extMap[lang.toLowerCase()] || 'txt';
            const filename = `generated_file.${ext}`;
            const blob = new Blob([code], { type: 'text/plain' });
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = filename;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            window.URL.revokeObjectURL(url);
        }

        function toggleCodeOutputView(btnElement, blockId, showOutput, isHtml = false) {
            const codeContainer = document.getElementById(`${blockId}-code-container`);
            const outputContainer = document.getElementById(`${blockId}-output-container`);
            
            if (showOutput) {
                if (codeContainer) codeContainer.classList.add('hidden');
                if (outputContainer) outputContainer.classList.remove('hidden');
                btnElement.innerHTML = '<i class="ph-bold ph-code text-[18px]"></i>';
                btnElement.setAttribute('title', 'Lihat Kode');
                btnElement.dataset.view = 'output';
            } else {
                if (outputContainer) outputContainer.classList.add('hidden');
                if (codeContainer) codeContainer.classList.remove('hidden');
                if (isHtml) {
                    btnElement.innerHTML = '<i class="ph-bold ph-eye text-[18px]"></i>';
                    btnElement.setAttribute('title', 'Preview UI / Animasi');
                } else {
                    btnElement.innerHTML = '<i class="ph-bold ph-play text-[18px]"></i>';
                    btnElement.setAttribute('title', 'Jalankan Kode');
                }
                btnElement.dataset.view = 'code';
            }
        }

        function previewHTML(btnElement, blockId) {
            const currentView = btnElement.dataset.view || 'code';
            
            if (currentView === 'output') {
                toggleCodeOutputView(btnElement, blockId, false, true);
                return;
            }

            toggleCodeOutputView(btnElement, blockId, true, true);

            const encodedCode = btnElement.getAttribute('data-code');
            const code = decodeURIComponent(encodedCode);
            const outputEl = document.getElementById(`${blockId}-output`);
            const iframeEl = document.getElementById(`${blockId}-iframe`);
            
            if (outputEl) outputEl.classList.add('hidden');
            if (iframeEl) {
                iframeEl.classList.remove('hidden');
                iframeEl.srcdoc = code;
            }
        }

        async function runCode(btnElement, lang, blockId) {
            const currentView = btnElement.dataset.view || 'code';
            
            if (currentView === 'output') {
                toggleCodeOutputView(btnElement, blockId, false, false);
                return;
            }

            toggleCodeOutputView(btnElement, blockId, true, false);

            const encodedCode = btnElement.getAttribute('data-code');
            const code = decodeURIComponent(encodedCode);
            const outputEl = document.getElementById(`${blockId}-output`);
            const iframeEl = document.getElementById(`${blockId}-iframe`);
            
            if (outputEl) outputEl.classList.remove('hidden');
            if (iframeEl) iframeEl.classList.add('hidden');

            outputEl.innerHTML = '<span class="text-blue-400 animate-pulse">Memuat eksekusi...</span>';
            const targetLang = lang.toLowerCase();

            try {
                outputEl.innerHTML = '<span class="text-blue-400 animate-pulse">Menyiapkan E2B Sandbox (e2b.dev)...</span>';
                // Eksekusi diproxy di server (/api/e2b-run): API key E2B tidak pernah
                // diunduh ke browser (perbaikan keamanan; dulu key dibagikan mentah).
                const runRes = await fetch(TOOL_API_BASE + '/api/e2b-run', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ code: code, language: targetLang })
                });
                if (!runRes.ok) {
                    throw new Error('Proxy sandbox gagal (HTTP ' + runRes.status + '), beralih ke fallback.');
                }
                const runJson = await runRes.json().catch(() => null);
                if (!runJson) throw new Error('Respons sandbox tidak valid, beralih ke fallback.');

                outputEl.innerHTML = '<span class="text-blue-400 animate-pulse">Mengeksekusi kode dalam Sandbox...</span>';

                let outputText = String(runJson.stdout || '');
                let errorText = String(runJson.stderr || '');
                if (runJson.error && runJson.error.value) {
                    errorText += (runJson.error.name ? runJson.error.name + ': ' : '') + runJson.error.value;
                }
                if (runJson.results && runJson.results.length) {
                    for (const res of runJson.results) {
                        if (res.text) outputText += res.text + "\n";
                    }
                }

                if (errorText) {
                    outputEl.innerHTML = `<span class="text-red-400">${errorText.replace(/</g, "&lt;").replace(/>/g, "&gt;")}</span>`;
                } else {
                    outputEl.innerHTML = `<span class="text-green-400">${(outputText || '').replace(/</g, "&lt;").replace(/>/g, "&gt;") || '(Tidak ada output/berhasil dieksekusi)'}</span>`;
                }

            } catch (e2bError) {
                console.warn("E2B execution failed, falling back to Piston Sandbox.", e2bError);
                outputEl.innerHTML = '<span class="text-yellow-400 animate-pulse">E2B Sandbox error/timeout. Melanjutkan eksekusi ke Piston Sandbox (Fallback)...</span>';
                
                const langMapPiston = {
                    'python': { language: 'python', version: '*' },
                    'javascript': { language: 'javascript', version: '*' },
                    'js': { language: 'javascript', version: '*' },
                    'java': { language: 'java', version: '*' },
                    'c': { language: 'c', version: '*' },
                    'cpp': { language: 'c++', version: '*' },
                    'php': { language: 'php', version: '*' },
                    'ruby': { language: 'ruby', version: '*' },
                    'go': { language: 'go', version: '*' },
                    'rust': { language: 'rust', version: '*' }
                };
                
                const runInfoPiston = langMapPiston[targetLang] || { language: targetLang, version: '*' };

                try {
                    const response = await fetch('https://emkc.org/api/v2/piston/execute', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            language: runInfoPiston.language,
                            version: runInfoPiston.version,
                            files: [{ content: code }]
                        })
                    });

                    const data = await response.json();
                    
                    if (data.compile && data.compile.code !== 0) {
                        outputEl.innerHTML = `<span class="text-red-400">${(data.compile.stderr || "").replace(/</g, "&lt;").replace(/>/g, "&gt;")}</span>`;
                    } else if (data.run) {
                        let out = (data.run.output || data.run.stdout || data.run.stderr || "").replace(/</g, "&lt;").replace(/>/g, "&gt;");
                        if (data.run.code !== 0) {
                             outputEl.innerHTML = `<span class="text-red-400">${out || 'Terjadi kesalahan eksekusi.'}</span>`;
                        } else {
                             outputEl.innerHTML = `<span class="text-green-400">${out || '(Tidak ada output/berhasil dieksekusi)'}</span>`;
                        }
                    } else {
                         outputEl.innerHTML = `<span class="text-red-400">Gagal menjalankan kode atau bahasa belum didukung server (versi).</span>`;
                    }
                } catch (err) {
                    outputEl.innerHTML = `<span class="text-red-400">Terjadi kesalahan jaringan pada sistem eksekusi Piston.</span>`;
                }
            }
        }

        // FIX: bug "tidak bisa scroll saat AI thinking, nempel di bawah" — sebelumnya
        // autoScrollActive hanya dimatikan lewat heuristik event 'scroll' (bandingkan posisi
        // sebelum/sesudah), yang gampang telat/kalah race saat konten terus tumbuh cepat
        // ketika AI sedang streaming/thinking (tiap render baru langsung menarik balik ke
        // bawah sebelum jari sempat menggeser). Sekarang gesture NAIK asli (jari geser ke
        // bawah / wheel ke atas) langsung mematikan auto-scroll di momen itu juga — tidak
        // menunggu event scroll berikutnya — supaya user selalu bisa baca pesan lama walau
        // AI masih mengetik.
        let touchStartY = 0;
        let momentumScrollWindow = false, momentumTimer = null;
        chatContainer.addEventListener('touchstart', (e) => {
            isUserInteracting = true;
            touchStartY = e.touches && e.touches[0] ? e.touches[0].clientY : 0;
        }, {passive: true});
        chatContainer.addEventListener('touchmove', (e) => {
            const y = e.touches && e.touches[0] ? e.touches[0].clientY : 0;
            if (touchStartY && y - touchStartY > 6) {
                // jari geser ke bawah -> isi discroll ke atas -> user sedang membaca ke atas
                autoScrollActive = false;
            }
            touchStartY = y;
        }, {passive: true});
        chatContainer.addEventListener('touchend', () => {
            isUserInteracting = false;
            // FIX momentum-scroll: setelah jari lepas, iOS/Android masih melanjutkan
            // scroll (momentum) beberapa ratus ms. Tanpa jendela ini, event 'scroll' saat
            // momentum tidak mematikan auto-scroll (isUserInteracting sudah false) —
            // sehingga render AI berikutnya langsung menarik tampilan balik ke bawah.
            momentumScrollWindow = true;
            clearTimeout(momentumTimer);
            momentumTimer = setTimeout(() => momentumScrollWindow = false, 800);
        }, {passive: true});
        chatContainer.addEventListener('mousedown', () => isUserInteracting = true);
        document.addEventListener('mouseup', () => isUserInteracting = false);
        chatContainer.addEventListener('wheel', (e) => {
            isUserInteracting = true;
            if (e.deltaY < 0) autoScrollActive = false; // scroll ke atas -> matikan auto-scroll seketika
            clearTimeout(chatContainer.wheelTimeout);
            chatContainer.wheelTimeout = setTimeout(() => isUserInteracting = false, 250);
        }, {passive: true});

        chatContainer.addEventListener('scroll', () => {
            const threshold = 15;
            const currentScrollTop = Math.ceil(chatContainer.scrollTop);
            const maxScrollTop = chatContainer.scrollHeight - chatContainer.clientHeight;

            if (maxScrollTop - currentScrollTop <= threshold) {
                autoScrollActive = true;
            } else if ((isUserInteracting || momentumScrollWindow) && currentScrollTop < lastScrollTop - 1) {
                // FIX: hanya matikan auto-scroll kalau user BENAR-BENAR sedang menyentuh/
                // scroll ke atas. Keyboard yang buka-tutup & perubahan tinggi konten membuat
                // browser meng-clamp scrollTop (terlihat seperti scroll ke atas padahal bukan
                // aksi user) — itu TIDAK boleh mematikan auto-scroll, karena dulu inilah
                // penyebab indikator "mengetik" di bawah tidak naik otomatis setelah kirim.
                autoScrollActive = false;
            }

            lastScrollTop = currentScrollTop <= 0 ? 0 : currentScrollTop;
        });

        function readAsDataURL(file) {
            return new Promise((resolve) => {
                const reader = new FileReader();
                reader.onload = e => resolve(e.target.result);
                reader.readAsDataURL(file);
            });
        }

        function readAsText(file) {
            return new Promise((resolve) => {
                const reader = new FileReader();
                reader.onload = e => resolve(e.target.result);
                reader.readAsText(file);
            });
        }

        async function loadPDF(file) {
            try {
                const arrayBuffer = await file.arrayBuffer();
                const pdf = await pdfjsLib.getDocument(arrayBuffer).promise;
                let maxPages = pdf.numPages;
                let text = "";
                for (let i = 1; i <= Math.min(maxPages, 10); i++) { 
                    const page = await pdf.getPage(i);
                    const content = await page.getTextContent();
                    text += content.items.map(item => item.str).join(' ') + "\n";
                }
                return text;
            } catch(err) {
                return "Gagal membaca file PDF.";
            }
        }

        // SPREADSHEET (xlsx/xls/xlsm/csv/ods): format biner — WAJIB diparse, readAsText
        // biasa hanya menghasilkan sampah karakter. SheetJS ubah tiap sheet jadi baris
        // "nilai | nilai | nilai" yang bisa dibaca AI.
        async function loadSpreadsheet(file) {
            try {
                const arrayBuffer = await file.arrayBuffer();
                const wb = XLSX.read(arrayBuffer, { type: 'array' });
                let text = '';
                wb.SheetNames.forEach(function (sheetName) {
                    const rows = XLSX.utils.sheet_to_csv(wb.Sheets[sheetName], { FS: ' | ' });
                    text += '[Sheet: ' + sheetName + ']\n' + rows + '\n\n';
                });
                return (text || '(sheet kosong)').substring(0, 50000);
            } catch (err) {
                return "Gagal membaca file spreadsheet.";
            }
        }
        // DOCX: format ZIP berisi XML — diparse via mammoth jadi teks bersih.
        async function loadDocx(file) {
            try {
                const arrayBuffer = await file.arrayBuffer();
                const result = await window.mammoth.extractRawText({ arrayBuffer: arrayBuffer });
                return (result.value || '').substring(0, 50000);
            } catch (err) {
                return "Gagal membaca file dokumen.";
            }
        }

        function formatSize(bytes) {
            if (bytes === 0) return '0 Bytes';
            const k = 1024;
            const sizes = ['Bytes', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return parseFloat((bytes / Math.pow(k, i)).toFixed(1)) + ' ' + sizes[i];
        }

        async function handleFileUpload(e) {
            const files = e.target.files;
            if (!files || files.length === 0) return;

            for (let i = 0; i < files.length; i++) {
                const file = files[i];
                let data = null;
                let text = null;
                let type = file.type.startsWith('image/') ? 'image' : 'document';
                let extension = file.name.split('.').pop().toLowerCase();

                if (type === 'image') {
                    data = await readAsDataURL(file);
                } else {
                    if (file.type === 'application/pdf' || extension === 'pdf') {
                        text = await loadPDF(file);
                    } else if (['xlsx', 'xls', 'xlsm', 'csv', 'ods'].includes(extension)) {
                        text = await loadSpreadsheet(file);
                    } else if (extension === 'docx') {
                        text = await loadDocx(file);
                    } else {
                        text = await readAsText(file);
                    }
                }

                currentAttachments.push({
                    id: generateId(),
                    file: file,
                    type: type,
                    name: file.name,
                    size: formatSize(file.size),
                    data: data,
                    text: text,
                    extension: extension
                });
            }

            showAttachmentPreview();
            try { closeUploadMenu(); } catch (e2) {}
            e.target.value = '';
        }

                'pdf': 'ph-file-pdf text-gray-500',
                'zip': 'ph-file-archive text-gray-500',
                'txt': 'ph-file-text text-gray-500',
                'csv': 'ph-file-csv text-gray-500',
                'xlsx': 'ph-file-xls text-gray-500',
                'xls': 'ph-file-xls text-gray-500',
                'xlsm': 'ph-file-xls text-gray-500',
                'ods': 'ph-file-xls text-gray-500',
                'docx': 'ph-file-doc text-gray-500',
                'doc': 'ph-file-doc text-gray-500',
                'png': 'ph-image text-gray-500',

        function showAttachmentPreview() {
            if (currentAttachments.length === 0) {
                filePreviewContainer.classList.add('hidden');
                filePreviewContainer.classList.remove('flex');
                filePreviewContainer.innerHTML = '';

            }

            filePreviewContainer.innerHTML = '';
            
            filePreviewContainer.classList.remove('hidden');
            filePreviewContainer.classList.add('flex');
            
            currentAttachments.forEach(att => {

                    iconHtml = `<img src="${escUrl(att.data)}" class="w-[18px] h-[18px] rounded-full object-cover">`;
                } else {
                    iconHtml = getFileIcon(att.extension);

                const pill = document.createElement('div');

        btnPlus.addEventListener('click', (e) => {

        // Pesan baru tampil di BAWAH (dekat kolom input) — perilaku chat normal.
        // (Dulu pesan baru di-pin ke atas viewport; selain sering tertutup header,
        // posisinya tidak konsisten dengan tampilan setelah refresh.)
        function revealNewMessage() {
            scrollToBottom(true);
        }

        // Jawaban AI selesai: kalau user memang sedang di ekor chat, tempelkan
        // ujung jawaban ke kolom input dengan scroll halus.
        function settleAfterAnswer() {
            requestAnimationFrame(function () {
                const max = Math.max(0, chatContainer.scrollHeight - chatContainer.clientHeight);
                // Dekat ekor jawaban -> scroll halus menempel ke input.
                // Sedang membaca pesan lama di atas -> TIDAK digeser (clamp alami saja).
                if (max - chatContainer.scrollTop < 600) chatContainer.scrollTo({ top: max, behavior: 'smooth' });
                autoScrollActive = true;
            });
        }

        function scrollToBottom(forceSmooth = false) {
            if (forceSmooth) {
                autoScrollActive = true;
                chatContainer.scrollTo({
                    top: chatContainer.scrollHeight,
                    behavior: 'smooth'
                });
                // FIX: konten markdown/gambar/kode sering menambah tinggi SETELAH scroll
                // selesai — pin ulang beberapa kali agar benar-benar sampai dasar.
                [150, 400, 800].forEach(function(ms) {
                    setTimeout(function() {
                        if (autoScrollActive) {
                            chatContainer.scrollTop = chatContainer.scrollHeight;
                        }
                    }, ms);
                });
            } else if (autoScrollActive && !isUserInteracting) {
                chatContainer.scrollTop = chatContainer.scrollHeight;
            }
        }

        // FIX KEYBOARD MOBILE: dulu pakai hack document.body.style.height = tinggi
        // viewport terlihat. Akibatnya composer (position:fixed bottom-0, yang tidak
        // ikut menyusut) berakhir MELAYANG MENIMPA area pesan seperti "card hitam"
        // saat keyboard terbuka (terlihat jelas di dark mode). Solusi yang benar:
        // (a) angkat composer persis ke atas keyboard via transform mengikuti
        //     visualViewport, dan (b) tambah padding bawah area chat sebesar keyboard
        //     supaya pesan terakhir tetap terlihat, bukan nyelip ke belakang keyboard.
        if (window.visualViewport) {
            const vv = window.visualViewport;
            const chatFooter = document.querySelector('footer.fixed');
            let vvRaf = null;
            const handleViewportResize = () => {
                cancelAnimationFrame(vvRaf);
                vvRaf = requestAnimationFrame(() => {
                    // tinggi area tertutup keyboard relatif layout viewport
                    const covered = Math.max(0, window.innerHeight - vv.height - vv.offsetTop);
                    if (covered > 24) {
                        if (chatFooter) chatFooter.style.transform = `translateY(${-covered}px)`;
                        chatContainer.style.paddingBottom = `${Math.round(covered + 8)}px`;
                    } else {
                        if (chatFooter) chatFooter.style.transform = '';
                        chatContainer.style.paddingBottom = '';
                    }
                    scrollToBottom(false);
                });
            };
            vv.addEventListener('resize', handleViewportResize);
            vv.addEventListener('scroll', handleViewportResize);
        }

        chatInput.addEventListener('focus', () => {
            setTimeout(() => {
                autoScrollActive = true;
                scrollToBottom(true);
            }, 300);
        });
