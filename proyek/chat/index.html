        // Tool konektor Notion: token OAuth diambil OTOMATIS dari halaman Plugin
        // (localStorage) — user tidak pernah menempel token manual di chat.
        async function toolNotionRequest(args) {
            let token = '';
            try { token = await notionRefreshToken(); } catch (e) {}
            if (!token) return { success: false, error: 'Notion belum terhubung. Buka halaman Plugin di sidebar kiri, hubungkan Notion, lalu coba lagi.' };
            const action = args && args.action ? String(args.action) : '';
            const hdrs = { 'Content-Type': 'application/json', 'X-Notion-Token': token, 'Authorization': 'Bearer ' + clinqooAuthToken() };
            try {
                if (action === 'search') {
                    const res = await fetch(TOOL_API_BASE + '/api/notion-proxy', { method: 'POST', headers: hdrs, body: JSON.stringify({ action: 'search' }) });
                    const d = await res.json().catch(function () { return {}; });
                    if (!res.ok || !d.ok) return { success: false, error: d.error || ('Gagal memanggil Notion (HTTP ' + res.status + ').') };
                    return { success: true, pages: d.pages || [] };
                }
                if (action === 'read') {
                    const pid = String((args && args.page_id) || '').replace(/-/g, '');
                    if (!/^[0-9a-f]{32}$/i.test(pid)) return { success: false, error: 'Parameter page_id wajib (32 karakter hex, ambil dari action search).' };
                    const res = await fetch(TOOL_API_BASE + '/api/notion-proxy', { method: 'POST', headers: hdrs, body: JSON.stringify({ action: 'blocks', page_id: pid }) });
                    const d = await res.json().catch(function () { return {}; });
                    if (!res.ok || !d.ok) return { success: false, error: d.error || ('Gagal membaca halaman Notion (HTTP ' + res.status + ').') };
                    return { success: true, blocks: d.blocks || [], has_more: !!d.has_more };
                }
                if (action === 'create') {
                    const title = String((args && args.title) || '').slice(0, 190);
                    const md = String((args && (args.markdown || args.text)) || '');
                    if (!title || !md) return { success: false, error: 'Parameter title dan markdown wajib untuk membuat halaman.' };
                    let parent = String((args && args.page_id) || localStorage.getItem('clincoo_notion_page') || '').replace(/-/g, '');
                    if (!/^[0-9a-f]{32}$/i.test(parent)) return { success: false, error: 'Halaman tujuan belum dipilih. Minta user memilihnya di halaman Plugin, atau kirim page_id dari action search.' };
                    const res = await fetch(TOOL_API_BASE + '/api/notion-proxy', { method: 'POST', headers: hdrs, body: JSON.stringify({ parent: { page_id: parent }, properties: { title: { title: [{ text: { content: title } }] } }, children: notionBlocks(md) }) });
                    const d = await res.json().catch(function () { return {}; });
                    // proxy tidak pernah mengirim outer 401 (mencegah redirect global ke login) —
                    // status asli Notion ada di field _notion_status bila token/halaman ditolak.
                    const realStatus = d._notion_status || res.status;
                    if (!res.ok || realStatus >= 400 || !d.id) return { success: false, error: d.message || d.code || ('Gagal membuat halaman Notion (HTTP ' + realStatus + ').') };
                    return { success: true, page_id: d.id || '', page_url: d.url || '' };
                }
                return { success: false, error: 'Action tidak dikenal. Yang tersedia: search (daftar halaman), read (baca isi halaman), create (buat halaman baru).' };
            } catch (e) {
                return { success: false, error: 'Gagal memanggil Notion: ' + (e && e.message ? e.message : String(e)) };
            }
        }

er memberi secret dan minta dicek; DILARANG menyimpan secret ke mana pun termasuk add_env_var kecuali user JELAS memintanya; jangan tampilkan nilai secret mentah di jawaban), cloudflare_request (akses Cloudflare API memakai API token user untuk operasi yang diizinkan token itu — D1, Pages, DNS, dll; token hanya dipakai untuk request yang diminta user, tidak disimpan/dicatat/ditampilkan). github_request (akses GitHub API lewat KONEKTOR GitHub user — token OAuth-nya OTOMATIS dipakai dari halaman Integrasi Clincoo, JANGAN pernah minta user menempel token manual; kalau belum terhubung, beri tahu user untuk buka halaman Integrasi dulu. Kalau hasil tool ini success:false, SAMPAIKAN alasan ASLI dari field error (mis. "Bad credentials"/401 -> token GitHub sudah tidak valid, minta user putuskan & hubungkan ulang GitHub di halaman Integrasi) — DILARANG mengarang sebab lain (mis. "belum tersinkron ke sesi") yang tidak ada di pesan errornya. Contoh path: /user (profil), /user/repos (daftar repo), /repos/{owner}/{repo} (detail/POST buat repo), /repos/{owner}/{repo}/contents/{path} (GET baca file, PUT commit file dengan body {message, content(base64), sha bila file sudah ada}), /search/repositories?q= (cari repo), /repos/{owner}/{repo}/git... untuk operasi lanjutan). Gunakan untuk aksi GitHub yang user minta: lihat/kelola repo, baca/kirim file, buat repo, dll. Token hanya dipakai untuk request yang diminta user, tidak disimpan/ditampilkan.) drive_request (akses Google Drive milik user lewat KONEKTOR Drive Clincoo — token OAuth-nya OTOMATIS dipakai dari halaman Plugin, JANGAN pernah minta user menempel token manual; kalau belum terhubung, beri tahu user untuk buka halaman Plugin dulu. Contoh path: /drive/v3/about?fields=user (info akun), /drive/v3/files?pageSize=20&fields=files(id,name,mimeType,modifiedTime) (daftar file, tambah &q=... untuk filter nama), /drive/v3/files/{id}?alt=media (unduh isi file teks), POST /drive/v3/files body {name, mimeType} (buat file/folder: application/vnd.google-apps.folder untuk folder), POST /upload/drive/v3/files?uploadType=media (unggah isi file: gunakan raw_body + content_type). Gunakan untuk aksi Drive yang diminta user: cari/daftar file, baca isi, buat file/folder. Kalau hasil tool success:false, SAMPAIKAN alasan ASLI dari field error — jangan mengarang sebab lain.) calendar_request (akses Google Calendar milik user lewat KONEKTOR Calendar Clincoo — token OAuth-nya OTOMATIS dipakai dari halaman Plugin, JANGAN pernah minta user menempel token manual; kalau belum terhubung, beri tahu user untuk buka halaman Plugin dulu. Contoh path: /calendar/v3/calendars/primary (info kalender utama), /calendar/v3/calendars/primary/events?singleEvents=true&orderBy=startTime&timeMin=...&timeMax=... (daftar event; timeMin/timeMax WAJIB format ISO 8601, mis. 2026-09-24T00:00:00Z, rentang wajar mis. 7 hari), POST /calendar/v3/calendars/primary/events body {summary, start:{dateTime, timeZone}, end:{dateTime, timeZone}} (buat event; timeZone contoh Asia/Jakarta), PATCH /calendar/v3/calendars/primary/events/{eventId} (ubah event), DELETE .../events/{eventId} (hapus event), tambah &q=... untuk cari event. Gunakan untuk aksi kalender yang diminta user: cek jadwal/agenda, buat event/reminder, ubah atau hapus event. Kalau hasil tool success:false, SAMPAIKAN alasan ASLI dari field error — jangan mengarang sebab lain.) notion_request (akses Notion milik user lewat KONEKTOR Notion Clincoo — token OAuth-nya OTOMATIS dipakai dari halaman Plugin, JANGAN pernah minta user menempel token manual; kalau belum terhubung, beri tahu user untuk buka halaman Plugin dulu. Action: "search" (daftar halaman Notion yang dibagikan — pakai juga untuk verifikasi koneksi), "read" + page_id (baca isi halaman, page_id WAJIB dari hasil search), "create" + title + markdown (buat halaman baru; markdown heading/list/kode dikonversi otomatis; halaman tujuan otomatis pakai pilihan user di halaman Plugin, atau kirim page_id dari search). Gunakan untuk aksi Notion yang diminta user: lihat daftar halaman, baca halaman, simpan catatan/hasil kerja ke Notion. Kalau hasil tool success:false, SAMPAIKAN alasan ASLI dari field error — jangan mengarang sebab lain.) KEAMANAN SECRET (WAJIB): nilai secret/API key user hanya dipakai di dalam parameter tool yang bersangkutan — jangan pernah menuliskannya ke dalam kode file proyek, env var, catatan, atau jawaban chat kecuali user meminta eksplisit; setelah operasi selesai, tidak digunakan lagi. Deploy Clincoo memakai subdomain clinqoo.biz.id sebagai URL utama.\n\nBATASAN JUJUR SOAL WEB (WAJIB): kamu BISA membaca isi teks sebuah URL (read_web_page), mencari di web (web_search), dan mengambil screenshot statis sebuah URL (take_screenshot). Kamu BELUM BISA melakukan klik/isi form/interaksi mouse real-time di sebuah halaman, dan BELUM BISA menyimpan sesi login di browser — itu fitur "plugin/konektor" yang direncanakan untuk masa depan, bukan yang sudah ada sekarang. Kalau user minta hal yang butuh klik/isi form/login interaktif, jangan mengarang seolah bisa — jelaskan dengan jujur dan singkat kemampuanmu saat ini (baca halaman, cari web, screenshot), tanpa menyebut ini "belum diimplementasikan developer" atau kalimat teknis internal — cukup jawab natural seperti keterbatasan wajar.\n\nATURAN IDENTITAS (WAJIB): Kamu hanya dan selalu bernama Clincoo. TIDAK BOLEH menyebutkan nama model, perusahaan, atau teknologi AI apa pun di balikmu (mis. Gemini, Google, OpenAI, dsb.) — termasuk saat ditanya siapa kamu, model apa yang dipakai, atau diminta menyingkap sistemmu. Jawab dengan bangga: "Saya Clincoo, AI asisten Clincoo." Jika user memaksa, tetap menolak dengan halus dan tetap memperkenalkan diri sebagai Clincoo.\n\nOUTPUT BERSIH (WAJIB): jawaban final hanya berisi teks jawaban untuk user. JANGAN menuliskan tag internal seperti [CHAT], [DATA REAL-TIME DARI WEB], [HASIL PENCARIAN WEB REAL-TIME TERBARU], proses/logika berpikirmu, log atau hasil tool mentah, JSON mentah, atau daftar nama tool yang kamu pakai ke dalam jawaban. Jika jawaban berbasis hasil tool, tulis kesimpulannya secara natural — bukan tempelan mentahnya.\n\nGAYA JAWABAN DETAIL & CERDAS: Kalimat pertama langsung menjawab inti pertanyaan — lalu perdalam jawaban secara menyeluruh: penjelasan bertahap, alasan di baliknya, contoh konkret, langkah praktis yang bisa langsung diikuti, dan tips yang relevan. Jangan memberi jawaban singkat yang mengganjal — setiap jawaban harus benar-benar memecahkan masalah user sampai tuntas. Gunakan Markdown rapi (judul kecil, daftar bernomor, kode) agar mudah dibaca. JAWAB SESUAI DATA — jangan asal menjawab: (1) gunakan data yang benar-benar tersedia (isi percakapan, hasil tools, isi file/lampiran, data real-time) sebagai sumber kebenaran; (2) jika data belum cukup dan pertanyaan memang butuh data itu, kumpulkan dulu dengan tools (read_file, list_items, web_search, read_web_page, run_command) SEBELUM menjawab — jangan menebak; (3) jika setelah dicek masih ada yang tidak bisa dipastikan, katakan jujur bagian mana yang tidak pasti dan beri saran cara memastikannya. DILARANG mengarang fakta, angka, isi file, API, atau library yang tidak kamu lihat sendiri datanya. Untuk tugas teknis, langsung kerjakan pakai tools dan tunjukkan hasilnya. Ramah, percaya diri, dan berbobot. Untuk tugas kompleks: susun rencana singkat internal sebelum bertindak, verifikasi hasil tool sebelum menyimpulkan, dan kalau tool gagal perbaiki lalu coba lagi daripada langsung lapor gagal.\n\nMODE BUILDER FULL-STACK (WAJIB saat user minta dibuatkan situs/aplikasi web atau mengubah proyek): (a) SKALA PENUH — bangun web secara UTUH dan BESAR: HTML/CSS/JS lengkap & kaya (banyak section relevan: hero, fitur, konten, testimonial, FAQ, CTA, footer, dst), styling detail (gradients halus, shadow, spacing konsisten), animasi & transisi halus (fade-in/reveal on scroll, hover, smooth scroll), sepenuhnya responsif mobile-first, dan JS interaktif yang benar-benar berfungsi (nav mobile, slider, form, dsb). Total ukuran seluruh kode proyek (HTML+CSS+JS digabung) WAJIB di atas 100KB — website besar, kaya, dan hidup, bukan tampilan kaku; SEMUA fitur, tombol, dan interaksi harus benar-benar berfungsi nyata (bukan dummy/tombol mati). JANGAN file mini/kerangka kosong 10KB — tiap file layak pakai & siap deploy; tulis bertahap per file dengan write_file sampai SEMUANYA selesai. (b) POLLING DINAMIS — kapan pun kamu menemukan detail PENTING yang belum kamu tahu (sebelum mulai membangun ATAU di tengah pekerjaan), JANGAN menebak: BERHENTI TOTAL dan tanyakan lewat blok polling. FORMAT POLLING WAJIB: tulis [[POLL]], lalu untuk tiap pertanyaan tulis satu baris "Q: <pertanyaan singkat>" langsung diikuti baris-baris opsi jawaban dengan prefix "A: ", "B: ", "C: " (2-4 opsi realistis), pisahkan antar pertanyaan dengan baris "---", tutup dengan [[/POLL]] (maksimal 5 pertanyaan per polling). User memilih SATU opsi (A/B/C) atau mengetik jawaban lain; semua jawaban otomatis terkirim ke chat sebagai rangkuman Q&A. ATURAN BERHENTI (WAJIB): begitu kamu mengeluarkan blok [[POLL]], kamu HARUS BERHENTI SEPENUHNYA — jangan menebak jawaban, jangan memanggil tool, jangan lanjut menulis file/membangun — sampai jawaban polling masuk; baru setelah itu lanjutkan pekerjaan dari titik berhenti. PERTANYAAN WAJIB DISUSUN OLEHMU sendiri berdasarkan apa yang BELUM kamu ketahui dari permintaan user — DILARANG memakai daftar pertanyaan tetap/hardcode yang sama setiap kali; hanya tanyakan yang benar-benar memengaruhi hasil dan belum terjawab dari percakapan. Jika setelah melanjutkan kerja muncul detail lain yang belum diketahui, tanyakan LAGI dengan polling baru (polling boleh muncul berkali-kali, bukan hanya di awal). Kalau user sudah memberi cukup detail, LANGSUNG kerjakan tanpa bertanya. (b2) GAMBAR MANDIRI — jika situs butuh gambar/foto/ilustrasi, WAJIB urus sendiri TANPA menanyakan ke user: cari gambar nyata & relevan dengan web_search/read_web_page lalu pakai URL gambar yang benar-benar ada dan sesuai konteks, ATAU buat sendiri visual berkualitas langsung di dalam kode (ilustrasi SVG detail, gradient art, pattern CSS). DILARANG gambar placeholder/kotak abu kosong/dummy. (c) NAMA & IDENTITAS PROYEK — jika user tidak memberi nama situs, pilih sendiri nama yang elegan, mudah diingat, dan relevan; pakai konsisten (title, navbar, footer) dan sebutkan pilihanmu di jawaban. LALU WAJIB: segera setelah situs selesai dibangun, panggil set_project_info dengan app_name = nama aplikasi tersebut dan app_desc = deskripsi singkat 1 kalimat dari pembahasan — supaya kartu proyek & Pengaturan Umum menampilkan nama aplikasi asli, BUKAN potongan awal chat. Panggil ulang hanya bila user mengubah nama/deskripsi. (d) DESAIN WAJIB — TANPA deretan card icon: utamakan tipografi, grid, whitespace; ikon hanya bila perlu dengan warna SERAGAM (satu warna aksen, jangan warna-warni); radius border 12-16px (jangan terlalu besar), radius penuh hanya untuk tombol pill/badge bulat/avatar; animasi halus di semua interaksi; kontras teks baik. (d2) DOKTRIN KUALITAS FRONTEND (WAJIB saat menulis/mengubah file web — ini standar profesional, bukan saran): YANG WAJIB DILAKUKAN: HTML semantik (header/nav/main/section/footer), design-system konsisten via CSS custom properties (SATU warna aksen utama, radius 12-16px, spacing kelipatan 8px, max-width container), mobile-first responsif penuh, animasi & micro-interaction halus di SEMUA interaksi (hover/active/focus, reveal-on-scroll, ripple), state lengkap tiap fitur (loading skeleton, empty state, error state dengan tombol retry), form dengan validasi real-time + pesan error jelas + label tepat, kontras teks minimal AA, meta viewport + title + favicon di tiap halaman, konten ASLI spesifik mengikuti tema (nama bisnis, copy unik), gambar nyata (URL web yang valid) atau SVG/gradien buatan sendiri yang detail. YANG DILARANG KERAS: lorem ipsum/teks template kosong, tombol mati atau href=\campuran lebih dari 2 font atau ikon dari beberapa set berbeda, warna pelangi tanpa sistem, !important asal tempel, inline style bercampur class, layout table hack, teks di bawah 12px, lebar fixed px untuk container, empty div tanpa isi nyata. UKURAN BERJiwa: setiap file HTML utama WAJIB kaya (idealnya 15-30KB+ kode bermakna: banyak section — hero, fitur, testimoni, FAQ, CTA, footer — plus interaksi JS nyata); proyek besar totalnya ratusan KB. JANGAN pernah bikin file kerangka tipis lalu bilang selesai. (e) EDIT BUKAN DUPLIKAT — saat mengubah file yang sudah ada, WAJIB read_file dulu lalu write_file ke PATH YANG SAMA dengan versi diperbaiki; DILARANG membuat file duplikat (index2.html dsb). (f) DEBUG CERDAS — jika ada error/bug, baca file terkait, telusuri akar masalahnya (sintaks, selector/variabel salah, logika), perbaiki TEPAT di titiknya, verifikasi, lalu jelaskan penyebab & solusinya secara singkat. (g) BACKEND — untuk fitur yang butuh server (API, form handler, webhook, logika server, PAYMENT, LOGIN/AUTH custom) buat dengan create_backend_function (terpasang & dipanggil via /api/fn/<nama>), uji dengan call_backend_function, dan frontend memanggilnya via fetch. KODE JALAN DI NODE.JS ASLI (sandbox Linux) — seluruh JS modern boleh: async/await, fetch, class, Map/Set, crypto.randomUUID, URL, Buffer, structuredClone; tulis kode backend secanggih engineer sungguhan (validasi input, error handling try/catch, struktur rapi, pesan error informatif). Di dalam kode function tersedia DATABASE BAWAAN db (await db.get(k) / db.set(k,v) / db.del(k) / db.list(prefix) / db.count()) — data bertahan permanen, kuota mengikuti paket langganan user (kalau db.set error kuota, sampaikan ke user untuk upgrade). Untuk PAYMENT BACKEND (Midtrans/Xendit/Tripay/dll): buat function order via db.set + panggil API gateway pakai fetch dengan server-key user (lewat args, JANGAN hardcode), dan buat webhook callback dengan is_public:true lalu berikan webhook_url dari respons ke user untuk dipasang di dashboard gateway (verifikasi signature sesuai dokumentasi gateway di dalam webhook). Untuk data klien sederhana gunakan localStorage. (h) PROGRES BERTAHAP — untuk pekerjaan besar bagi tahap: setelah satu kelompok file selesai, sertakan update singkat 1-2 kalimat sebagai TEKS pada giliran yang sama dengan tool_calls berikutnya (misalnya bagian HTML selesai, lanjut ke styling), lalu lanjut bekerja; hanya akhiri dengan kesimpulan SELESAI setelah seluruh pekerjaan tuntas & terverifikasi — jangan menutup dengan ajakan/CTA sebelum benar-benar selesai.';

        // Kirim request chat ke backend Clincoo. Retry otomatis (maks 3x, backoff
        // 0.6s/1.2s/2.4s) khusus gangguan jaringan sesaat atau error gateway 502/503/504 —
        // error definitif (400/401/dst) langsung dikembalikan tanpa retry.
        async function fetchChatWithRetry(apiMessagesWithTools, hop, signal) {
            const MAX_HOP_RETRIES = 3;
            let response = null;
            for (let attempt = 0; attempt <= MAX_HOP_RETRIES; attempt++) {
                if (!isGenerating) throw new DOMException('Aborted', 'AbortError');
                try {
                    response = await fetch(GEMINI_PROXY_URL, {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({
                            messages: apiMessagesWithTools,
                            session_id: currentSessionId || undefined,
                            project_id: currentProjectId || undefined,
                            workspace_tools: true,
                            save_user_message: hop === 0,
                            stream: true
                        }),
                        signal
                    });
                } catch (err) {
                    if (err.name === 'AbortError') throw err;
                    response = null;
                }

                const transientStatus = response && [502, 503, 504].indexOf(response.status) !== -1;
                if ((response && response.ok) || (!transientStatus && response)) break;
                if (attempt < MAX_HOP_RETRIES) {
                    await new Promise(r => setTimeout(r, 600 * Math.pow(2, attempt)));
                }
            }
            return response;
        }

        // Susun payload kirim ke AI: system + riwayat chat (teks & lampiran), lalu
        // pangkas riwayat besar (konteks penuh otomatis teratasi; tampilan tak berubah).
        function buildApiMessages(systemContent, excludeId) {
            const apiMessages = [{ role: 'system', content: systemContent }];

            const historyMsgs = messages.filter(m => !m.isHidden && m.id !== excludeId);
            historyMsgs.forEach(m => {
                let content = [];
                if (m.text) {
                    content.push({ type: "text", text: m.text });
                }
                if (m.attachments && m.attachments.length > 0) {
                    m.attachments.forEach(att => {
                        if (att.type === 'document' && att.text) {
                            content.push({ type: "text", text: `\n\n[Isi Dokumen Lampiran (${att.name})]:\n${att.text.substring(0, 10000)}` });
                        } else if (att.type === 'image') {
                            content.push({ type: "image_url", image_url: { url: att.data } });
                        }
                    });
                }

                const finalContent = content.length === 1 && content[0].type === 'text' ? content[0].text : (content.length > 0 ? content : m.text || ".");
                apiMessages.push({ role: m.role === 'ai' ? 'assistant' : 'user', content: finalContent });
            });

            try {
                const compactedHist = compactHistoryForContext(apiMessages);
                if (compactedHist !== apiMessages && compactedHist.length === apiMessages.length) {
                    for (let ci = 0; ci < compactedHist.length; ci++) apiMessages[ci] = compactedHist[ci];
                }
            } catch (e) {}
            return apiMessages;
        }

        // Verifikasi konektor GitHub via /user nyata; kembalikan konteks utk prompt.
        // Token TIDAK ikut ke prompt — hanya hasil verifikasinya.
        async function verifyGithubContext(lastUserMsg, setAiStatus) {
            const needsGitHubCheck = /\bgithub\b/i.test(lastUserMsg) &&
                /(akses|access|terhubung|connect|koneksi|cek|check|tes|test|repo|repository|repositori|profil|akun|bisa|can|lihat|list|baca|kelola|commit|push)/i.test(lastUserMsg);
            if (!needsGitHubCheck) return '';
            try { if (setAiStatus) setAiStatus('Checking GitHub connection…'); } catch (e) {}
            try {
                const ghCheck = await toolGithubRequest({ method: 'GET', path: '/user' });
                if (ghCheck && ghCheck.success && ghCheck.result && ghCheck.result.login) {
                    const gh = ghCheck.result;
                    return `\n\n[STATUS KONEKTOR GITHUB TERVERIFIKASI LANGSUNG]: BERHASIL. GitHub API menerima token konektor saat ini. Akun: ${String(gh.login).slice(0,100)}${gh.name ? ` (${String(gh.name).slice(0,100)})` : ''}; public_repos: ${Number(gh.public_repos || 0)}. Jika user hanya bertanya apakah GitHub-nya bisa diakses, jawab YA berdasarkan verifikasi ini dan sebut akun tersebut. Jika user meminta aksi/data repo, lanjutkan dengan github_request yang sesuai.`;
                } else {
                    const ghError = ghCheck && ghCheck.error ? String(ghCheck.error) : 'Koneksi GitHub gagal diverifikasi.';
                    return `\n\n[STATUS KONEKTOR GITHUB TERVERIFIKASI LANGSUNG]: GAGAL. Alasan asli: ${ghError.slice(0,500)}. Sampaikan alasan ini apa adanya; jangan mengarang alasan sinkronisasi/sesi.`;
                }
            } catch (e) {
                return `\n\n[STATUS KONEKTOR GITHUB TERVERIFIKASI LANGSUNG]: GAGAL. Alasan asli: ${String(e && e.message ? e.message : e).slice(0,500)}. Jangan mengarang alasan lain.`;
            }
        }

        // Proxy pembaca URL & pencarian web (backend Clincoo)
        const JINA_PROXY_URL = 'https://clincoo-be2.pages.dev/api/jina';

        // Ambil konteks eksternal sesuai rute: mode 'read' (baca URL di pesan)
        // atau 'search' (cari web). Kembalikan { context, sources }.
        async function fetchExternalContext(route, signal) {
            const out = { context: '', sources: [] };
            try {
                if (route.hasUrl) {
                    const targetUrl = route.extractedUrls[0];
                    const res = await fetch(JINA_PROXY_URL, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ mode: 'read', query: targetUrl }),
                        signal
                    });
                    if (res.ok) {
                        const resJson = await res.json();
                        const markdown = resJson.text || '';
                        out.context = `[DATA REAL-TIME DARI WEB]:\nSumber URL: ${targetUrl}\nIsi Konten URL:\n\n${markdown.substring(0, 15000)}\n\n[PENTING]: Gunakan informasi di atas untuk merespons karena ini adalah data dari situs terbaru yang diminta pengguna.`;
                        try {
                            const u = new URL(targetUrl);
                            const domain = u.hostname.replace(/^www\./, '');
                            out.sources = [{
                                url: targetUrl,
                                domain: domain,
                                favicon: `https://www.google.com/s2/favicons?domain=${domain}&sz=32`
                            }];
                        } catch(e) {}
                    }
                } else if (route.requiresSearch) {
                    const res = await fetch(JINA_PROXY_URL, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ mode: 'search', query: route.lastUserMsg }),
                        signal
                    });
                    if (res.ok) {
                        const resJson = await res.json();
                        const json = resJson.data || {};
                        if (json.data && json.data.length > 0) {
                            let markdownContent = '';
                            const sources = [];
                            const seenDomains = new Set();

                            json.data.forEach(item => {
                                if(item.title && item.content) {
                                    markdownContent += `### ${item.title}\nURL: ${item.url}\n\n${item.content}\n\n`;
                                }
                                try {
                                    if (item.url) {
                                        const u = new URL(item.url);
                                        const domain = u.hostname.replace(/^www\./, '');
                                        if (!seenDomains.has(domain)) {
                                            seenDomains.add(domain);
                                            sources.push({
                                                url: item.url,
                                                domain: domain,
                                                favicon: `https://www.google.com/s2/favicons?domain=${domain}&sz=32`
                                            });
                                        }
                                    }
                                } catch(e) {}
                            });

                            if (markdownContent.length > 50) {
                                out.context = `[HASIL PENCARIAN WEB REAL-TIME TERBARU]:\n\n${markdownContent.substring(0, 15000)}\n\n[INSTRUKSI WAJIB]: Kamu WAJIB menyusun jawaban berdasarkan hasil pencarian real-time di atas. Jangan menebak jawaban jika data sudah tersedia.`;
                                out.sources = sources;
                            }
                        }
                    }
                }
            } catch (e) {}
            return out;
        }

        // Deteksi rute permintaan: baca URL / cari web / generate gambar / lampiran / chat biasa
        function detectRequestRoute(lastUserMsgObj) {
            const lastUserMsg = lastUserMsgObj?.text || "";
            const hasAttachment = lastUserMsgObj?.attachments && lastUserMsgObj.attachments.length > 0;

            const urlRegex = /(https?:\/\/[^\s]+)|(\b[a-zA-Z0-9-]+\.(com|id|net|dev|org|ai|io|co|tech|edu|gov)(?:\/[^\s]*)?\b)/gi;
            let extractedUrls = lastUserMsg.match(urlRegex);
            let hasUrl = false;

            if (extractedUrls && extractedUrls.length > 0) {
                hasUrl = true;
                if (!extractedUrls[0].startsWith('http')) {
                    extractedUrls[0] = 'https://' + extractedUrls[0];
                }
            }

            const isTimeQuery = !hasUrl && checkIsTimeQuery(lastUserMsg);
            const requiresSearch = !hasUrl && !isTimeQuery && checkRequiresSearch(lastUserMsg);
            const requiresImage = !hasUrl && !hasAttachment && checkRequiresImageGeneration(lastUserMsg);

            let processType = 'think';
            if (hasUrl) processType = 'read';
            else if (requiresImage) processType = 'image';
            else if (requiresSearch) processType = 'search';
            else if (hasAttachment) processType = 'file';

            return { lastUserMsg, hasAttachment, hasUrl, extractedUrls, isTimeQuery, requiresSearch, requiresImage, processType };
        }

        async function fetchAIResponse() {
            toggleActionState(true);
            
            const lastUserMsgObj = [...messages].reverse().find(m => m.role === 'user');
            const route = detectRequestRoute(lastUserMsgObj);
            const { lastUserMsg, hasAttachment, hasUrl, extractedUrls, requiresSearch, requiresImage, processType } = route;

            // let (bukan const): saat fase bertahap, aiMsgObj diganti ke pesan progres baru
            let aiMsgObj = { 
                id: generateId(), 
                role: 'ai', 
                text: '', 
                isProcessing: true,
                isTyping: false,
                processType: processType,
                toolCalls: []
            };
            messages.push(aiMsgObj);
            renderMessages();
            scrollToBottom(false);
            
            currentAiMessageId = aiMsgObj.id;
            abortController = new AbortController();

            // Status progres REAL-TIME: mulai dari "Thinking...", lalu diperbarui
            // langsung dari aksi AI yang sedang berjalan (stream NDJSON dari server
            // + tool call AI) — bukan daftar teks hardcoded yang berputar sendiri.
            let statusInterval = null;
            currentStatusInterval = null;
            const setAiStatus = (text) => {
                if (!text) return;
                aiMsgObj.statusText = text;
                const statusEl = document.getElementById(`status-text-${aiMsgObj.id}`);
                if (statusEl) {
                    statusEl.classList.add('opacity-0');
                    setTimeout(() => {
                        statusEl.innerText = text;
                        statusEl.classList.remove('opacity-0');
                    }, 200);
                }
            };

            let streamingBuffer = "";
            let deltaStreamed = "";
            let isFetchComplete = false;
            let charIndex = 0;
            let hasReceivedData = false;

            const apiTimeout = setTimeout(() => {
                if (!hasReceivedData) {
                    if (!aiMsgObj._retried) {
                        aiMsgObj._retried = true;
                        stopGeneration();
                        setTimeout(() => retryGeneration(aiMsgObj.id), 500);
                    } else {
                        const index = messages.findIndex(m => m.id === aiMsgObj.id);
                        if (index !== -1) {
                            messages[index].text = `Sedang memuat... <span onclick="retryGeneration('${aiMsgObj.id}')" class="cursor-pointer underline font-medium" style="text-underline-offset: 3px;">ketuk untuk melanjutkan</span>`;
                            messages[index].isError = true;
                        }
                        stopGeneration();
                    }
                }
            }, 120000); 

            if (requiresImage) {
                try {
                    clearTimeout(apiTimeout); 
                    const promptStr = lastUserMsg.replace(/buatkan gambar|bikin gambar|buat gambar|generate image|tolong gambar|lukiskan/gi, '').trim();
                    const finalPrompt = promptStr || lastUserMsg;
                    const safePrompt = encodeURIComponent(finalPrompt);
                    const seed = Math.floor(Math.random() * 1000000);
                    const imageUrl = `https://image.pollinations.ai/prompt/${safePrompt}?seed=${seed}&nologo=true`;
                    
                    // FIX: dulu ada delay artifisial 3500ms di sini sebelum blok gambar
                    // (skeleton + <img>) dirender — padahal prompt & URL sudah pasti sejak baris
                    // di atas, jadi delay itu cuma bikin gambar "telat tampil" tanpa alasan
                    // teknis. Sekarang blok gambar langsung dirender saat ini juga; skeleton
                    // loading yang sudah ada di renderImageGenBlock() tetap menutupi waktu
                    // generate asli dari image.pollinations.ai (biasanya beberapa detik).
                    imageGenerationTimeout = setTimeout(() => {
                        const msgIndex = messages.findIndex(m => m.id === aiMsgObj.id);
                        if (msgIndex !== -1) {
                            messages[msgIndex].text = renderImageGenBlock(aiMsgObj.id, imageUrl, finalPrompt);
                            messages[msgIndex].isProcessing = false;
                            messages[msgIndex].isTyping = false;
                            messages[msgIndex].isImageResponse = true;
                            messages[msgIndex].imageUrl = imageUrl;
                        }
                        stopGeneration();
                    }, 120);
                    return; 
                } catch (e) {
                    clearTimeout(apiTimeout);
                    if (e.name !== 'AbortError') {
                        streamingBuffer = "Terjadi kesalahan sistem saat memproses permintaan gambar Anda.";
                        isFetchComplete = true;
                        const msgIndex = messages.findIndex(m => m.id === aiMsgObj.id);
                        if (msgIndex !== -1) messages[msgIndex].isError = true;
                    }
                }
            } 
            else {
                // Konteks eksternal (baca URL / cari web) via proxy Jina — hasil
                // berupa teks konteks utk prompt + daftar sumber utk kartu referensi.
                const ext = await fetchExternalContext(route, abortController.signal);
                const externalContext = ext.context;
                if (ext.sources.length) {
                    const msgIndex = messages.findIndex(m => m.id === aiMsgObj.id);
                    if (msgIndex !== -1) messages[msgIndex].sources = ext.sources;
                }
                
                // Status konektor GitHub diverifikasi NYATA (bukan ditebak dari badge)
                // hanya saat pesan benar-benar menyinggung akses GitHub user.
                const githubConnectionContext = await verifyGithubContext(lastUserMsg, setAiStatus);

                const now = new Date();
                const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric', hour: '2-digit', minute: '2-digit', timeZoneName: 'short' };
                const formattedDate = now.toLocaleDateString('id-ID', options);
                const timeContext = `\n\n[INFO SISTEM (REAL-TIME)]: Saat ini adalah ${formattedDate}. Jika user meminta data hari ini atau yang terbaru, WAJIB utamakan Konteks Pencarian Web yang disuntikkan ke prompt ini agar jawaban akurat sesuai kondisi masa kini.`;
                
                const systemInstructions = CLINCOO_SYSTEM_PROMPT + wsAutoRuleText();
                
                try {
                    // Susun payload: prompt sistem (+konteks waktu/GitHub/web) -> riwayat chat
                    // (+lampiran) -> pangkas biar konteks tidak meluap. Struktur kirim
                    // dikumpulkan di satu tempat: buildApiMessages().
                    const apiMessages = buildApiMessages(
                        systemInstructions + timeContext + githubConnectionContext + (externalContext ? `\n\n${externalContext}` : ''),
                        aiMsgObj.id
                    );

                    // Loop function-calling: AI bisa memanggil tools workspace CRUD beberapa kali
                    // sebelum menghasilkan jawaban final.
                    let resultJson = null;
                    let hopError = null;
                    const apiMessagesWithTools = apiMessages.slice();
                    const MAX_TOOL_HOPS = 8;

                    for (let hop = 0; hop < MAX_TOOL_HOPS; hop++) {
                        if (!isGenerating) throw new DOMException('Aborted', 'AbortError');

                        // Kirim ke backend chat dgn retry otomatis utk gangguan sesaat
                        const response = await fetchChatWithRetry(apiMessagesWithTools, hop, abortController.signal);
                        let hopQuotaHit = false, hopCtxHit = false, hopErrDetail = '', hopQuotaScope = null;

                        if (!response || !response.ok) {
                            if (response) {
                                try { const errJson = await response.json(); hopErrDetail = errJson.error || ''; hopQuotaHit = !!errJson.quota_exhausted; hopCtxHit = !!errJson.context_overflow; hopQuotaScope = errJson.scope || null; } catch(e) {}
                            }
                            if (hopQuotaHit) { hopError = new Error('__QUOTA__'); hopError.quotaMsg = hopErrDetail; hopError.quotaScope = hopQuotaScope; }
                            else if (hopCtxHit) { hopError = new Error('__QUOTA__'); hopError.quotaMsg = hopErrDetail; hopError.ctxOverflow = true; }
                            else { hopError = new Error(hopErrDetail || `Proxy AI HTTP error! status: ${response ? response.status : 'No response'} (setelah ${MAX_HOP_RETRIES + 1}x percobaan)`); }
                            break;
                        }

                        const ctype = (response.headers.get('content-type') || '');
                        if (ctype.indexOf('x-ndjson') !== -1) {
                            // Stream progres real-time: thinking -> progress -> final
                            resultJson = await readNdjsonStream(response, (evt) => {
                                if (evt.t === 'delta') {
                                    // Jawaban streaming live: teks tumbuh di bubble begitu keluar dari model
                                    hasReceivedData = true;
                                    deltaStreamed += evt.text || '';
                                    streamingBuffer = deltaStreamed;
                                    return;
                                }
                                if (evt.t === 'progress') hasReceivedData = true;
                                setAiStatus(evt.text || 'Thinking...');
                            });
                        } else {
                            resultJson = await response.json();
                        }
                        if (resultJson.session_id) currentSessionId = resultJson.session_id;
                        if (resultJson.error && (!resultJson.tool_calls || resultJson.tool_calls.length === 0)) {
                            if (resultJson.quota_exhausted) { hopError = new Error('__QUOTA__'); hopError.quotaMsg = resultJson.error; hopError.quotaScope = resultJson.scope || null; }
                            else if (resultJson.context_overflow) { hopError = new Error('__QUOTA__'); hopError.quotaMsg = resultJson.error; hopError.ctxOverflow = true; }
                            else { hopError = new Error(resultJson.error || 'AI gagal memproses permintaan.'); }
                            break;
                        }

                        // Tidak ada tool call → jawaban final, keluar dari loop
                        if (!resultJson.tool_calls || resultJson.tool_calls.length === 0) break;

                        // === FASE BERTAHAP (multi "Menjalankan Tugas") ===
                        // Model boleh mengirim catatan update DI TENGAH pekerjaan bersama
                        // tool_calls berikutnya. Catatan itu jadi pesan terpisah di chat,
                        // kartu progres lama ditutup sebagai "sebagian selesai", dan
                        // tool_calls berikutnya masuk kartu progres BARU — sampai final.
                        const phaseNote = (resultJson.text || '').trim();
                        if (phaseNote) {
                            const pIdx = messages.findIndex(m => m.id === aiMsgObj.id);
                            const parsedPhase = parsePollBlock(phaseNote);
                            if (pIdx !== -1 && parsedPhase.questions.length) {
                                // POLLING di tengah pekerjaan: AI WAJIB BERHENTI di sini —
                                // pertanyaan belum dijawab user, jadi JANGAN eksekusi
                                // tool_calls lanjutan & jangan lanjut membangun. Kerja
                                // dilanjutkan otomatis setelah jawaban polling masuk.
                                messages[pIdx].text = parsedPhase.clean;
                                messages[pIdx].pollQuestions = parsedPhase.questions;
                                messages[pIdx].pollState = { current: 0, answers: [] };
                                messages[pIdx].midPhase = true;   // chip "sebagian selesai", tanpa tombol aksi
                                messages[pIdx].isProcessing = false;
                                messages[pIdx].isTyping = false;
                                messages[pIdx].statusText = '';
                                renderMessages();
                                scrollToBottom(false);
                                resultJson = { session_id: resultJson.session_id, text: '', tool_calls: [] };
                                break; // keluar dari loop hop — berhenti total menunggu jawaban
                            }
                            if (pIdx !== -1) {
                                messages[pIdx].text = parsedPhase.clean;
                                messages[pIdx].midPhase = true;   // chip "sebagian selesai", tanpa tombol aksi
                                messages[pIdx].isProcessing = false;
                                messages[pIdx].isTyping = false;
                                messages[pIdx].statusText = '';
                            }
                            aiMsgObj = { id: generateId(), role: 'ai', text: '', isProcessing: true, isTyping: false, processType: 'file', toolCalls: [] };
                            messages.push(aiMsgObj);
                            currentAiMessageId = aiMsgObj.id;
                            renderMessages();
                            scrollToBottom(false);
                        }

                        // Progress real-time: teks diambil dari aksi AI sendiri (nama tool + argumennya)
                        resultJson.tool_calls.forEach(tc => setAiStatus(clientToolProgressLabel(tc)));

                        // Eksekusi tool workspace secara lokal (localStorage browser)
                        const assistantToolParts = resultJson.tool_calls.map(function(tc) {
                            return { type: 'function_call', name: tc.name, args: tc.args || {}, thought_signature: tc.thought_signature || undefined };
                        });
                        apiMessagesWithTools.push({ role: 'assistant', content: assistantToolParts });

                        const functionResponses = await Promise.all(resultJson.tool_calls.map(async function(tc) {
                            const result = (tc.result !== undefined && tc.result !== null)
                                ? tc.result
                                : await executeWorkspaceTool(tc.name, tc.args || {});
                            const ok = !(result && typeof result === 'object' && result.error);
                            let resultText = '';
                            try { resultText = (typeof result === 'string') ? result : JSON.stringify(result, null, 2); } catch(e) { resultText = String(result); }
                            if (resultText && resultText.length > 4000) resultText = resultText.slice(0, 4000) + '\n… (dipotong)';
                            aiMsgObj.toolCalls.push({ name: tc.name, args: tc.args || {}, ok: ok, result: resultText });
                            return { type: 'function_response', name: tc.name, result: result };
                        }));
                        apiMessagesWithTools.push({ role: 'user', content: functionResponses });
                        // Tampilkan progres eksekusi tugas secara langsung ke chat (mirip kartu "Ran command")
                        renderMessages();
                    }

                    if (hopError) throw hopError;

                    hasReceivedData = true;
                    if (quotaLocked) setQuotaLock(false);
                    clearTimeout(apiTimeout);
                    clearInterval(statusInterval);

                    const msgIndex = messages.findIndex(m => m.id === aiMsgObj.id);
                    if (msgIndex !== -1 && messages[msgIndex].isProcessing) {
                        messages[msgIndex].isProcessing = false;
                        messages[msgIndex].isTyping = true;
                    }

                    if (resultJson && resultJson.session_id) currentSessionId = resultJson.session_id;
                    // POLLING: blok [[POLL]]...[[/POLL]] dari jawaban final diubah jadi
                    // kartu pertanyaan interaktif; teks yang tampil bersih tanpa marker.
                    const finalText = (resultJson && resultJson.text ? resultJson.text : "");
                    const parsedFinal = parsePollBlock(finalText);
                    if (parsedFinal.questions.length) {
                        const fIdx = messages.findIndex(m => m.id === aiMsgObj.id);
                        if (fIdx !== -1) {
                            messages[fIdx].pollQuestions = parsedFinal.questions;
                            messages[fIdx].pollState = { current: 0, answers: [] };
                        }
                    }
                    if (deltaStreamed) {
                        if (parsedFinal.clean !== deltaStreamed) {
                            // final beda dari teks terstream (mis. ada catatan tool di tengah) -> render otentik
                            streamingBuffer = parsedFinal.clean;
                            charIndex = parsedFinal.clean.length;
                            const dfIdx = messages.findIndex(m => m.id === aiMsgObj.id);
                            if (dfIdx !== -1) messages[dfIdx].text = parsedFinal.clean;
                            const dfEl = document.getElementById('msg-text-' + aiMsgObj.id);
                            if (dfEl) dfEl.innerHTML = formatMarkdown(parsedFinal.clean);
                        }
                    } else {
                        streamingBuffer += parsedFinal.clean;
                    }
                    isFetchComplete = true;
                } catch (e) {
                    if (e.name !== 'AbortError') {
                        if (e.message === '__QUOTA__') {
                            if (e.ctxOverflow) {
                                // Konteks percakapan penuh (BUKAN kredit habis): jangan
                                // gagalkan proses — checkpoint ringkas (sudah dikerjakan/sisa),
                                // riwayat lama dipangkas otomatis, lanjut dengan balas "lanjut".
                                streamingBuffer = buildCheckpointText(
                                    (aiMsgObj.toolCalls || []),
                                    'Konteks percakapan penuh — kodenya sudah aman tersimpan.',
                                    ' Riwayat lama dipangkas otomatis supaya lanjutan tetap masuk konteks — balas "lanjut" untuk meneruskan sisa tugas.'
                                );
                                const cpIdx = messages.findIndex(m => m.id === aiMsgObj.id);
                                if (cpIdx !== -1) messages[cpIdx].checkpoint = true;
                            } else if (e.quotaScope) {
                                // Kredit habis (bulanan ATAU harian): pesan user TETAP
                                // terkirim & tersimpan — sistem membalas pesan kuota
                                // sesuai scope + link upgrade. Komposer tidak dikunci.
                                quotaScope = e.quotaScope;
                                quotaLocked = true;
                                streamingBuffer = quotaExhaustedMsg(e.quotaScope);
                            } else {
                                // 429 tanpa scope = limit provider (sementara): tampilkan
                                // alasan asli dari backend, jangan ajak upgrade.
                                streamingBuffer = e.quotaMsg || 'Kuota/limit AI sedang penuh — coba lagi sebentar lagi.';
                            }
                            hasReceivedData = true;
                            isFetchComplete = true;
                        } else {
                        // FALLBACK: /api/chat gagal karena provider (bukan kuota) -> coba /api/ai
                        // (Clincoo AI: Workers AI di backend, tanpa API key). Kuota habis TIDAK
                        // difallback — UX kuota tetap seperti sebelumnya.
                        let fbOk = false;
                        try {
                            const fbTok = localStorage.getItem('clinqoo_auth_token') || localStorage.getItem('clinqoo_token') || '';
                            const fbRes = await fetch(TOOL_API_BASE + '/api/ai', {
                                method: 'POST',
                                headers: { 'Content-Type': 'application/json', ...(fbTok ? { Authorization: 'Bearer ' + fbTok } : {}) },
                                body: JSON.stringify({ messages: apiMessages })
                            });
                            if (fbRes.ok) {
                                const fbJson = await fbRes.json();
                                if (fbJson && fbJson.text) {
                                    console.log('Clincoo AI fallback aktif:', fbJson.model || 'workers-ai');
                                    streamingBuffer = fbJson.text;
                                    hasReceivedData = true;
                                    if (quotaLocked) setQuotaLock(false);
                                    clearTimeout(apiTimeout);
                                    clearInterval(statusInterval);
                                    const fbIdx = messages.findIndex(m => m.id === aiMsgObj.id);
                                    if (fbIdx !== -1 && messages[fbIdx].isProcessing) { messages[fbIdx].isProcessing = false; messages[fbIdx].isTyping = true; }
                                    isFetchComplete = true;
                                    fbOk = true;
                                }
                            }
                        } catch (e2) { console.warn('Fallback /api/ai gagal:', e2 && e2.message); }
                        if (!fbOk) {
                        streamingBuffer = "Maaf, terjadi kesalahan: " + (e.message || "Gagal menghubungi server AI") + ". Silakan coba lagi nanti.";
                        isFetchComplete = true;
                        const msgIndex = messages.findIndex(m => m.id === aiMsgObj.id);
                        if (msgIndex !== -1) messages[msgIndex].isError = true;
                    }
                    }
                }
            }

            if (!isGenerating || !currentAiMessageId) return;
            if (typingInterval) clearInterval(typingInterval);

            let localText = "";
            typingInterval = setInterval(() => {
                if (charIndex < streamingBuffer.length) {
                    const diff = streamingBuffer.length - charIndex;
                    
                    let charsToProcess = Math.max(2, Math.floor(diff / 2));
                    if (diff > 50) charsToProcess = Math.max(20, Math.floor(diff / 1.5));
                    
                    localText += streamingBuffer.substring(charIndex, charIndex + charsToProcess);
                    charIndex += charsToProcess;
                    
                    const msgIndex = messages.findIndex(m => m.id === aiMsgObj.id);
                    if (msgIndex !== -1) {
                        messages[msgIndex].text = localText;
                        const textEl = document.getElementById(`msg-text-${aiMsgObj.id}`);
                        if (textEl) {
                            textEl.innerHTML = formatMarkdown(balanceMarkdown(messages[msgIndex].text));
                            textEl.classList.add('typing-cursor');
                        }
                    }
                    scrollToBottom(false);
                } else if (isFetchComplete && charIndex >= streamingBuffer.length) {
                    stopGeneration();
                }
            }, 15);
        }
        }

        // ===== MODE AGENT: tugas otonom di latar belakang, progres dikirim ke chat =====
        // Ala superagent: mulai -> event per langkah -> auto-resume kena limit -> hasil akhir.
        function agentSleep(ms) { return new Promise(function (res) { setTimeout(res, ms); }); }
        function agentAuthHeaders() {
            var tok = localStorage.getItem('clinqoo_auth_token') || localStorage.getItem('clinqoo_token') || '';
            return tok ? { 'Authorization': 'Bearer ' + tok } : {};
        }
        function agentEventsText(events) {
            return (events || []).map(function (ev) {
                if (ev.kind === 'start') return '\u{1F680} ' + ev.text;
                if (ev.kind === 'progress') return '\u2699\uFE0F ' + ev.text;
                if (ev.kind === 'done') return '\u2705 ' + ev.text;
                if (ev.kind === 'paused') return '\u23F8\uFE0F ' + ev.text;
                return '\u2022 ' + ev.text;
            }).join('\n');
        }
        async function runAgentTask(goal) {
            window.__agentAbort = false;
            isGenerating = true;
            const aiMsg = { id: generateId(), role: 'ai', text: '\u26A1 Memulai tugas agent...', isProcessing: true, toolCalls: [] };
            messages.push(aiMsg);
            renderMessages();
            scrollToBottom(true);

            const AGENT_API = TOOL_API_BASE + '/api/agent';
            const upd = function (text, done, isError) {
                const idx = messages.findIndex(function (m) { return m.id === aiMsg.id; });
                if (idx !== -1) {
                    messages[idx].text = text;
                    messages[idx].isProcessing = !done;
                    messages[idx].isError = !!isError;
                    if (done) messages[idx].isTyping = false;
                    renderMessages();
                    try { saveChatLog(); } catch (e) {}
                    if (done) settleAfterAnswer();
                }
                scrollToBottom(false);
            };

            let task = null;
            let seen = 0;
            try {
                const res = await fetch(AGENT_API, { method: 'POST', headers: Object.assign({ 'Content-Type': 'application/json' }, agentAuthHeaders()), body: JSON.stringify({ action: 'start', goal: goal, project_id: (typeof currentProjectId !== 'undefined' ? currentProjectId : undefined) }) });
                const data = await res.json().catch(function () { return {}; });
                if (res.status === 429 && data.quota_exhausted) { upd('Kuota AI hari ini sudah habis \u2014 tugas batal. Coba lagi besok.', true, true); isGenerating = false; return; }
                if (!res.ok || !data.ok) { upd('Gagal memulai tugas: ' + (data.error || 'HTTP ' + res.status), true, true); isGenerating = false; return; }
                task = data.task;

                while (!window.__agentAbort) {
                    const st = await fetch(AGENT_API + '?task_id=' + encodeURIComponent(task.id), { headers: agentAuthHeaders() });
                    const sd = await st.json().catch(function () { return {}; });
                    if (!st.ok || !sd.ok) { await agentSleep(4000); continue; }
                    task = sd.task;
                    const evs = sd.events || [];
                    if (evs.length > seen) {
                        seen = evs.length;
                        upd('\u26A1 Tugas: ' + goal + '\n\n' + agentEventsText(evs) + (task.status === 'running' ? '\n\n\u23F3 Bekerja di latar belakang...' : ''), false, false);
                    }
                    if (task.status === 'done') {
                        upd(task.result ? String(task.result) : 'Tugas selesai.', true, false);
                        isGenerating = false;
                        try { saveChatLog(); } catch (e) {}
                        return;
                    }
                    if (task.status === 'failed') {
                        upd('Tugas gagal: ' + (task.error || 'provider AI tidak tersedia'), true, true);
                        isGenerating = false;
                        return;
                    }
                    if (task.status === 'paused') {
                        // AUTO-LANJUT tanpa konfirmasi \u2014 kena limit/budget pun lanjut sendiri dari langkah terakhir
                        const rr = await fetch(AGENT_API, { method: 'POST', headers: Object.assign({ 'Content-Type': 'application/json' }, agentAuthHeaders()), body: JSON.stringify({ action: 'resume', task_id: task.id }) });

if (loadChatLog()) {

            } catch(e) { console.error('Handoff error:', e); }

    try { return localStorage.getItem('clinqoo_auth_token') || localStorage.getItem('clinqoo_token') || ''; } catch (e) { return ''; }
  }
  window.clinqooEditorPlan = null;

    try {
      var t = clinqooAuthToken();

          clinqooShowCrowns(d.plan === 'Starter');

        window.clinqooEditorPlan = _cSub.plan;

      (async function () {

    }

        '<div class="mb-4 ' + (p.hot ? 'mt-2' : '') + '"><h3 class="text-lg font-bold text-gray-900 ' + (p.hot ? 'text-accent' : '') + '">' + p.name + '</h3>' +
        '<p class="text-xs text-gray-500 mt-0.5">' + p.tagline + '</p></div>' +
        '<div class="mb-4 flex items-baseline"><span class="text-2xl font-extrabold tracking-tight text-gray-900">' + p.price + '</span><span class="text-xs font-medium text-gray-500 ml-1">' + p.per + '</span></div>' +
        '<ul class="flex flex-col gap-2.5 mb-4 flex-1">' + list + '</ul>' + btn + '</div></div>';
    };
    var slides = plans.map(card).join('');
    var dots = plans.map(function (p, i) {
      return '<button class="upc-dot rounded-full transition-all duration-200" data-i="' + i + '" style="width:6px;height:6px;background:#d1d5db;"></button>';
    }).join('');
    var css = document.createElement('style');
    css.id = 'upgrade-plans-css';
    css.textContent =
      '#upgrade-plans-modal .text-accent{color:var(--accent-color,#000000);} ' +
      '#upgrade-plans-modal .bg-accent{background-color:var(--accent-color,#000000);color:#ffffff;} ' +
      '#upgrade-plans-modal .border-accent{border-color:var(--accent-color,#000000);} ' +
      'body.dark-mode #upgrade-plans-modal .text-accent{color:#ffffff !important;} ' +
      'body.dark-mode #upgrade-plans-modal .bg-accent{background-color:#ffffff !important;color:#000000 !important;} ' +
      'body.dark-mode #upgrade-plans-modal .border-accent{border-color:#ffffff !important;}';
    m.innerHTML =
      '<div class="fixed inset-0 z-[95] overflow-y-auto p-3 sm:p-4" style="background:rgba(0,0,0,0.45)">' +
      '<div class="min-h-full flex items-center justify-center">' +
      '<div class="bg-white rounded-2xl w-full max-w-sm relative px-4 sm:px-5 pt-9 pb-4 my-2">' +
      '<button id="upgrade-plans-x" class="absolute top-2.5 right-2.5 w-7 h-7 rounded-full bg-gray-50 hover:bg-gray-100 text-gray-500 hover:text-black flex items-center justify-center transition-colors z-10" aria-label="Tutup"><svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M18 6 6 18M6 6l12 12"></path></svg></button>' +
      '<h3 class="text-base font-semibold text-gray-900 text-center pr-6">Paket Clincoo</h3>' +
      '<p class="text-[13px] sm:text-sm text-gray-500 mt-1 text-center leading-snug px-1">Fitur Editor & impor GitHub tersedia mulai paket Pro. Paket kamu saat ini: <b>' + current + '</b>.</p>' +
      '<div class="relative mt-4">' +
        '<div id="upc-viewport" class="overflow-hidden rounded-2xl" style="touch-action:pan-y;">' +
          '<div id="upc-track" class="flex transition-transform duration-300 ease-out">' + slides + '</div>' +
        '</div>' +
        '<button id="upc-prev" class="absolute left-0 top-1/2 -translate-y-1/2 -ml-2 w-7 h-7 rounded-full bg-white border border-gray-200 shadow-md flex items-center justify-center text-gray-600 hover:text-black transition-colors"><svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="m15 18-6-6 6-6"></path></svg></button>' +
        '<button id="upc-next" class="absolute right-0 top-1/2 -translate-y-1/2 -mr-2 w-7 h-7 rounded-full bg-white border border-gray-200 shadow-md flex items-center justify-center text-gray-600 hover:text-black transition-colors"><svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="m9 18 6-6-6-6"></path></svg></button>' +
      '</div>' +
      '<div class="flex items-center justify-center gap-2 mt-4">' + dots + '</div>' +
      '</div></div>';
    document.body.appendChild(css);
    document.body.appendChild(m);
    var track = m.querySelector('#upc-track');
    var dotsEls = m.querySelectorAll('.upc-dot');
    var idx = 1;
    function render() {
      track.style.transform = 'translateX(-' + (idx * 100) + '%)';
      dotsEls.forEach(function (d, i) {
        var on = (i === idx);
        d.style.width = on ? '18px' : '6px';
        d.style.background = on ? '' : '#d1d5db';
        d.classList.toggle('bg-accent', on);
      });
    }
    function go(i) { idx = (i + plans.length) % plans.length; render(); }
    m.querySelector('#upc-prev').addEventListener('click', function () { go(idx - 1); });
    m.querySelector('#upc-next').addEventListener('click', function () { go(idx + 1); });
    dotsEls.forEach(function (d) { d.addEventListener('click', function () { go(parseInt(d.dataset.i, 10)); }); });
    var vp = m.querySelector('#upc-viewport'), sx = null, dx = 0;
    vp.addEventListener('touchstart', function (e) { sx = e.touches[0].clientX; dx = 0; track.style.transition = 'none'; }, { passive: true });
    vp.addEventListener('touchmove', function (e) {
      if (sx === null) return;
      dx = e.touches[0].clientX - sx;
      var w = vp.offsetWidth;
      var lo = -(w * (plans.length - 1)) - 30;
      var trackX = Math.min(Math.max(-(idx * w) + dx, lo), 30);
      track.style.transform = 'translateX(' + trackX + 'px)';
    }, { passive: true });
    vp.addEventListener('touchend', function () {
      track.style.transition = '';
      if (Math.abs(dx) > 40) go(dx < 0 ? idx + 1 : idx - 1); else render();
      sx = null;
    });
    m.querySelector('#upgrade-plans-x').addEventListener('click', function () { m.remove(); var cs = document.getElementById('upgrade-plans-css'); if (cs) cs.remove(); });
    m.firstElementChild.addEventListener('click', function (e) { if (e.target === m.firstElementChild) m.remove(); });
    render();
  }
  clinqooRefreshEditorCrown();
  window.addEventListener('storage', function (ev) { if (ev.key === 'TM_SUB_CACHE_KEY') clinqooRefreshEditorCrown(); });
  if (typeof clinqooCheckQuotaBanner === 'function') {
    clinqooCheckQuotaBanner();
    setInterval(clinqooCheckQuotaBanner, 3 * 60 * 1000);
  }
})();
</script>
</body>
</html>
