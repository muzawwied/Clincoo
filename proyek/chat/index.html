                        let netTry = 0;
                        // FIX BACKGROUNDING: saat user pindah app lain (mis. WhatsApp),
                        // OS mobile membekukan halaman & memutus koneksi stream. Saat
                        // kembali, stream mati tanpa event final -> error "Koneksi AI
                        // terputus" -> tugas gagal padahal tool call sudah setengah jalan.
                        // Solusi: gangguan jaringan (bukan user stop, bukan kuota) ->
                        // RECONNECT diam-diam: kirim ulang request DENGAN riwayat tool
                        // yang sudah jalan (apiMessagesWithTools), server lanjut tugas
                        // dari titik terhenti — user gak perlu minta "lanjut" manual.
                        const reconnectStream = async function (streamErr) {
                            netTry++;
                            setAiStatus(netTry === 1 ? 'Menyambung ulang…' : 'Menyambung ulang tugas…');
                            await new Promise(r => setTimeout(r, netTry === 1 ? 1500 : (netTry === 2 ? 4000 : 6000)));
                            if (!isGenerating) throw new DOMException('Aborted', 'AbortError');
                            // buang delta parsial hop ini agar re-stream tidak dobel teks
                            deltaStreamed = deltaStreamed.slice(0, deltaBaseLen);
                            streamingBuffer = deltaStreamed;
                            // guard: fetch reconnect pun bisa menggantung tanpa balas
                            // (koneksi benar2 mati) — timeout 300s agar tidak deadlock;
                            // abort user-stop tetap diteruskan lewat chaining sinyal.
                            if (abortController.signal.aborted) throw new DOMException('Aborted', 'AbortError');
                            const rc = new AbortController();
                            const onStop = () => { try { rc.abort(); } catch (e3) {} };
                            abortController.signal.addEventListener('abort', onStop);
                            const rcT = setTimeout(() => rc.abort(new Error('Koneksi mati saat menyambung ulang')), 300000);
                            try {
                            response0 = await fetch(GEMINI_PROXY_URL, {
                                method: "POST",
                                headers: { "Content-Type": "application/json" },
                                body: JSON.stringify({
                                    messages: apiMessagesWithTools,
                                    session_id: currentSessionId || undefined,
                                    project_id: currentProjectId || undefined,
                                    workspace_tools: true,
                                    premium: AI_PREMIUM_MODEL, mode: (typeof window.selectedAiMode === 'function' && window.selectedAiMode()) || 'chat',
                                    save_user_message: false,

                                    stream: true
                                }),
                                signal: rc.signal
                            });
                            } finally {
                                clearTimeout(rcT);
                                abortController.signal.removeEventListener('abort', onStop);
                            }
                            if (!response0.ok) {
                                // error definitif dari server (mis. kuota) -> parse agar
                                // penanganan tengah-tugas (checkpoint/auto-lanjut) jalan
                                try {
                                    const ej = await response0.json();
                                    if (ej && ej.error) {
                                        const er = new Error('__QUOTA__');
                                        er.quotaMsg = ej.error;
                                        if (ej.context_overflow) er.ctxOverflow = true;
                                        if (!ej.quota_exhausted && !ej.context_overflow) throw streamErr;
                                        throw er;
                                    }
                                } catch (e2) { if (e2 && e2.message === '__QUOTA__') throw e2; }
                                throw streamErr; // fallback menangani
                            }
                        };
                        const isNetDrop = (e) => e && e.name !== 'AbortError' && e.message !== '__QUOTA__' && !e.providerBusy && !e.isAppError;
                        const deltaBaseLen = deltaStreamed.length; // basis delta hop ini (utk reset saat reconnect)
                        // STALL WATCHDOG (fix kedua backgrounding): koneksi yang dibunuh
                        // OS saat app di-background KADANG tidak melempar error sama sekali —
                        // reader menggantung selamanya, AI terlihat "masih bekerja" padahal
                        // sudah mati. Watchdog ini mengukur jeda antar event stream; jika
                        // lebih dari STALL_MS (sudah di atas worst-case rantai provider
                        // 90+90+25+25+25s), body stream dibatalkan paksa -> readNdjsonStream
                        // melempar -> jalur reconnect menyiapkan koneksi baru & tugas lanjut.
                        const STALL_MS = 300000;
                        let lastEventAt = Date.now();
                        let stallHits = 0;
                        const stallTimer = setInterval(() => {
                            if (!isGenerating) { clearInterval(stallTimer); return; }
                            if (Date.now() - lastEventAt < STALL_MS) return;
                            stallHits++;
                            lastEventAt = Date.now(); // re-arm utk fetch reconnect berikutnya
                            try { if (response0 && response0.body) response0.body.cancel(); } catch (e) {}
                            if (stallHits >= 4) clearInterval(stallTimer); // reconnect 2x habis -> biarkan jalur error/fallback
                        }, 15000);
                        try {
                        for (;;) {
                            try {
                                return await readNdjsonStream(response0, (evt) => {
                                    lastEventAt = Date.now(); // event hidup -> stream masih sehat
                                    if (evt.t === 'delta') {
                                        hasReceivedData = true;
                                        deltaStreamed += evt.text || '';
                                        streamingBuffer = deltaStreamed;
                                        return;
                                    }
                                    if (evt.t === 'progress') hasReceivedData = true;
                                    setAiStatus(evt.text || 'Thinking...');
                                });
                            } catch (streamErr) {
                                if (streamErr && streamErr.providerBusy && busyTry < 2 && isGenerating) {
                                    busyTry++;
                                    setAiStatus('Server AI sedang sibuk — melanjutkan otomatis…');
                                    await new Promise(r => setTimeout(r, busyTry === 1 ? 8000 : 20000));
                                    if (!isGenerating) throw new DOMException('Aborted', 'AbortError');
                                    response0 = await fetch(GEMINI_PROXY_URL, {
                                        method: "POST",
                                        headers: { "Content-Type": "application/json" },
                                        body: JSON.stringify({
                                            messages: apiMessagesWithTools,
                                            session_id: currentSessionId || undefined,
                                            project_id: currentProjectId || undefined,
                                            workspace_tools: true,
                                            premium: AI_PREMIUM_MODEL, mode: (typeof window.selectedAiMode === 'function' && window.selectedAiMode()) || 'chat',
                                            save_user_message: false,

                                            stream: true
                                        }),
                                        signal: abortController.signal
                                    });
                                    if (!response0.ok) throw streamErr; // definitif -> fallback menangani
                                    continue;
                                }
                                // GANGGUAN JARINGAN (termasuk app di-background lalu dibuka lagi):
                                // reconnect sampai 2x — tugas dilanjutkan, bukan error merah.
                                if (isNetDrop(streamErr) && netTry < 3 && isGenerating) {
                                    await reconnectStream(streamErr);
                                    continue;
                                }
                                throw streamErr;
                            }
                        }
                        } finally { clearInterval(stallTimer); }
                    };

                    for (let hop = 0; hop < MAX_TOOL_HOPS; hop++) {
                        if (!isGenerating) throw new DOMException('Aborted', 'AbortError');

                        // Retry otomatis (maks 3x) khusus untuk gangguan jaringan sesaat
                        // (koneksi putus/timeout di tengah proses generate beberapa file) atau
                        // error gateway sementara (502/503/504) — supaya proses panjang yang
                        // butuh banyak hop tidak gagal total hanya karena satu koneksi drop.
                        const MAX_HOP_RETRIES = 3;
                        let hopQuotaHit = false, hopCtxHit = false, hopErrDetail = '';
                        for (let attempt = 0; attempt <= MAX_HOP_RETRIES; attempt++) {
                            if (!isGenerating) throw new DOMException('Aborted', 'AbortError');
                            try {
                                response = await fetch(GEMINI_PROXY_URL, {
                                    method: "POST",
                                    headers: { "Content-Type": "application/json" },
                                    body: JSON.stringify({
                                        messages: apiMessagesWithTools,
                                        session_id: currentSessionId || undefined,
                                        project_id: currentProjectId || undefined,
                                        workspace_tools: true,
                                        premium: AI_PREMIUM_MODEL, mode: (typeof window.selectedAiMode === 'function' && window.selectedAiMode()) || 'chat',
                                        save_user_message: hop === 0,
                                       
                                        stream: true
                                    }),
                                    signal: abortController.signal
                                });
                            } catch (err) {
                                if (err.name === 'AbortError') throw err;
                                response = null;
                            }

                            const transientStatus = response && [502, 503, 504].indexOf(response.status) !== -1;
                            if ((response && response.ok) || (!transientStatus && response)) break; // sukses ATAU error definitif (400/401/403/dst) -> jangan retry
                            if (attempt < MAX_HOP_RETRIES) {
                                await new Promise(r => setTimeout(r, 600 * Math.pow(2, attempt))); // backoff: 0.6s, 1.2s, 2.4s
                                continue;
                            }
                        }

                        if (!response || !response.ok) {
                            if (response) {
                                try { const errJson = await response.json(); hopErrDetail = errJson.error || ''; hopQuotaHit = !!errJson.quota_exhausted; hopCtxHit = !!errJson.context_overflow; } catch(e) {}
                            }
                            if (hopQuotaHit) { hopError = new Error('__QUOTA__'); hopError.quotaMsg = hopErrDetail; }
                            else if (hopCtxHit) { hopError = new Error('__QUOTA__'); hopError.quotaMsg = hopErrDetail; hopError.ctxOverflow = true; }
                            else { hopError = new Error(hopErrDetail || `Proxy AI HTTP error! status: ${response ? response.status : 'No response'} (setelah ${MAX_HOP_RETRIES + 1}x percobaan)`); }
                            break;
                        }

                        const ctype = (response.headers.get('content-type') || '');
                        if (ctype.indexOf('x-ndjson') !== -1) {
                            // Stream progres real-time: thinking -> progress -> final
                            // (dengan auto-retry diam-diam saat server AI sibuk sesaat)
                            resultJson = await readStreamWithBusyRetry(response);
                        } else {
                            resultJson = await response.json();
                        }
                        if (resultJson.session_id) currentSessionId = resultJson.session_id;
                        if (resultJson.error && (!resultJson.tool_calls || resultJson.tool_calls.length === 0)) {
                            if (resultJson.quota_exhausted) { hopError = new Error('__QUOTA__'); hopError.quotaMsg = resultJson.error; }
                            else if (resultJson.context_overflow) { hopError = new Error('__QUOTA__'); hopError.quotaMsg = resultJson.error; hopError.ctxOverflow = true; }
                            else { hopError = new Error(resultJson.error || 'AI gagal memproses permintaan.'); }
                            break;
                        }

                        // Tidak ada tool call → jawaban final, keluar dari loop
                        if (!resultJson.tool_calls || resultJson.tool_calls.length === 0) {
                            // Gabungkan teks final antar-ronde AUTO-LANJUT SILENT
                            const cleanNow = (resultJson.text || '');
                            if (cleanNow) accumulatedFinal = accumulatedFinal ? (accumulatedFinal + '\n\n' + cleanNow) : cleanNow;
                            // POLL/FORM/PLUGIN = hentian SENGAJA menunggu input user -> jangan pernah auto-lanjut
                            if (cleanNow.indexOf('[[POLL]]') !== -1 || cleanNow.indexOf('[[FORM]]') !== -1 || cleanNow.indexOf('[[PLUGIN:') !== -1 || cleanNow.indexOf('[[APK_LOGO]]') !== -1) {
                                resultJson = Object.assign({}, resultJson, { text: accumulatedFinal });
                                break;
                            }
                            // AUTO-LANJUT SILENT: jawaban final terindikasi BELUM TUNTAS
                            // ("akan saya lanjutkan", "bersambung", dsb.) — kirim prompt lanjutan
                            // yang TIDAK tampil di bubble user; AI terus bekerja sampai selesai.
                            if (silentRounds < SILENT_MAX_ROUNDS && finalLooksUnfinished(cleanNow, aiMsgObj) && isGenerating) {
                                silentRounds++;
                                setAiStatus('Melanjutkan sisa tugas…');
                                pushSilentNudge();
                                apiMessagesWithTools.push({ role: 'user', content: [{ type: 'text', text: messages[messages.length - 1].text }] });
                                continue; // ronde lanjutan dalam bubble yang sama
                            }
                            resultJson = Object.assign({}, resultJson, { text: accumulatedFinal });
                            break;
                        }

                        // === FASE BERTAHAP (multi "Menjalankan Tugas") ===
                        // Model boleh mengirim catatan update DI TENGAH pekerjaan bersama
                        // tool_calls berikutnya. FIX: dulu catatan ini membuka bubble/kartu
                        // progres BARU (kartu lama ditutup "Partially done — continuing…",
                        // kartu baru "Running…") — user melihat 2 kartu terpisah menumpuk utk
                        // 1 tugas yang sama. Sekarang (kecuali kasus poll/apk yang memang WAJIB
                        // berhenti menunggu user) catatan digabung ke bubble & kartu tool-calls
                        // YANG SAMA — satu kartu "Running…" terus sampai tugas final.
                        const phaseNote = (resultJson.text || '').trim();
                        if (phaseNote) {
                            const pIdx = messages.findIndex(m => m.id === aiMsgObj.id);
                            const parsedPhase = parsePollBlock(phaseNote);
                            const parsedPhaseApk = parseApkBlocks(parsedPhase.clean);
                            if (pIdx !== -1 && parsedPhaseApk.logo) {
                                // SETUP APK di tengah pekerjaan: AI berhenti total menunggu
                                // user mengisi logo/nama/pengaturan di kartu, lalu lanjut otomatis.
                                messages[pIdx].text = parsedPhaseApk.clean;
                                messages[pIdx].apkLogo = parsedPhaseApk.logo;
                                messages[pIdx].midPhase = true;
                                messages[pIdx].isProcessing = false;
                                messages[pIdx].isTyping = false;
                                messages[pIdx].statusText = '';
                                renderMessages();
                                scrollToBottom(false);
                                resultJson = { session_id: resultJson.session_id, text: '', tool_calls: [] };
                                break;
                            }
                            if (pIdx !== -1 && parsedPhase.questions.length) {
                                // POLLING di tengah pekerjaan: AI WAJIB BERHENTI di sini —
                                // pertanyaan belum dijawab user, jadi JANGAN eksekusi
                                // tool_calls lanjutan & jangan lanjut membangun. Kerja
                                // dilanjutkan otomatis setelah jawaban polling masuk.
                                messages[pIdx].text = parsedPhase.clean;
                                messages[pIdx].pollQuestions = parsedPhase.questions;
                                messages[pIdx].pollTitle = parsedPhase.title || '';
                                messages[pIdx].pollState = { current: 0, answers: [] };
                                messages[pIdx].midPhase = true;   // chip "sebagian selesai", tanpa tombol aksi
                                messages[pIdx].isProcessing = false;
                                messages[pIdx].isTyping = false;
                                messages[pIdx].statusText = '';
                                renderMessages();
                                scrollToBottom(false);
                                resultJson = { session_id: resultJson.session_id, text: '', tool_calls: [] };
                                break; // keluar dari loop hop — berhenti total menunggu jawaban
                            }
                            // GABUNG: tetap di bubble & kartu tool-calls yang sama (tidak
                            // membuka bubble baru) — kartu progres tetap satu, terus "Running…"
                            // sampai tugas final. Catatan ditambahkan sebagai teks di bubble itu.
                            if (pIdx !== -1) {
                                const noteText = parsedPhaseApk.clean.trim();
                                if (noteText) {
                                    messages[pIdx].text = messages[pIdx].text ? (messages[pIdx].text + '\n\n' + noteText) : noteText;
                                }
                                renderMessages();
                                scrollToBottom(false);
                            }
                        }

                        // Progress real-time: teks diambil dari aksi AI sendiri (nama tool + argumennya)
                        resultJson.tool_calls.forEach(tc => setAiStatus(clientToolProgressLabel(tc)));

                        // Eksekusi tool workspace secara lokal (localStorage browser).
                        // PENTING: args PENUH (tc.args, bukan versi slim) tetap dipakai untuk
                        // eksekusi nyata di bawah -- slimForModelHistory HANYA memangkas COPY
                        // yang dikirim balik ke riwayat percakapan model (lihat catatan di
                        // definisi slimForModelHistory soal payload membengkak tanpa batas).
                        const assistantToolParts = resultJson.tool_calls.map(function(tc) {
                            return { type: 'function_call', name: tc.name, args: slimForModelHistory(tc.args || {}), thought_signature: tc.thought_signature || undefined };
                        });
                        apiMessagesWithTools.push({ role: 'assistant', content: assistantToolParts });

                        // ANTI-LOOP (bug klasik infinite loop): tool dengan nama+argumen
                        // IDENTIK yang sudah sukses >=2x TIDAK dieksekusi lagi — model
                        // dikembalikan fakta tegas agar beralih ke langkah berikutnya.
                        // Dulu create_folder 'assets'/'assets/css' dipanggil ulang tiap
                        // hop sampai budget 20 hop habis tanpa pernah nulis isinya.
                        const dupTCs = [];
                        resultJson.tool_calls.forEach(function(tc) {
                            let sig;
                            try { sig = tc.name + ':' + JSON.stringify(slimForModelHistory(tc.args || {})); } catch (e) { sig = tc.name + ':' + String((tc.args && tc.args.path) || ''); }
                            toolSigCounts[sig] = (toolSigCounts[sig] || 0) + 1;
                            if (toolSigCounts[sig] >= 3) dupTCs.push(tc);
                        });
                        const functionResponses = await Promise.all(resultJson.tool_calls.map(async function(tc) {
                            if (dupTCs.indexOf(tc) !== -1) {
                                return { type: 'function_response', name: tc.name, result: 'STOP — tool ini sudah dipanggil dengan argumen IDENTIK dua kali dan berhasil. Item tersebut SUDAH ADA. JANGAN ulangi. Baca function_response sebelumnya lalu LANJUT ke langkah berikutnya (tulis isi file / bagian lain), atau panggil list_items untuk melihat isi workspace sekarang.' };
                            }
                            const result = (tc.result !== undefined && tc.result !== null)
                                ? tc.result
                                : await executeWorkspaceTool(tc.name, tc.args || {});
                            const ok = !(result && typeof result === 'object' && result.error);
                            let resultText = '';
                            try { resultText = (typeof result === 'string') ? result : JSON.stringify(result, null, 2); } catch(e) { resultText = String(result); }
                            if (resultText && resultText.length > 4000) resultText = resultText.slice(0, 4000) + '\n… (dipotong)';
                            aiMsgObj.toolCalls.push({ name: tc.name, args: tc.args || {}, ok: ok, result: resultText });
                            // result yang dikirim BALIK ke model juga dipangkas (bukan hanya tampilan
                            // UI) -- mencegah riwayat satu giliran membengkak tak terbatas saat AI
                            // membaca kembali file besar (read_file/read_files) di hop berikutnya.
                            return { type: 'function_response', name: tc.name, result: slimForModelHistory(result, 3000) };
                        }));
                        apiMessagesWithTools.push({ role: 'user', content: functionResponses });
                        // Tampilkan progres eksekusi tugas secara langsung ke chat (mirip kartu "Ran command")
                        renderMessages();
                    }

                    // AUTO-LANJUT SILENT: budget hop habis padahal AI masih memanggil tools —
                    // tugas belum final; jangan berhenti di tengah jalan, lanjutkan diam-diam.
                    if (!hopError && resultJson && resultJson.tool_calls && resultJson.tool_calls.length > 0

                        hasReceivedData = true;
                        clearTimeout(apiTimeout);
                        clearInterval(statusInterval);
                        // tanpa bubbleText: tidak ada teks sistem yang menyela — kartu tool sudah

                        try { await continueSilently(aiMsgObj, ''); } catch (e2) {}
                        return;
                    }

                    if (hopError) throw hopError;

                    hasReceivedData = true;
                    if (quotaLocked) setQuotaLock(false);
                    clearTimeout(apiTimeout);
                    clearInterval(statusInterval);

                    const msgIndex = messages.findIndex(m => m.id === aiMsgObj.id);
                    if (msgIndex !== -1 && messages[msgIndex].isProcessing) {
                        messages[msgIndex].isProcessing = false;
                        messages[msgIndex].isTyping = true;
                    }

                    if (resultJson && resultJson.session_id) currentSessionId = resultJson.session_id;
                    // POLLING: blok [[POLL]]...[[/POLL]] dari jawaban final diubah jadi
                    // kartu pertanyaan interaktif; teks yang tampil bersih tanpa marker.
                    const finalText = (resultJson && resultJson.text ? resultJson.text : "");
                    const parsedFinal = parsePollBlock(finalText);
                    const parsedFinalApk = parseApkBlocks(parsedFinal.clean);
                    if (parsedFinal.questions.length) {
                        const fIdx = messages.findIndex(m => m.id === aiMsgObj.id);
                        if (fIdx !== -1) {
                            messages[fIdx].pollQuestions = parsedFinal.questions;
                            messages[fIdx].pollTitle = parsedFinal.title || '';
                            messages[fIdx].pollState = { current: 0, answers: [] };
                        }
                    }
                    if (parsedFinalApk.logo || parsedFinalApk.card) {
                        const fIdx = messages.findIndex(m => m.id === aiMsgObj.id);
                        if (fIdx !== -1) {
                            if (parsedFinalApk.logo) messages[fIdx].apkLogo = parsedFinalApk.logo;
                            if (parsedFinalApk.card) messages[fIdx].apkBuild = parsedFinalApk.card;
                        }
                    }
                    if (deltaStreamed) {
                        if (parsedFinalApk.clean !== deltaStreamed) {
                            // final beda dari teks terstream (mis. ada catatan tool di tengah) -> render otentik
                            streamingBuffer = parsedFinalApk.clean;
                            charIndex = parsedFinalApk.clean.length;
                            const dfIdx = messages.findIndex(m => m.id === aiMsgObj.id);
                            if (dfIdx !== -1) messages[dfIdx].text = parsedFinalApk.clean;
                            const dfEl = document.getElementById('msg-text-' + aiMsgObj.id);
                            if (dfEl) dfEl.innerHTML = formatMarkdown(parsedFinalApk.clean);
                        }
                    } else {
                        streamingBuffer += parsedFinalApk.clean;
                    }
                    isFetchComplete = true;
                } catch (e) {
                    if (e.name !== 'AbortError') {
                        if (e.message === '__QUOTA__') {
                            const qMsg = e.quotaMsg || 'Kuota/limit AI sedang penuh.';
                            const doneTools = (aiMsgObj.toolCalls || []);
                            if (doneTools.length > 0) {
                                // AUTO-LANJUT SILENT: konteks penuh di TENGAH tugas — server memangkas
                                // riwayat otomatis pada request berikutnya, jadi TIDAK perlu menunggu
                                // user mengetik "lanjut": teruskan diam-diam sampai tugas tuntas.
                                if (isGenerating && silentRounds < (e.ctxOverflow ? SILENT_MAX_ROUNDS : QUOTA_MAX_ROUNDS)) {
                                    silentRounds++;
                                    hasReceivedData = true;
                                    clearTimeout(apiTimeout);
                                    clearInterval(statusInterval);
                                    try {
                                        if (e.ctxOverflow) {
                                            await continueSilently(aiMsgObj,
                                                buildCheckpointText(doneTools, 'Konteks dipangkas otomatis — saya lanjutkan sisa tugasnya.'),
                                                'Riwayat lama sudah dipangkas otomatis — lanjutkan HANYA sisa tugas yang belum selesai, tanpa mengulang bagian yang sudah beres.');
                                        } else {
                                            await continueSilently(aiMsgObj,
                                                buildCheckpointText(doneTools, 'Limit AI tercapai sebentar — saya lanjutkan sisa tugasnya.'),
                                                'Limit kuota AI barusan tercapai di tengah pengerjaan dan kini sudah pulih — lanjutkan HANYA sisa tugas yang belum selesai dari titik terakhir, tanpa mengulang bagian yang sudah beres.');
                                        }
                                    } catch (e2) {}
                                    return;
                                }
                                // FALLBACK TERAKHIR: percobaan auto-lanjut di atas sudah habis
                                // (provider benar-benar tidak bisa dilanjutkan sekarang) — tampilkan
                                // checkpoint ringkas (sudah dikerjakan / sisa) sebagai titipan state.
                                streamingBuffer = buildCheckpointText(
                                    doneTools,
                                    e.ctxOverflow ? 'Konteks percakapan penuh — kodenya sudah aman tersimpan.' : qMsg,
                                    e.ctxOverflow ? ' Riwayat lama dipangkas otomatis supaya lanjutan tetap masuk konteks — balas "lanjut" untuk meneruskan sisa tugas.' : undefined
                                );
                                const cpIdx = messages.findIndex(m => m.id === aiMsgObj.id);
                                if (cpIdx !== -1) messages[cpIdx].checkpoint = true;
                                hasReceivedData = true;
                                isFetchComplete = true;
                                // Pesan user TIDAK dikembalikan ke kolom ketik & komposer TIDAK
                                // dikunci — user harus bisa membalas "lanjut" untuk meneruskan.
                            } else {
                                // KUOTA HABIS (bukan di tengah tugas): pesan user tetap terkirim
                                // & tersimpan di chat; balasan AI = kartu kuota + link upgrade.
                                streamingBuffer = quotaReplyText(qMsg);
                                setQuotaLock(true, 'Kuota AI habis — upgrade paket untuk lanjut mengobrol.');
                            }
                            if (e.ctxOverflow && doneTools.length === 0) setQuotaLock(false);
                        } else {
                        // FALLBACK BERLAPIS: /api/chat (streaming) gagal karena provider
                        // (bukan kuota). JANGAN langsung tampilkan error ke user — coba ulang
                        // diam-diam lewat beberapa jalur dulu sebelum menyerah:

  function checkoutUrl(name){

  }
  function buildSheet(){
    if(sheetEl) return;
    var current=currentPlan()||'Starter';
    var slides=plans.map(function(p){ return cardHtml(p,current); }).join('');
    var dots=plans.map(function(p,i){ return '<button class="pps-dot rounded-full transition-all duration-200" data-i="'+i+'" style="width:6px;height:6px;background:#d1d5db;"></button>'; }).join('');
    var css=document.createElement('style'); css.id='premium-sheet-css';
    css.textContent='#premium-plans-sheet .text-accent{color:var(--accent-color,#000000);} #premium-plans-sheet .bg-accent{background-color:var(--accent-color,#000000);color:#ffffff;} #premium-plans-sheet .border-accent{border-color:var(--accent-color,#000000);}'+
      'body:is(.dark-mode,.dark) #premium-plans-sheet .text-accent{color:#ffffff !important;} body:is(.dark-mode,.dark) #premium-plans-sheet .bg-accent{background-color:#ffffff !important;color:#000000 !important;} body:is(.dark-mode,.dark) #premium-plans-sheet .border-accent{border-color:#ffffff !important;}'+
      'body:is(.dark-mode,.dark) #premium-plans-sheet .pps-plan-card{background-color:#0a0a0a!important;border-color:#222;} body:is(.dark-mode,.dark) #premium-plans-sheet .text-gray-700{color:#d1d5db;} body:is(.dark-mode,.dark) #premium-plans-sheet .pps-card{background-color:#0a0a0a !important;} body:is(.dark-mode,.dark) #premium-plans-sheet .pps-card h3,body:is(.dark-mode,.dark) #premium-plans-sheet .pps-card .text-gray-900{color:#ffffff !important;}';
    document.head.appendChild(css);
    sheetEl=document.createElement('div'); sheetEl.id='premium-plans-sheet'; sheetEl.setAttribute('role','dialog'); sheetEl.setAttribute('aria-modal','true'); sheetEl.setAttribute('aria-label','Paket Clincoo');
    sheetEl.innerHTML=
      '<div id="pps-backdrop" class="fixed inset-0 z-[95] opacity-0 transition-opacity duration-300" style="background:rgba(0,0,0,.45)"></div>'+
      '<div class="fixed bottom-0 left-0 right-0 z-[96] flex justify-center pointer-events-none">'+
        '<div id="pps-card" class="pps-card pointer-events-auto w-full bg-white rounded-t-3xl px-4 pt-3 pb-5 translate-y-full transition-transform duration-300 ease-out shadow-2xl" style="height:100dvh;overflow-y:auto;padding-bottom:calc(1.25rem + env(safe-area-inset-bottom,0px));">'+
          '<div class="flex justify-center"><div class="w-10 h-1.5 rounded-full bg-gray-200 mb-2"></div></div>'+
          '<div class="flex items-start justify-between px-1">'+
            '<div class="pr-8"><h3 class="text-base font-semibold text-gray-900">Paket Clincoo</h3>'+
            '<p id="pps-feature-hint" class="text-[12.5px] text-gray-500 mt-0.5 leading-snug">Fitur ini hanya untuk paket Pro. Paket kamu saat ini: <b>'+current+'</b>.</p></div>'+
            '<button id="pps-x" aria-label="Tutup" class="w-8 h-8 rounded-full bg-gray-50 hover:bg-gray-100 text-gray-500 hover:text-black flex items-center justify-center transition-colors shrink-0"><svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M18 6 6 18M6 6l12 12"></path></svg></button>'+
          '</div>'+
          '<div class="relative mt-3">'+
            '<div id="pps-viewport" class="overflow-hidden rounded-2xl" style="touch-action:pan-y;">'+
              '<div id="pps-track" class="flex transition-transform duration-300 ease-out">'+slides+'</div>'+
            '</div>'+
            '<button id="pps-prev" class="absolute left-0 top-1/2 -translate-y-1/2 -ml-2 w-7 h-7 rounded-full bg-white border border-gray-200 shadow-md flex items-center justify-center text-gray-600 hover:text-black transition-colors"><svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="m15 18-6-6 6-6"></path></svg></button>'+
            '<button id="pps-next" class="absolute right-0 top-1/2 -translate-y-1/2 -mr-2 w-7 h-7 rounded-full bg-white border border-gray-200 shadow-md flex items-center justify-center text-gray-600 hover:text-black transition-colors"><svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="m9 18 6-6-6-6"></path></svg></button>'+
          '</div>'+
          '<div class="flex items-center justify-center gap-2 mt-3.5">'+dots+'</div>'+
        '</div>'+
      '</div>';
    document.body.appendChild(sheetEl);
    var track=sheetEl.querySelector('#pps-track'), dotsEls=sheetEl.querySelectorAll('.pps-dot');
    function render(){ track.style.transform='translateX(-'+(idx*100)+'%)'; dotsEls.forEach(function(d,i){ var on=(i===idx); d.style.width=on?'18px':'6px'; d.style.background=on?'':'#d1d5db'; d.classList.toggle('bg-accent',on); }); }
    function go(i){ idx=(i+plans.length)%plans.length; render(); }
    sheetEl.querySelector('#pps-prev').addEventListener('click',function(){ go(idx-1); });
    sheetEl.querySelector('#pps-next').addEventListener('click',function(){ go(idx+1); });
    dotsEls.forEach(function(d){ d.addEventListener('click',function(){ go(parseInt(d.dataset.i,10)); }); });
    var vp=sheetEl.querySelector('#pps-viewport'), sx=null, dx=0;
    vp.addEventListener('touchstart',function(e){ sx=e.touches[0].clientX; dx=0; track.style.transition='none'; },{passive:true});
    vp.addEventListener('touchmove',function(e){ if(sx===null)return; dx=e.touches[0].clientX-sx; track.style.transform='translateX(calc(-'+(idx*100)+'% + '+dx+'px))'; },{passive:true});
    vp.addEventListener('touchend',function(){ if(sx===null)return; track.style.transition=''; if(Math.abs(dx)>40){ go(idx+(dx<0?1:-1)); } else { render(); } sx=null; });
    sheetEl.querySelector('#pps-x').addEventListener('click',closeSheet);
    sheetEl.querySelector('#pps-backdrop').addEventListener('click',closeSheet);
    sheetEl.__render=render;
    render();
  }
  async function openSheet(crown){
    if(isPaid()&&crownMin(crown)!=='Bisnis') return;
    await refreshSubscription();
    if((isPaid()&&crownMin(crown)!=='Bisnis')||(token()&&!currentPlan())) return;
    featureMinimum=crownMin(crown);
    buildSheet();
    sheetEl.querySelector('#pps-track').innerHTML=plans.map(function(p){return cardHtml(p,currentPlan()||'Starter');}).join('');
    sheetEl.querySelector('#pps-feature-hint').textContent='Fitur ini hanya untuk paket '+featureMinimum+'. '+(currentPlan()?'Paket kamu saat ini: '+currentPlan()+'.':'Pilih paket yang sesuai kebutuhanmu.');
    idx=featureMinimum==='Bisnis'?2:1; sheetEl.__render();
    if(closeTimer){clearTimeout(closeTimer);closeTimer=null;}
    if(sheetEl.style.display==='none'||!sheetEl.__open) previousOverflow=document.body.style.overflow;
    sheetEl.__open=true; document.body.style.overflow='hidden';
    var b=sheetEl.querySelector('#pps-backdrop'), c=sheetEl.querySelector('#pps-card');
    sheetEl.style.display='';
    requestAnimationFrame(function(){ requestAnimationFrame(function(){ b.classList.remove('opacity-0'); c.classList.remove('translate-y-full'); }); });
  }
  function closeSheet(){
    if(!sheetEl||!sheetEl.__open) return;
    sheetEl.__open=false; document.body.style.overflow=previousOverflow;
    var b=sheetEl.querySelector('#pps-backdrop'), c=sheetEl.querySelector('#pps-card');
    b.classList.add('opacity-0'); c.classList.add('translate-y-full');
    closeTimer=setTimeout(function(){ sheetEl.style.display='none'; closeTimer=null; },300);
  }
  function crownMin(c){
    try{ if(c&&c.getAttribute&&c.getAttribute('data-min')==='Bisnis') return 'Bisnis';
      if(c&&c.id==='export-crown-label') return 'Bisnis'; }catch(e){}
    return 'Pro';
  }
  // Crown seragam: samakan ikon, ukuran & warna mahkota di seluruh halaman.
  var CLINCOO_CROWN_PATH='M11.562 3.266a.5.5 0 0 1 .876 0L15.39 8.87a1 1 0 0 0 1.516.294L21.183 5.5a.5.5 0 0 1 .798.519l-2.834 10.246a1 1 0 0 1-.956.734H5.81a1 1 0 0 1-.957-.734L2.02 6.019a.5.5 0 0 1 .798-.519l4.276 3.664a1 1 0 0 0 1.516-.294z';
  function clincooUniformCrowns(){
    document.querySelectorAll(crownSelector).forEach(function(c){
      try{ c.setAttribute('data-min-crown','1'); c.setAttribute('data-min',crownMin(c)); }catch(e){}
      var sv=c.querySelector('svg');
      if(sv){ sv.setAttribute('viewBox','0 0 24 24'); sv.setAttribute('aria-hidden','true');
        var p=sv.querySelector('path'); if(p){ p.setAttribute('d',CLINCOO_CROWN_PATH); p.setAttribute('stroke-linecap','round'); p.setAttribute('stroke-linejoin','round'); } }
      if(!c.title) c.title='Fitur premium — ketuk untuk lihat paket';
    });
  }
  function applyCrownState(){
    var plan=currentPlan()||'Starter';
    document.body.setAttribute('data-pps-paid',isPaid()?'true':'false');
    document.body.setAttribute('data-pps-plan',plan);
    document.querySelectorAll(crownSelector).forEach(function(c){
      // Starter = lihat semua crown (level Pro & Bisnis); Pro = hanya level Bisnis; Bisnis = tanpa crown.
      var show=!isPaid()?true:(plan==='Pro'&&crownMin(c)==='Bisnis');
      c.style.display=show?'':'none'; c.style.cursor='pointer';
      c.setAttribute('role','button'); c.setAttribute('tabindex',show?'0':'-1');
      c.setAttribute('aria-label','Lihat daftar paket');
    });
    clincooUniformCrowns();
    if(plan==='Bisnis') closeSheet();
  }
  async function refreshSubscription(){
    try{
      var t=token();
      var res=await fetch(apiBase()+'/api/subscription?fields=plan',{cache:'no-store',headers:t?{Authorization:'Bearer '+t}:{}});
      if(res.ok){ var d=await res.json();
        if(d&&d.plan){ verifiedPlan=d.plan;
          var cache=JSON.stringify({plan:d.plan,billingCycle:d.billingCycle||'Bulanan',ts:Date.now()});
          try{localStorage.setItem('TM_SUB_CACHE_KEY',cache);localStorage.setItem('clincoo_subscription_cache',cache);}catch(e){}
          applyCrownState();
        }
      }
    }catch(e){}
  }
  // Capture hanya mahkota: cegah handler modal lama atau navigasi induknya.
  // ===== Gate layar penuh (klik fitur bermahkota oleh user Starter) =====
  function clincooCrownGateClose(){var g=document.getElementById('cc-crown-gate');if(g)g.remove();}
  function clincooCrownTheme(){
    var bg='',nodes=[document.body,document.documentElement];
    for(var i=0;i<nodes.length;i++){try{if(!nodes[i])continue;var v=getComputedStyle(nodes[i]).backgroundColor;if(v&&v!=='transparent'&&v!=='rgba(0, 0, 0, 0)'){bg=v;break;}}catch(e){}}
    var m=bg.match(/rgba?\(\s*(\d+)[,\s]+(\d+)[,\s]+(\d+)/i),lum=m?(0.299*+m[1]+0.587*+m[2]+0.114*+m[3]):-1;
    if(lum<0){var dk=false;try{dk=!!(window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches);}catch(e){}bg=dk?'#0b0b0d':'#ffffff';lum=dk?20:255;}
    return lum<128
      ?{bg:bg,fg:'#f5f6f7',muted:'#9aa0a6',btnA:'#ffffff',btnAf:'#111111',bd:'rgba(255,255,255,.22)'}
      :{bg:bg,fg:'#111111',muted:'#555555',btnA:'#111111',btnAf:'#ffffff',bd:'#e5e7eb'};
  }
  function clincooCrownGate(c){
    clincooCrownGateClose();
    var min=crownMin(c);
    if(typeof isPaid==='function'&&isPaid()&&!((currentPlan()||'')==='Pro'&&min==='Bisnis'))return;
    var t=clincooCrownTheme();
    var ov=document.createElement('div');ov.id='cc-crown-gate';
    ov.style.cssText='position:fixed;inset:0;z-index:2147483000;background:'+t.bg+';color:'+t.fg+';display:flex;align-items:center;justify-content:center;font-family:system-ui,sans-serif;padding:24px;';
    ov.innerHTML='<div style="max-width:420px;width:100%;text-align:center">'+
      '<div style="font-size:44px;line-height:1">&#128081;</div>'+
      '<h2 style="font-size:20px;margin:14px 0 8px;color:'+t.fg+';font-weight:700">Fitur ini hanya untuk paket '+min+'</h2>'+
      '<p style="font-size:14px;color:'+t.muted+';margin:0 0 20px">Paket kamu saat ini '+(currentPlan()||'Starter')+'. Upgrade untuk membuka fitur ini.</p>'+
      '<button id="cc-gate-plans" style="display:block;width:100%;padding:13px;background:'+t.btnA+';color:'+t.btnAf+';border:0;border-radius:12px;font-weight:600;font-size:14px;cursor:pointer">Lihat Paket</button>'+
      '<button id="cc-gate-close" style="display:block;width:100%;margin-top:10px;padding:13px;border:1.5px solid '+t.bd+';background:transparent;color:'+t.fg+';border-radius:12px;font-weight:600;font-size:14px;cursor:pointer">Tutup</button>'+
      '</div>';
    (document.body||document.documentElement).appendChild(ov);
    ov.querySelector('#cc-gate-plans').addEventListener('click',function(){clincooCrownGateClose();openSheet(c);});
    ov.querySelector('#cc-gate-close').addEventListener('click',clincooCrownGateClose);
    document.addEventListener('keydown',function esc(ev){if(ev.key==='Escape'){clincooCrownGateClose();document.removeEventListener('keydown',esc,true);}},true);
  }
function crownAction(e){
    var c=e.target&&e.target.closest?e.target.closest(crownSelector):null;
    if(!c) return;
    if(e.type==='keydown'&&e.key!=='Enter'&&e.key!==' ') return;
    e.preventDefault(); e.stopImmediatePropagation();
    if(!isPaid()){ (async function(){ await refreshSubscription(); if(isPaid()||(token()&&!currentPlan())) return; clincooCrownGate(c); })(); return; }
    if((currentPlan()||'')==='Pro'&&crownMin(c)==='Bisnis'){ (async function(){ await refreshSubscription(); if((currentPlan()||'')==='Pro') clincooCrownGate(c); })(); return; }
    openSheet(c);
  }
  document.addEventListener('click',crownAction,true);
  document.addEventListener('keydown',function(e){if(e.key==='Escape'){closeSheet();return;}crownAction(e);},true);
  window.addEventListener('storage',function(e){if(e.key==='TM_SUB_CACHE_KEY'||e.key==='clincoo_subscription_cache'){verifiedPlan=null;applyCrownState();refreshSubscription();}});
  new MutationObserver(function(records){if(records.some(function(r){return Array.from(r.addedNodes).some(function(n){return n.nodeType===1&&(n.matches(crownSelector)||n.querySelector(crownSelector));});}))applyCrownState();}).observe(document.body,{childList:true,subtree:true});
  applyCrownState();
  document.addEventListener('DOMContentLoaded',applyCrownState);
  refreshSubscription();
  window.clincooOpenPlansPopup=function(){clincooCrownGate(null);};
  window.clincooFeatureGate=function(min){clincooCrownGate({id:'cc-gate-'+(min||'Pro'),getAttribute:function(k){return k==='data-min'?(min||'Pro'):null;}});};
  clincooUniformCrowns();
  // Syarat promo dan harga mengikuti halaman Upgrade, bukan harga promo tanpa eligibility.
  fetch(apiBase()+'/api/promo',{cache:'no-store'}).then(function(r){return r.json();}).then(function(p){
    if(!p||p.active!==true||p.remaining<=0||!p.eligible)return;
    promoProActive=true;
    if(sheetEl){sheetEl.querySelector('#pps-track').innerHTML=plans.map(function(p){return cardHtml(p,currentPlan()||'Starter');}).join('');sheetEl.__render();}
  }).catch(function(){});
})();

  // Crown di opsi Build (menu mode AI): tampil untuk paket Starter — gaya konsisten dgn crown di profil/upgrade
