        // ===== POLLING: AI bertanya detail yang belum diketahui sebelum/di tengah membangun =====
        // Format blok: [[POLL]] / Q: pertanyaan / A:, B:, C: opsi / --- antar pertanyaan / [[/POLL]]
        // Kartu = stepper BERURUTAN: hanya pertanyaan aktif yang terbuka (opsi A/B/C +
        // "Lainnya…" untuk jawaban manual di chat), pertanyaan berikutnya terkunci;
        // garis antar nomor mengisi saat terjawab. Setelah semua terjawab, rangkuman
        // Q&A otomatis dikirim ke chat dan AI melanjutkan pekerjaannya.

        function parsePollBlock(text) {
            const raw = String(text || '');
            const m = raw.match(/\[\[POLL\]\]([\s\S]*?)(?:\[\[\s*\/\s*POLL\s*\]\]|$)/i);
            if (!m) return { clean: raw, questions: [], title: '' };
            let body = m[1].replace(/\[\[\s*\/?\s*POLL\s*\]\]/gi, '').trim();
            // Baris "T: <judul>" (disusun AI sendiri sesuai konteks) = judul kartu.
            let title = '';
            const tm = body.match(/^\s*T\s*[:.]\s*(.+)$/im);
            if (tm) {
                title = tm[1].trim().slice(0, 80);
                body = (body.slice(0, tm.index) + body.slice(tm.index + tm[0].length)).trim();
            }
            const questions = [];
            if (/^\s*Q\s*[:.]/im.test(body)) {
                // Format baru: Q: + opsi A:/B:/C:/D: per pertanyaan, dipisah '---'
                body.split(/\n\s*-{3,}\s*(?:\n|$)|\n(?=Q\s*[:.])/i).forEach(function (block) {
                    const lines = block.split('\n').map(l => l.trim()).filter(l => l.length > 0);
                    let q = null, opts = [];
                    lines.forEach(l => {
                        let mm;
                        if ((mm = l.match(/^Q\s*[:.]\s*(.+)$/i))) {
                            if (q !== null) { questions.push({ q: q, options: opts }); opts = []; }
                            q = mm[1];
                        } else if ((mm = l.match(/^([A-D])\s*[:.)]\s*(.+)$/i))) {
                            opts.push(mm[2]);
                        }
                    });
                    if (q !== null) questions.push({ q: q, options: opts });
                });
            } else {
                // Format lama: tiap baris satu pertanyaan tanpa opsi (kompatibel)
                let lines = body.split('\n').map(l => l.trim()).filter(l => l.length > 0);
                if (lines.length === 1 && lines[0].indexOf(' | ') !== -1) {
                    lines = lines[0].split(' | ').map(l => l.trim()).filter(l => l.length > 0);
                }
                lines.map(l => l.replace(/^\s*(?:\d+\s*[.)\]:-]|[-*•])\s*/, '').trim())
                    .filter(l => l.length > 0)
                    .forEach(q => questions.push({ q: q, options: [] }));
            }
            const clean = (raw.slice(0, m.index) + raw.slice(m.index + m[0].length)).trim();
            return { clean, questions: questions.slice(0, 6), title: title };
        }

        function pollStepsOf(msg) {
            return (msg.pollQuestions || []).map(function (q) {
                return (typeof q === 'string') ? { q: q, options: [] } : { q: q.q, options: q.options || [] };
            });
        }
        function pollStateOf(msg) {
            if (!msg.pollState) msg.pollState = { current: 0, answers: [] };
            if (!Array.isArray(msg.pollState.answers)) msg.pollState.answers = [];
            return msg.pollState;
        }

        function renderPollCard(msg) {
            const qs = pollStepsOf(msg);
            if (!qs.length) return '';
            const st = pollStateOf(msg);
            const letters = ['A', 'B', 'C', 'D'];
            const doneAll = st.done || st.current >= qs.length;
            const stepsHtml = qs.map(function (s, i) {
                const answered = doneAll || i < st.current;
                const active = !doneAll && i === st.current;
                const cls = answered ? 'answered' : (active ? 'active' : 'locked');
                const rail = (i < qs.length - 1) ? `<span class="poll-rail${i < st.current ? ' done' : ''}"></span>` : '';
                let bodyHtml = '';
                if (answered) {
                    bodyHtml = `<div class="poll-ans">✓ <span>${escText(st.answers[i] || '')}</span></div>`;
                } else if (active) {
                    const opts = s.options.map(function (o, oi) {
                        return `<button type="button" class="poll-opt" onclick="pollPickOption('${msg.id}', ${i}, ${oi})"><span class="poll-opt-text">${escText(o)}</span></button>`;
                    }).join('');
                    // [10 Okt, arahan pemilik] "Lainnya" = INPUT LANGSUNG yang selalu
                    // tampil di bawah opsi kapsul, bukan tombol yang harus diklik dulu.
                    bodyHtml = `<div class="poll-opts">
                        ${opts}
                        <div class="poll-manual">
                            <input type="text" id="poll-manual-input" placeholder="Atau tulis jawabanmu sendiri di sini…" onkeydown="if(event.key==='Enter'){event.preventDefault();pollSubmitManual('${msg.id}', ${i});}" maxlength="500">
                            <button type="button" onclick="pollSubmitManual('${msg.id}', ${i})">Kirim</button>
                        </div>
                    </div>`;
                }
                return `
                    <div class="poll-step ${cls}">
                        ${rail}
                        <span class="poll-node">${answered ? '✓' : (i + 1)}</span>
                        <div class="poll-step-body">
                            <div class="poll-step-q">${escText(s.q)}</div>
                            ${bodyHtml}
                        </div>
                    </div>`;
            }).join('');
            // Judul kartu disusun AI sesuai konteks (baris "T:"), fallback netral bila tiada.
            const cardTitle = (msg.pollTitle && String(msg.pollTitle).trim()) || 'Konfirmasi singkat';
            return `
                <div class="poll-card fade-in">
                    <div class="poll-card-head">
                        <span class="poll-head-title">${escText(cardTitle)}</span>
                        <span class="poll-head-badge${doneAll ? ' done' : ''}">${doneAll ? 'Selesai' : (Math.min(st.current + 1, qs.length) + '/' + qs.length)}</span>
                    </div>
                    <div class="poll-steps">${stepsHtml}</div>
                    ${doneAll ? '' : '<div class="poll-card-hint">Pilih jawaban yang paling sesuai, atau tulis sendiri di kolom bawah. Satu pertanyaan per langkah, sisanya menyusul.</div>'}
                </div>
            `;
        }

        window.pollPickOption = function (msgId, qIdx, optIdx) {
            const m = messages.find(x => x && x.id === msgId);
            if (!m) return;
            const qs = pollStepsOf(m);
            if (!qs[qIdx] || !qs[qIdx].options[optIdx]) return;
            const st = pollStateOf(m);
            if (st.sending || st.done || st.answers[qIdx] !== undefined) return;
            st.answers[qIdx] = qs[qIdx].options[optIdx];
            st.current = qIdx + 1;
            if (st.current >= qs.length) pollAutoSend(m);
            else { renderMessages(); try { scrollToBottom(false); } catch (e) {} }
        };

        window.pollPickOther = function (msgId, qIdx) {
            const m = messages.find(x => x && x.id === msgId);
            const qs = m && pollStepsOf(m);
            if (!m || !qs[qIdx]) return;
            const st = pollStateOf(m);
            st.manualOpen = qIdx;
            renderMessages();
            try {
                const inp = document.getElementById('poll-manual-input');
                if (inp) { inp.focus(); inp.scrollIntoView({ block: 'nearest', behavior: 'smooth' }); }
            } catch (e) {}
        };
        window.pollSubmitManual = function (msgId, qIdx) {
            const inp = document.getElementById('poll-manual-input');
            const val = inp ? inp.value.trim() : '';
            if (!val) { if (inp) inp.focus(); return; }
            const m = messages.find(x => x && x.id === msgId);
            if (!m) return;
            const qs = pollStepsOf(m);
            const st = pollStateOf(m);
            st.manualOpen = null;
            st.answers[qIdx] = val;
            st.current = Math.max(st.current, qIdx + 1);
            if (st.current >= qs.length) pollAutoSend(m);
            else { renderMessages(); try { scrollToBottom(false); } catch (e) {} }
        };
        window.pollCancelOther = function () {
            hidePollAnswerChip();
        };

        function showPollAnswerChip(question) {
            let chip = document.getElementById('poll-answer-chip');
            if (!chip) {
                chip = document.createElement('div');
                chip.id = 'poll-answer-chip';
                const card = chatInput.parentElement;
                card.insertBefore(chip, card.firstChild);
            }
            chip.innerHTML = '<span>✏ Menjawab: ' + escText(question) + ' — ketik jawabanmu lalu kirim.</span><button type="button" class="poll-chip-x" onclick="pollCancelOther()" title="Batal">✕</button>';
            chip.style.display = 'flex';
        }
        function hidePollAnswerChip() {
            const chip = document.getElementById('poll-answer-chip');
            if (chip) chip.style.display = 'none';
        }

        // Semua pertanyaan terjawab -> rangkuman Q&A otomatis terkirim ke chat
        // sebagai pesan user, lalu AI melanjutkan pekerjaannya dari titik berhenti.
        function pollAutoSend(m) {
            const qs = pollStepsOf(m);
            const st = pollStateOf(m);
            if (st.sending || st.done) return;
            st.sending = true;
            st.done = true;
            hidePollAnswerChip();
            const lines = ['Jawaban konfirmasi:'];
            qs.forEach(function (s, i) {
                lines.push((i + 1) + '. ' + s.q);
                lines.push('→ ' + (st.answers[i] || '-'));
            });
            lines.push('Lanjutkan pekerjaannya dengan jawaban di atas.');
            const qaText = lines.join('\n');
            const send = function () {
                if (isGenerating) { setTimeout(send, 400); return; }
                messages.push({ id: generateId(), role: 'user', text: qaText, time: Date.now() });
                silentRounds = 0; // jawaban polling = tugas lanjutan, budget silent segar
                renderMessages();
                pinMessageToTop(messages[messages.length - 1].id);
                fetchAIResponse();
            };
            renderMessages();
            send();
        }

        // ===== SUBDOMAIN CUSTOM ([[SUBDOMAIN_INPUT]]): AI minta nama subdomain via kapsul =====
        // Format blok: [[SUBDOMAIN_INPUT]] / baris "S: <saran-slug>" (opsional) / [[/SUBDOMAIN_INPUT]].
        // User isi nama -> cek ketersediaan real-time (ikon loading/centang/X) -> tombol
        // "Gunakan nama ini" -> tersimpan -> deploy_project otomatis pakai nama itu.
        // Hasil publish: <nama>.clincoo.biz.id PERSIS, TANPA karakter acak.
        function parseSubdomainBlock(text) {
            const raw = String(text || '');
            const m = raw.match(/\[\[SUBDOMAIN_INPUT\]\]([\s\S]*?)(?:\[\[\s*\/\s*SUBDOMAIN_INPUT\s*\]\]|$)/i);
            if (!m) return { clean: raw, ask: false, suggestion: '' };
            let body = m[1].replace(/\[\[\s*\/\?\s*SUBDOMAIN_INPUT\s*\]\]/gi, '').trim();
            let suggestion = '';
            const sm = body.match(/^\s*S\s*[:.]\s*(.+)$/im);
            if (sm) {
                suggestion = sm[1].trim().slice(0, 60);
                body = (body.slice(0, sm.index) + body.slice(sm.index + sm[0].length)).trim();
            }
            if (body) suggestion = (suggestion + ' ' + body).trim().slice(0, 60);
            const clean = (raw.slice(0, m.index) + raw.slice(m.index + m[0].length)).trim();
            return { clean: clean, ask: true, suggestion: subSlugify(suggestion) };
        }
        function subSlugify(x) {
            return String(x || '').toLowerCase().trim()
                .replace(/[^a-z0-9\s-]/g, '').replace(/[\s_]+/g, '-')
                .replace(/-{2,}/g, '-').replace(/^-+|-+$/g, '');
        }
        function subdomainStateOf(msg) {
            if (!msg.subdomainState) msg.subdomainState = { done: false, sub: '', check: 'idle', note: '' };
            return msg.subdomainState;
        }
        function subEscAttr(x) { return escText(String(x == null ? '' : x)).replace(/"/g, '&quot;'); }
        function renderSubdomainCard(msg) {
            if (!msg.subdomainAsk) return '';
            const st = subdomainStateOf(msg);
            if (st.done) {
                return '<div class="subdomain-card fade-in"><div class="sub-done-note"><i class="ph-bold ph-check-circle text-[16px]"></i> Subdomain dipilih: <span class="sub-pill">' + escText(st.sub) + '.clincoo.biz.id</span></div></div>';
            }
            const sug = (st.sub !== '' ? st.sub : (msg.subdomainSuggestion || ''));
            const checkIcon = st.check === 'loading' ? '<i class="ph-bold ph-circle-notch tc-spin text-[15px]"></i>'
                : st.check === 'ok' ? '<i class="ph-bold ph-check text-[15px]"></i>'
                : st.check === 'bad' ? '<i class="ph-bold ph-x text-[15px]"></i>'
                : '<i class="ph-bold ph-magnifying-glass text-[15px]"></i>';
            const noteCls = st.check === 'ok' ? 'ok' : (st.check === 'bad' ? 'bad' : '');
            const noteTxt = st.check === 'ok' ? 'Nama tersedia — siap dipakai.' : (st.check === 'bad' ? (st.note || 'Nama sudah dipakai — coba nama lain.') : '');
            return '<div class="subdomain-card fade-in">' +
                '<div class="sub-card-head"><span class="sub-card-title">Pilih nama subdomain kamu</span><span class="sub-card-badge">' + escText(sug || 'nama-situs') + '.clincoo.biz.id</span></div>' +
                '<div class="sub-capsule">' +
                '<input type="text" id="sub-input-' + msg.id + '" placeholder="mis. kedaikopi" maxlength="40" value="' + subEscAttr(sug) + '" autocomplete="off" autocapitalize="off" spellcheck="false" oninput="subdomainPreview(this,\'' + msg.id + '\')" onkeydown="if(event.key===\'Enter\'){event.preventDefault();subdomainSubmit(\'' + msg.id + '\');}" style="font-family:\'SF Mono\',Consolas,monospace;">' +
                '<span class="sub-suffix">.clincoo.biz.id</span>' +
                '<button type="button" class="sub-check-btn' + (st.check === 'ok' ? ' ok' : '') + (st.check === 'bad' ? ' bad' : '') + '" onclick="subdomainCheck(\'' + msg.id + '\')" title="Cek ketersediaan">' + checkIcon + '</button>' +
                '</div>' +
                '<div class="sub-url-preview" id="sub-prev-' + msg.id + '">' + escText(sug ? (sug + '.clincoo.biz.id') : '') + '</div>' +
                '<div class="sub-check-note ' + noteCls + '" id="sub-note-' + msg.id + '">' + escText(noteTxt) + '</div>' +
                '<button type="button" class="sub-use-btn" id="sub-use-' + msg.id + '" onclick="subdomainSubmit(\'' + msg.id + '\')"><i class="ph-bold ph-rocket-launch text-[15px]"></i> Gunakan nama ini</button>' +
                '<div style="font-size:11.5px;color:#9ca3af;margin-top:8px;">Huruf, angka, tanda hubung. 3-40 karakter. Ikon kaca pembelas cek ketersediaan nama.</div>' +
                '</div>';
        }
        window.subdomainPreview = function (inp, msgId) {
            const sub = subSlugify(inp.value);
            const prevEl = document.getElementById('sub-prev-' + msgId);
            if (prevEl) prevEl.textContent = sub ? (sub + '.clincoo.biz.id') : '';
            const noteEl = document.getElementById('sub-note-' + msgId);
            if (noteEl) { noteEl.className = 'sub-check-note'; noteEl.textContent = ''; }
            const btn = document.getElementById('sub-use-' + msgId);
            if (btn) btn.classList.remove('sent');
            const m = messages.find(x => x && x.id === msgId);
            if (m) { const st = subdomainStateOf(m); st.check = 'idle'; st.note = ''; }
        };
        window.subdomainCheck = async function (msgId) {
            const m = messages.find(x => x && x.id === msgId);
            if (!m) return;
            const st = subdomainStateOf(m);
            const inp = document.getElementById('sub-input-' + msgId);
            const sub = subSlugify(inp ? inp.value : '');
            if (inp && inp.value !== sub) inp.value = sub;
            const prevEl = document.getElementById('sub-prev-' + msgId);
            if (prevEl) prevEl.textContent = sub ? (sub + '.clincoo.biz.id') : '';
            if (!sub || sub.length < 3 || sub.length > 40) {
                st.check = 'bad'; st.note = 'Nama minimal 3 karakter.';
                renderMessages();
                try { const el = document.getElementById('sub-input-' + msgId); if (el) el.focus(); } catch (e) {}
                return;
            }
            st.check = 'loading'; renderMessages();
            try {
                const pid = currentProjectId;
                const r = await fetch(TOOL_API_BASE + '/api/deploy?action=check_sub&sub=' + encodeURIComponent(sub) + '&project_id=' + encodeURIComponent(pid));
                const d = await r.json().catch(function () { return {}; });
                st.check = (d && d.available) ? 'ok' : 'bad';
                st.note = (d && d.available) ? '' : (d && d.reason === 'invalid' ? 'Nama tidak valid.' : 'Nama sudah dipakai — coba nama lain.');
            } catch (e) { st.check = 'bad'; st.note = 'Cek gagal — periksa koneksi lalu coba lagi.'; }
            renderMessages();
            try { const el = document.getElementById('sub-input-' + msgId); if (el) el.focus(); } catch (e) {}
        };
        window.subdomainSubmit = async function (msgId) {
            const m = messages.find(x => x && x.id === msgId);
            if (!m) return;
            const st = subdomainStateOf(m);
            const inp = document.getElementById('sub-input-' + msgId);
            const sub = subSlugify(inp ? inp.value : '');
            if (!sub || sub.length < 3 || sub.length > 40) { window.subdomainCheck(msgId); return; }
            if (st.check !== 'ok') {
                await window.subdomainCheck(msgId);
                if (subdomainStateOf(m).check !== 'ok') return;
            }
            st.done = true; st.sub = sub;
            try {
                const pid = currentProjectId;
                localStorage.setItem('clincoo_' + pid + '_custom_subdomain', sub);
                try { window.AI_WORK_STATE.customSubdomain = sub; } catch (e2) {}
            } catch (e) {}
            const qaText = 'Pakai subdomain custom: ' + sub + ' (URL nanti https://' + sub + '.clincoo.biz.id). Lanjutkan publish sekarang dengan nama persis ini, jangan diubah.';
            const send = function () {
                if (isGenerating) { setTimeout(send, 400); return; }
                messages.push({ id: generateId(), role: 'user', text: qaText, time: Date.now() });
                silentRounds = 0;
                renderMessages();
                try { pinMessageToTop(messages[messages.length - 1].id); } catch (e) {}
                fetchAIResponse();
            };
            renderMessages();
            send();
        };

        // ===== APK: [[APK_LOGO]] (langkah kecil, FLAT tanpa card — minta logo saja; nama &
        // pengaturan ditanya belakangan terpisah via teks biasa / [[POLL]]) dan
        // [[APK_CARD]] (progres build real-time + tombol unduh, tetap pakai card — tidak diubah).
        function parseApkBlocks(text) {
            const raw = String(text || '');
            let clean = raw;
            let logo = null, card = null;
            // [[APK_LOGO]] cuma PENANDA (tanpa field) — satu langkah kecil: minta logo saja.
            // Nama & pengaturan (orientasi/fullscreen/splash) ditanyakan BELAKANGAN secara
            // terpisah (teks biasa utk nama, [[POLL]] utk pengaturan) — bukan satu kartu besar.
            const logoM = clean.match(/\[\[APK_LOGO\]\]([\s\S]*?)(?:\[\[\s*\/\s*APK_LOGO\s*\]\]|$)/i);
            if (logoM) {
                logo = {};
                clean = clean.replace(/\[\[APK_LOGO\]\]([\s\S]*?)(?:\[\[\s*\/\s*APK_LOGO\s*\]\]|$)/i, '');
            }
            const cardM = clean.match(/\[\[APK_CARD\]\]([\s\S]*?)(?:\[\[\s*\/\s*APK_CARD\s*\]\]|$)/i);
            if (cardM) {
                const body = cardM[1];
                const line = (k) => { const m2 = body.match(new RegExp('^[ \t]*' + k + '[ \t]*[:.][ \t]*(.+)$', 'im')); return m2 ? m2[1].trim() : ''; };
                const id = line('ID');
                if (id) card = { id: id, name: line('NAME'), url: line('URL'), pkg: line('PKG') };
                clean = clean.replace(/\[\[APK_CARD\]\]([\s\S]*?)(?:\[\[\s*\/\s*APK_CARD\s*\]\]|$)/i, '');
            }
            return { clean: clean, logo: logo, card: card };
        }

        function apkLogoStateOf(m) {
            if (!m.apkLogoState) {
                let savedIcon = null;
                try { savedIcon = localStorage.getItem('clincoo_apk_icon') || null; } catch (e) {}
                m.apkLogoState = { iconB64: savedIcon, sent: false, sending: false };
            }
            return m.apkLogoState;
        }
        function apkBuildStateOf(m) {
            if (!m.apkBuildState) m.apkBuildState = { progress: 0, done: false, failed: false, downloading: false, downloaded: false, error: '', phaseLabel: '' };
            return m.apkBuildState;
        }

        window.apkIconPick = function (msgId) {
            const inp = document.getElementById('apk-icon-input-' + msgId);
            if (inp) inp.click();
        };
        window.apkIconFile = function (msgId, input) {
            const m = messages.find(x => x && x.id === msgId);
            const file = input && input.files && input.files[0];
            if (!m || !file) return;
            const st = apkLogoStateOf(m);
            const reader = new FileReader();
            reader.onload = function (e) {
                const img = new Image();
                img.onload = function () {
                    try {
                        const c = document.createElement('canvas');
                        c.width = c.height = 512;
                        const ctx = c.getContext('2d');
                        const s = Math.min(img.width, img.height);
                        ctx.drawImage(img, (img.width - s) / 2, (img.height - s) / 2, s, s, 0, 0, 512, 512);
                        let b64 = c.toDataURL('image/png').replace(/^data:image\/png;base64,/, '');
                        if (b64.length > 2000000) { alert('Logo terlalu besar — coba gambar yang lebih kecil.'); return; }
                        st.iconB64 = b64;
                        try { localStorage.setItem('clincoo_apk_icon', b64); } catch (er) {}
                        renderMessages();
                        try { scrollToBottom(false); } catch (er) {}
                        window.apkLogoSend(msgId, true);
                    } catch (er) { alert('Gambar tidak bisa diproses.'); }
                };
                img.onerror = function () { alert('Gambar tidak bisa dibaca.'); };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        };
        // Satu langkah: logo saja. Begitu diunggah (atau dilewati), jawaban terkirim
        // otomatis ke AI — nama & pengaturan (orientasi/fullscreen/splash) ditanyakan
        // belakangan secara terpisah (teks biasa / [[POLL]]), bukan ditumpuk di kartu ini.
        window.apkLogoSend = function (msgId, hasLogo) {
            const m = messages.find(x => x && x.id === msgId);
            if (!m || !m.apkLogo) return;
            const st = apkLogoStateOf(m);
            if (st.sending || st.sent) return;
            st.sending = true;
            const qaText = hasLogo
                ? 'Logo tersimpan — pakai sebagai ikon aplikasi (panggil build_apk dengan icon "saved").'
                : 'Lewati logo — pakai ikon default aplikasi.';
            const send = function () {
                if (isGenerating) { setTimeout(send, 400); return; }
                st.sent = true;
                messages.push({ id: generateId(), role: 'user', text: qaText, time: Date.now() });
                silentRounds = 0;
                renderMessages();
                pinMessageToTop(messages[messages.length - 1].id);
                fetchAIResponse();
            };
            renderMessages();
            send();
        };

        const apkPollTimers = new Map();
        function apkClearTimer(msgId) { const t = apkPollTimers.get(msgId); if (t) { clearInterval(t); apkPollTimers.delete(msgId); } }
        function apkStepLabel(steps) {
            const cur = (steps || []).find(function (x) { return x && x.status === 'in_progress'; });
            const name = cur ? String(cur.name || '') : '';
            if (/compile/i.test(name)) return 'Mengompilasi APK…';
            if (/sign/i.test(name)) return 'Menandatangani APK…';
            if (/susun|generate/i.test(name)) return 'Menyusun proyek Android…';
            if (/upload/i.test(name)) return 'Mengemas APK…';
            if (/gradle|java/i.test(name)) return 'Menyiapkan lingkungan build…';
            return 'Menjalankan build di GitHub Actions…';
        }
        function ensureApkPolling(msg) {
            if (!msg.apkBuild || !msg.apkBuild.id) return;
            const st = apkBuildStateOf(msg);
            if (st.done || st.failed || apkPollTimers.has(msg.id)) return;
            const tick = async function () {
                if (!messages.includes(msg)) { apkClearTimer(msg.id); return; }
                try {
                    const r = await toolBuildApk({ action: 'status', build_id: msg.apkBuild.id });
                    const cst = apkBuildStateOf(msg);
                    const before = { progress: cst.progress, phaseLabel: cst.phaseLabel, done: cst.done, failed: cst.failed, sizeKb: cst.sizeKb };
                    if (!r || r.success === false) {
                        cst.failed = true;
                        cst.error = (r && r.error) || 'Gagal memantau build.';
                        apkClearTimer(msg.id); renderMessages(); return;
                    }
                    cst.progress = Math.max(4, Math.min(typeof r.progress === 'number' ? r.progress : 0, 100));
                    if (r.status === 'done' || (r.found && r.status === 'completed' && r.conclusion === 'success')) {
                        cst.done = true; cst.progress = 100; cst.phaseLabel = '';
                        if (r.apk_size_bytes) cst.sizeKb = Math.round(r.apk_size_bytes / 1024);
                        apkClearTimer(msg.id); renderMessages(); return;
                    }
                    if (r.status === 'failed' || (r.found && r.status === 'completed' && r.conclusion && r.conclusion !== 'success')) {
                        cst.failed = true;
                        cst.error = r.message || 'Build gagal.';
                        apkClearTimer(msg.id); renderMessages(); return;
                    }
                    cst.phaseLabel = apkStepLabel(r.steps);
                    // FIX GETAR ("kaya refresh"): dulu polling tiap 6 detik SELALU
                    // renderMessages() penuh walau tak ada perubahan apa pun — seluruh
                    // chat dibongkar-pasang ulang (gambar kedip, animasi fade-in main
                    // lagi, layout loncat sesaat) sehingga halaman terasa digetar/
                    // ke-refresh terus. Sekarang render hanya jika tampilan kartu
                    // benar-benar berubah; saveChatLog & sinkron cloud ikut hemat.
                    if (cst.progress !== before.progress || cst.phaseLabel !== before.phaseLabel
                        || cst.done !== before.done || cst.failed !== before.failed
                        || cst.sizeKb !== before.sizeKb) renderMessages();
                } catch (e) {}
            };
            apkPollTimers.set(msg.id, setInterval(tick, 6000));
            tick();
        }
        window.apkDownloadClick = async function (msgId) {
            const m = messages.find(x => x && x.id === msgId);
            if (!m || !m.apkBuild) return;
            const st = apkBuildStateOf(m);
            if (st.downloading) return;
            st.downloading = true; st.error = '';
            renderMessages();
            try {
                const r = await toolBuildApk({ action: 'download', build_id: m.apkBuild.id, app_name: m.apkBuild.name });
                st.downloading = false;
                if (r && r.success) { st.downloaded = true; st.sizeKb = r.size_kb || st.sizeKb; }
                else { st.error = (r && r.error) || 'Gagal mengunduh APK.'; }
            } catch (e) {
                st.downloading = false;
                st.error = 'Gagal mengunduh APK.';
            }
            renderMessages();
        };

        function renderApkLogoCard(msg) {
            if (!msg.apkLogo) return '';
            const st = apkLogoStateOf(msg);
            if (st.sent) return '';
            const iconHtml = st.iconB64
                ? '<img src="data:image/png;base64,' + st.iconB64 + '" alt="logo">'
                : '<i class="ph-bold ph-plus"></i>';
            // SATU langkah kecil, FLAT, SENTRIS — cuma bulatan ikon (tanpa teks di sampingnya,
            // penjelasan sudah ada di teks AI sendiri) + "Lewati" di bawahnya. Nama & pengaturan
            // ditanyakan belakangan terpisah (teks biasa / [[POLL]]), bukan ditumpuk di sini.
            return `
                <div class="apk-logo-row fade-in">
                    <button type="button" class="apk-icon-btn ${st.iconB64 ? 'has-icon' : ''}" onclick="apkIconPick('${msg.id}')" title="Unggah logo aplikasi">${iconHtml}</button>
                    <input type="file" id="apk-icon-input-${msg.id}" accept="image/*" style="display:none" onchange="apkIconFile('${msg.id}', this)">
                    <button type="button" class="apk-logo-skip" onclick="apkLogoSend('${msg.id}', false)">${st.iconB64 ? 'Lanjutkan' : 'Lewati, pakai ikon default'}</button>
                </div>`;
        }

        function renderApkBuildCard(msg) {
            if (!msg.apkBuild) return '';
            const st = apkBuildStateOf(msg);
            ensureApkPolling(msg);
            let savedIcon = null;
            try { savedIcon = localStorage.getItem('clincoo_apk_icon') || null; } catch (e) {}
            const iconHtml = savedIcon
                ? '<img src="data:image/png;base64,' + savedIcon + '" alt="logo">'
                : '<i class="ph-bold ph-android-logo"></i>';
            let statusLine;
            if (st.failed) { statusLine = st.error || 'Build gagal.'; }
            else if (st.done) { statusLine = 'Selesai — siap didownload.'; }
            else { statusLine = st.phaseLabel || 'Menyiapkan build di GitHub Actions…'; }
            return `
                <div class="apk-card fade-in">
                    <div class="apk-build-top">
                        <span class="apk-build-icon">${iconHtml}</span>
                        <div style="min-width:0;flex:1">
                            <div class="apk-build-name">${escText(msg.apkBuild.name || 'Aplikasi')}</div>
                            <div class="apk-build-sub">${escText(msg.apkBuild.url || '')}</div>
                        </div>
                    </div>
                    ${!st.done && !st.failed ? `
                    <div class="apk-bar"><div class="apk-bar-fill" style="width:${st.progress || 4}%"></div></div>` : ''}
                    <div class="apk-build-status">
                        <span>${escText(statusLine)}${!st.done && !st.failed ? ' (' + (st.progress || 0) + '%)' : ''}</span>
                    </div>
                    ${st.done ? `
                    <div class="apk-cta-row">
                        <button type="button" class="apk-dl-btn" ${st.downloading ? 'disabled' : ''} onclick="apkDownloadClick('${msg.id}')">
                            <i class="ph-bold ph-download-simple"></i> ${st.downloading ? 'Menyiapkan…' : 'Download'}${!st.downloading && st.sizeKb ? ' (' + st.sizeKb + ' KB)' : ''}
                        </button>
                        ${st.downloaded ? '<span class="apk-card-hint">Sudah didownload — buka file, izinkan "aplikasi tidak dikenal" bila diminta.</span>' : ''}
                    </div>` : ''}
                    ${st.failed ? `
                    <div class="apk-cta-row">
                        <button type="button" class="apk-pill-btn secondary" onclick="handlePromptClick('coba build apk lagi dengan pengaturan yang sama')">Coba lagi</button>
                    </div>` : ''}
                    ${st.error && !st.failed ? `<div class="apk-card-hint">${escText(st.error)}</div>` : ''}
                </div>`;
        }

        function renderApkCards(msg) {
            return renderApkLogoCard(msg) + renderApkBuildCard(msg);
        }

        // ===== CHECKPOINT TOKEN: saat kuota token habis di tengah tugas, AI minta
        // konfirmasi sebelum lanjut — dengan variasi kalimat agar tidak monoton/selalu sama.
        const CHECKPOINT_OPENERS = [
            'Sepertinya token saya kehabisan tepat di tengah pengerjaan. Untungnya, semuanya aman.',
            'Kuota token untuk tugas ini habis sebentar, jadi saya jeda dulu di titik aman.',
            'Proses berhenti sementara — token saya mentok, tapi tenang, kerjaanmu tidak hilang.',
            'Sebentar ya, token saya kehabisan di tengah jalan. Ini laporan posisinya sejauh ini.',
            'Oke jujur saja, token saya habis pas mengerjakan ini. Kabar baiknya: progresnya tersimpan.',
            'Token saya kehabisan, jadi saya berhenti dulu di sini biar semuanya rapi.'
        ];
        const CHECKPOINT_DONE_HDRS = ['Sudah dikerjakan', 'Sudah selesai', 'Progres sejauh ini'];
        const CHECKPOINT_TODO_HDRS = ['Belum selesai', 'Yang masih tersisa', 'Sisa pengerjaan'];
        const CHECKPOINT_TODO_BODIES = [
            'Sisa file dan komponen yang belum jadi akan saya kerjakan setelah kamu konfirmasi.',
            'Tugas masih punya sisa — semuanya tersimpan rapi dan siap dilanjutkan kapan pun.',
            'Ada beberapa bagian terakhir yang belum saya sentuh; tinggal konfirmasi untuk melanjutkan.'
        ];
        const CHECKPOINT_PROMPTS = [
            'Ketuk tombol **Lanjutkan** di bawah — saya kerjakan sisanya.',
            'Tekan **Lanjutkan** di bawah dan saya teruskan dari titik ini.',
            'Cukup ketuk **Lanjutkan** — saya ambil lagi dari sini.',
            'Tekan **Lanjutkan** untuk meneruskan pengerjaannya.',
            'Kapan pun kamu siap, ketuk **Lanjutkan** — saya siap melanjutkan.'
        ];
        function pickRandom(arr) { return arr[Math.floor(Math.random() * arr.length)]; }
        function buildCheckpointText(toolCalls, reason, recoveryNote) {
            const doneList = toolCalls.map(function (tc) {
                let lbl = toolCallLabel({ name: tc.name, args: tc.args });
                return (tc.ok === false ? '⚠ ' : '✓ ') + lbl;
            });
            const lines = [];
            lines.push(pickRandom(CHECKPOINT_OPENERS));
            lines.push('');
            lines.push('**' + pickRandom(CHECKPOINT_DONE_HDRS) + ':**');
            doneList.forEach(function (d, i) { lines.push((i + 1) + '. ' + d); });
            lines.push('');
            lines.push('**' + pickRandom(CHECKPOINT_TODO_HDRS) + ':**');
            lines.push(pickRandom(CHECKPOINT_TODO_BODIES));
            if (reason) { lines.push(''); lines.push('*' + reason + (recoveryNote || ' Biasanya pulih sendiri dalam beberapa menit.') + '*'); }
            lines.push('');
            lines.push(pickRandom(CHECKPOINT_PROMPTS));
            return lines.join('\n');
        }

        function toggleToolCallsGroup(msgId) {
            const msg = messages.find(m => m.id === msgId || m.id.toString() === msgId);
            if (!msg) return;
            // Selalu tertutup default — user membuka manual, termasuk saat AI masih berjalan.
            const current = (msg.toolCallsOpen === undefined) ? false : msg.toolCallsOpen;
            msg.toolCallsOpen = !current;
            renderMessages();
        }

        function toggleToolCallItem(msgId, idx) {
            const msg = messages.find(m => m.id === msgId || m.id.toString() === msgId);
            if (!msg || !msg.toolCalls || !msg.toolCalls[idx]) return;
            msg.toolCalls[idx].expanded = !msg.toolCalls[idx].expanded;
            renderMessages();
        }

        function toolCallDetailBlock(label, text) {
            if (text === undefined || text === null || text === '') return '';
            const encoded = encodeURIComponent(text);
            return `
                <div class="toolcalls-detail-block">
                    <div class="toolcalls-detail-label">
                        <span>${escText(label)}</span>
                        <button type="button" class="toolcalls-detail-copy" onclick="event.stopPropagation(); copyCodeBlock(this)" data-code="${encoded}" title="Salin">
                            <i class="ph-bold ph-copy text-[13px]"></i>
                        </button>
                    </div>
                    <pre class="toolcalls-detail-pre">${escText(text)}</pre>
                </div>
            `;
        }

        // Tool pencarian/pembacaan info murni — tidak ada aksi/perubahan nyata,
        // jadi tidak perlu kartu "Menjalankan Tugas". Status shimmer teks saja sudah cukup.
        const INFO_ONLY_TOOLS = new Set(['web_search', 'read_web_page', 'search_clincoo_kb', 'test_secret', 'db_list_tables', 'db_list_rows']);
        function isInfoOnlyToolCalls(toolCalls) {
            if (!toolCalls || toolCalls.length === 0) return true;
            return toolCalls.every(tc => INFO_ONLY_TOOLS.has(tc.name));
        }

        function renderToolCallsCard(msg) {
            if (!msg.toolCalls || msg.toolCalls.length === 0) return '';
            if (isInfoOnlyToolCalls(msg.toolCalls)) return ''; // murni search -> tanpa kartu
            const running = !!msg.isProcessing;
            // Tertutup default: progres tidak auto-membuka; user membuka sendiri manual.
            const groupOpen = (msg.toolCallsOpen === undefined) ? false : msg.toolCallsOpen;
            const errCount = msg.toolCalls.filter(tc => tc.ok === false).length;
            // Jawaban final gagal terkirim (semua provider down sesaat) -> jangan
            // klaim "finished" seolah semua berhasil; tampilkan status jujur.
            const reportFailed = !running && msg.isError && msg.retryable;
            // Saat masih berjalan: tampilkan aksi NYATA yang sedang AI lakukan (English,
            // dari statusText yang sama dipakai shimmer -- misal "Writing file: services.html…"),
            // bukan teks generik "Menjalankan Tugas".
            const summaryText = running
                ? (msg.statusText || 'Running…')
                : (reportFailed
                    ? 'Task complete — laporan gagal terkirim, ketuk "Lanjutkan" di bawah'
                    : (msg.midPhase
                        ? 'Partially done — continuing…'
                        : (errCount > 0
                            ? `Everything's finished (${errCount} failed)`
                            : "Everything's finished")));
            const badgeClass = running ? '' : (reportFailed || errCount > 0 ? ' err' : ' ok');
            const summaryIcon = running
                ? '<i class="ph-bold ph-circle-notch tc-spin text-[15px]"></i>'
                : (msg.midPhase
                    ? '<i class="ph-bold ph-dots-three text-[15px]"></i>'
                    : (errCount > 0 ? '<i class="ph-bold ph-x text-[15px]"></i>' : '<i class="ph-bold ph-check text-[15px]"></i>'));
            return `
                <div class="mb-1.5 toolcalls-card fade-in">
                    <button type="button" class="toolcalls-summary${groupOpen ? ' open' : ''}" onclick="toggleToolCallsGroup('${msg.id}')">
                        <span class="toolcalls-badge${badgeClass}">${summaryIcon}</span>
                        <span class="toolcalls-summary-text">${escText(summaryText)}</span>
                        <i class="ph-bold ph-caret-down tc-chevron text-[12px]"></i>
                    </button>
                    ${running ? '<div class="toolcalls-livebar"></div>' : ''}
                    ${groupOpen ? `
                        <div class="toolcalls-list">
                            ${msg.toolCalls.map((tc, idx) => {
                                const itemOpen = !!tc.expanded;
                                const argsText = (tc.args && Object.keys(tc.args).length) ? JSON.stringify(tc.args, null, 2) : '';
                                const resultText = (tc.result !== undefined && tc.result !== null && tc.result !== '') ? String(tc.result) : '';
                                return `
                                <div class="toolcalls-item">
                                    <button type="button" class="toolcalls-item-header${itemOpen ? ' open' : ''}${tc.ok === false ? ' err' : ''}" onclick="toggleToolCallItem('${msg.id}', ${idx})">
                                        ${tc.name === 'notion_request' ? `<span class="inline-flex w-[14px] h-[14px]" style="flex-shrink:0">${SVG}</span>` : `<i class="ph-bold ${toolCallIcon(tc.name)} text-[14px]" style="flex-shrink:0"></i>`}
                                        <span class="toolcalls-item-label">${tc.ok === false ? '✗ ' : ''}${escText(toolCallLabel(tc))}</span>
                                        ${(argsText || resultText) ? `<i class="ph-bold ph-caret-down tc-chevron text-[12px]"></i>` : ''}
                                    </button>
                                    ${(itemOpen && (argsText || resultText)) ? `
                                        <div class="toolcalls-item-detail">
                                            ${toolCallDetailBlock('Arguments', argsText)}
                                            ${toolCallDetailBlock('Result', resultText)}
                                        </div>
                                    ` : ''}
                                </div>
                            `; }).join('')}
                        </div>
                    ` : ''}
                </div>
            `;
        }

        // Saat tab ditutup / disembunyikan saat AI masih mengetik, simpan kondisi terakhir —
        // begitu kembali, halaman melanjutkan (lihat logika resume di bawah).
        window.addEventListener('pagehide', function () {
            try { saveChatLog(); } catch (e) {}
            try { if (chatSyncTimer) { clearTimeout(chatSyncTimer); chatSyncTimer = null; syncChatLogOut(lastSavedLog, true); } } catch (e) {}
        });
        document.addEventListener('visibilitychange', function () {
            if (document.visibilityState === 'hidden') { try { saveChatLog(); } catch (e) {} }
        });

        let __aiOpenPage = null;
        function renderMessages() {
            // Deteksi token AI [[BUKA_HALAMAN:/domain/]] -> buka halaman otomatis untuk user
            try {
                for (const m of messages) {
                    if (m && m.role === 'ai' && typeof m.text === 'string' && m.text.indexOf('[[BUKA_HALAMAN:') !== -1) {
                        const mm = m.text.match(/\[\[BUKA_HALAMAN:([^\]\s]+)\]\]/);
                        m.text = m.text.replace(/\s*\[\[BUKA_HALAMAN:[^\]]+\]\]\s*/g, ' ').trim();
                        if (mm && mm[1] === '/domain/') __aiOpenPage = '/domain/';
                    }
                }
                if (__aiOpenPage) { const __p = __aiOpenPage; __aiOpenPage = null; setTimeout(function () { location.href = __p; }, 400); }
            } catch (e) {}
            try { saveChatLog(); } catch(e) {}
            chatContainer.innerHTML = '';
            const visibleMessages = messages.filter(m => !m.isHidden && !m.silent);
            
            if (visibleMessages.length === 0) {
                chatContainer.innerHTML = `
                    <div class="flex flex-col items-center justify-center w-full h-full min-h-[50vh] gap-6 fade-in pointer-events-auto">
                        <h2 class="text-3xl md:text-[34px] text-center text-gray-800 tracking-tight px-4" style="font-weight: 400;">${currentGreeting}</h2>
                        
                        <!-- Tombol Gunakan Prompt / Prompt Suggestions -->
                        <div class="flex flex-wrap items-center justify-center gap-2 max-w-2xl px-4">
                            <button onclick="handlePromptClick('Buatkan ringkasan artikel ini')" class="px-4 py-2 bg-gray-50 hover:bg-gray-100 border border-gray-200 rounded-full text-[13px] font-medium text-gray-700 transition-colors shadow-sm flex items-center gap-1.5">
                                <i class="ph ph-magic-wand text-lg"></i> Buat ringkasan
                            </button>
                            <button onclick="handlePromptClick('Tuliskan email profesional untuk klien')" class="px-4 py-2 bg-gray-50 hover:bg-gray-100 border border-gray-200 rounded-full text-[13px] font-medium text-gray-700 transition-colors shadow-sm flex items-center gap-1.5">
                                <i class="ph ph-envelope text-lg"></i> Tulis email
                            </button>
                            <button onclick="handlePromptClick('Jelaskan konsep AI dengan sederhana')" class="px-4 py-2 bg-gray-50 hover:bg-gray-100 border border-gray-200 rounded-full text-[13px] font-medium text-gray-700 transition-colors shadow-sm flex items-center gap-1.5">
                                <i class="ph ph-lightbulb text-lg"></i> Jelaskan konsep AI
                            </button>
                        </div>
                    </div>
                `;
                return;
            }

            const lastAiIndex = [...visibleMessages].reverse().findIndex(m => m.role === 'ai');
            const actualLastAiIndex = lastAiIndex !== -1 ? (visibleMessages.length - 1) - lastAiIndex : -1;
            const lastUserIndex = [...visibleMessages].reverse().findIndex(m => m.role === 'user');
            const actualLastUserIndex = lastUserIndex !== -1 ? (visibleMessages.length - 1) - lastUserIndex : -1;

            visibleMessages.forEach((msg, index) => {
                const messageEl = document.createElement('div');
                messageEl.id = 'msg-row-' + msg.id;
                messageEl.classList.add('flex', 'w-full', 'fade-in');

                if (msg.role === 'ai') {
                    const isLastAi = index === actualLastAiIndex;
                    messageEl.classList.add('justify-start');
                    
                    let processIndicator = '';
                    if (msg.isProcessing) {
                        if (msg.processType === 'search') {
                            processIndicator = `<div class="shimmer-search"><span id="status-text-${msg.id}" class="transition-opacity duration-200">${msg.statusText || 'Searching...'}</span></div>`;
                        } else if (msg.processType === 'read') {
                            processIndicator = `<div class="shimmer-search"><span id="status-text-${msg.id}" class="transition-opacity duration-200">${msg.statusText || 'Reading URL...'}</span></div>`;
                        } else if (msg.processType === 'file') {
                            processIndicator = `<div class="shimmer-search"><span id="status-text-${msg.id}" class="transition-opacity duration-200">${msg.statusText || 'Analyzing...'}</span></div>`;
                        } else if (msg.processType === 'image') {
                            processIndicator = `<div class="shimmer-search"><span id="status-text-${msg.id}" class="transition-opacity duration-200">${msg.statusText || 'Generating...'}</span></div>`;
                        } else {
                            processIndicator = `<div class="shimmer-search"><span id="status-text-${msg.id}" class="transition-opacity duration-200">${msg.statusText || 'Thinking...'}</span></div>`;
                        }
                    }

                    messageEl.innerHTML = `
                        <div class="flex max-w-[95%] sm:max-w-[90%] w-full min-w-0">
                            <div class="flex flex-col gap-2 pt-1 w-full min-w-0">
                                ${renderToolCallsCard(msg)}
                                <div class="text-black text-[15px] leading-normal break-words w-full md-content pointer-events-auto overflow-hidden${(!msg.isProcessing && !msg.isTyping && msg.text && msg.role === 'ai') ? ' ai-answer-reveal' : ''}" style="word-break: break-word; overflow-wrap: break-word; max-width: 100%;" id="msg-text-${msg.id}">
                                    ${(msg.isProcessing && isInfoOnlyToolCalls(msg.toolCalls)) ? (isLastAi ? processIndicator : '') : (msg.isImageResponse ? msg.text : formatMarkdown(balanceMarkdown(msg.text)))}
                                </div>
                                ${renderPollCard(msg)}
                                ${renderSubdomainCard(msg)}
                                ${renderApkCards(msg)}
                                ${(msg.sources && msg.sources.length > 0) ? `
                                    <div class="mt-1.5 mb-0.5 pointer-events-auto fade-in">
                                        <div class="flex items-center flex-wrap gap-x-1.5 gap-y-1 text-[11.5px] text-gray-400">
                                            <i class="ph ph-globe text-[13px]"></i>
                                            ${msg.sources.map(s => `<a href="${escUrl(s.url)}" target="_blank" rel="noopener noreferrer" class="underline decoration-gray-300 hover:text-gray-600 transition-colors" title="${escText(s.url)}">${escText(s.domain)}</a>`).join('<span class="text-gray-300">·</span>')}
                                        </div>
                                    </div>
                                ` : ''}
                                ${(msg.checkpoint && isLastAi && !msg.isProcessing && !msg.isTyping) ? `
                                    <button type="button" class="checkpoint-chip fade-in" onclick="resumeCheckpoint(this)" title="Lanjutkan tugas yang tertunda">
                                        <i class="ph-bold ph-arrow-clockwise"></i> Lanjutkan
                                    </button>
                                ` : ''}
                                ${(msg.stoppedByUser && !msg.isProcessing && !msg.isTyping) ? `
                                    <div class="stopped-divider fade-in select-none">
                                        <span class="stopped-line"></span>
                                        <span class="stopped-text">Respon dihentikan</span>
                                        <span class="stopped-line"></span>
                                    </div>
                                ` : ''}
                                <div class="flex items-center gap-3 mt-1 pointer-events-auto" id="action-bar-${msg.id}" style="${(msg.isProcessing || msg.isTyping || msg.midPhase || (msg.checkpointNote && isGenerating)) ? 'display: none;' : ''}">
                                    ${msg.isImageResponse ? 
                                    `<button onclick="downloadImage('${msg.imageUrl}', 'clincoo-image.jpg')" class="relative text-gray-400 hover:text-black transition p-1" title="Unduh Gambar">
                                        <i class="ph ph-download-simple text-lg"></i>
                                    </button>` :
                                    `<button onclick="copyText('${msg.id}', this)" class="relative text-gray-400 hover:text-black transition p-1" title="Salin">
                                        <i class="ph ph-copy text-lg"></i>
                                    </button>`}
                                    <button onclick="shareText('${msg.id}')" class="text-gray-400 hover:text-black transition p-1" title="Bagikan">
                                        <i class="ph ph-arrow-bend-up-right text-lg"></i>
                                    </button>
                                    ${isLastAi ? `
                                        <button onclick="handleThumbs('${msg.id}', 'up', this)" class="text-gray-400 hover:text-black transition p-1" title="Suka">
                                            <i class="ph ph-thumbs-up text-lg"></i>
                                        </button>
                                        <button onclick="handleThumbs('${msg.id}', 'down', this)" class="text-gray-400 hover:text-black transition p-1" title="Tidak Suka">
                                            <i class="ph ph-thumbs-down text-lg"></i>
                                        </button>
                                    ` : ''}
                                    <span class="ml-auto text-[11px] text-gray-400 font-medium select-none whitespace-nowrap">${(msg.respMs ? (msg.respMs >= 10000 ? Math.round(msg.respMs/1000) + ' dtk' : (msg.respMs >= 1000 ? (msg.respMs/1000).toFixed(1).replace('.', ',') + ' dtk' : msg.respMs + ' ms')) : '')}</span>
</div>
                            </div>
                        </div>
                    `;
                } else {
                    const isLastUser = index === actualLastUserIndex;
                    messageEl.classList.add('justify-end');
                    
                    let attachmentsHtml = '';
                    if (msg.attachments && msg.attachments.length > 0) {
                        attachmentsHtml = '<div class="flex flex-wrap gap-2 mb-2 justify-end w-full">';
                        msg.attachments.forEach(att => {
                            if (att.type === 'image') {
                                attachmentsHtml += `<img src="${escUrl(att.data)}" class="max-w-[200px] sm:max-w-[250px] rounded-2xl mb-1 border border-gray-200/50 shadow-sm object-cover" alt="Attached Image">`;
                            } else {
                                attachmentsHtml += `
                                    <div class="flex items-center gap-1.5 bg-black/5 px-3 py-1.5 rounded-full border border-black/5 max-w-full mb-1">
                                        ${getFileIcon(att.extension)}
                                        <div class="flex-1 overflow-hidden">
                                            <p class="text-[12px] font-semibold truncate text-gray-800">${att.name}</p>
                                        </div>
                                    </div>
                                `;
                            }
                        });
                        attachmentsHtml += '</div>';
                    }

                    messageEl.innerHTML = `
                        <div class="flex flex-col items-end max-w-[85%] w-full pointer-events-auto">
                            ${attachmentsHtml}
                            ${msg.text ? `
                            <div class="bg-gray-100 text-black px-4 py-2.5 rounded-2xl rounded-br-sm text-[15px] leading-relaxed user-bubble cursor-pointer inline-block w-fit md-content" 
                                 style="word-break: break-word; overflow-wrap: break-word; hyphens: auto;"
                                 data-id="${msg.id}">
                                ${formatMarkdown(msg.text)}
                            </div>
                            ` : ''}
                            <div id="user-action-bar-${msg.id}" class="hidden items-center gap-3 mt-1 mr-2 user-action-bar">
                                <button onclick="copyText('${msg.id}', this)" class="relative text-gray-400 hover:text-black transition p-1" title="Salin">
                                    <i class="ph ph-copy text-lg"></i>
                                </button>
                                ${isLastUser ? `
                                    <button onclick="editMessage('${msg.id}')" class="text-gray-400 hover:text-black transition p-1" title="Edit">
                                        <i class="ph ph-pencil-simple text-lg"></i>
                                    </button>
                                ` : ''}
                            </div>
                        </div>
                    `;
                }
                chatContainer.appendChild(messageEl);
            });
            const scrollSpacer = document.createElement('div');
            scrollSpacer.id = 'scroll-top-spacer';
            scrollSpacer.style.flexShrink = '0';
            scrollSpacer.style.width = '100%';
            scrollSpacer.style.height = pinSpacerPx + 'px';
            scrollSpacer.setAttribute('aria-hidden', 'true');
            chatContainer.appendChild(scrollSpacer);
            attachBubbleClickListeners();
            scrollToBottom(false);
        
            try {
                var keepMsgs = messages.filter(function(m){ return !m.isHidden; }).slice(-100).map(function(m){ return { role: m.role, text: m.text }; });
                localStorage.setItem('clincoo_chat_cache', JSON.stringify({ sessionId: currentSessionId, savedAt: Date.now(), msgs: keepMsgs }));
            } catch(e) {}
}

        function msgPlainText(id) {
            const m = messages.find(x => x.id === id || x.id.toString() === id);
            return m ? (m.text || '') : '';
        }
        function exportDocTitle(text) {
            const firstLine = (text || '').split('\n').map(t => t.trim()).filter(Boolean)[0] || 'Jawaban Clincoo';
            return firstLine.replace(/^#+\s*/, '').replace(/[*_`~>#]/g, '').slice(0, 60) || 'Jawaban Clincoo';
        }
        function escHtml(x) { return String(x).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
        function mdInlineHtml(x) {
            return escHtml(x)
                .replace(/`([^`]+)`/g, '<code>$1</code>')
                .replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>')
                .replace(/(^|\s)\*([^*]+)\*/g, '$1<i>$2</i>')
                .replace(/\[([^\]]+)\]\((https?:[^)]+)\)/g, '<a href="$2">$1</a>');
        }
        function mdToHtml(md) {
            const lines = (md || '').split('\n');
            let html = '', inCode = false, codeBuf = [], listType = null;
            const closeList = () => { if (listType) { html += (listType === 'ul' ? '</ul>' : '</ol>'); listType = null; } };
            for (const raw of lines) {
                const line = raw;
                if (line.trim().startsWith('```')) {
                    if (inCode) { html += '<pre>' + escHtml(codeBuf.join('\n')) + '</pre>'; codeBuf = []; inCode = false; }
                    else { closeList(); inCode = true; }
                    continue;
                }
                if (inCode) { codeBuf.push(line); continue; }
                const t = line.trim();
                if (!t) { closeList(); continue; }
                let m;
                if ((m = t.match(/^(#{1,3})\s+(.*)$/))) {
                    closeList();
                    const h = m[1].length + 1;
                    html += '<h' + h + '>' + mdInlineHtml(m[2]) + '</h' + h + '>';
                } else if (/^([-*])\s+/.test(t)) {
                    if (listType !== 'ul') { closeList(); html += '<ul>'; listType = 'ul'; }
                    html += '<li>' + mdInlineHtml(t.replace(/^([-*])\s+/, '')) + '</li>';
                } else if (/^\d+\.\s+/.test(t)) {
                    if (listType !== 'ol') { closeList(); html += '<ol>'; listType = 'ol'; }
                    html += '<li>' + mdInlineHtml(t.replace(/^\d+\.\s+/, '')) + '</li>';
                } else {
                    closeList();
                    html += '<p>' + mdInlineHtml(t) + '</p>';
                }
            }
            if (inCode && codeBuf.length) html += '<pre>' + escHtml(codeBuf.join('\n')) + '</pre>';
            closeList();
            return '<!DOCTYPE html><html><head><meta charset="utf-8"></head><body>' + html + '</body></html>';
        }

                '\r\n--CLINCOOBOUND\r\nContent-Type: text/html\r\n\r\n' + html + '\r\n--CLINCOOBOUND--';
            return fetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id,name,webViewLink', {
                method: 'POST',
                headers: { 'Authorization': 'Bearer ' + token, 'Content-Type': 'multipart/related; boundary=CLINCOOBOUND' },
                body
            });
        }

        function notionInlineRich(text) {
            // jadikan 1 rich_text dengan penandaan **bold**/*italic*`code` sederhana
            const out = [];
            const re = /(\*\*[^*]+\*\*|\*[^*]+\*|`[^`]+`)/g;
            let last = 0, m;
            const push = (t, ann) => { if (t) out.push({ type: 'text', text: { content: t }, annotations: ann || {} }); };
            while ((m = re.exec(text)) !== null) {
                push(text.slice(last, m.index));
                const tok = m[0];
                if (tok.startsWith('**')) push(tok.slice(2, -2), { bold: true });
                else if (tok.startsWith('`')) push(tok.slice(1, -1), { code: true });
                else push(tok.slice(1, -1), { italic: true });
                last = m.index + tok.length;
            }
            push(text.slice(last));
            if (!out.length) out.push({ type: 'text', text: { content: text || ' ' } });
            return out;
        }
        function notionBlocks(md) {
            const blocks = [];
            const lines = (md || '').split('\n');
            let i = 0;
            while (i < lines.length && blocks.length < 95) {
                const t = lines[i].trim();
                if (t.startsWith('```')) {
                    const buf = [];
                    i++;
                    while (i < lines.length && !lines[i].trim().startsWith('```')) { buf.push(lines[i]); i++; }
                    i++;
                    blocks.push({ object: 'block', type: 'code', code: { rich_text: [{ type: 'text', text: { content: buf.join('\n').slice(0, 1900) } }], language: 'plain text' } });
                    continue;
                }
                let m;
                if ((m = t.match(/^(#{1,3})\s+(.*)$/))) {
                    const lvl = 'heading_' + m[1].length;
                    const o = { object: 'block', type: lvl };
                    o[lvl] = { rich_text: notionInlineRich(m[2]) };
                    blocks.push(o);
                } else if (/^[-*]\s+/.test(t)) {
                    blocks.push({ object: 'block', type: 'bulleted_list_item', bulleted_list_item: { rich_text: notionInlineRich(t.replace(/^[-*]\s+/, '')) } });
                } else if (/^\d+\.\s+/.test(t)) {
                    blocks.push({ object: 'block', type: 'numbered_list_item', numbered_list_item: { rich_text: notionInlineRich(t.replace(/^\d+\.\s+/, '')) } });
                } else if (t) {
                    blocks.push({ object: 'block', type: 'paragraph', paragraph: { rich_text: notionInlineRich(t) } });
                }
                i++;
            }
            if (!blocks.length) blocks.push({ object: 'block', type: 'paragraph', paragraph: { rich_text: [{ type: 'text', text: { content: (md || '').slice(0, 1900) } }] } });
            return blocks;
        }

        async function notionRefreshToken() {
            // Terhubung lewat plugin Notion (OAuth): access token di-refresh lewat server Clincoo
            const refresh = localStorage.getItem('clincoo_notion_refresh');
            if (!refresh) return localStorage.getItem('clincoo_notion_token') || '';
            try {
                const rt = localStorage.getItem('clincoo_auth_token') || localStorage.getItem('clincoo_token') || '';
                const r = await fetch(TOOL_API_BASE + '/api/notion-oauth', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', ...(rt ? { 'Authorization': 'Bearer ' + rt } : {}) },
                    body: JSON.stringify({ refresh_token: refresh })
                });
                const j = await r.json().catch(() => ({}));
                if (r.ok && j.access_token) { localStorage.setItem('clincoo_notion_token', j.access_token); return j.access_token; }
            } catch (e) {}
            return localStorage.getItem('clincoo_notion_token') || '';
        }

            showGlobalTooltip(btnElement, 'Mengirim ke Notion…');
            let ok = false, status = 0;
            try {

                let d = await res.json().catch(function () { return {}; });
                // proxy tidak pernah mengirim outer 401 (mencegah redirect global ke login) —
                // status asli Notion ada di field _notion_status bila token ditolak.
                status = d._notion_status || res.status;
                if (status === 401 && localStorage.getItem('clincoo_notion_refresh')) {
                    // token OAuth kedaluwarsa -> refresh sekali lalu ulangi
                    const fresh = await notionRefreshToken();

        function wsNormalize(p) {

            const folderKey = parts.length > 0 ? parts.join('/') : 'root';
            const itemPath = parts.length > 0 ? folderKey + '/' + name : name;

                for (let i = 0; i < arr.length; i++) {

                        .replace(/<!--[\s\S]*?-->/g, '')

        function wsMissingRefs(htmlPath, content) {

        // Blok generate-image dengan skeleton loading + auto-retry sekali (seed baru) +
        // fallback rapi kalau tetap gagal -- gantikan ikon "broken image" bawaan browser
        // yang terlihat seperti pill kecil "Generated Image" pas gambar gagal termuat.
        function renderImageGenBlock(msgId, imageUrl, prompt) {
            return `<div class="flex justify-center w-full my-2 pointer-events-auto">
                <div class="w-full max-w-sm" id="imgwrap-${msgId}">
                    <div class="img-skeleton rounded-xl" id="imgskel-${msgId}"></div>
                    <img src="${imageUrl}" data-prompt="${escText(prompt)}" data-retried="0"
                         class="w-full max-w-sm rounded-xl shadow-[0_5px_15px_rgba(0,0,0,0.1)] border border-gray-200"
                         alt="Generated Image" style="display:none"
                         onload="document.getElementById('imgskel-${msgId}')?.remove(); this.style.display='block'; scrollToBottom(true);"
                         onerror="handleImageGenError(this, '${msgId}')">
                </div>
            </div>`;
        }
        function handleImageGenError(imgEl, msgId) {
            const wrap = document.getElementById('imgwrap-' + msgId);
            if (!wrap) return;
            const prompt = imgEl.getAttribute('data-prompt') || '';
            const retried = imgEl.getAttribute('data-retried') === '1';
            if (!retried) {
                // Coba sekali lagi diam-diam dengan seed baru sebelum benar2 dianggap gagal.
                const newSeed = Math.floor(Math.random() * 1000000);
                imgEl.setAttribute('data-retried', '1');
                imgEl.src = `https://image.pollinations.ai/prompt/${encodeURIComponent(prompt)}?seed=${newSeed}&nologo=true`;
                return;
            }
            wrap.innerHTML = `
                <div class="flex flex-col items-center justify-center gap-2 py-8 px-4 rounded-xl" style="background:rgba(120,120,130,0.08); border:1px solid rgba(120,120,130,0.18);">
                    <i class="ph-bold ph-image-broken text-[22px]" style="color:#8b8b93"></i>
                    <span style="color:#8b8b93; font-size:13px;">Failed to generate the image.</span>
                    <button type="button" onclick="retryImageGeneration('${msgId}', '${encodeURIComponent(prompt)}')" style="color:#9ca3af; font-size:13px; text-decoration:underline; text-underline-offset:2px; cursor:pointer; background:none; border:none;">Try again</button>
                </div>`;
        }
        function retryImageGeneration(msgId, encodedPrompt) {
            const wrap = document.getElementById('imgwrap-' + msgId);
            if (!wrap) return;
            const prompt = decodeURIComponent(encodedPrompt);
            const seed = Math.floor(Math.random() * 1000000);
            const imageUrl = `https://image.pollinations.ai/prompt/${encodeURIComponent(prompt)}?seed=${seed}&nologo=true`;
            wrap.innerHTML = `
                <div class="img-skeleton rounded-xl" id="imgskel-${msgId}"></div>
                <img src="${imageUrl}" data-prompt="${escText(prompt)}" data-retried="0"
                     class="w-full max-w-sm rounded-xl shadow-[0_5px_15px_rgba(0,0,0,0.1)] border border-gray-200"
                     alt="Generated Image" style="display:none"
                     onload="document.getElementById('imgskel-${msgId}')?.remove(); this.style.display='block'; scrollToBottom(true);"
                     onerror="handleImageGenError(this, '${msgId}')">`;
        }

        // ==== Pemangkasan riwayat otomatis (konteks skala 1M token tetap muat) ====
        // Chat panjang dgn banyak write_file besar bikin total payload jutaan karakter.
        // Sebelum kirim: kalau payload melebihi ~350KB, pangkas isi file & hasil tool
        // LAMA (10 pesan terakhir utuh) — AI tetap bisa read_file ulang bila perlu.
        // Tampilan chat TIDAK berubah: hanya payload kirim yang dipangkas.
        function compactHistoryForContext(msgs) {
            try {
                if (!Array.isArray(msgs) || msgs.length <= 11) return msgs;
                let total = 0;
                try { total = JSON.stringify(msgs).length; } catch (e) { return msgs; }
                if (total < 350_000) return msgs; // < ~350KB masih aman utk context window
                const CUTOFF = 3000;
                return msgs.map((m, idx) => {
                    if (!m || idx >= msgs.length - 10 || idx === 0) return m; // system + 10 terakhir utuh
                    if (!Array.isArray(m.content)) return m;
                    let changed = false;
                    const content = m.content.map(b => {
                        if (!b || typeof b !== 'object') return b;
                        if (b.type === 'function_call' && b.args && typeof b.args === 'object') {
                            const a = Object.assign({}, b.args);
                            for (const key of ['content', 'code', 'file_content', 'new_content', 'text']) {
                                if (typeof a[key] === 'string' && a[key].length > CUTOFF) {
                                    a[key] = a[key].slice(0, 800) + '\n…[dipangkas otomatis — hasil/berkas lama; baca ulang via read_file bila perlu]';
                                    changed = true;
                                }
                            }
                            return changed ? Object.assign({}, b, { args: a }) : b;
                        }
                        if (b.type === 'function_response') {
                            let rs; try { rs = JSON.stringify(b.result); } catch (e) { rs = ''; }
                            if (rs && rs.length > 6000) {
                                changed = true;
                                return Object.assign({}, b, { result: { info: '(hasil tool lama dipangkas otomatis)', preview: rs.slice(0, 800) } });
                            }
                        }
                        // jaring pengaman tambahan: gambar lama (base64) yang lolos dari gating
                        // keepImageIdx (mis. lewat jalur fallback/continueSilently) tetap dipangkas
                        // di sini agar payload tidak pernah membengkak tak terbatas.
                        if (b.type === 'image_url' && b.image_url && typeof b.image_url.url === 'string' && b.image_url.url.length > 2000) {
                            changed = true;
                            return { type: 'text', text: '[Lampiran foto lama -- dipangkas otomatis agar riwayat tidak membengkak]' };
                        }
                        return b;
                    });
                    return changed ? { role: m.role, content: content } : m;
                });
            } catch (e) { return msgs; }
        }
