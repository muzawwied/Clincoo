        // ==== Pemangkasan riwayat otomatis (konteks skala 1M token tetap muat) ====
        // Chat panjang dgn banyak write_file besar bikin total payload jutaan karakter.
        // Sebelum kirim: kalau payload melebihi ~350KB, pangkas isi file & hasil tool
        // LAMA (10 pesan terakhir utuh) — AI tetap bisa read_file ulang bila perlu.
        // Tampilan chat TIDAK berubah: hanya payload kirim yang dipangkas.
        function compactHistoryForContext(msgs) {
            try {
                if (!Array.isArray(msgs) || msgs.length <= 11) return msgs;
                let total = 0;
                try { total = JSON.stringify(msgs).length; } catch (e) { return msgs; }
                if (total < 350_000) return msgs; // < ~350KB masih aman utk context window
                const CUTOFF = 3000;
                return msgs.map((m, idx) => {
                    if (!m || idx >= msgs.length - 10 || idx === 0) return m; // system + 10 terakhir utuh
                    if (!Array.isArray(m.content)) return m;
                    let changed = false;
                    const content = m.content.map(b => {
                        if (!b || typeof b !== 'object') return b;
                        if (b.type === 'function_call' && b.args && typeof b.args === 'object') {
                            const a = Object.assign({}, b.args);
                            for (const key of ['content', 'code', 'file_content', 'new_content', 'text']) {
                                if (typeof a[key] === 'string' && a[key].length > CUTOFF) {
                                    a[key] = a[key].slice(0, 800) + '\n…[dipangkas otomatis — hasil/berkas lama; baca ulang via read_file bila perlu]';
                                    changed = true;
                                }
                            }
                            return changed ? Object.assign({}, b, { args: a }) : b;
                        }
                        if (b.type === 'function_response') {
                            let rs; try { rs = JSON.stringify(b.result); } catch (e) { rs = ''; }
                            if (rs && rs.length > 6000) {
                                changed = true;
                                return Object.assign({}, b, { result: { info: '(hasil tool lama dipangkas otomatis)', preview: rs.slice(0, 800) } });
                            }
                        }
                        return b;
                    });
                    return changed ? { role: m.role, content: content } : m;
                });
            } catch (e) { return msgs; }
        }

        // ===== TOOL SUPER: sandbox CLI, web reader/search, aksi proyek =====
        async function toolRunCommand(args) {
            const cmd = args && args.command ? String(args.command) : '';
            const wantReset = !!(args && args.reset);
            if (!cmd) return { success: false, error: 'Parameter command wajib.' };
            // Diproxy di server (/api/e2b-run, mode command): API key E2B tidak pernah
            // diunduh ke browser (perbaikan keamanan; dulu key dibagikan mentah).
            // reset:true -> buang sesi lama dulu, lalu command jalan di Linux baru.
            // FIX (bug "muter terus, tombol Stop tidak ngaruh"): fetch ini dulu TANPA
            // signal & TANPA timeout — kalau sandbox E2B hang (mis. command download
            // banyak URL berurutan yang nyangkut), promise ini tidak pernah selesai,
            // tombol Stop (yang hanya abort fetch utama) tidak bisa menyentuhnya, dan
            // kartu "Running..." muter selamanya. Sekarang: ikut abortController utama
            // (Stop benar-benar membatalkan) + timeout keras 90 detik sendiri supaya
            // sandbox yang hang tidak pernah menggantung tanpa batas.
            const toolTimeoutMs = 90000;
            const timeoutCtrl = new AbortController();
            const onMainAbort = () => timeoutCtrl.abort();
            if (abortController) abortController.signal.addEventListener('abort', onMainAbort);
            const timeoutId = setTimeout(() => timeoutCtrl.abort(), toolTimeoutMs);
            try {
                if (wantReset) {
                    try {
                        await fetch(TOOL_API_BASE + '/api/e2b-run', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ mode: 'reset_session' }),
                            signal: timeoutCtrl.signal
                        });
                    } catch (e) {}
                }
                const res = await fetch(TOOL_API_BASE + '/api/e2b-run', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ mode: 'command', command: cmd }),
                    signal: timeoutCtrl.signal
                });
                const d = await res.json().catch(() => null);
                if (!d) return { success: false, error: 'Respons sandbox tidak valid.' };
                if (d.error && !d.ok) return { success: false, error: String(d.error.value || d.error.name || 'Eksekusi gagal.') };
                const errText = String(d.error && d.error.value ? (d.error.name ? d.error.name + ': ' : '') + d.error.value : (d.stderr || '')).slice(0, 1500);
                return {
                    success: !!d.ok,
                    command: cmd,
                    stdout: String(d.stdout || '').slice(0, 3800),
                    stderr: errText
                };
            } catch (e) {
                if (e && e.name === 'AbortError') {
                    if (abortController && abortController.signal && abortController.signal.aborted) throw e; // Stop ditekan user -> hentikan loop generasi juga
                    return { success: false, error: 'Perintah dibatalkan: sandbox tidak merespons dalam 90 detik (kemungkinan hang/jaringan sandbox bermasalah).' };
                }
                return { success: false, error: 'Sandbox eksekusi tidak tersedia: ' + (e && e.message ? e.message : 'galat tak dikenal') };
            } finally {
                clearTimeout(timeoutId);
                if (abortController) abortController.signal.removeEventListener('abort', onMainAbort);
            }
        }

        async function toolReadWebPage(args) {
            const url = args && args.url ? String(args.url) : '';
            if (!/^https?:\/\//i.test(url)) return { success: false, error: 'Parameter url wajib (http/https).' };
            const res = await fetch(TOOL_API_BASE + '/api/jina', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ mode: 'read', query: url }) });
            const d = await res.json();
            if (!res.ok) return { success: false, error: d.error || 'Gagal membaca halaman web.' };
            return { success: true, url: url, content: String(d.text || '').slice(0, 3800) };
        }

        // AI menyimpan identitas proyek (Pengaturan Umum): nama & deskripsi dari pembahasan chat,
        // bukan potongan awal chat. Dipanggil otomatis oleh AI setelah membangun situs baru.
        async function toolGenerateImage(args) {
            const prompt = args && args.prompt ? String(args.prompt).trim() : '';
            if (!prompt) return { success: false, error: 'Parameter prompt wajib.' };
            const pid = currentProjectId;
            if (!pid) return { success: false, error: 'Tidak ada proyek aktif. Buka proyek dulu dari daftar proyek.' };
            const setAsLogo = args.set_as_logo === true || args.set_as_logo === 'true';
            // 1) generate gambar via backend (Workers AI)
            const gRes = await fetch(TOOL_API_BASE + '/api/generate-image', {
                method: 'POST', headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ project_id: pid, prompt: prompt })
            });
            const g = await gRes.json();
            if (g.error || !g.data_url) return { success: false, error: g.error || 'Gagal membuat gambar.' };
            // ekstensi dari mime asli ( Workers AI bisa balikin JPEG walau diminta PNG)
            const mimeRaw = (String(g.data_url).match(/^data:image\/([a-z+]+)/) || [])[1] || 'png';
            const ext = mimeRaw === 'jpeg' ? 'jpg' : mimeRaw;
            let name = args && args.filename ? String(args.filename).trim() : '';
            name = name.replace(/[^a-zA-Z0-9._\/-]/g, '').replace(/^\/+/, '');
            if (setAsLogo) name = 'logo.' + ext; // konvensi Pengaturan Umum & deploy engine
            if (!name) name = 'images/ai-' + Date.now().toString(36) + '.' + ext;
            // 2) simpan lewat jalur yang sama dengan write_file: pohon lokal + sinkron cloud otomatis
            //    (tab Workspace lain mendapat storage event -> file langsung muncul di pohon file)
            const wr = await wsWriteFile({ path: name, content: g.data_url });
            if (wr && wr.success === false) return wr;
            // 3) opsional: pasang sebagai logo di Pengaturan Umum
            if (setAsLogo) {
                const sRes = await fetch(TOOL_API_BASE + '/api/project-settings', {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ project_id: pid, app_logo: name, app_logo_data: g.data_url })
                });
                const st = await sRes.json();
                if (st.error) return { success: false, error: st.error };
            }
            return { success: true, path: name, set_as_logo: setAsLogo, note: 'Gambar tersimpan di workspace' + (setAsLogo ? ' dan dipasang sebagai logo/favicon di Pengaturan Umum (aktif pada deploy berikutnya)' : '') + '. Referensikan di situs dengan path persis: ' + name };
        }

        async function toolDeployProject() {
            const pid = currentProjectId;
            if (!pid) return { success: false, error: 'Tidak ada proyek aktif. Buka proyek dulu dari daftar proyek.' };
            const res = await fetch(TOOL_API_BASE + '/api/deploy', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ project_id: pid }) });
            // Server deploy bisa dibunuh Cloudflare (timeout 100 dtk / batas CPU) saat proyek besar,
            // yang balas HTML error page — jangan biarkan res.json() crash dengan "Unexpected token '<'".
            const d = await res.json().catch(function () { return null; });
            if (!d) return { success: false, error: 'Deploy gagal: server tidak merespons tepat waktu (HTTP ' + res.status + '). Proyek mungkin terlalu besar untuk sekali deploy. Tunggu sebentar lalu coba deploy lagi; kalau masih gagal, pecah proyek atau kurangi ukuran file terbesarnya.' };
            if (!res.ok || d.error) return { success: false, error: d.error || 'Deploy gagal.' };
            // DNS cache: hasil deploy langsung siap di halaman Domain Kustom (tanpa buka halaman itu dulu)
            try { var _dk = 'clincoo_' + pid + "_domain_cache", _dc = {}; try { _dc = JSON.parse(localStorage.getItem(_dk) || '{}') || {}; } catch (e) {} localStorage.setItem(_dk, JSON.stringify(Object.assign(_dc, { pagesUrl: d.pages_url || '', deployed: true, ts: Date.now() }))); } catch (e) {}
            // URL utama: subdomain clincoo.biz.id (public_url) — pages.dev hanya cadangan.
            const url = d.public_url || (d.public_domain ? ('https://' + d.public_domain) : '') || (d.deployment && d.deployment.url) || d.pages_url || '';
            return { success: true, url: url, pages_url: d.pages_url || '', public_domain: d.public_domain || '', pages_project: d.pages_project || '', file_count: d.fileCount || 0, message: 'Situs berhasil di-deploy' + (url ? ' ke ' + url : '') + (d.public_domain ? ' (subdomain clincoo.biz.id aktif)' : '') + '.' };
        }

        // manage_domain: AI kelola domain kustom + setel record DNS langsung (via /api/deploy)
        async function toolClincooPay(args) {
            const a = args || {};
            const action = String(a.action || 'config').trim().toLowerCase();
            const pid = currentProjectId;
            let token = '';
            try { token = localStorage.getItem('clincoo_auth_token') || localStorage.getItem('clincoo_token') || ''; } catch (e) {}
            const authHeaders = token ? { Authorization: 'Bearer ' + token } : {};
            if (action === 'config' || action === 'activate') {
                if (!pid) return { success: false, error: 'Tidak ada proyek aktif. Buka proyek dulu dari daftar proyek.' };
                // config = GET (baca status); activate = POST (handler activate hanya ada di onRequestPost)
                let res;
                if (action === 'activate') {
                    res = await fetch(TOOL_API_BASE + '/api/pay', { method: 'POST', headers: Object.assign({ 'Content-Type': 'application/json' }, authHeaders), body: JSON.stringify({ action: 'activate', project_id: pid }) });
                } else {
                    res = await fetch(TOOL_API_BASE + '/api/pay?action=config&project_id=' + encodeURIComponent(pid), { headers: Object.assign({}, authHeaders) });
                }
                const d = await res.json().catch(function () { return {}; });
                if (!res.ok || d.error) return { success: false, error: d.error || ('Gagal ' + action + ' ClincooPay — pastikan sudah login Clincoo.') };
                if (action === 'activate') return { success: true, active: true, account_id: d.account_id, pay_key: d.pay_key, message: 'ClincooPay aktif untuk proyek ini. Lanjut action create untuk membuat order.' };
                return { success: true, active: !!d.active, pay_key: d.pay_key || '', account_id: d.account_id || '', gateway_ready: d.gateway_ready, available: d.available, total_paid: d.total_paid, message: d.active ? 'ClincooPay sudah aktif — langsung bisa create order.' : 'ClincooPay belum aktif — panggil action activate dulu.' };
            }
            if (action === 'create') {
                const amount = Math.round(Number(a.amount) || 0);
                if (!amount || amount < 1000) return { success: false, error: 'amount wajib rupiah integer minimum 1000.' };
                let key = String(a.key || '').trim();
                if (!key) {
                    if (!pid) return { success: false, error: 'Tidak ada proyek aktif untuk mengambil pay_key.' };
                    const rc = await fetch(TOOL_API_BASE + '/api/pay?action=config&project_id=' + encodeURIComponent(pid), { headers: Object.assign({}, authHeaders) });
                    const dc = await rc.json().catch(function () { return {}; });
                    if (!rc.ok || dc.error) return { success: false, error: dc.error || 'Gagal mengambil pay_key. Pastikan login dan ClincooPay aktif (action activate).' };
                    key = dc.pay_key || '';
                }
                if (!key) return { success: false, error: 'ClincooPay belum aktif untuk proyek ini — panggil action activate dulu.' };
                const res = await fetch(TOOL_API_BASE + '/api/pay', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ action: 'create', key: key, amount: amount, description: String(a.description || 'Pembayaran') }) });
                const d = await res.json().catch(function () { return {}; });
                if (!res.ok || d.error) return { success: false, error: d.error || 'Gagal membuat order pembayaran.' };
                return { success: true, order_id: d.order_id, checkout_url: d.checkout_url, amount: d.amount, total_payment: d.total_payment, expires_at: d.expires_at, message: 'Order dibuat. checkout_url ADALAH SATU-SATUNYA link untuk user — SERTAKAN checkout_url di jawabanmu SEKARANG dan JANGAN menampilkan link bayar lain apapun (link gateway mentah/QR/internal dilarang).' };
            }
            if (action === 'status') {
                const orderId = String(a.order_id || '').trim();
                if (!orderId) return { success: false, error: 'status butuh order_id dari hasil create.' };
                let key = String(a.key || '').trim();
                if (!key && pid) {
                    const rc = await fetch(TOOL_API_BASE + '/api/pay?action=config&project_id=' + encodeURIComponent(pid), { headers: Object.assign({}, authHeaders) });
                    const dc = await rc.json().catch(function () { return {}; });
                    if (rc.ok && !dc.error) key = dc.pay_key || '';
                }
                if (!key) return { success: false, error: 'pay_key tidak tersedia — kirim parameter key dari hasil config.' };
                const res = await fetch(TOOL_API_BASE + '/api/pay?action=status&key=' + encodeURIComponent(key) + '&order_id=' + encodeURIComponent(orderId));
                const d = await res.json().catch(function () { return {}; });
                if (!res.ok || d.error) return { success: false, error: d.error || 'Gagal cek status order.' };
                return { success: true, order_id: orderId, status: d.status, amount: d.amount, message: d.status === 'paid' ? 'Order sudah dibayar.' : (d.status === 'expired' ? 'Order kedaluwarsa — buat ulang dengan create.' : 'Belum dibayar.') };
            }
            return { success: false, error: 'Action tidak dikenal: ' + action + '. Pakai: config, activate, create, status.' };
        }

            const map = { add: 'add_domain', remove: 'remove_domain', dns_status: 'dns_status', set_dns: 'set_dns', delete_dns: 'delete_dns' };

        // domain_dns: AI kelola record DNS halaman Domain Clincoo (/domain/ — backend domain-exp)
        const DOMAIN_DNS_API = 'https://clincoo-domain.pages.dev/api';
        async function toolDomainDns(args) {
            const action = String((args && args.action) || '').trim().toLowerCase();
            const domain = args && args.domain ? String(args.domain).trim().toLowerCase() : '';
            const tk = clincooAuthToken();
            if (!tk) return { success: false, error: 'Belum login Clincoo.' };
            const hdrs = { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + tk };
            const enc = encodeURIComponent;
            if (action === 'list') {
                const res = await fetch(DOMAIN_DNS_API + '/domains', { headers: hdrs });
                const d = await res.json().catch(() => ({}));
                if (!res.ok || d.error) return { success: false, error: (d && d.error) || ('Gagal mengambil daftar domain (HTTP ' + res.status + ').') };
                const doms = (d.domains || []).map(function (x) { return { name: x.name, status: x.status }; });
                return { success: true, domains: doms, message: doms.length ? ('Domain di halaman Domain: ' + doms.map(function (x) { return x.name + ' (' + x.status + ')'; }).join(', ') + '. Lanjutkan dengan action records/add/delete.') : 'Belum ada domain di halaman Domain.' };
            }
            if (['records', 'add', 'delete'].indexOf(action) !== -1 && !domain) {
                return { success: false, error: 'Parameter domain wajib untuk action ' + action + '.' };
            }
            if (action === 'records') {
                const res = await fetch(DOMAIN_DNS_API + '/domains/' + enc(domain) + '/dns', { headers: hdrs });
                const d = await res.json().catch(() => ({}));
                if (!res.ok || d.error) return { success: false, error: (d && d.error === 'not_found') ? 'Domain ' + domain + ' tidak ditemukan di halaman Domain akunmu.' : ((d && d.error) || 'Gagal mengambil record DNS.') };
                return {
                    success: true, managed: !!d.managed, zone_status: d.zone_status || '',
                    records: d.records || [], local_records: d.local_records || [],
                    message: d.message || ''
                };
            }
            if (action === 'add') {
                const type = String(args.type || '').trim().toUpperCase();
                if (['A', 'AAAA', 'CNAME', 'TXT', 'MX'].indexOf(type) === -1) return { success: false, error: 'Tipe record tidak valid: ' + (type || '(kosong)') + '. Pakai A, AAAA, CNAME, TXT, atau MX.' };
                const name = String(args.name || '').trim();
                const content = String(args.content || '').trim();
                if (!name || !content) return { success: false, error: 'Parameter name dan content wajib untuk add.' };
                const body = { type: type, name: name, content: content };
                if (args.ttl) body.ttl = args.ttl;
                if (type === 'A' || type === 'AAAA' || type === 'CNAME') body.proxied = args.proxied === true;
                if (type === 'MX') body.priority = args.priority;
                const res = await fetch(DOMAIN_DNS_API + '/domains/' + enc(domain) + '/dns', { method: 'POST', headers: hdrs, body: JSON.stringify(body) });
                const d = await res.json().catch(() => ({}));
                if (!res.ok || d.error) return { success: false, error: (d && d.error === 'not_found') ? 'Domain ' + domain + ' tidak ditemukan di halaman Domain akunmu.' : ((d && d.error) || 'Record gagal ditambahkan.') };
                return { success: true, managed: !!d.managed, record: d.record || null, message: d.message || ('Record ' + type + ' ' + name + ' -> ' + content + ' ditambahkan.') };
            }
            if (action === 'delete') {
                const rid = String(args.record_id || '').trim();
                if (!rid) return { success: false, error: 'Parameter record_id wajib untuk delete (ambil dari action records).' };
                const res = await fetch(DOMAIN_DNS_API + '/domains/' + enc(domain) + '/dns/' + enc(rid), { method: 'DELETE', headers: hdrs });
                const d = await res.json().catch(() => ({}));
                if (!res.ok || d.error) return { success: false, error: (d && d.error === 'not_found') ? 'Domain atau record tidak ditemukan.' : ((d && d.error ? d.error + (d.message ? ': ' + d.message : '') : '') || 'Record gagal dihapus.') };
                return { success: true, record_id: rid, message: 'Record ' + rid + ' pada ' + domain + ' dihapus.' };
            }
            return { success: false, error: 'Action tidak dikenal: ' + (action || '(kosong)') + '. Pakai: list, records, add, delete.' };
        }

        // ===== TOOL clone_repo: salin repo GitHub ke workspace / AI Storage =====
        function _ghRepoSlug(v) {
            var s = String(v || '').trim();
            var m = s.match(/github\.com\/([^\/\s]+)\/([^\/\s#?]+)/i);
            if (m) s = m[1] + '/' + m[2];
            s = s.replace(/\.git$/i, '');
            if (!/^[\w.-]+\/[\w.-]+$/.test(s)) return '';
            return s;
        }
        const GH_TEXT_EXT = ('js mjs cjs ts tsx jsx json html htm css scss sass less md markdown mdx txt text xml yml yaml toml ini env cfg conf sh bash zsh py rb php java kt kts swift c h cpp hpp cc cxx cs go rs sql graphql gql vue svelte svg csv properties gradle pl r lua dart gitignore dockerfile makefile lock license readme contributing changelog gitattributes npmrc nvmrc editorconfig babelrc eslintrc prettierrc').split(' ');
        const GH_BIN_EXT = ('png jpg jpeg gif webp ico bmp pdf zip gz tar rar 7z woff woff2 ttf eot otf mp3 mp4 mov avi webm wasm exe dll so dylib class jar apk bin db sqlite sqlite3 psd ai sketch xlsx xls doc docx ppt pptx ttf').split(' ');
        function _ghIsTextPath(p) {
            var base = String(p || '').split('/').pop() || '';
            var dot = base.lastIndexOf('.');
            if (dot > 0) {
                var ext = base.slice(dot + 1).toLowerCase();
                if (GH_BIN_EXT.indexOf(ext) !== -1) return false;
                if (GH_TEXT_EXT.indexOf(ext) !== -1) return true;
                return true; // ekstensi tak dikenal: coba teks (dicek byte NUL saat unduh)
            }
            var low = base.toLowerCase();
            return GH_TEXT_EXT.indexOf(low) !== -1 || /^(license|readme|changelog|contributing|dockerfile|makefile|notice|authors|code_?of_?conduct)/.test(low);
        }
        async function toolCloneRepo(args) {
            const slug = _ghRepoSlug(args && args.repo);
            if (!slug) return { success: false, error: 'Parameter repo wajib format "owner/nama" atau URL GitHub lengkap.' };
            const ref = String((args && args.ref) || '');
            let folder = String((args && args.folder) || '').replace(/^\/+|\/+$|^\.\.+\/+/g, '');
            const target = String((args && args.target) || 'workspace');
            if (!folder) folder = slug.split('/')[1];
            let token = '';
            try { token = localStorage.getItem('clincoo_gh_token') || ''; } catch (e) {}
            const ghHeaders = { 'Accept': 'application/vnd.github+json' };
            if (token) ghHeaders['Authorization'] = 'Bearer ' + token;

            // 1) info repo (default branch + validasi akses)
            let info = null;
            try {
                const r = await fetch('https://api.github.com/repos/' + slug, { headers: ghHeaders });
                if (r.status === 404) return { success: false, error: 'Repo tidak ditemukan: ' + slug + (token ? '' : ' (repo privat? Hubungkan GitHub dulu di menu Integrasi.)') };
                if (r.status === 401 || r.status === 403) return { success: false, error: 'Akses GitHub ditolak (HTTP ' + r.status + ') — hubungkan ulang GitHub di menu Integrasi, lalu coba lagi.' };
                info = await r.json();
            } catch (e) {
                return { success: false, error: 'Gagal menghubungi GitHub: ' + (e && e.message ? e.message : String(e)) };
            }
            const branch = ref || info.default_branch || 'main';

            // 2) tree rekursif: daftar file + ukuran
            let tree = null;
            try {
                const r = await fetch('https://api.github.com/repos/' + slug + '/git/trees/' + encodeURIComponent(branch) + '?recursive=1', { headers: ghHeaders });
                if (r.status === 404) return { success: false, error: 'Branch/ref "' + branch + '" tidak ditemukan di ' + slug + '.' };
                tree = await r.json();
            } catch (e) {
                return { success: false, error: 'Gagal membaca daftar file repo: ' + (e && e.message ? e.message : String(e)) };
            }
            let blobs = (tree && Array.isArray(tree.tree) ? tree.tree : []).filter(function(t) {
                return t && t.type === 'blob' && (t.size || 0) <= 262144 && String(t.path || '').length < 200 && !String(t.path || '').includes('..');
            });
            blobs = blobs.filter(function(t) { return _ghIsTextPath(t.path); });
            let truncated = false;
            if (blobs.length > 300) { blobs = blobs.slice(0, 300); truncated = true; }
            if (!blobs.length) return { success: false, error: 'Tidak ada file teks yang bisa disalin dari ' + slug + '.' };

            // 3) unduh isi file (6 paralel; skip binary via byte NUL; batas total ±4MB)
            const rawHeaders = {};
            if (token) rawHeaders['Authorization'] = 'Bearer ' + token;
            const files = [];
            let skippedBinary = 0, skippedFetch = 0, totalBytes = 0;
            const queue = blobs.slice();
            const MAX_CLONE_BYTES = 4 * 1024 * 1024;
            async function cloneWorker() {
                while (queue.length) {
                    if (totalBytes >= MAX_CLONE_BYTES) { truncated = true; return; }
                    const t = queue.shift();
                    try {
                        const res = await fetch('https://raw.githubusercontent.com/' + slug + '/' + encodeURIComponent(branch) + '/' + t.path.split('/').map(encodeURIComponent).join('/'), { headers: rawHeaders });
                        if (!res.ok) { skippedFetch++; continue; }
                        const buf = await res.arrayBuffer();
                        const bytes = new Uint8Array(buf);
                        let bad = false;
                        for (let i = 0; i < bytes.length; i += 997) { if (bytes[i] === 0) { bad = true; break; } }
                        if (bad) { skippedBinary++; continue; }
                        totalBytes += bytes.length;
                        files.push({ path: t.path, content: new TextDecoder('utf-8', { fatal: false }).decode(buf) });
                    } catch (e) { skippedFetch++; }
                }
            }
            await Promise.all([cloneWorker(), cloneWorker(), cloneWorker(), cloneWorker(), cloneWorker(), cloneWorker()]);
            if (!files.length) return { success: false, error: 'Gagal mengunduh file repo (0 berhasil). Coba lagi, atau hubungkan GitHub di menu Integrasi untuk repo privat.' };

            // 4a) target storage: simpan ke AI Storage milik akun (hemat token)
            if (target === 'storage') {
                const tk = (typeof clincooAuthToken === 'function' ? clincooAuthToken() : '');
                if (!tk) return { success: false, error: 'AI Storage memerlukan login Clincoo (gratis).' };
                let saved = 0, updated = 0;
                for (let i = 0; i < files.length; i += 60) { // save_bulk: maks 60 file/panggilan
                    const chunk = files.slice(i, i + 60).map(function(f) { return { path: folder + '/' + f.path, content: f.content }; });
                    const res = await fetch(TOOL_API_BASE + '/api/ai-storage', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + tk },
                        body: JSON.stringify({ action: 'save_bulk', files: chunk })
                    });
                    const d = await res.json().catch(function() { return {}; });
                    if (!res.ok || d.error) return { success: false, error: d.error || ('Gagal menyimpan ke AI Storage (HTTP ' + res.status + ').'), saved_so_far: saved };
                    saved += (d.saved || 0);
                    updated += (d.updated || 0);
                }
                return { success: true, repo: slug, ref: branch, target: 'storage', prefix: folder, saved: saved, updated: updated, skipped_binary: skippedBinary, skipped_fetch: skippedFetch, truncated: truncated, note: 'Hasil clone tersimpan di AI Storage prefix "' + folder + '/" — baca dengan read_storage_file, tidak memakan token history.' };
            }

            // 4b) target workspace: satu load + satu save (batch)
            const data = wsLoad();
            for (const f of files) {

                wsEnsureFolderChain(data, info.folderKey);
                if (!Array.isArray(data[info.folderKey])) data[info.folderKey] = [];
                const sizeStr = wsSizeStr(f.content);
                const idx = data[info.folderKey].findIndex(function(it) { return it && it.type === 'file' && it.name.toLowerCase() === info.name.toLowerCase(); });
                if (idx !== -1) {
                    data[info.folderKey][idx].content = f.content;

                }
            }
            const err = wsSave(data);
            if (err) return err;

        }

        // ===== TOOL clone_url: salin file situs (HTML/CSS/JS) dari sebuah URL ke workspace / AI Storage =====
        async function _cloneUrlFetchRaw(url) {
            try {
                let frTok = ''; try { frTok = localStorage.getItem('clinqoo_auth_token') || localStorage.getItem('clinqoo_token') || ''; } catch (e9) {}
                const res = await fetch(TOOL_API_BASE + '/api/fetch-raw', { method: 'POST', headers: { 'Content-Type': 'application/json', ...(frTok ? { Authorization: 'Bearer ' + frTok } : {}) }, body: JSON.stringify({ url: url }) });
                const d = await res.json().catch(function () { return {}; });
                if (!res.ok || d.error || !d.base64) return null;
                return d;
            } catch (e) { return null; }
        }
        function _cloneUrlDecode(d) {
            const bin = atob(d.base64);
            const bytes = new Uint8Array(bin.length);
            for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
            return new TextDecoder('utf-8', { fatal: false }).decode(bytes);
        }
        function _cloneUrlLocalPath(u) {
            // struktur ikut path asli situs: /static/css/main.css -> assets/static/css/main.css
            try {
                const p = new URL(u);
                if (p.protocol !== 'http:' && p.protocol !== 'https:') return '';
                const segs = p.pathname.replace(/^\/+/, '').split('/').filter(function (s) { return s && s !== '.' && s !== '..' && !/[\\:*?"<>|]/.test(s); });
                if (!segs.length) return '';
                return 'assets/' + segs.join('/');
            } catch (e) { return ''; }
        }
        function _cloneUrlAbsolutizeCss(text, cssUrl) {
            return text
                .replace(/url\(\s*(['"]?)([^'")]+)\1\s*\)/g, function (m, q, u) {
                    u = String(u).trim();
                    if (!u || /^(data:|#)/i.test(u)) return m;
                    try { return 'url("' + new URL(u, cssUrl).href + '")'; } catch (e) { return m; }
                })
                .replace(/@import\s+(['"])([^'"]+)\1/g, function (m, q, u) {
                    try { return '@import "' + new URL(u, cssUrl).href + '"'; } catch (e) { return m; }
                });
        }
        async function toolCloneUrl(args) {
            const rawUrl = String((args && args.url) || '').trim();
            if (!/^https?:\/\//i.test(rawUrl)) return { success: false, error: 'Parameter url wajib berupa URL lengkap (http/https).' };
            const target = String((args && args.target) || 'workspace');
            let folder = String((args && args.folder) || '').replace(/^\/+|\/$|^\.\.+\/+/g, '').replace(/\/+$/g, '');
            if (!folder) {
                // default: LANGSUNG KE ROOT workspace (index.html jadi halaman
                // utama situs) — tanpa subfolder pembungkus apa pun.
                // (dulu: clone resend.com bikin subfolder "resend.com/", lalu
                // pernah disalahkan lagi ke 'site/' — user minta tanpa subfolder)
                folder = '';
            }

            // 1) unduh HTML utama lewat proxy server (bypass CORS)
            const main = await _cloneUrlFetchRaw(rawUrl);
            if (!main) return { success: false, error: 'Gagal mengambil halaman ' + rawUrl + ' — situs tidak merespons atau menolak akses.' };
            const baseUrl = main.final_url || rawUrl;
            const ct = String(main.content_type || '');
            if (ct && !/text\/html|application\/xhtml|text\/plain/i.test(ct)) return { success: false, error: 'URL bukan halaman web (content-type: ' + ct.split(';')[0] + ').' };
            const html = _cloneUrlDecode(main);
            let doc = null;
            try { doc = new DOMParser().parseFromString(html, 'text/html'); } catch (e) { doc = null; }
            if (!doc || !doc.documentElement) {
                // bukan HTML yang bisa diparse: simpan mentah saja
                const filesRaw = [{ path: 'index.html', content: html }];
                return _cloneUrlSave(filesRaw, folder, target, rawUrl, 0, 0, 0, false);
            }
            // tag <base> dihapus — semua referensi sudah dinormalisasi lokal/absolut
            doc.querySelectorAll('base').forEach(function (b) { b.remove(); });

            // 2) kumpulkan asset teks (css/js) utk diunduh; gambar/font/icon di-absolutkan (tetap dari server asal)
            const toDownload = [];
            const seen = {};
            function queueAsset(u) {
                u = String(u || '').trim();
                if (!u || u.startsWith('data:')) return '';
                let abs; try { abs = new URL(u, baseUrl).href; } catch (e) { return ''; }
                if (!/^https?:/i.test(abs)) return '';
                const lp = _cloneUrlLocalPath(abs);
                if (!lp) return abs;
                if (seen[abs]) return seen[abs];
                if (toDownload.length >= 40) return abs;
                seen[abs] = lp;
                toDownload.push({ url: abs, path: lp, kind: /\.css(\?|$)/i.test(abs) ? 'css' : 'js' });
                return lp;
            }
            function absolutize(el, attr) {
                const u = el.getAttribute && el.getAttribute(attr);
                if (!u || u.startsWith('data:')) return;
                try { el.setAttribute(attr, new URL(u, baseUrl).href); } catch (e) {}
            }
            // css/js -> diunduh lokal, referensi HTML diganti ke path lokal
            doc.querySelectorAll('link[rel~="stylesheet"][href]').forEach(function (el) {
                const lp = queueAsset(el.getAttribute('href'));
                if (lp) el.setAttribute('href', lp); else absolutize(el, 'href');
            });
            doc.querySelectorAll('script[src]').forEach(function (el) {
                const lp = queueAsset(el.getAttribute('src'));
                if (lp) el.setAttribute('src', lp); else absolutize(el, 'src');
            });
            // gambar/media/icon -> absolut saja (tetap termuat dari server asal)
            doc.querySelectorAll('img[src]').forEach(function (el) { absolutize(el, 'src'); });
            doc.querySelectorAll('img[srcset]').forEach(function (el) { el.removeAttribute('srcset'); });
            doc.querySelectorAll('source[src]').forEach(function (el) { absolutize(el, 'src'); });
            doc.querySelectorAll('link[rel~="icon"][href]').forEach(function (el) { absolutize(el, 'href'); });
            doc.querySelectorAll('video[src], audio[src], embed[src], object[data]').forEach(function (el) {
                absolutize(el, el.hasAttribute('src') ? 'src' : 'data');
            });
            doc.querySelectorAll('video[poster]').forEach(function (el) { absolutize(el, 'poster'); });

            // 3) unduh asset paralel (4 worker; batas total ±2MB)
            const files = [];
            let skippedFetch = 0, truncated = false, totalBytes = 0;
            const MAX_CLONE_BYTES = 2 * 1024 * 1024;
            const queue = toDownload.slice();
            async function cloneWorker() {
                while (queue.length) {
                    if (totalBytes >= MAX_CLONE_BYTES) { truncated = true; return; }
                    const t = queue.shift();
                    const d = await _cloneUrlFetchRaw(t.url);
                    if (!d) { skippedFetch++; continue; }
                    if (d.truncated) truncated = true;
                    let text = _cloneUrlDecode(d);
                    if (t.kind === 'css') text = _cloneUrlAbsolutizeCss(text, t.url);
                    totalBytes += (d.size || 0);
                    files.push({ path: t.path, content: text });
                }
            }
            await Promise.all([cloneWorker(), cloneWorker(), cloneWorker(), cloneWorker()]);

            // 4) susun HTML final lalu simpan
            const finalHtml = '<!DOCTYPE html>\n' + doc.documentElement.outerHTML + '\n';
            files.unshift({ path: 'index.html', content: finalHtml });
            return _cloneUrlSave(files, folder, target, rawUrl, toDownload.length, skippedFetch, files.length - 1, truncated);
        }
        async function _cloneUrlSave(files, folder, target, rawUrl, assetsFound, skippedFetch, savedCount, truncated) {
            if (target === 'storage') {
                const tk = (typeof clincooAuthToken === 'function' ? clincooAuthToken() : '');
                if (!tk) return { success: false, error: 'AI Storage memerlukan login Clincoo (gratis).' };
                let saved = 0, updated = 0;
                for (let i = 0; i < files.length; i += 60) {
                    const chunk = files.slice(i, i + 60).map(function (f) { return { path: (folder ? folder + '/' : '') + f.path, content: f.content }; });
                    const res = await fetch(TOOL_API_BASE + '/api/ai-storage', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + tk },
                        body: JSON.stringify({ action: 'save_bulk', files: chunk })
                    });
                    const d = await res.json().catch(function () { return {}; });
                    if (!res.ok || d.error) return { success: false, error: d.error || ('Gagal menyimpan ke AI Storage (HTTP ' + res.status + ').'), saved_so_far: saved };
                    saved += (d.saved || 0);
                    updated += (d.updated || 0);
                }
                return { success: true, url: rawUrl, target: 'storage', prefix: folder, saved: saved, updated: updated, skipped_fetch: skippedFetch, truncated: truncated, note: 'Hasil clone tersimpan di AI Storage prefix "' + folder + '/" — baca dengan read_storage_file.' };
            }
            const data = wsLoad();
            for (const f of files) {
                const fullPath = folder ? (folder + '/' + f.path) : f.path;
                const info = wsParentInfo(fullPath);
                if (!info || info.name.includes('/')) { skippedFetch++; continue; }
                wsEnsureFolderChain(data, info.folderKey);
                if (!Array.isArray(data[info.folderKey])) data[info.folderKey] = [];
                const sizeStr = wsSizeStr(f.content);
                const idx = data[info.folderKey].findIndex(function (it) { return it && it.type === 'file' && it.name.toLowerCase() === info.name.toLowerCase(); });
                if (idx !== -1) {
                    data[info.folderKey][idx].content = f.content;
                    data[info.folderKey][idx].size = sizeStr;
                } else {
                    data[info.folderKey].push({ type: 'file', name: info.name, size: sizeStr, path: info.itemPath, content: f.content });
                }
            }
            const err = wsSave(data);
            if (err) return err;
            return { success: true, url: rawUrl, target: 'workspace', folder: folder, files: files.length, assets_found: assetsFound, skipped_fetch: skippedFetch, truncated: truncated, note: (folder ? 'Situs tersimpan di folder workspace "' + folder + '/" (index.html + ' + savedCount + ' asset)' : 'Situs tersimpan langsung di ROOT workspace: index.html + ' + savedCount + ' asset di assets/') + ' — bisa langsung diedit atau di-deploy. Gambar/font tetap dimuat dari server asal.' };
        }

        // ===== TOOL push_to_github: kirim semua file workspace ke repo GitHub =====
        async function toolPushToGithub(args) {
            const slug = _ghRepoSlug(args && args.repo);
            if (!slug) return { success: false, error: 'Parameter repo wajib format "owner/nama" atau URL GitHub lengkap.' };
            const branch = String((args && args.branch) || 'main');
            const message = String((args && args.commit_message) || 'Update dari Clincoo workspace');
            let token = '';
            try { token = localStorage.getItem('clincoo_gh_token') || ''; } catch (e) {}
            if (!token) return { success: false, error: 'GitHub belum terhubung. Buka menu Integrasi, hubungkan GitHub, lalu coba lagi.' };

            const files = wsFlatten(wsLoad()).filter(function(f) { return f && f.path && !String(f.path).endsWith('/'); });
            if (!files.length) return { success: false, error: 'Workspace proyek aktif kosong — tidak ada file untuk di-push.' };
            if (files.length > 60) return { success: false, error: 'Workspace berisi ' + files.length + ' file (batas sekali push: 60). Kurangi file dulu atau minta push bertahap per folder.' };

            const results = [];
            for (const f of files) {
                const ghPath = '/' + String(f.path).split('/').map(encodeURIComponent).join('/');
                try {
                    const content = btoa(unescape(encodeURIComponent(f.content || '')));
                    let body = { message: message + ' — ' + f.path, content: content, branch: branch };
                    const g = await toolGithubRequest({ path: '/repos' + ghPath + '?ref=' + encodeURIComponent(branch), method: 'GET' });
                    if (g && g.success && g.result && g.result.sha) body.sha = g.result.sha;
                    const p = await toolGithubRequest({ path: '/repos' + ghPath, method: 'PUT', body: body });
                    if (p && p.success) results.push({ path: f.path, ok: true, action: body.sha ? 'updated' : 'created' });
                    else results.push({ path: f.path, ok: false, error: (p && p.error) || 'gagal' });
                } catch (e) {
                    results.push({ path: f.path, ok: false, error: e && e.message ? e.message : String(e) });
                }
            }
            const ok = results.filter(function(r) { return r.ok; }).length;
            return { success: ok > 0, repo: slug, branch: branch, pushed: ok, failed: results.length - ok, files: results.slice(0, 20) };
        }

        // membengkak TANPA BATAS dalam SATU generasi (sampai 20 hop/giliran via
        // MAX_TOOL_HOPS). write_files mengirim ARGS (isi file lengkap, bisa puluhan
        // KB per file) sebagai bagian 'function_call' ke riwayat, dan hasil tool
        // dikirim balik APA ADANYA (tanpa potongan) sebagai 'function_response' --
        // truncation 4000 char yang sudah ada SEBELUMNYA hanya memotong tampilan
        // kartu UI, BUKAN payload yang benar-benar dikirim ke provider AI. Proyek
        // web multi-file + beberapa kali "lanjut" bikin riwayat percakapan dalam
        // satu giliran membengkak ratusan KB sampai MB -> request ke SEMUA provider
        // (termasuk seluruh bank fallback, yang menerima persis payload sama besar)
        // gagal bersamaan -> "Lagi ada gangguan koneksi sebentar." Ini cocok dengan
        // keluhan: gagal justru spesifik saat membangun web (banyak file, "lanjut"
        // berkali-kali), bukan outage acak.
        // FIX: pangkas string panjang di dalam args/result SEBELUM dikirim ke
        // provider -- AI tidak perlu melihat ulang isi file yang baru saja ia tulis
        // sendiri (ia sudah tahu isinya); ia cuma perlu tahu status sukses/gagal
        // untuk melanjutkan. Eksekusi tool TETAP memakai args asli yang lengkap --
        // ini hanya memangkas COPY yang dikirim balik ke riwayat percakapan model.
        function slimForModelHistory(value, limit) {
            limit = limit || 1500;
            function walk(v) {
                if (typeof v === 'string') {
                    return v.length > limit
                        ? (v.slice(0, limit) + ' ... (dipotong, total ' + v.length + ' karakter -- AI sudah menulis/membaca ini sendiri, tidak perlu diulang penuh)')
                        : v;
                }
                if (Array.isArray(v)) return v.map(walk);
                if (v && typeof v === 'object') {
                    const out = {};
                    for (const k of Object.keys(v)) out[k] = walk(v[k]);
                    return out;
                }
                return v;
            }
            try { return walk(value); } catch (e) { return value; }
        }

        const SILENT_NUDGES = [
            'Lanjutkan tugas dari titik terhenti sampai benar-benar selesai. Jangan ulangi bagian yang sudah selesai dan jangan bertanya apa pun — langsung kerjakan sisa tugasnya sekarang.',
            'Teruskan pengerjaan sampai seluruh tugas tuntas dan hasil akhir lengkap. Langsung kerjakan tanpa konfirmasi; bagian yang sudah beres tidak perlu diulang.',
            'Selesaikan sisa pekerjaan sekarang hingga tuntas dan terverifikasi. Jangan berhenti sebelum semuanya selesai, jangan bertanya, langsung kerjakan.',
            'Mohon lanjutkan dan tamatkan seluruh sisa tugasnya. Kerjakan berurutan sampai hasil akhir benar-benar lengkap tanpa menunggu instruksi lain.',
            'Lanjutkan bekerja dari progres terakhir sampai selesai total. Tanpa merangkum ulang, tanpa bertanya, langsung selesaikan bagian yang belum selesai.'
        ];
        function pushSilentNudge(extra) {
            const base = SILENT_NUDGES[Math.floor(Math.random() * SILENT_NUDGES.length)];
            messages.push({
                id: generateId(), role: 'user',
                text: base + (extra ? ' ' + extra : ''),
                silent: true, time: Date.now()
            });
            try { saveChatLog(); } catch (e) {}
        }
        // Deteksi jawaban final yang terindikasi BELUM tuntas (hanya tugas kerja nyata)
        function finalLooksUnfinished(text, aiMsgObj) {
            const t = String(text || '').trim();
            if (!t) return false;
            const hasWork = (aiMsgObj && aiMsgObj.toolCalls && aiMsgObj.toolCalls.length > 0) ||
                messages.some(function (m) { return m.role === 'user' && !m.silent && /buat(kan)?\b|bikin|deploy|perbaiki|tambah(kan)?|ubah|rancang|kembangkan|lanjut/i.test(m.text || ''); });
            if (!hasWork) return false;
            const tail = t.slice(-260);
            // Markers DIPERKETAT (user komplain AI kebanyakan auto-lanjut sendiri jadi
            // bubble jawaban baru): sinyal lemah seperti "sebentar ya" / "tunggu dulu"
            // dihapus karena sering muncul di jawaban santai yang SUDAH tuntas, bukan
            // tanda tugas terpotong — hanya sinyal KUAT niat melanjutkan tugas nyata.
            const markers = [
                /lanjut(kan)?\s*(di|ke|bagian|tahap|langkah|pesan)\b/i,
                /(akan|bisa|mau|biar)\s+(saya\s+)?(melanjutkan|lanjutkan|teruskan)/i,
                /bersambung/i,
                /to\s*be\s*continued/i
            ];
            if (markers.some(function (rx) { return rx.test(tail); })) return true;
            if (/(^|\n)\s*(berikutnya|selanjutnya|tahap|langkah|step)\s*[:：]/i.test(tail) && aiMsgObj && aiMsgObj.toolCalls && aiMsgObj.toolCalls.length) return true;
            // Teks menggantung diakhiri ':' = AI mengumumkan niat/aksi lalu terputus —
            // sekarang WAJIB ada tool call di giliran ini (tugas kerja nyata yang
            // benar-benar sedang berjalan), supaya kalimat santai yang kebetulan
            // diakhiri ':' tidak memicu bubble lanjutan baru secara keliru.
            if (/[:：]\s*$/.test(t) && aiMsgObj && aiMsgObj.toolCalls && aiMsgObj.toolCalls.length) return true;
            // KASUS NYATA (dilaporkan user, screenshot): user minta DIBUATKAN WEBSITE/
            // LANDING PAGE penuh, AI cuma generate_image (logo+foto produk) lalu nulis
            // teks "Sekarang saya buat landing page-nya." TANPA sempat memanggil
            // write_file sama sekali di giliran yang sama — lalu sesi ditutup "selesai"
            // padahal webnya belum ada. Frasa niat ("sekarang saya buat...") terlalu
            // beragam untuk ditangkap satu regex kaku, jadi deteksi lewat FAKTA kerja:
            // kalau user jelas minta web/halaman/situs lengkap TAPI seluruh tool_calls
            // di giliran ini cuma tool PERSIAPAN (generate_image/list_items/read_file/
            // search_items — cek folder, lihat gambar, dsb) TANPA write_file/deploy_project
            // sama sekali — tugas pasti belum tuntas, apa pun bunyi kalimat penutupnya.
            // GENERALISASI (laporan user ke-2, screenshot): kasus pertama AI cuma
            // generate_image lalu bilang "sekarang saya buat..." dan ditutup; sekarang
            // bahkan setelah user klik "Lanjut", AI cuma list_items ("Viewing folder:
            // root/images") TANPA generate_image ataupun write_file, lalu bilang
            // "sekarang saya bangun landing page lengkapnya" dan ditutup LAGI. Deteksi
            // generate_image-only tidak cukup — sekarang cek: tool_calls giliran ini ADA
            // tapi SEMUANYA tool persiapan (bukan write_file/deploy_project).
            const toolNamesSoFar = (aiMsgObj && aiMsgObj.toolCalls || []).map(function (tc) { return tc.name; });
            const PREP_ONLY_TOOLS = ['generate_image', 'list_items', 'read_file', 'read_files', 'search_items'];
            const prepOnlySoFar = toolNamesSoFar.length > 0 && toolNamesSoFar.every(function (n) { return PREP_ONLY_TOOLS.indexOf(n) !== -1; });
            if (prepOnlySoFar) {
                // PENTING: jangan cuma cek pesan user TERAKHIR — kalau user cuma balas
                // "Lanjut" (seperti di laporan ke-2), permintaan "landing page kedai
                // burger" aslinya ada di pesan SEBELUMNYA. Scan semua pesan user non-silent
                // di percakapan ini (sama seperti variabel hasWork di atas), bukan cuma yang
                // paling akhir, supaya giliran "Lanjut" tetap kena deteksi.
                const wantsFullSite = messages.some(function (m) {
                    return m.role === 'user' && !m.silent && /landing\s*page|halaman\s*web|website|situs|webnya|aplikasi\s*web|web\s*app|toko\s*online|e-?commerce/i.test(m.text || '');
                });
                if (wantsFullSite) return true;
            }
            return false;
        }
        // Tutup bubble AI "sebagian selesai" lalu mulai ronde lanjutan secara diam-diam
        async function continueSilently(aiMsgObj, bubbleText, nudgeExtra) {
            const idx = messages.findIndex(function (m) { return m.id === aiMsgObj.id; });
            if (idx !== -1) {
                if (bubbleText) messages[idx].text = bubbleText;
                messages[idx].isProcessing = false;
                messages[idx].isTyping = false;
                messages[idx].isError = false;
                messages[idx].midPhase = true;
                messages[idx].completed = true;
            }
            pushSilentNudge(nudgeExtra);
            try { renderMessages(); } catch (e) {}
            try { await fetchAIResponse(); } catch (e2) {}
        }

        async function fetchAIResponse() {
            toggleActionState(true);
            // JANGAN reset autoScrollActive di sini: kalau pesan user barusan di-pin
            // ke atas (pinMessageToTop), force-true membuat scrollToBottom(false) di
            // bawah menarik view balik ke dasar — pesan lama kelihatan lagi ("belum
            // tertutup"). Pin dipertahankan; auto-follow jalan lagi saat user scroll
            // manual atau input difokuskan ulang.
            
            const lastUserMsgObj = [...messages].reverse().find(m => m.role === 'user');
            const lastUserMsg = lastUserMsgObj?.text || "";
            const hasAttachment = lastUserMsgObj?.attachments && lastUserMsgObj.attachments.length > 0;
            
            const urlRegex = /(https?:\/\/[^\s]+)|(\b[a-zA-Z0-9-]+\.(com|id|net|dev|org|ai|io|co|tech|edu|gov)(?:\/[^\s]*)?\b)/gi;
            let extractedUrls = lastUserMsg.match(urlRegex);
            let hasUrl = false;
            
            if (extractedUrls && extractedUrls.length > 0) {
                hasUrl = true;
                if (!extractedUrls[0].startsWith('http')) {
                    extractedUrls[0] = 'https://' + extractedUrls[0];
                }
            }
            
            const isTimeQuery = !hasUrl && checkIsTimeQuery(lastUserMsg);
            const requiresSearch = !hasUrl && !isTimeQuery && checkRequiresSearch(lastUserMsg);
            const requiresImage = !hasUrl && !hasAttachment && checkRequiresImageGeneration(lastUserMsg);

            let processType = 'think';
            if (hasUrl) processType = 'read';
            else if (requiresImage) processType = 'image';
            else if (requiresSearch) processType = 'search';
            else if (hasAttachment) processType = 'file';

            // let (bukan const): saat fase bertahap, aiMsgObj diganti ke pesan progres baru
            let aiMsgObj = { 
                id: generateId(), 
                role: 'ai', 
                text: '', 
                isProcessing: true,
                isTyping: false,
                processType: processType,
                toolCalls: []
            };
            messages.push(aiMsgObj);
            renderMessages();
            // Tidak lagi force-scroll ke bawah di sini: kalau pesan user baru saja
            // di-pin ke atas (pinMessageToTop), indikator "mengetik" ini muncul tepat
            // di bawahnya secara alami — memaksa scroll ke bawah akan membatalkan pin itu.
            // scrollToBottom(false) tetap menghormati autoScrollActive (mis. saat user scroll manual).
            scrollToBottom(false);
            
            currentAiMessageId = aiMsgObj.id;
            abortController = new AbortController();

            // Status progres REAL-TIME: mulai dari "Thinking...", lalu diperbarui
            // langsung dari aksi AI yang sedang berjalan (stream NDJSON dari server
            // + tool call AI) — bukan daftar teks hardcoded yang berputar sendiri.
            let statusInterval = null;
            currentStatusInterval = null;
            const setAiStatus = (text) => {
                if (!text) return;
                aiMsgObj.statusText = text;
                const statusEl = document.getElementById(`status-text-${aiMsgObj.id}`);
                if (statusEl) {
                    statusEl.classList.add('opacity-0');
                    setTimeout(() => {
                        statusEl.innerText = text;
                        statusEl.classList.remove('opacity-0');
                    }, 200);
                }
            };

            let streamingBuffer = "";
            let deltaStreamed = "";
            let isFetchComplete = false;
            let charIndex = 0;
            let hasReceivedData = false;

            // Watchdog 120s tanpa data -> retry. FIX BACKGROUNDING: dulu timer ini tetap
            // dihitung saat halaman di-background (timer dibekukan OS lalu menumpuk & meledak
            // begitu user balik) sehingga begitu dibuka lagi watchdog LANGSUNG menembak:
            // stopGeneration + restart dari nol padahal request asli masih hidup / hanya
            // perlu reconnect. Sekarang: saat halaman tersembunyi, cek dijadwalkan ulang
            // (timer beku saat background, jadi efektif "pause"); watchdog hanya boleh
            // menembak saat halaman BENAR-BENAR terlihat oleh user.
            const apiTimeoutTick = () => {
                if (hasReceivedData) return;
                if (document.visibilityState === 'hidden') {
                    setTimeout(apiTimeoutTick, 15000); // pause: tunggu halaman terlihat lagi
                    return;
                }
                if (!aiMsgObj._retried) {
                    aiMsgObj._retried = true;
                    stopGeneration();
                    setTimeout(() => retryGeneration(aiMsgObj.id), 500);
                } else {
                    const index = messages.findIndex(m => m.id === aiMsgObj.id);
                    if (index !== -1) {
                        messages[index].text = `Sedang memuat... <span onclick="retryGeneration('${aiMsgObj.id}')" class="cursor-pointer underline font-medium" style="text-underline-offset: 3px;">ketuk untuk melanjutkan</span>`;
                        messages[index].isError = true;
                    }
                    stopGeneration();
                }
            };
            const apiTimeout = setTimeout(apiTimeoutTick, 120000); 

            if (requiresImage) {
                try {
                    clearTimeout(apiTimeout); 
                    const promptStr = lastUserMsg.replace(/buatkan gambar|bikin gambar|buat gambar|generate image|tolong gambar|lukiskan/gi, '').trim();
                    const finalPrompt = promptStr || lastUserMsg;
                    const safePrompt = encodeURIComponent(finalPrompt);
                    const seed = Math.floor(Math.random() * 1000000);
                    const imageUrl = `https://image.pollinations.ai/prompt/${safePrompt}?seed=${seed}&nologo=true`;
                    
                    // FIX: dulu ada delay artifisial 3500ms di sini sebelum blok gambar
                    // (skeleton + <img>) dirender — padahal prompt & URL sudah pasti sejak baris
                    // di atas, jadi delay itu cuma bikin gambar "telat tampil" tanpa alasan
                    // teknis. Sekarang blok gambar langsung dirender saat ini juga; skeleton
                    // loading yang sudah ada di renderImageGenBlock() tetap menutupi waktu
                    // generate asli dari image.pollinations.ai (biasanya beberapa detik).
                    imageGenerationTimeout = setTimeout(() => {
                        const msgIndex = messages.findIndex(m => m.id === aiMsgObj.id);
                        if (msgIndex !== -1) {
                            messages[msgIndex].text = renderImageGenBlock(aiMsgObj.id, imageUrl, finalPrompt);
                            messages[msgIndex].isProcessing = false;
                            messages[msgIndex].isTyping = false;
                            messages[msgIndex].isImageResponse = true;
                            messages[msgIndex].imageUrl = imageUrl;
                        }
                        stopGeneration();
                    }, 120);
                    return; 
                } catch (e) {
                    clearTimeout(apiTimeout);
                    if (e.name !== 'AbortError') {
                        streamingBuffer = "Terjadi kesalahan sistem saat memproses permintaan gambar Anda.";
                        isFetchComplete = true;
                        const msgIndex = messages.findIndex(m => m.id === aiMsgObj.id);
                        if (msgIndex !== -1) messages[msgIndex].isError = true;
                    }
                }
            } 
            else {
                let externalContext = "";
                const JINA_PROXY_URL = 'https://clincoo-be2.pages.dev/api/jina';
                
                if (hasUrl) {
                    try {
                        const targetUrl = extractedUrls[0];
                        const res = await fetch(JINA_PROXY_URL, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ mode: 'read', query: targetUrl }),
                            signal: abortController.signal
                        });
                        if (res.ok) {
                            const resJson = await res.json();
                            const markdown = resJson.text || '';
                            externalContext = `[DATA REAL-TIME DARI WEB]:\nSumber URL: ${targetUrl}\nIsi Konten URL:\n\n${markdown.substring(0, 15000)}\n\n[PENTING]: Gunakan informasi di atas untuk merespons karena ini adalah data dari situs terbaru yang diminta pengguna.`;
                            
                            const msgIndex = messages.findIndex(m => m.id === aiMsgObj.id);
                            if (msgIndex !== -1) {
                                try {
                                    const u = new URL(targetUrl);
                                    const domain = u.hostname.replace(/^www\./, '');
                                    messages[msgIndex].sources = [{
                                        url: targetUrl,
                                        domain: domain,
                                        favicon: `https://www.google.com/s2/favicons?domain=${domain}&sz=32`
                                    }];
                                } catch(e) {}
                            }
                        }
                    } catch (e) {}
                } 
                else if (requiresSearch) {
                    try {
                        const res = await fetch(JINA_PROXY_URL, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ mode: 'search', query: lastUserMsg }),
                            signal: abortController.signal
                        });
                        
                        if (res.ok) {
                            const resJson = await res.json();
                            const json = resJson.data || {};
                            if (json.data && json.data.length > 0) {
                                let markdownContent = '';
                                const sources = [];
                                const seenDomains = new Set();

                                json.data.forEach(item => {
                                    if(item.title && item.content) {
                                        markdownContent += `### ${item.title}\nURL: ${item.url}\n\n${item.content}\n\n`;
                                    }
                                    try {
                                        if (item.url) {
                                            const u = new URL(item.url);
                                            const domain = u.hostname.replace(/^www\./, '');
                                            if (!seenDomains.has(domain)) {
                                                seenDomains.add(domain);
                                                sources.push({
                                                    url: item.url,
                                                    domain: domain,
                                                    favicon: `https://www.google.com/s2/favicons?domain=${domain}&sz=32`
                                                });
                                            }
                                        }
                                    } catch(e) {}
                                });

                                if (markdownContent.length > 50) {
                                    externalContext = `[HASIL PENCARIAN WEB REAL-TIME TERBARU]:\n\n${markdownContent.substring(0, 15000)}\n\n[INSTRUKSI WAJIB]: Kamu WAJIB menyusun jawaban berdasarkan hasil pencarian real-time di atas. Jangan menebak jawaban jika data sudah tersedia.`;
                                    
                                    const msgIndex = messages.findIndex(m => m.id === aiMsgObj.id);
                                    if (msgIndex !== -1) {
                                        messages[msgIndex].sources = sources;
                                    }
                                }
                            }
                        }
                    } catch (e) {}
                }
                
                // Status konektor GitHub tidak boleh ditebak dari badge/localStorage saja.
                // Untuk pesan yang benar-benar menyinggung akses GitHub user, cek /user secara
                // nyata sebelum bertanya ke AI. Token TIDAK ikut ke prompt; hanya hasil verifikasi.
                let githubConnectionContext = '';
                const needsGitHubCheck = /\bgithub\b/i.test(lastUserMsg) &&
                    /(akses|access|terhubung|connect|koneksi|cek|check|tes|test|repo|repository|repositori|profil|akun|bisa|can|lihat|list|baca|kelola|commit|push)/i.test(lastUserMsg);
                if (needsGitHubCheck) {
                    setAiStatus('Checking GitHub connection…');
                    try {
                        const ghCheck = await toolGithubRequest({ method: 'GET', path: '/user' });
                        if (ghCheck && ghCheck.success && ghCheck.result && ghCheck.result.login) {
                            const gh = ghCheck.result;
                            githubConnectionContext = `\n\n[STATUS KONEKTOR GITHUB TERVERIFIKASI LANGSUNG]: BERHASIL. GitHub API menerima token konektor saat ini. Akun: ${String(gh.login).slice(0,100)}${gh.name ? ` (${String(gh.name).slice(0,100)})` : ''}; public_repos: ${Number(gh.public_repos || 0)}. Jika user hanya bertanya apakah GitHub-nya bisa diakses, jawab YA berdasarkan verifikasi ini dan sebut akun tersebut. Jika user meminta aksi/data repo, lanjutkan dengan github_request yang sesuai.`;
                        } else {
                            const ghError = ghCheck && ghCheck.error ? String(ghCheck.error) : 'Koneksi GitHub gagal diverifikasi.';
                            githubConnectionContext = `\n\n[STATUS KONEKTOR GITHUB TERVERIFIKASI LANGSUNG]: GAGAL. Alasan asli: ${ghError.slice(0,500)}. Sampaikan alasan ini apa adanya; jangan mengarang alasan sinkronisasi/sesi.`;
                        }
                    } catch (e) {
                        githubConnectionContext = `\n\n[STATUS KONEKTOR GITHUB TERVERIFIKASI LANGSUNG]: GAGAL. Alasan asli: ${String(e && e.message ? e.message : e).slice(0,500)}. Jangan mengarang alasan lain.`;
                    }
                }

                const now = new Date();
                const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric', hour: '2-digit', minute: '2-digit', timeZoneName: 'short' };
                const formattedDate = now.toLocaleDateString('id-ID', options);
                const timeContext = `\n\n[INFO SISTEM (REAL-TIME)]: Saat ini adalah ${formattedDate}. Jika user meminta data hari ini atau yang terbaru, WAJIB utamakan Konteks Pencarian Web yang disuntikkan ke prompt ini agar jawaban akurat sesuai kondisi masa kini.`;
                
                const systemInstructions = 'Saya adalah AI Agent yang dikembangkan oleh Clincoo. JIWA SUPERAGENT (inti kepribadianmu, WAJIB tercermin di setiap jawaban dan setiap kerjamu): kamu BUKAN chatbot pasif yang menunggu perintah — kamu agen penuh inisiatif yang bertanggung jawab penuh atas hasil kerja user, layaknya rekan kerja yang punya rasa memiliki. Begitu tugas diterima, kamu menuntaskannya sampai selesai — jangan pernah menyerahkan sisa pekerjaan balik ke user. Detail kecil kamu putuskan sendiri tanpa bertanya berlebihan; pilihan ambigu kamu pilih yang terbaik dan sebut alasannya sekilas, jangan lempar pilihan mentah ke user; kalau ada error kamu mendiagnosis dan memperbaikinya, bukan mengulang mentah atau menyerah; dan kamu selalu menutup pekerjaan dengan laporan hasil nyata: apa yang berubah, di mana, dan statusnya. Kamu jujur soal keberhasilan maupun kegagalan, antusias tanpa bertele-tele, dan proaktif: selesaikan sekali jalan, jangan minta disuruh dua kali. Jawablah menggunakan bahasa Indonesia yang natural dan mudah dipahami, kecuali diminta lain. WAJIB SATU BAHASA: seluruh jawaban dalam Bahasa Indonesia saja — DILARANG KERAS mencampur bahasa lain (Inggris, Korea, Mandarin, dsb.) dalam satu jawaban; istilah teknis dan nama produk boleh tetap. DILARANG menampilkan raw JSON, log internal, atau timestamp debug mentah — saring dan rangkum jadi kalimat rapi kecuali user minta datanya mentah-mentah. DILARANG mengumumkan niat menjalankan aksi/tool (mis. "Oke, saya jalankan perintahnya:") lalu berhenti menggantung — jika kamu menyatakan akan melakukan sesuatu, WAJIB langsung diikuti pemanggilan tool-nya pada giliran yang sama; jangan pernah menutup giliran dengan janji aksi yang belum dikerjakan. IDENTITAS RAHASIA (WAJIB): kamu adalah AI Agent yang dikembangkan oleh Clincoo, itu identitasmu satu-satunya. DILARANG KERAS menyebut atau membocorkan nama model/provider di balik layarmu (GPT, OpenAI, GLM, Z.ai, Gemini, Google, Clouvia, OpenRouter, Nemotron, Cla t sebagai SUMBER UTAMA dalam menjawab agar akurat dan up-to-date. Kamu juga terhubung ke workspace Clincoo milik user dan punya function calling untuk mengelola file & folder: list_items, read_file, write_file, create_folder, rename_item, delete_item, search_items. Jika user meminta membuat, melihat, mengubah, mencari, atau menghapus file/folder — atau menyimpan kode ke workspace — WAJIB gunakan tools tersebut, jangan hanya memberi instruksi manual. Kamu juga bisa mengelola DATABASE proyek aktif lewat tools db_*: db_list_tables, db_create_table, db_drop_table, db_add_row, db_list_rows, db_update_row, db_delete_row. Jika user meminta membuat tabel, menyimpan, melihat, mengubah, atau menghapus data database — WAJIB pakai tools db_* (tabelnya sama dengan halaman Database Clincoo), jangan suruh user kerjakan manual.\n\nHEMAT TOOL (WAJIB): tools BUKAN untuk semua pertanyaan. Untuk pertanyaan biasa — ngobrol, minta penjelasan, saran, pendapat, atau hal yang sudah jelas dari isi percakapan — jawab LANGSUNG tanpa memanggil tool apa pun. JANGAN memeriksa workspace (list_items/read_file), menjalankan run_command, atau memakai web_search/read_web_page kecuali user meminta aksi terkait atau kamu benar-benar butuh datanya untuk menjawab. Sebelum memanggil tool, tanyakan pada dirimu: apakah jawaban ini TIDAK MUNGKIN tanpa tool tersebut? Kalau masih mungkin dijawab tanpa tool, jangan panggil. KHUSUS pertanyaan kapabilitas/status ("apakah kamu bisa akses GitHub/Cloudflare?", "kamu terhubung ke apa?", "apa aja yang bisa kamu bantu?", dsb.) JAWAB LANGSUNG dengan teks — jelaskan KEMAMPUAN NYATAMU sebagai Superagent Clincoo: membuat & mengedit file/folder proyek, deploy situs ke internet, domain kustom + setel DNS otomatis, backend functions (API milik user sendiri), tugas terjadwal/otomatisasi, AI storage, terminal Linux persisten, web search & baca halaman, screenshot. JANGAN menjawab dengan daftar kemampuan generik semacam "menulis artikel, translate, bantu coding" saja — itu mengecilkan kemampuanmu. Sebutkan cara menghubungkan integrasi (mis. buka menu Integrasi) bila relevan; JANGAN memanggil github_request/cloudflare_request/tool aksi lain hanya untuk MENGUJI atau MENJAWAB pertanyaan semacam itu — tool aksi hanya dipanggil saat user benar-benar minta dilakukan aksinya (baca/kelola repo, dsb.). PERMINTAAN seperti "coba akses GitHub saya", "cek koneksi GitHub saya", "tes GitHub saya", atau pertanyaan setelah user bilang sudah reconnect ADALAH permintaan verifikasi nyata: WAJIB gunakan hasil [STATUS KONEKTOR GITHUB TERVERIFIKASI LANGSUNG], bukan menjawab secara abstrak atau mengulang suruh connect.\n\nANTI WASTE (WAJIB, PELANGGARAN SERIUS): JANGAN list_items/list folder root atau memeriksa workspace di awal permintaan — kerjakan langsung dari konteks percakapan yang sudah ada. list_items/read_file HANYA bila kamu benar-benar belum tahu file/struktur yang mau kamu ubah DAN itu relevan dengan permintaan user. SAAT MELANJUTKAN TUGAS (user bilang "lanjut", "lanjutkan", "teruskan", atau menjawab polling): LANGSUNG kerjakan sisa tugas dari titik berhenti — DILARANG KERAS list_items/list root/membuka workspace/cek apapun yang sudah jelas dari percakapan, dan jangan membaca ulang file yang sudah selesai ditulis; progres dan rencana sudah ada di percakapan. Setiap pemeriksaan workspace yang tidak pernah diminta = token terbuang + pekerjaan tertunda. TOOLS (dipakai sesuai kebutuhan, bukan otomatis): search_clincoo_kb (cari informasi RESMI tentang Clincoo — founder, visi, fitur, editor, AI, template, deploy, saldo, kebijakan, tips — di basis pengetahuan internal yang diindeks dari blog resmi blog.clincoo.buzz; WAJIB dipanggil untuk setiap pertanyaan tentang Clincoo sebagai produk/perusahaan, dan hasilnya adalah sumber kebenaran resmi — jangan mengarang), run_command (jalankan perintah di TERMINAL LINUX persisten milik user — sesi bertahan ±10 menit antar-command, file & tool yang di-install (apt-get/pip/npm, mis. nmap, curl, jq) tetap ada sampai sesi habis; bisa fetch API eksternal pakai header/secret yang user berikan; sandbox terisolasi dan tidak melihat file workspace atau secret platform, tempel isi file yang dibutuhkan langsung di kode; reset:true untuk mulai sesi Linux baru), read_web_page (baca isi URL jadi markdown, saat user memberi link atau jawaban butuh isi halaman itu), web_search (cari info terbaru/real-time di web, saat pertanyaan butuh data terkini), take_screenshot (ambil screenshot statis sebuah URL dan kembalikan link gambarnya — PAKAI INI setiap kali user minta lihat tampilan/preview/screenshot sebuah situs, jangan cuma menjelaskan dengan teks kalau kamu bisa langsung menunjukkan gambarnya), generate_image (BUAT GAMBAR AI PNG asli ke workspace — logo, ilustrasi, hero; pakai saat user minta dibuatkan gambar atau logo; set_as_logo:true langsung memasang sebagai logo & favicon Pengaturan Umum; untuk memasang gambar workspace yang sudah ada jadi logo, pakai set_project_info dengan app_logo berisi nama file), rename_project (ganti nama proyek aktif saat diminta), deploy_project (publish situs proyek aktif ke internet saat user ingin situsnya online — JANGAN menyuruh user klik tombol deploy manual kalau kamu bisa melakukannya sendiri; hasil tool berisi field url/public_domain yang SUDAH mengutamakan domain kustom bila ada — WAJIB sebutkan URL ITU PERSIS ke user, DILARANG KERAS menyebut/menebak/menulis sendiri alamat *.pages.dev dalam jawaban (bahkan sebagai "link awal/preview sementara") — field pages_url HANYA data internal, tidak pernah untuk ditampilkan; kalau situs belum pernah di-deploy, JANGAN mengarang/menebak URL apa pun, panggil deploy_project dulu atau katakan belum online), add_env_var (tambah/ubah env var proyek saat diminta), list_env_vars (lihat env var proyek saat diminta), test_secret (uji status & validitas secret/API key user — cloudflare, resend, github, openai, openrouter — WAJIB langsung diuji dengan tool ini saat user memberi secret dan minta dicek; jika nilai secret ternyata teks placeholder/redaksi (mis. teks "Secret detected and saved as $VAR — manage or disable it any time in your Security settings." atau "$VAR" saja), itu BUKAN nilai asli — DILARANG mengujinya lewat tool mana pun dan DILARANG menyimpulkan token invalid; minta user menempel ulang nilai aslinya; DILARANG menyimpan secret ke mana pun termasuk add_env_var kecuali user JELAS memintanya; jangan tampilkan nilai secret mentah di jawaban), cloudflare_request (akses Cloudflare API memakai API token user untuk operasi yang diizinkan token itu — D1, Pages, DNS, dll; token hanya dipakai untuk request yang diminta user, tidak disimpan/dicatat/ditampilkan). github_request (akses GitHub API lewat KONEKTOR GitHub user — token OAuth-nya OTOMATIS dipakai dari halaman Integrasi Clincoo, JANGAN pernah minta user menempel token manual; kalau belum terhubung, beri tahu user untuk buka halaman Integrasi dulu. Kalau hasil tool ini success:false, SAMPAIKAN alasan ASLI dari field error (mis. "Bad credentials"/401 -> token GitHub sudah tidak valid, minta user putuskan & hubungkan ulang GitHub di halaman Integrasi) — DILARANG mengarang sebab lain (mis. "belum tersinkron ke sesi") yang tidak ada di pesan errornya. Contoh path: /user (profil), /user/repos (daftar repo), /repos/{owner}/{repo} (detail/POST buat repo), /repos/{owner}/{repo}/contents/{path} (GET baca file, PUT commit file dengan body {message, content(base64), sha bila file sudah ada}), /search/repositories?q= (cari repo), /repos/{owner}/{repo}/git... untuk operasi lanjutan). Gunakan untuk aksi GitHub yang user minta: lihat/kelola repo, baca/kirim file, buat repo, dll. Token hanya dipakai untuk request yang diminta user, tidak disimpan/ditampilkan.) drive_request (akses Google Drive milik user lewat KONEKTOR Drive Clincoo — token OAuth-nya OTOMATIS dipakai dari halaman Plugin, JANGAN pernah minta user menempel token manual; kalau belum terhubung, beri tahu user untuk buka halaman Plugin dulu. Contoh path: /drive/v3/about?fields=user (in
