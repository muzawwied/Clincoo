        // ===== POLLING: AI bertanya detail yang belum diketahui sebelum/di tengah membangun =====
        // Format blok: [[POLL]] / Q: pertanyaan / A:, B:, C: opsi / --- antar pertanyaan / [[/POLL]]
        // Kartu = stepper BERURUTAN: hanya pertanyaan aktif yang terbuka (opsi A/B/C +
        // "Lainnya…" untuk jawaban manual di chat), pertanyaan berikutnya terkunci;
        // garis antar nomor mengisi saat terjawab. Setelah semua terjawab, rangkuman
        // Q&A otomatis dikirim ke chat dan AI melanjutkan pekerjaannya.
        let pendingPollAnswer = null;

        function parsePollBlock(text) {
            const raw = String(text || '');
            const m = raw.match(/\[\[POLL\]\]([\s\S]*?)(?:\[\[\s*\/\s*POLL\s*\]\]|$)/i);
            if (!m) return { clean: raw, questions: [] };
            let body = m[1].replace(/\[\[\s*\/?\s*POLL\s*\]\]/gi, '').trim();
            const questions = [];
            if (/^\s*Q\s*[:.]/im.test(body)) {
                // Format baru: Q: + opsi A:/B:/C:/D: per pertanyaan, dipisah '---'
                body.split(/\n\s*-{3,}\s*(?:\n|$)|\n(?=Q\s*[:.])/i).forEach(function (block) {
                    const lines = block.split('\n').map(l => l.trim()).filter(l => l.length > 0);
                    let q = null, opts = [];
                    lines.forEach(l => {
                        let mm;
                        if ((mm = l.match(/^Q\s*[:.]\s*(.+)$/i))) {
                            if (q !== null) { questions.push({ q: q, options: opts }); opts = []; }
                            q = mm[1];
                        } else if ((mm = l.match(/^([A-D])\s*[:.)]\s*(.+)$/i))) {
                            opts.push(mm[2]);
                        }
                    });
                    if (q !== null) questions.push({ q: q, options: opts });
                });
            } else {
                // Format lama: tiap baris satu pertanyaan tanpa opsi (kompatibel)
                let lines = body.split('\n').map(l => l.trim()).filter(l => l.length > 0);
                if (lines.length === 1 && lines[0].indexOf(' | ') !== -1) {
                    lines = lines[0].split(' | ').map(l => l.trim()).filter(l => l.length > 0);
                }
                lines.map(l => l.replace(/^\s*(?:\d+\s*[.)\]:-]|[-*•])\s*/, '').trim())
                    .filter(l => l.length > 0)
                    .forEach(q => questions.push({ q: q, options: [] }));
            }
            const clean = (raw.slice(0, m.index) + raw.slice(m.index + m[0].length)).trim();
            return { clean, questions: questions.slice(0, 6) };
        }

        function pollStepsOf(msg) {
            return (msg.pollQuestions || []).map(function (q) {
                return (typeof q === 'string') ? { q: q, options: [] } : { q: q.q, options: q.options || [] };
            });
        }
        function pollStateOf(msg) {
            if (!msg.pollState) msg.pollState = { current: 0, answers: [] };
            if (!Array.isArray(msg.pollState.answers)) msg.pollState.answers = [];
            return msg.pollState;
        }

        function renderPollCard(msg) {
            const qs = pollStepsOf(msg);
            if (!qs.length) return '';
            const st = pollStateOf(msg);
            const letters = ['A', 'B', 'C', 'D'];
            const doneAll = st.done || st.current >= qs.length;
            const stepsHtml = qs.map(function (s, i) {
                const answered = doneAll || i < st.current;
                const active = !doneAll && i === st.current;
                const cls = answered ? 'answered' : (active ? 'active' : 'locked');
                const rail = (i < qs.length - 1) ? `<span class="poll-rail${i < st.current ? ' done' : ''}"></span>` : '';
                let bodyHtml = '';
                if (answered) {
                    bodyHtml = `<div class="poll-ans">✓ ${escText(st.answers[i] || '')}</div>`;
                } else if (active) {
                    const opts = s.options.map(function (o, oi) {
                        return `<button type="button" class="poll-opt" onclick="pollPickOption('${msg.id}', ${i}, ${oi})">
                            <span class="poll-opt-letter">${letters[oi] || (oi + 1)}</span>
                            <span>${escText(o)}</span>
                        </button>`;
                    }).join('');
                    const manual = (st.manualOpen === i)
                        ? `<div class="poll-manual">
                            <input type="text" id="poll-manual-input" placeholder="Ketik jawabanmu di sini…" onkeydown="if(event.key==='Enter'){event.preventDefault();pollSubmitManual('${msg.id}', ${i});}" maxlength="500">
                            <button type="button" onclick="pollSubmitManual('${msg.id}', ${i})">Kirim</button>
                        </div>`
                        : '';
                    bodyHtml = `<div class="poll-opts">
                        ${opts}
                        <button type="button" class="poll-opt other" onclick="pollPickOther('${msg.id}', ${i})">
                            <span class="poll-opt-letter">+</span>
                            <span>Lainnya… (jawab dengan kata-kata sendiri)</span>
                        </button>
                        ${manual}
                    </div>`;
                }
                return `
                    <div class="poll-step ${cls}">
                        ${rail}
                        <span class="poll-node">${answered ? '✓' : (i + 1)}</span>
                        <div class="poll-step-body">
                            <div class="poll-step-q">${escText(s.q)}</div>
                            ${bodyHtml}
                        </div>
                    </div>`;
            }).join('');
            return `
                <div class="poll-card fade-in">
                    <div class="poll-card-head">${doneAll ? 'Polling terjawab' : ('Konfirmasi singkat (' + Math.min(st.current + 1, qs.length) + '/' + qs.length + ')')}</div>
                    <div class="poll-steps">${stepsHtml}</div>
                    ${doneAll ? '' : '<div class="poll-card-hint">Pilih satu opsi, atau "Lainnya…" untuk jawab sendiri di chat. Selesai satu, pertanyaan berikutnya terbuka.</div>'}
                </div>
            `;
        }

        window.pollPickOption = function (msgId, qIdx, optIdx) {
            const m = messages.find(x => x && x.id === msgId);
            if (!m) return;
            const qs = pollStepsOf(m);
            if (!qs[qIdx] || !qs[qIdx].options[optIdx]) return;
            const st = pollStateOf(m);
            if (st.sending || st.done || st.answers[qIdx] !== undefined) return;
            st.answers[qIdx] = qs[qIdx].options[optIdx];
            st.current = qIdx + 1;
            if (st.current >= qs.length) pollAutoSend(m);
            else { renderMessages(); try { scrollToBottom(false); } catch (e) {} }
        };

        window.pollPickOther = function (msgId, qIdx) {
            const m = messages.find(x => x && x.id === msgId);
            const qs = m && pollStepsOf(m);
            if (!m || !qs[qIdx]) return;
            const st = pollStateOf(m);
            st.manualOpen = qIdx;
            renderMessages();
            try {
                const inp = document.getElementById('poll-manual-input');
                if (inp) { inp.focus(); inp.scrollIntoView({ block: 'nearest', behavior: 'smooth' }); }
            } catch (e) {}
        };
        window.pollSubmitManual = function (msgId, qIdx) {
            const inp = document.getElementById('poll-manual-input');
            const val = inp ? inp.value.trim() : '';
            if (!val) { if (inp) inp.focus(); return; }
            const m = messages.find(x => x && x.id === msgId);
            if (!m) return;
            const qs = pollStepsOf(m);
            const st = pollStateOf(m);
            st.manualOpen = null;
            st.answers[qIdx] = val;
            st.current = Math.max(st.current, qIdx + 1);
            if (st.current >= qs.length) pollAutoSend(m);
            else { renderMessages(); try { scrollToBottom(false); } catch (e) {} }
        };
        window.pollCancelOther = function () {
            pendingPollAnswer = null;
            hidePollAnswerChip();
        };

        function showPollAnswerChip(question) {
            let chip = document.getElementById('poll-answer-chip');
            if (!chip) {
                chip = document.createElement('div');
                chip.id = 'poll-answer-chip';
                const card = chatInput.parentElement;
                card.insertBefore(chip, card.firstChild);
            }
            chip.innerHTML = '<span>✏ Menjawab: ' + escText(question) + ' — ketik jawabanmu lalu kirim.</span><button type="button" class="poll-chip-x" onclick="pollCancelOther()" title="Batal">✕</button>';
            chip.style.display = 'flex';
        }
        function hidePollAnswerChip() {
            const chip = document.getElementById('poll-answer-chip');
            if (chip) chip.style.display = 'none';
        }

        // Semua pertanyaan terjawab -> rangkuman Q&A otomatis terkirim ke chat
        // sebagai pesan user, lalu AI melanjutkan pekerjaannya dari titik berhenti.
        function pollAutoSend(m) {
            const qs = pollStepsOf(m);
            const st = pollStateOf(m);
            if (st.sending || st.done) return;
            st.sending = true;
            st.done = true;
            pendingPollAnswer = null;
            hidePollAnswerChip();
            const lines = ['Jawaban polling:'];
            qs.forEach(function (s, i) {
                lines.push((i + 1) + '. ' + s.q);
                lines.push('→ ' + (st.answers[i] || '-'));
            });
            lines.push('Lanjutkan pekerjaannya dengan jawaban di atas.');
            const qaText = lines.join('\n');
            const send = function () {
                if (isGenerating) { setTimeout(send, 400); return; }
                messages.push({ id: generateId(), role: 'user', text: qaText, time: Date.now() });
                renderMessages();
                revealNewMessage();
                fetchAIResponse();
            };
            renderMessages();
            send();
        }

        // ===== CHECKPOINT TOKEN: saat kuota token habis di tengah tugas, AI minta
        // konfirmasi sebelum lanjut — dengan variasi kalimat agar tidak monoton/selalu sama.
        const CHECKPOINT_OPENERS = [
            'Sepertinya token saya kehabisan tepat di tengah pengerjaan. Untungnya, semuanya aman.',
            'Kuota token untuk tugas ini habis sebentar, jadi saya jeda dulu di titik aman.',
            'Proses berhenti sementara — token saya mentok, tapi tenang, kerjaanmu tidak hilang.',
            'Sebentar ya, token saya kehabisan di tengah jalan. Ini laporan posisinya sejauh ini.',
            'Oke jujur saja, token saya habis pas mengerjakan ini. Kabar baiknya: progresnya tersimpan.',
            'Token saya kehabisan, jadi saya berhenti dulu di sini biar semuanya rapi.'
        ];
        const CHECKPOINT_DONE_HDRS = ['Sudah dikerjakan', 'Sudah selesai', 'Progres sejauh ini'];
        const CHECKPOINT_TODO_HDRS = ['Belum selesai', 'Yang masih tersisa', 'Sisa pengerjaan'];
        const CHECKPOINT_TODO_BODIES = [
            'Sisa file dan komponen yang belum jadi akan saya kerjakan setelah kamu konfirmasi.',
            'Tugas masih punya sisa — semuanya tersimpan rapi dan siap dilanjutkan kapan pun.',
            'Ada beberapa bagian terakhir yang belum saya sentuh; tinggal konfirmasi untuk melanjutkan.'
        ];
        const CHECKPOINT_PROMPTS = [
            'Tulis **lanjut** dan saya kerjakan sisanya.',
            'Balas **lanjut** kalau kamu mau saya teruskan dari titik ini.',
            'Cukup ketik **lanjut** — saya ambil lagi dari sini.',
            'Ketik **lanjut** untuk meneruskan pengerjaannya.',
            'Tulis **lanjut** kapan pun kamu siap — saya siap melanjutkan.'
        ];
        function pickRandom(arr) { return arr[Math.floor(Math.random() * arr.length)]; }
        function buildCheckpointText(toolCalls, reason, recoveryNote) {
            const doneList = toolCalls.map(function (tc) {
                let lbl = toolCallLabel({ name: tc.name, args: tc.args });
                return (tc.ok === false ? '⚠ ' : '✓ ') + lbl;
            });
            const lines = [];
            lines.push(pickRandom(CHECKPOINT_OPENERS));
            lines.push('');
            lines.push('**' + pickRandom(CHECKPOINT_DONE_HDRS) + ':**');
            doneList.forEach(function (d, i) { lines.push((i + 1) + '. ' + d); });
            lines.push('');
            lines.push('**' + pickRandom(CHECKPOINT_TODO_HDRS) + ':**');
            lines.push(pickRandom(CHECKPOINT_TODO_BODIES));
            if (reason) { lines.push(''); lines.push('*' + reason + (recoveryNote || ' Biasanya pulih sendiri dalam beberapa menit.') + '*'); }
            lines.push('');
            lines.push(pickRandom(CHECKPOINT_PROMPTS));
            return lines.join('\n');
        }

        function toggleToolCallsGroup(msgId) {
            const msg = messages.find(m => m.id === msgId || m.id.toString() === msgId);
            if (!msg) return;
            // Selalu tertutup default — user membuka manual, termasuk saat AI masih berjalan.
            const current = (msg.toolCallsOpen === undefined) ? false : msg.toolCallsOpen;
            msg.toolCallsOpen = !current;
            renderMessages();
        }

        function toggleToolCallItem(msgId, idx) {
            const msg = messages.find(m => m.id === msgId || m.id.toString() === msgId);
            if (!msg || !msg.toolCalls || !msg.toolCalls[idx]) return;
            msg.toolCalls[idx].expanded = !msg.toolCalls[idx].expanded;
            renderMessages();
        }

        function toolCallDetailBlock(label, text) {
            if (text === undefined || text === null || text === '') return '';
            const encoded = encodeURIComponent(text);
            return `
                <div class="toolcalls-detail-block">
                    <div class="toolcalls-detail-label">
                        <span>${escText(label)}</span>
                        <button type="button" class="toolcalls-detail-copy" onclick="event.stopPropagation(); copyCodeBlock(this)" data-code="${encoded}" title="Salin">
                            <i class="ph-bold ph-copy text-[13px]"></i>
                        </button>
                    </div>
                    <pre class="toolcalls-detail-pre">${escText(text)}</pre>
                </div>
            `;
        }

        // Tool pencarian/pembacaan info murni — tidak ada aksi/perubahan nyata,
        // jadi tidak perlu kartu "Menjalankan Tugas". Status shimmer teks saja sudah cukup.
        const INFO_ONLY_TOOLS = new Set(['web_search', 'read_web_page', 'search_clinqoo_kb', 'test_secret']);
        function isInfoOnlyToolCalls(toolCalls) {
            if (!toolCalls || toolCalls.length === 0) return true;
            return toolCalls.every(tc => INFO_ONLY_TOOLS.has(tc.name));
        }

        function renderToolCallsCard(msg) {
            if (!msg.toolCalls || msg.toolCalls.length === 0) return '';
            if (isInfoOnlyToolCalls(msg.toolCalls)) return ''; // murni search -> tanpa kartu
            const running = !!msg.isProcessing;
            // Tertutup default: progres tidak auto-membuka; user membuka sendiri manual.
            const groupOpen = (msg.toolCallsOpen === undefined) ? false : msg.toolCallsOpen;
            const errCount = msg.toolCalls.filter(tc => tc.ok === false).length;
            // Saat masih berjalan: tampilkan aksi NYATA yang sedang AI lakukan (English,
            // dari statusText yang sama dipakai shimmer -- misal "Writing file: services.html…"),
            // bukan teks generik "Menjalankan Tugas".
            const summaryText = running
                ? (msg.statusText || 'Running…')
                : (msg.midPhase
                    ? 'Partially done — continuing…'
                    : (errCount > 0
                        ? `Everything's finished (${errCount} gagal)`
                        : "Everything's finished"));
            const badgeClass = running ? '' : (errCount > 0 ? ' err' : ' ok');
            const summaryIcon = running
                ? '<i class="ph-bold ph-circle-notch tc-spin text-[15px]"></i>'
                : (msg.midPhase
                    ? '<i class="ph-bold ph-dots-three text-[15px]"></i>'
                    : (errCount > 0 ? '<i class="ph-bold ph-x text-[15px]"></i>' : '<i class="ph-bold ph-check text-[15px]"></i>'));
            return `
                <div class="mb-1.5 toolcalls-card fade-in">
                    <button type="button" class="toolcalls-summary${groupOpen ? ' open' : ''}" onclick="toggleToolCallsGroup('${msg.id}')">
                        <span class="toolcalls-badge${badgeClass}">${summaryIcon}</span>
                        <span>${escText(summaryText)}</span>
                        <i class="ph-bold ph-caret-down tc-chevron text-[12px]"></i>
                    </button>
                    ${running ? '<div class="toolcalls-livebar"></div>' : ''}
                    ${groupOpen ? `
                        <div class="toolcalls-list">
                            ${msg.toolCalls.map((tc, idx) => {
                                const itemOpen = !!tc.expanded;
                                const argsText = (tc.args && Object.keys(tc.args).length) ? JSON.stringify(tc.args, null, 2) : '';
                                const resultText = (tc.result !== undefined && tc.result !== null && tc.result !== '') ? String(tc.result) : '';
                                return `
                                <div class="toolcalls-item">
                                    <button type="button" class="toolcalls-item-header${itemOpen ? ' open' : ''}${tc.ok === false ? ' err' : ''}" onclick="toggleToolCallItem('${msg.id}', ${idx})">
                                        ${tc.name === 'notion_request' ? `<span class="inline-flex w-[14px] h-[14px]" style="flex-shrink:0"><svg fill="currentColor" role="img" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" style="width:100%;height:100%;display:block"><path d="M4.459 4.208c.746.606 1.026.56 2.428.466l13.215-.793c.28 0 .047-.28-.046-.326L17.86 1.968c-.42-.326-.981-.7-2.055-.607L3.01 2.295c-.466.046-.56.28-.374.466zm.793 3.08v13.904c0 .747.373 1.027 1.214.98l14.523-.84c.841-.046.935-.56.935-1.167V6.354c0-.606-.233-.933-.748-.887l-15.177.887c-.56.047-.747.327-.747.933zm14.337.745c.093.42 0 .84-.42.888l-.7.14v10.264c-.608.327-1.168.514-1.635.514-.748 0-.935-.234-1.495-.933l-4.577-7.186v6.952L12.21 19s0 .84-1.168.84l-3.222.186c-.093-.186 0-.653.327-.746l.84-.233V9.854L7.822 9.76c-.094-.42.14-1.026.793-1.073l3.456-.233 4.764 7.279v-6.44l-1.215-.139c-.093-.514.28-.887.747-.933zM1.936 1.035l13.31-.98c1.634-.14 2.055-.047 3.082.7l4.249 2.986c.7.513.934.653.934 1.213v16.378c0 1.026-.373 1.634-1.68 1.726l-15.458.934c-.98.047-1.448-.093-1.962-.747l-3.129-4.06c-.56-.747-.793-1.306-.793-1.96V2.667c0-.839.374-1.54 1.447-1.632z"/></svg></span>` : `<i class="ph-bold ${toolCallIcon(tc.name)} text-[14px]" style="flex-shrink:0"></i>`}
                                        <span class="toolcalls-item-label">${tc.ok === false ? '✗ ' : ''}${escText(toolCallLabel(tc))}</span>
                                        ${(argsText || resultText) ? `<i class="ph-bold ph-caret-down tc-chevron text-[12px]"></i>` : ''}
                                    </button>
                                    ${(itemOpen && (argsText || resultText)) ? `
                                        <div class="toolcalls-item-detail">
                                            ${toolCallDetailBlock('Arguments', argsText)}
                                            ${toolCallDetailBlock('Result', resultText)}
                                        </div>
                                    ` : ''}
                                </div>
                            `; }).join('')}
                        </div>
                    ` : ''}
                </div>
            `;
        }

        // Saat tab ditutup / disembunyikan saat AI masih mengetik, simpan kondisi terakhir —
        // begitu kembali, halaman melanjutkan (lihat logika resume di bawah).
        window.addEventListener('pagehide', function () { try { saveChatLog(); } catch (e) {} try { pushChatCloud(); } catch (e) {} });
        document.addEventListener('visibilitychange', function () {
            if (document.visibilityState === 'hidden') { try { saveChatLog(); } catch (e) {} }
        });

        function renderMessages() {
            try { saveChatLog(); } catch(e) {}
            chatContainer.innerHTML = '';
            const visibleMessages = messages.filter(m => !m.isHidden);
            
            if (visibleMessages.length === 0) {
                chatContainer.innerHTML = `
                    <div class="flex flex-col items-center justify-center w-full h-full min-h-[50vh] gap-6 fade-in pointer-events-auto">
                        <h2 class="text-3xl md:text-[34px] text-center text-gray-800 tracking-tight px-4" style="font-weight: 400;">${currentGreeting}</h2>
                        
                        <!-- Tombol Gunakan Prompt / Prompt Suggestions -->
                        <div class="flex flex-wrap items-center justify-center gap-2 max-w-2xl px-4">
                            <button onclick="handlePromptClick('Buatkan ringkasan artikel ini')" class="px-4 py-2 bg-gray-50 hover:bg-gray-100 border border-gray-200 rounded-full text-[13px] font-medium text-gray-700 transition-colors shadow-sm flex items-center gap-1.5">
                                <i class="ph ph-magic-wand text-lg"></i> Buat ringkasan
                            </button>
                            <button onclick="handlePromptClick('Tuliskan email profesional untuk klien')" class="px-4 py-2 bg-gray-50 hover:bg-gray-100 border border-gray-200 rounded-full text-[13px] font-medium text-gray-700 transition-colors shadow-sm flex items-center gap-1.5">
                                <i class="ph ph-envelope text-lg"></i> Tulis email
                            </button>
                            <button onclick="handlePromptClick('Jelaskan konsep AI dengan sederhana')" class="px-4 py-2 bg-gray-50 hover:bg-gray-100 border border-gray-200 rounded-full text-[13px] font-medium text-gray-700 transition-colors shadow-sm flex items-center gap-1.5">
                                <i class="ph ph-lightbulb text-lg"></i> Jelaskan konsep AI
                            </button>
                        </div>
                    </div>
                `;
                return;
            }

            const lastAiIndex = [...visibleMessages].reverse().findIndex(m => m.role === 'ai');
            const actualLastAiIndex = lastAiIndex !== -1 ? (visibleMessages.length - 1) - lastAiIndex : -1;
            const lastUserIndex = [...visibleMessages].reverse().findIndex(m => m.role === 'user');
            const actualLastUserIndex = lastUserIndex !== -1 ? (visibleMessages.length - 1) - lastUserIndex : -1;

            visibleMessages.forEach((msg, index) => {
                const messageEl = document.createElement('div');
                messageEl.id = 'msg-row-' + msg.id;
                messageEl.classList.add('flex', 'w-full', 'fade-in');

                if (msg.role === 'ai') {
                    const isLastAi = index === actualLastAiIndex;
                    messageEl.classList.add('justify-start');
                    
                    let processIndicator = '';
                    if (msg.isProcessing) {
                        if (msg.processType === 'search') {
                            processIndicator = `<div class="shimmer-search"><span id="status-text-${msg.id}" class="transition-opacity duration-200">${msg.statusText || 'Searching...'}</span></div>`;
                        } else if (msg.processType === 'read') {
                            processIndicator = `<div class="shimmer-search"><span id="status-text-${msg.id}" class="transition-opacity duration-200">${msg.statusText || 'Reading URL...'}</span></div>`;
                        } else if (msg.processType === 'file') {
                            processIndicator = `<div class="shimmer-search"><span id="status-text-${msg.id}" class="transition-opacity duration-200">${msg.statusText || 'Analyzing...'}</span></div>`;
                        } else if (msg.processType === 'image') {
                            processIndicator = `<div class="shimmer-search"><span id="status-text-${msg.id}" class="transition-opacity duration-200">${msg.statusText || 'Generating...'}</span></div>`;
                        } else {
                            processIndicator = `<div class="shimmer-search"><span id="status-text-${msg.id}" class="transition-opacity duration-200">${msg.statusText || 'Thinking...'}</span></div>`;
                        }
                    }

                    messageEl.innerHTML = `
                        <div class="flex max-w-[95%] sm:max-w-[90%] w-full min-w-0">
                            <div class="flex flex-col gap-2 pt-1 w-full min-w-0">
                                ${renderToolCallsCard(msg)}
                                <div class="text-black text-[15px] leading-normal break-words w-full md-content pointer-events-auto overflow-hidden" style="word-break: break-word; overflow-wrap: break-word; max-width: 100%;" id="msg-text-${msg.id}">
                                    ${(msg.isProcessing && isInfoOnlyToolCalls(msg.toolCalls)) ? processIndicator : (msg.isImageResponse ? msg.text : formatMarkdown(balanceMarkdown(msg.text)))}
                                </div>
                                ${renderPollCard(msg)}
                                ${(msg.sources && msg.sources.length > 0) ? `
                                    <div class="mt-1.5 mb-0.5 pointer-events-auto fade-in">
                                        <div class="flex items-center flex-wrap gap-x-1.5 gap-y-1 text-[11.5px] text-gray-400">
                                            <i class="ph ph-globe text-[13px]"></i>
                                            ${msg.sources.map(s => `<a href="${escUrl(s.url)}" target="_blank" rel="noopener noreferrer" class="underline decoration-gray-300 hover:text-gray-600 transition-colors" title="${escText(s.url)}">${escText(s.domain)}</a>`).join('<span class="text-gray-300">·</span>')}
                                        </div>
                                    </div>
                                ` : ''}
                                ${(msg.checkpoint && isLastAi && !msg.isProcessing && !msg.isTyping) ? `
                                    <button type="button" class="checkpoint-chip fade-in" onclick="handlePromptClick('lanjut')" title="Lanjutkan tugas yang tertunda">
                                        <i class="ph-bold ph-arrow-clockwise"></i> Lanjutkan
                                    </button>
                                ` : ''}
                                ${(msg.stoppedByUser && !msg.isProcessing && !msg.isTyping) ? `
                                    <div class="flex items-center gap-1.5 mt-0.5 text-[11px] text-gray-400 fade-in select-none">
                                        <span class="w-1.5 h-1.5 rounded-full bg-gray-300"></span> Pesan dihentikan
                                    </div>
                                ` : ''}
                                <div class="flex items-center gap-3 mt-1 pointer-events-auto" id="action-bar-${msg.id}" style="${(msg.isProcessing || msg.isTyping || msg.midPhase) ? 'display: none;' : ''}">
                                    ${msg.isImageResponse ? 
                                    `<button onclick="downloadImage('${msg.imageUrl}', 'clinqoo-image.jpg')" class="relative text-gray-400 hover:text-black transition p-1" title="Unduh Gambar">
                                        <i class="ph ph-download-simple text-lg"></i>
                                    </button>` :
                                    `<button onclick="copyText('${msg.id}', this)" class="relative text-gray-400 hover:text-black transition p-1" title="Salin">
                                        <i class="ph ph-copy text-lg"></i>
                                    </button>`}
                                    <button onclick="shareText('${msg.id}')" class="text-gray-400 hover:text-black transition p-1" title="Bagikan">
                                        <i class="ph ph-arrow-bend-up-right text-lg"></i>
                                    </button>
                                    <button onclick="exportMsgDocs('${msg.id}', this)" class="text-gray-400 hover:text-black transition p-1" title="Kirim ke Google Docs">
                                        <i class="ph ph-google-logo text-lg"></i>
                                    </button>
                                    ${isLastAi ? `
                                        <button onclick="handleThumbs('${msg.id}', 'up', this)" class="text-gray-400 hover:text-black transition p-1" title="Suka">
                                            <i class="ph ph-thumbs-up text-lg"></i>
                                        </button>
                                        <button onclick="handleThumbs('${msg.id}', 'down', this)" class="text-gray-400 hover:text-black transition p-1" title="Tidak Suka">
                                            <i class="ph ph-thumbs-down text-lg"></i>
                                        </button>
                                    ` : ''}
                                </div>
                            </div>
                        </div>
                    `;
                } else {
                    const isLastUser = index === actualLastUserIndex;
                    messageEl.classList.add('justify-end');
                    
                    let attachmentsHtml = '';
                    if (msg.attachments && msg.attachments.length > 0) {
                        attachmentsHtml = '<div class="flex flex-wrap gap-2 mb-2 justify-end w-full">';
                        msg.attachments.forEach(att => {
                            if (att.type === 'image') {
                                attachmentsHtml += `<img src="${escUrl(att.data)}" class="max-w-[200px] sm:max-w-[250px] rounded-2xl mb-1 border border-gray-200/50 shadow-sm object-cover" alt="Attached Image">`;
                            } else {
                                attachmentsHtml += `
                                    <div class="flex items-center gap-1.5 bg-black/5 px-3 py-1.5 rounded-full border border-black/5 max-w-full mb-1">
                                        ${getFileIcon(att.extension)}
                                        <div class="flex-1 overflow-hidden">
                                            <p class="text-[12px] font-semibold truncate text-gray-800">${att.name}</p>
                                        </div>
                                    </div>
                                `;
                            }
                        });
                        attachmentsHtml += '</div>';
                    }

                    messageEl.innerHTML = `
                        <div class="flex flex-col items-end max-w-[85%] w-full pointer-events-auto">
                            ${attachmentsHtml}
                            ${msg.text ? `
                            <div class="bg-gray-100 text-black px-4 py-2.5 rounded-2xl rounded-br-sm text-[15px] leading-relaxed user-bubble cursor-pointer inline-block w-fit md-content" 
                                 style="word-break: break-word; overflow-wrap: break-word; hyphens: auto;"
                                 data-id="${msg.id}">
                                ${formatMarkdown(msg.text)}
                            </div>
                            ` : ''}
                            <div id="user-action-bar-${msg.id}" class="hidden items-center gap-3 mt-1 mr-2 user-action-bar">
                                <button onclick="copyText('${msg.id}', this)" class="relative text-gray-400 hover:text-black transition p-1" title="Salin">
                                    <i class="ph ph-copy text-lg"></i>
                                </button>
                                ${isLastUser ? `
                                    <button onclick="editMessage('${msg.id}')" class="text-gray-400 hover:text-black transition p-1" title="Edit">
                                        <i class="ph ph-pencil-simple text-lg"></i>
                                    </button>
                                ` : ''}
                            </div>
                        </div>
                    `;
                }
                chatContainer.appendChild(messageEl);
            });
            attachBubbleClickListeners();
            scrollToBottom(false);

        // ===== EKSPOR KE APLIKASI KERJA: Google Docs & Notion =====
        // Masukan beta tester: jawaban AI harus bisa langsung dipakai di aplikasi kerja
        // (Docs/Notion) — tanpa copy-paste manual. Token Drive dipakai dari konektor
        // Integrasi (clincoo_drive_token); token Notion disimpan lokal per perangkat.
        function msgPlainText(id) {
            const m = messages.find(x => x.id === id || x.id.toString() === id);
            return m ? (m.text || '') : '';
        }
        function exportDocTitle(text) {
            const firstLine = (text || '').split('\n').map(t => t.trim()).filter(Boolean)[0] || 'Jawaban Clincoo';
            return firstLine.replace(/^#+\s*/, '').replace(/[*_`~>#]/g, '').slice(0, 60) || 'Jawaban Clincoo';
        }
        function escHtml(x) { return String(x).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
        function mdInlineHtml(x) {
            return escHtml(x)
                .replace(/`([^`]+)`/g, '<code>$1</code>')
                .replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>')
                .replace(/(^|\s)\*([^*]+)\*/g, '$1<i>$2</i>')
                .replace(/\[([^\]]+)\]\((https?:[^)]+)\)/g, '<a href="$2">$1</a>');
        }
        function mdToHtml(md) {
            const lines = (md || '').split('\n');
            let html = '', inCode = false, codeBuf = [], listType = null;
            const closeList = () => { if (listType) { html += (listType === 'ul' ? '</ul>' : '</ol>'); listType = null; } };
            for (const raw of lines) {
                const line = raw;
                if (line.trim().startsWith('```')) {
                    if (inCode) { html += '<pre>' + escHtml(codeBuf.join('\n')) + '</pre>'; codeBuf = []; inCode = false; }
                    else { closeList(); inCode = true; }
                    continue;
                }
                if (inCode) { codeBuf.push(line); continue; }
                const t = line.trim();
                if (!t) { closeList(); continue; }
                let m;
                if ((m = t.match(/^(#{1,3})\s+(.*)$/))) {
                    closeList();
                    const h = m[1].length + 1;
                    html += '<h' + h + '>' + mdInlineHtml(m[2]) + '</h' + h + '>';
                } else if (/^([-*])\s+/.test(t)) {
                    if (listType !== 'ul') { closeList(); html += '<ul>'; listType = 'ul'; }
                    html += '<li>' + mdInlineHtml(t.replace(/^([-*])\s+/, '')) + '</li>';
                } else if (/^\d+\.\s+/.test(t)) {
                    if (listType !== 'ol') { closeList(); html += '<ol>'; listType = 'ol'; }
                    html += '<li>' + mdInlineHtml(t.replace(/^\d+\.\s+/, '')) + '</li>';
                } else {
                    closeList();
                    html += '<p>' + mdInlineHtml(t) + '</p>';
                }
            }
            if (inCode && codeBuf.length) html += '<pre>' + escHtml(codeBuf.join('\n')) + '</pre>';
            closeList();
            return '<!DOCTYPE html><html><head><meta charset="utf-8"></head><body>' + html + '</body></html>';
        }
        async function driveUploadHtml(token, title, html) {
            const meta = JSON.stringify({ name: title, mimeType: 'application/vnd.google-apps.document' });

                '\r\n--CLINCOOBOUND\r\nContent-Type: text/html\r\n\r\n' + html + '\r\n--CLINCOOBOUND--';
            return fetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id,name,webViewLink', {
                method: 'POST',
                headers: { 'Authorization': 'Bearer ' + token, 'Content-Type': 'multipart/related; boundary=CLINCOOBOUND' },
                body
            });
        }

        function notionInlineRich(text) {
            // jadikan 1 rich_text dengan penandaan **bold**/*italic*`code` sederhana
            const out = [];
            const re = /(\*\*[^*]+\*\*|\*[^*]+\*|`[^`]+`)/g;
            let last = 0, m;
            const push = (t, ann) => { if (t) out.push({ type: 'text', text: { content: t }, annotations: ann || {} }); };
            while ((m = re.exec(text)) !== null) {
                push(text.slice(last, m.index));
                const tok = m[0];
                if (tok.startsWith('**')) push(tok.slice(2, -2), { bold: true });
                else if (tok.startsWith('`')) push(tok.slice(1, -1), { code: true });
                else push(tok.slice(1, -1), { italic: true });
                last = m.index + tok.length;
            }
            push(text.slice(last));
            if (!out.length) out.push({ type: 'text', text: { content: text || ' ' } });
            return out;
        }
        function notionBlocks(md) {
            const blocks = [];
            const lines = (md || '').split('\n');
            let i = 0;
            while (i < lines.length && blocks.length < 95) {
                const t = lines[i].trim();
                if (t.startsWith('```')) {
                    const buf = [];
                    i++;
                    while (i < lines.length && !lines[i].trim().startsWith('```')) { buf.push(lines[i]); i++; }
                    i++;
                    blocks.push({ object: 'block', type: 'code', code: { rich_text: [{ type: 'text', text: { content: buf.join('\n').slice(0, 1900) } }], language: 'plain text' } });
                    continue;
                }
                let m;
                if ((m = t.match(/^(#{1,3})\s+(.*)$/))) {
                    const lvl = 'heading_' + m[1].length;
                    const o = { object: 'block', type: lvl };
                    o[lvl] = { rich_text: notionInlineRich(m[2]) };
                    blocks.push(o);
                } else if (/^[-*]\s+/.test(t)) {
                    blocks.push({ object: 'block', type: 'bulleted_list_item', bulleted_list_item: { rich_text: notionInlineRich(t.replace(/^[-*]\s+/, '')) } });
                } else if (/^\d+\.\s+/.test(t)) {
                    blocks.push({ object: 'block', type: 'numbered_list_item', numbered_list_item: { rich_text: notionInlineRich(t.replace(/^\d+\.\s+/, '')) } });
                } else if (t) {
                    blocks.push({ object: 'block', type: 'paragraph', paragraph: { rich_text: notionInlineRich(t) } });
                }
                i++;
            }
            if (!blocks.length) blocks.push({ object: 'block', type: 'paragraph', paragraph: { rich_text: [{ type: 'text', text: { content: (md || '').slice(0, 1900) } }] } });
            return blocks;
        }

        async function notionRefreshToken() {
            // Terhubung lewat plugin Notion (OAuth): access token di-refresh lewat server Clincoo
            const refresh = localStorage.getItem('clincoo_notion_refresh');
            if (!refresh) return localStorage.getItem('clincoo_notion_token') || '';
            try {
                const rt = localStorage.getItem('clinqoo_auth_token') || localStorage.getItem('clinqoo_token') || '';
                const r = await fetch(TOOL_API_BASE + '/api/notion-oauth', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', ...(rt ? { 'Authorization': 'Bearer ' + rt } : {}) },
                    body: JSON.stringify({ refresh_token: refresh })
                });
                const j = await r.json().catch(() => ({}));
                if (r.ok && j.access_token) { localStorage.setItem('clincoo_notion_token', j.access_token); return j.access_token; }
            } catch (e) {}
            return localStorage.getItem('clincoo_notion_token') || '';
        }
        async function notionSendPage(token, page, text, nTok) {
            return fetch(TOOL_API_BASE + '/api/notion-proxy', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'X-Notion-Token': token, ...(nTok ? { 'Authorization': 'Bearer ' + nTok } : {}) },
                body: JSON.stringify({ parent: { page_id: page }, properties: { title: { title: [{ text: { content: exportDocTitle(text) } }] } }, children: notionBlocks(text) })
            });

        async function exportMsgNotion(id, btnElement) {
            const text = msgPlainText(id);
            if (!text) return;
            const nTok = localStorage.getItem('clinqoo_auth_token') || localStorage.getItem('clinqoo_token') || '';
            let token = await notionRefreshToken();
            let page = localStorage.getItem('clincoo_notion_page') || '';
            if (!token || !page) { openNotionModal(); return; }
            showGlobalTooltip(btnElement, 'Mengirim ke Notion…');
            let ok = false, status = 0;
            try {
                let res = await notionSendPage(token, page, text, nTok);
                let d = await res.json().catch(function () { return {}; });
                // proxy tidak pernah mengirim outer 401 (mencegah redirect global ke login) —
                // status asli Notion ada di field _notion_status bila token ditolak.
                status = d._notion_status || res.status;
                if (status === 401 && localStorage.getItem('clincoo_notion_refresh')) {
                    // token OAuth kedaluwarsa -> refresh sekali lalu ulangi
                    const fresh = await notionRefreshToken();
                    if (fresh) {
                        token = fresh;
                        res = await notionSendPage(token, page, text, nTok);
                        d = await res.json().catch(function () { return {}; });
                        status = d._notion_status || res.status;
                    }
                }
                ok = res.ok && status !== 401 && status !== 403 && !d.message && !d.code;
            } catch (e) { ok = false; }
            if (ok) showGlobalTooltip(btnElement, 'Terkirim ke Notion');
            else if (status === 401 || status === 403) {
                if (!localStorage.getItem('clincoo_notion_refresh')) localStorage.removeItem('clincoo_notion_token');
                openNotionModal(status === 403 ? 'Halaman belum di-share ke integration Notion Clincoo. Periksa halaman tujuan.' : 'Token Notion tidak valid / halaman belum di-share ke integration. Periksa ulang.');

        const TOOL_API_BASE = (['clincoo-be2.pages.dev','localhost','127.0.0.1'].indexOf(location.hostname) === -1) ? 'https://clincoo-be2.pages.dev' : '';

        // ===== WORKSPACE FILE/FOLDER CRUD (shared store with ../workspace/) =====

        function wsFlatten(data) {
            const files = [];
            Object.keys(data || {}).forEach(function(folderKey) {
                (data[folderKey] || []).forEach(function(it) {
                    if (!it || !it.path) return;
                    if (it.type === 'file') {
                        files.push({ path: it.path, content: it.content || '' });
                    } else if (it.type === 'folder') {
                        const hasChildren = Object.keys(data).some(function(k) { return k === it.path || k.startsWith(it.path + '/'); });
                        if (!hasChildren) files.push({ path: it.path + '/', content: '' });
                    }

        function wsSizeLabel(content) {
            const b = new Blob([content || '']).size;
            if (b > 1024 * 1024) return (b / (1024 * 1024)).toFixed(2) + ' MB';
            if (b > 1024) return (b / 1024).toFixed(1) + ' KB';
            return b + ' B';
        }

        function wsUnflatten(files) {
            const data = { 'root': [] };
            const ensureChain = function(folderKey) {
                if (folderKey === 'root') return;
                const parts = folderKey.split('/').filter(Boolean);
                let parent = 'root', cum = '';
                parts.forEach(function(part) {
                    cum = cum ? cum + '/' + part : part;
                    if (!Array.isArray(data[parent])) data[parent] = [];
                    if (!data[parent].some(function(i) { return i && i.type === 'folder' && i.name.toLowerCase() === part.toLowerCase(); })) {
                        data[parent].push({ type: 'folder', name: part, path: cum, fileCount: 0, previewText: 'Folder' });
                    }
                    if (!Array.isArray(data[cum])) data[cum] = [];
                    parent = cum;
                });
            };
            (files || []).forEach(function(f) {
                const p = String((f && f.path) || '').trim();
                const content = (f && f.content) || '';
                if (p.slice(-1) === '/') { ensureChain(p.slice(0, -1)); return; }
                const parts = p.split('/').filter(Boolean);
                const name = parts.pop();
                if (!name) return;
                const folderKey = parts.length ? parts.join('/') : 'root';
                ensureChain(folderKey);
                if (!Array.isArray(data[folderKey])) data[folderKey] = [];
                if (!data[folderKey].some(function(i) { return i.path.toLowerCase() === p.toLowerCase(); })) {
                    data[folderKey].push({ type: 'file', name: name, size: wsSizeLabel(content), path: p, content: content });
                }
            });
            return data;
        }

        let wsCloudTimer = null;

        function wsCloudPushSchedule() {
            const pid = wsProjectId();
            if (!pid) return;

            wsCloudTimer = setTimeout(function() {
                wsCloudTimer = null;

                    .then(function() { return fetch(WS_CLOUD_API, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) }); })
                    .catch(function() {});
            }, 3000);
        }

        // Tarik data workspace dari D1 sekali saat halaman dibuka
        function wsCloudPull() {
            const pid = wsProjectId();
            if (!pid || wsCloudTimer) return;
            fetch(WS_CLOUD_API + '?project_id=' + encodeURIComponent(pid))
                .then(function(r) { return r.ok ? r.json() : Promise.reject(); })
                .then(function(d) {

                    if (files.length) {

                        }
                    } else {

                            fetch(WS_CLOUD_API, { method: 'POST', headers: { 'Content-Type': 'application/json' },
                                body: JSON.stringify({ project_id: pid, files: wsFlatten(wsLoad()) }) }).catch(function() {});

        function wsNormalize(p) {
            let s = String(p || '').trim().replace(/^\/+/, '').replace(/\/+$/, '');
            if (!s || s === 'root') return '';
            if (s.toLowerCase().startsWith('root/')) s = s.substring(5);
            return s.replace(/\/{2,}/g, '/');
        }

        function wsParentInfo(p) {
            const s = wsNormalize(p);
            if (!s) return null;
            const parts = s.split('/').filter(Boolean);
            const name = parts.pop();
            if (!name) return null;
            const folderKey = parts.length > 0 ? parts.join('/') : 'root';
            const itemPath = parts.length > 0 ? folderKey + '/' + name : name;
            return { name, folderKey, itemPath };
        }

        function wsFindItem(data, p) {
            const info = wsParentInfo(p);
            if (!info) return null;
            for (const key of Object.keys(data)) {
                const arr = data[key];
                if (!Array.isArray(arr)) continue;
                for (let i = 0; i < arr.length; i++) {
                    const it = arr[i];
                    if (it && it.path && it.path.toLowerCase() === info.itemPath.toLowerCase()) {
                        return { item: it, index: i, folderKey: key };
                    }
                }
            }
            return null;
        }

        function wsEnsureFolderChain(data, folderKey) {
            if (!Array.isArray(data.root)) data.root = [];
            if (folderKey === 'root') return;
            const parts = folderKey.split('/').filter(Boolean);
            let parent = 'root', cum = '';
            parts.forEach(function(part) {
                cum = cum ? cum + '/' + part : part;
                if (!Array.isArray(data[parent])) data[parent] = [];
                const exists = data[parent].some(function(i) {
                    return i && i.type === 'folder' && i.name.toLowerCase() === part.toLowerCase();
                });
                if (!exists) {
                    data[parent].push({ type: 'folder', name: part, path: cum, fileCount: 0, previewText: 'Folder' });
                }
                if (!Array.isArray(data[cum])) data[cum] = [];
                parent = cum;
            });
        }

        function wsSizeStr(content) {
            const bytes = new Blob([content || '']).size;
            if (bytes > 1024 * 1024) return (bytes / (1024 * 1024)).toFixed(2) + ' MB';
            if (bytes > 1024) return (bytes / 1024).toFixed(1) + ' KB';
            return bytes + ' B';
        }

        function wsListItems(args) {

            const folderKey = key === '' ? 'root' : key;

                total: items.length,

        function wsReadFile(args) {
            const path = args && args.path;
            if (!path) return { success: false, error: 'Parameter path wajib.' };
            const data = wsLoad();
            const found = wsFindItem(data, path);
            if (!found) return { success: false, error: 'File "' + path + '" tidak ditemukan.' };
            if (found.item.type !== 'file') return { success: false, error: '"' + path + '" adalah folder, bukan file.' };
            let content = found.item.content || '';
            let truncated = false;
            if (content.length > 60000) { content = content.substring(0, 60000); truncated = true; }
            return {
                success: true,
                name: found.item.name,
                path: found.item.path,
                size: found.item.size || '',
                truncated: truncated,
                content: content,
                note: truncated ? 'Isi file dipotong 60.000 karakter pertama.' : undefined
            };
        }

        function wsWriteFile(args) {
            const path = args && args.path;
            const content = args && typeof args.content === 'string' ? args.content : '';
            if (!path) return { success: false, error: 'Parameter path wajib.' };
            const data = wsLoad();
            const info = wsParentInfo(path);
            if (!info) return { success: false, error: 'Path file tidak valid: ' + path };
            if (info.name.includes('/')) return { success: false, error: 'Nama file tidak boleh mengandung "/".' };
            wsEnsureFolderChain(data, info.folderKey);
            if (!Array.isArray(data[info.folderKey])) data[info.folderKey] = [];
            const sizeStr = wsSizeStr(content);
            const existingIdx = data[info.folderKey].findIndex(function(i) {
                return i && i.type === 'file' && i.name.toLowerCase() === info.name.toLowerCase();
            });
            let created;
            if (existingIdx !== -1) {
                data[info.folderKey][existingIdx].content = content;
                data[info.folderKey][existingIdx].size = sizeStr;
                created = false;
            } else {
                data[info.folderKey].push({ type: 'file', name: info.name, size: sizeStr, path: info.itemPath, content: content });
                created = true;
            }
            const err = wsSave(data);
            if (err) return err;
            return { success: true, action: created ? 'created' : 'overwritten', path: info.itemPath, size: sizeStr };
        }

        function wsCreateFolder(args) {

        function wsRenameItem(args) {
            const path = args && args.path;
            const newName = args && args.new_name ? String(args.new_name).trim() : '';
            if (!path || !newName) return { success: false, error: 'Parameter path dan new_name wajib.' };
            if (newName.includes('/')) return { success: false, error: 'Nama baru tidak boleh mengandung "/".' };
            const data = wsLoad();
            const found = wsFindItem(data, path);
            if (!found) return { success: false, error: 'Item "' + path + '" tidak ditemukan.' };
            const items = data[found.folderKey] || [];
            const dupe = items.some(function(i) { return i !== found.item && i.name.toLowerCase() === newName.toLowerCase(); });
            if (dupe) return { success: false, error: 'Nama "' + newName + '" sudah digunakan di folder yang sama.' };
            const item = found.item;
            const oldPath = item.path;
            const parentKey = found.folderKey;
            const newPath = parentKey === 'root' ? newName : parentKey + '/' + newName;
            if (item.type === 'folder') {
                Object.keys(data).forEach(function(key) {
                    if (key === oldPath || key.startsWith(oldPath + '/')) {
                        const newKey = newPath + key.substring(oldPath.length);
                        data[newKey] = data[key];
                        delete data[key];
                        if (Array.isArray(data[newKey])) {
                            data[newKey].forEach(function(child) {
                                if (child.path && child.path.startsWith(oldPath + '/')) {
                                    child.path = newPath + child.path.substring(oldPath.length);
                                }
                            });
                        }
                    }
                });
            }
            item.name = newName;
            item.path = newPath;
            const err = wsSave(data);
            if (err) return err;
            return { success: true, action: 'renamed', old_path: oldPath, new_path: newPath };
        }

        function wsDeleteItem(args) {
            const path = args && args.path;
            if (!path) return { success: false, error: 'Parameter path wajib.' };
            const data = wsLoad();
            const found = wsFindItem(data, path);
            if (!found) return { success: false, error: 'Item "' + path + '" tidak ditemukan.' };
            const item = found.item;
            const items = data[found.folderKey] || [];
            if (item.type === 'folder') {
                Object.keys(data).forEach(function(key) {
                    if (key === item.path || key.startsWith(item.path + '/')) {
                        delete data[key];
                    }
                });
            }
            items.splice(found.index, 1);
            const err = wsSave(data);
            if (err) return err;
            return { success: true, action: 'deleted', path: item.path, type: item.type };

        function wsSearchItems(args) {
            const query = args && args.query ? String(args.query).toLowerCase().trim() : '';
            if (!query) return { success: false, error: 'Parameter query wajib.' };

            Object.keys(data).forEach(function(key) {

                    }

            });
            return { success: true, query: query, total: matches.length, items: matches.slice(0, 100) };
        }

        // ===== Konteks workspace untuk AI =====
        function buildWorkspaceContext() {
            try {
                const data = wsLoad();
                if (!data || typeof data !== 'object') return '';
                const lines = [];
                const walk = function(key, prefix) {
                    const items = data[key];
                    if (!Array.isArray(items)) return;
                    items.forEach(function(i) {
                        if (!i || !i.name) return;
                        const p = i.path || (prefix ? prefix + '/' + i.name : i.name);
                        if (i.type === 'folder') { lines.push(p + '/'); walk(p, p); }
                        else lines.push(p + ' (' + (i.size || (i.content ? i.content.length : 0)) + ' B)');
                    });
                };
                walk('root', '');
                return lines.length
                    ? '\n\n[ISI WORKSPACE PROYEK USER SAAT INI — pakai read_file untuk membaca isinya]:\n' + lines.slice(0, 150).join('\n')
                    : '\n\n[WORKSPACE PROYEK MASIH KOSONG — buat file lewat write_file / create_folder bila user meminta]';
            } catch (e) { return ''; }
        }
        async function readNdjsonStream(response, onProgress) {
            const reader = response.body.getReader();
            const dec = new TextDecoder();
            let buf = '', finalObj = null, errObj = null;
            while (true) {
                const { done, value } = await reader.read();
                if (done) break;
                buf += dec.decode(value, { stream: true });
                let idx;
                while ((idx = buf.indexOf('\n')) !== -1) {
                    const line = buf.slice(0, idx).trim();
                    buf = buf.slice(idx + 1);
                    if (!line) continue;
                    let evt; try { evt = JSON.parse(line); } catch (e) { continue; }
                    if (evt.t === 'progress' || evt.t === 'thinking' || evt.t === 'delta') onProgress(evt);
                    else if (evt.t === 'final') finalObj = evt;
                    else if (evt.t === 'error') errObj = evt;
                }
            }
            if (errObj && !finalObj) {
                if (errObj.quota_exhausted) {
                    const e = new Error('__QUOTA__');
                    e.quotaMsg = errObj.error || 'Kuota/limit AI sedang penuh.';
                    e.quotaScope = errObj.scope || null;
                    throw e;
                }
                if (errObj.context_overflow) {
                    const e = new Error('__QUOTA__');
                    e.quotaMsg = errObj.error || 'Konteks percakapan penuh.';
                    e.ctxOverflow = true;
                    throw e;
                }
                throw new Error(errObj.error || 'AI gagal memproses permintaan.');
            }
            if (!finalObj) throw new Error('Koneksi AI terputus. Silakan coba lagi.');
            return { text: finalObj.text || '', model: finalObj.model, session_id: finalObj.session_id, tool_calls: finalObj.tool_calls };
        }

        // Blok generate-image dengan skeleton loading + auto-retry sekali (seed baru) +
        // fallback rapi kalau tetap gagal -- gantikan ikon "broken image" bawaan browser
        // yang terlihat seperti pill kecil "Generated Image" pas gambar gagal termuat.
        function renderImageGenBlock(msgId, imageUrl, prompt) {
            return `<div class="flex justify-center w-full my-2 pointer-events-auto">
                <div class="w-full max-w-sm" id="imgwrap-${msgId}">

        }
        function handleImageGenError(imgEl, msgId) {
            const wrap = document.getElementById('imgwrap-' + msgId);
            if (!wrap) return;
            const prompt = imgEl.getAttribute('data-prompt') || '';
            const retried = imgEl.getAttribute('data-retried') === '1';
            if (!retried) {
                // Coba sekali lagi diam-diam dengan seed baru sebelum benar2 dianggap gagal.
                const newSeed = Math.floor(Math.random() * 1000000);
                imgEl.setAttribute('data-retried', '1');
                imgEl.src = `https://image.pollinations.ai/prompt/${encodeURIComponent(prompt)}?seed=${newSeed}&nologo=true`;
                return;
            }
            wrap.innerHTML = `
                <div class="flex flex-col items-center justify-center gap-2 py-8 px-4 rounded-xl" style="background:rgba(120,120,130,0.08); border:1px solid rgba(120,120,130,0.18);">

                    <span style="color:#8b8b93; font-size:13px;">Failed to generate the image.</span>
                    <button type="button" onclick="retryImageGeneration('${msgId}', '${encodeURIComponent(prompt)}')" style="color:#9ca3af; font-size:13px; text-decoration:underline; text-underline-offset:2px; cursor:pointer; background:none; border:none;">Try again</button>
                </div>`;
        }
        function retryImageGeneration(msgId, encodedPrompt) {
            const wrap = document.getElementById('imgwrap-' + msgId);
            if (!wrap) return;
            const prompt = decodeURIComponent(encodedPrompt);
            const seed = Math.floor(Math.random() * 1000000);
            const imageUrl = `https://image.pollinations.ai/prompt/${encodeURIComponent(prompt)}?seed=${seed}&nologo=true`;
            wrap.innerHTML = `
                <div class="img-skeleton rounded-xl" id="imgskel-${msgId}"></div>
                <img src="${imageUrl}" data-prompt="${escText(prompt)}" data-retried="0"
                     class="w-full max-w-sm rounded-xl shadow-[0_5px_15px_rgba(0,0,0,0.1)] border border-gray-200"
                     alt="Generated Image" style="display:none"
                     onload="document.getElementById('imgskel-${msgId}')?.remove(); this.style.display='block'; scrollToBottom(true);"
                     onerror="handleImageGenError(this, '${msgId}')">`;

        // ==== Pemangkasan riwayat otomatis (konteks skala 1M token tetap muat) ====
        // Chat panjang dgn banyak write_file besar bikin total payload jutaan karakter.
        // Sebelum kirim: kalau payload melebihi ~350KB, pangkas isi file & hasil tool
        // LAMA (10 pesan terakhir utuh) — AI tetap bisa read_file ulang bila perlu.
        // Tampilan chat TIDAK berubah: hanya payload kirim yang dipangkas.
        function compactHistoryForContext(msgs) {
            try {
                if (!Array.isArray(msgs) || msgs.length <= 11) return msgs;
                let total = 0;
                try { total = JSON.stringify(msgs).length; } catch (e) { return msgs; }
                if (total < 350_000) return msgs; // < ~350KB masih aman utk context window
                const CUTOFF = 3000;
                return msgs.map((m, idx) => {
                    if (!m || idx >= msgs.length - 10 || idx === 0) return m; // system + 10 terakhir utuh
                    if (!Array.isArray(m.content)) return m;
                    let changed = false;
                    const content = m.content.map(b => {
                        if (!b || typeof b !== 'object') return b;
                        if (b.type === 'function_call' && b.args && typeof b.args === 'object') {
                            const a = Object.assign({}, b.args);
                            for (const key of ['content', 'code', 'file_content', 'new_content', 'text']) {
                                if (typeof a[key] === 'string' && a[key].length > CUTOFF) {
                                    a[key] = a[key].slice(0, 800) + '\n…[dipangkas otomatis — hasil/berkas lama; baca ulang via read_file bila perlu]';
                                    changed = true;
                                }
                            }
                            return changed ? Object.assign({}, b, { args: a }) : b;
                        }
                        if (b.type === 'function_response') {
                            let rs; try { rs = JSON.stringify(b.result); } catch (e) { rs = ''; }
                            if (rs && rs.length > 6000) {
                                changed = true;
                                return Object.assign({}, b, { result: { info: '(hasil tool lama dipangkas otomatis)', preview: rs.slice(0, 800) } });
                            }
                        }
                        return b;
                    });
                    return changed ? { role: m.role, content: content } : m;
                });
            } catch (e) { return msgs; }
        }

        // ===== TOOL SUPER: sandbox CLI, web reader/search, aksi proyek =====
        async function toolRunCommand(args) {
            const cmd = args && args.command ? String(args.command) : '';
            const wantReset = !!(args && args.reset);
            if (!cmd) return { success: false, error: 'Parameter command wajib.' };
            // Diproxy di server (/api/e2b-run, mode command): API key E2B tidak pernah
            // diunduh ke browser (perbaikan keamanan; dulu key dibagikan mentah).
            // reset:true -> buang sesi lama dulu, lalu command jalan di Linux baru.
            try {
                if (wantReset) {
                    try {
                        await fetch(TOOL_API_BASE + '/api/e2b-run', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ mode: 'reset_session' })
                        });
                    } catch (e) {}
                }
                const res = await fetch(TOOL_API_BASE + '/api/e2b-run', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ mode: 'command', command: cmd })
                });
                const d = await res.json().catch(() => null);
                if (!d) return { success: false, error: 'Respons sandbox tidak valid.' };
                if (d.error && !d.ok) return { success: false, error: String(d.error.value || d.error.name || 'Eksekusi gagal.') };
                const errText = String(d.error && d.error.value ? (d.error.name ? d.error.name + ': ' : '') + d.error.value : (d.stderr || '')).slice(0, 1500);
                return {
                    success: !!d.ok,
                    command: cmd,
                    stdout: String(d.stdout || '').slice(0, 3800),
                    stderr: errText
                };
            } catch (e) {
                return { success: false, error: 'Sandbox eksekusi tidak tersedia: ' + (e && e.message ? e.message : 'galat tak dikenal') };
            }
        }

        async function toolWebSearch(args) {
            const query = args && args.query ? String(args.query) : '';
            if (!query) return { success: false, error: 'Parameter query wajib.' };
            const res = await fetch(TOOL_API_BASE + '/api/jina', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ mode: 'search', query: query }) });

        // AI menyimpan identitas proyek (Pengaturan Umum): nama & deskripsi dari pembahasan chat,

        async function toolSetProjectInfo(args) {

            const appDesc = args && args.app_desc ? String(args.app_desc).trim() : '';

            const stRes = await fetch(TOOL_API_BASE + '/api/project-settings', {
                method: 'POST', headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ project_id: pid, app_name: appName, app_desc: appDesc })
            });
            const st = await stRes.json();
            if (!stRes.ok || st.error) return { success: false, error: st.error || 'Gagal menyimpan Pengaturan Umum.' };
            // 2) sinkronkan judul proyek di server + lokal supaya kartu langsung benar
            try {
                const listRes = await fetch(TOOL_API_BASE + '/api/projects');
                const d = await listRes.json();
                const proj = (Array.isArray(d.projects) ? d.projects : []).find(function (x) { return String(x.id) === String(pid); });

                    await fetch(TOOL_API_BASE + '/api/projects', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ action: 'upsert', project: Object.assign({}, proj, { title: appName }) }) });
                }

                const list = stored ? JSON.parse(stored) : [];
                const lp = list.find(function (x) { return String(x.id) === String(pid); });
                if (lp) { lp.title = appName; localStorage.setItem('clinqoo_projects', JSON.stringify(list)); }

        // ==== BULK WRITE: puluhan file dalam SATU panggilan tool ====
        async function toolWriteFiles(args) {
            const files = Array.isArray(args && args.files) ? args.files : [];
            if (!files.length) return { success: false, error: 'Parameter files wajib array [{path, content}].' };
            if (files.length > 60) return { success: false, error: 'Maksimal 60 file per panggilan — bagi jadi beberapa write_files.' };
            let created = 0, updated = 0, failed = [];
            for (const f of files) {
                const r = wsWriteFile({ path: f && f.path, content: (f && typeof f.content === 'string') ? f.content : '' });
                if (r && r.success) { if (r.created === false) updated++; else created++; }
                else failed.push(String((f && f.path) || '(tanpa path)'));
            }
            const out = { success: failed.length === 0, written: created + updated, created: created, updated: updated };
            if (failed.length) { out.failed = failed.slice(0, 10); out.error = failed.length + ' file gagal: ' + failed.slice(0, 3).join(', '); }
            return out;
        }

        // ==== CLONE REPO: salin seluruh isi repo GitHub ke folder workspace ====
        async function ghApi(url, token, method, body) {
            const h = { 'Accept': 'application/vnd.github+json' };
            if (token) h['Authorization'] = 'Bearer ' + token;
            if (body !== undefined) h['Content-Type'] = 'application/json';
            const res = await fetch(url, { method: method || 'GET', headers: h, body: body !== undefined ? JSON.stringify(body) : undefined });
            let j = null; try { j = await res.json(); } catch (e) {}
            return { ok: res.ok, status: res.status, data: j };
        }
        function ghRepoSlug(v) {
            const m = /^(?:https?:\/\/)?(?:www\.)?github\.com\/([^\/\s]+)\/([^\/\s]+?)(?:\.git)?\/?$/i.exec(String(v || '').trim());
            if (m) return m[1] + '/' + m[2];
            return /^[A-Za-z0-9_.-]+\/[A-Za-z0-9_.-]+$/.test(String(v || '').trim()) ? String(v).trim() : null;
        }
        function b64ToText(b64) {
            try { return decodeURIComponent(escape(atob(String(b64 || '').replace(/\s/g, '')))); }
            catch (e) { try { return atob(String(b64 || '').replace(/\s/g, '')); } catch (e2) { return null; } }
        }
        async function toolCloneRepo(args) {
            const repo = ghRepoSlug(args && args.repo);
            if (!repo) return { success: false, error: 'Parameter repo wajib format owner/nama atau URL GitHub, contoh "tailwindlabs/heroicons".' };
            const dest = String((args && args.folder) || '').trim().replace(/^\/+|\/+$/g, '') || repo.split('/')[1];
            const ref = String((args && args.ref) || '').trim();
            let token = ''; try { token = localStorage.getItem('clincoo_gh_token') || ''; } catch (e) {}
            // 1) info repo -> default branch
            const ri = await ghApi('https://api.github.com/repos/' + repo, token);
            if (ri.status === 404) return { success: false, error: 'Repo tidak ditemukan. Bila repo privat, hubungkan GitHub dulu di menu Integrasi (konektor GitHub). Bila publik, cek ejaan owner/nama repo.' };
            if (!ri.ok) return { success: false, error: 'Gagal membaca repo (HTTP ' + ri.status + ').' };
            const branch = ref || ((ri.data && ri.data.default_branch) || 'main');
            // 2) tree recursive
            const ti = await ghApi('https://api.github.com/repos/' + repo + '/git/trees/' + encodeURIComponent(branch) + '?recursive=1', token);
            if (!ti.ok) return { success: false, error: 'Gagal membaca isi repo branch ' + branch + ' (HTTP ' + ti.status + ').' };
            const blobs = ((ti.data && ti.data.tree) || []).filter(function (t) { return t && t.type === 'blob'; });
            const SKIP_DIR = /(^|\/)(\.git|node_modules|__MACOSX|\.next)(\/|$)/i;
            const SKIP_EXT = /\.(png|jpe?g|gif|webp|bmp|ico|zip|tar|gz|rar|7z|pdf|mp3|mp4|mov|avi|mkv|woff2?|ttf|otf|eot|exe|dll|so|dylib|bin|jar|class|pyc|wasm|psd|ai|sketch)$/i;
            const MAX_FILES = 300, MAX_SIZE = 256 * 1024;
            let saved = 0, skipped = [], truncated = false;
            for (const t of blobs) {
                if (saved >= MAX_FILES) { truncated = true; break; }
                const p = String(t.path || '');
                if (!p || SKIP_DIR.test(p) || SKIP_EXT.test(p) || (t.size || 0) > MAX_SIZE) { skipped.push(p); continue; }
                const ci = await ghApi('https://api.github.com/repos/' + repo + '/contents/' + p.split('/').map(encodeURIComponent).join('/') + '?ref=' + encodeURIComponent(branch), token);
                if (!ci.ok) { skipped.push(p); continue; }
                const content = ci.data && ci.data.content ? b64ToText(ci.data.content) : null;
                if (content === null) { skipped.push(p); continue; }
                const w = wsWriteFile({ path: dest + '/' + p, content: content });
                if (w && w.success) saved++; else skipped.push(p);
            }
            const out = { success: true, repo: repo, branch: branch, folder: dest, files_copied: saved, skipped: skipped.length };
            if (truncated) { out.truncated = true; out.note = 'Clone dipotong di ' + MAX_FILES + ' file (repo terlalu besar) — file terpenting biasanya tetap ikut.'; }
            else out.note = 'Repo tersimpan ke folder "' + dest + '/" di workspace — datanya kini tersimpan permanen, siap diubah, dicari (search_items), di-deploy, atau di-push.';
            if (skipped.length) out.skipped_sample = skipped.slice(0, 8);
            return out;
        }

        // ==== PUSH KE GITHUB: seluruh file workspace -> repo user ====
        function textToB64(str) { return btoa(unescape(encodeURIComponent(str || ''))); }
        async function toolPushToGithub(args) {
            const repo = ghRepoSlug(args && args.repo);
            if (!repo) return { success: false, error: 'Parameter repo wajib format owner/nama atau URL GitHub.' };
            const branch = String((args && args.branch) || '').trim() || 'main';
            const msg = String((args && args.commit_message) || '').trim() || 'Update dari Clincoo';
            let token = ''; try { token = localStorage.getItem('clincoo_gh_token') || ''; } catch (e) {}
            if (!token) return { success: false, error: 'GitHub belum terhubung. Buka menu Integrasi di sidebar kiri, hubungkan GitHub, lalu coba lagi.' };
            const all = wsFlatten(wsLoad());
            const files = all.filter(function (f) { return f.path && !f.path.endsWith('/'); });
            if (!files.length) return { success: false, error: 'Workspace kosong — tidak ada file untuk di-push. Buat/clone file dulu.' };
            const CAP = 200;
            const list = files.length > CAP ? files.slice(0, CAP) : files;
            // pastikan branch ada: cek satu panggilan ringan
            const br = await ghApi('https://api.github.com/repos/' + repo + '/branches/' + encodeURIComponent(branch), token);
            if (br.status === 404) return { success: false, error: 'Branch "' + branch + '" tidak ada di repo ' + repo + '. Buat branchnya dulu (github_request POST /repos/' + repo + '/git/refs) atau pakai branch yang ada, mis. main/master.' };
            if (!br.ok) return { success: false, error: 'Gagal mengakses repo ' + repo + ' (HTTP ' + br.status + ') — cek nama repo dan izin konektor GitHub.' };
            let pushed = 0, failed = [];
            for (const f of list) {
                const ghPath = f.path.replace(/^\/+/, '').split('/').map(encodeURIComponent).join('/');
                const g = await ghApi('https://api.github.com/repos/' + repo + '/contents/' + ghPath + '?ref=' + encodeURIComponent(branch), token);
                const body = { message: msg + ' — ' + f.path, content: textToB64(f.content), branch: branch };
                if (g.ok && g.data && g.data.sha) body.sha = g.data.sha;
                const put = await ghApi('https://api.github.com/repos/' + repo + '/contents/' + ghPath, token, 'PUT', body);
                if (put.ok) pushed++; else failed.push(f.path + ' (HTTP ' + put.status + ')');
            }
            const out = { success: failed.length === 0, repo: repo, branch: branch, pushed: pushed, total: list.length, url: 'https://github.com/' + repo };
            if (files.length > CAP) out.note = 'Hanya ' + CAP + ' file pertama di-push (workspace terlalu besar) — ulangi setelahnya bila perlu.';
            if (failed.length) { out.failed_sample = failed.slice(0, 8); out.error = (list.length - pushed) + ' file gagal di-push.'; }
            return out;
        }

        async function toolAddEnvVar(args) {
            const key = args && args.key ? String(args.key).trim().toUpperCase() : '';
