        /* "Menjalankan Tugas" — TANPA kartu: nempel bersih ke background halaman,
           tidak ada border/shadow/box terpisah. Hanya untuk tool workspace/aksi nyata
           (bukan sekadar pencarian info — lihat isInfoOnlyToolCalls di JS). */
        .toolcalls-card { border: none; border-radius: 0; background: transparent; overflow: visible; box-shadow: none; }
        body.dark-mode .toolcalls-card { border: none; background: transparent; box-shadow: none; }
        /* Monokrom abu2, bersih — terinspirasi pill "Thought for Xs" tapi beda: pakai
           badge lingkaran outline (bukan icon polos) + teks tetap menyertakan jumlah langkah. */
        .toolcalls-summary { display: flex; align-items: center; gap: 8px; width: 100%; padding: 6px 0; margin: 0; background: none; border: none; cursor: pointer; text-align: left; font-size: 13px; font-weight: 500; color: #6b7280; transition: opacity 0.15s ease; }
        .toolcalls-summary:hover { opacity: 0.75; }
        body.dark-mode .toolcalls-summary { color: #9ca3af; }
        body.dark-mode .toolcalls-summary:hover { opacity: 0.8; }
        /* Bare icon tanpa lingkaran/box — persis gaya pill "Thought for Xs": ikon polos + teks + chevron, monokrom abu2 bawaan Clincoo (tanpa ungu). */
        .toolcalls-badge { display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0; color: #6b7280; }
        body.dark-mode .toolcalls-badge { color: #9ca3af; }

        .toolcalls-summary.open .tc-chevron { transform: rotate(180deg); }
        .toolcalls-livebar { height: 2px; width: 100%; background: linear-gradient(90deg, transparent 0%, #6366f1 30%, #8b5cf6 50%, #6366f1 70%, transparent 100%); background-size: 220% 100%; animation: tc-sweep 1.6s ease-in-out infinite; }
        @keyframes tc-sweep { 0% { background-position: 120% 0; } 100% { background-position: -120% 0; } }
        .toolcalls-list { display: flex; flex-direction: column; border-top: none; border-left: 2px solid #eef0f3; margin-left: 12px; padding-left: 6px; animation: tc-fadein 0.2s ease; }
        @keyframes tc-fadein { from { opacity: 0; transform: translateY(-3px); } to { opacity: 1; transform: none; } }
        body.dark-mode .toolcalls-list { border-left-color: #26262b; }
        .toolcalls-item { border-bottom: 1px solid #f0f2f5; }

        .toolcalls-item-header { display: flex; align-items: center; gap: 9px; width: 100%; padding: 8px 13px; background: none; border: none; cursor: pointer; text-align: left; font-size: 12.5px; font-weight: 500; color: #4b5563; }

        .toolcalls-item-header.open .tc-chevron { transform: rotate(180deg); }
        .toolcalls-item-label { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; flex: 1 1 auto; }
        .toolcalls-summary-text { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; flex: 1 1 auto; }
        .toolcalls-item-detail { padding: 0 13px 10px 34px; display: flex; flex-direction: column; gap: 6px; }

        /* Chip "Lanjutkan" pada checkpoint kehabisan token */
        .checkpoint-chip { display: inline-flex; align-items: center; gap: 7px; margin-top: 10px; padding: 8px 16px; border-radius: 999px; border: 1px solid #e0e4ea; background: #ffffff; color: #111827; font-size: 13px; font-weight: 600; cursor: pointer; box-shadow: 0 1px 3px rgba(15,23,42,0.06); transition: all 0.18s ease; }

        /* Kartu POLLING: stepper berurutan — 1 pertanyaan terbuka, lainnya terkunci,
           garis penghubung antar nomor mengisi saat terjawab. Netral, tanpa ungu. */
        .poll-card { margin-top: 0.375rem; border: none; background: transparent; padding: 0.125rem 0 0; }
        .poll-card-head { display: flex; align-items: center; justify-content: space-between; gap: 0.625rem; margin-bottom: 0.5rem; }
        .poll-head-title { font-size: 12.5px; font-weight: 600; color: #4b5563; line-height: 1.35; }
        .poll-head-badge { flex-shrink: 0; font-size: 11px; font-weight: 600; color: #6b7280; background: #f3f4f6; border: 1px solid #e5e7eb; border-radius: 999px; padding: 2px 9px; line-height: 1.4; }
        .poll-head-badge.done { background: #111827; border-color: #111827; color: #ffffff; }
        .poll-steps { display: flex; flex-direction: column; }
        .poll-step { position: relative; display: flex; gap: 0.625rem; padding-bottom: 0.875rem; }
        .poll-step:last-child { padding-bottom: 0.25rem; }
        .poll-rail { position: absolute; left: 10px; top: 26px; bottom: 2px; width: 2px; background: #e5e7eb; border-radius: 2px; }
        .poll-rail.done { background: #111827; }
        .poll-node { position: relative; z-index: 1; flex-shrink: 0; width: 22px; height: 22px; border-radius: 999px; background: #ffffff; border: 2px solid #d1d5db; color: #9ca3af; font-size: 11px; font-weight: 600; display: inline-flex; align-items: center; justify-content: center; }
        .poll-step.active .poll-node { background: #111827; border-color: #111827; color: #ffffff; }
        .poll-step.answered .poll-node { background: #111827; border-color: #111827; color: #ffffff; font-size: 10px; }
        .poll-step.locked { opacity: 0.5; }
        .poll-step.locked .poll-node { background: #f3f4f6; }
        .poll-step-body { min-width: 0; flex: 1; }
        .poll-step-q { font-size: 13.5px; font-weight: 500; color: #1f2937; line-height: 1.45; padding-top: 1px; }
        .poll-step.locked .poll-step-q { font-weight: 400; color: #6b7280; }
        .poll-opts { margin-top: 0.5rem; display: flex; flex-direction: column; gap: 0.375rem; }
        .poll-opt { display: flex; align-items: center; gap: 0.625rem; width: 100%; text-align: left; padding: 0.625rem 0.75rem; border-radius: 10px; background: #ffffff; border: 1px solid #e5e7eb; font-size: 13px; color: #1f2937; cursor: pointer; transition: background 0.15s ease, border-color 0.15s ease, transform 0.15s ease; }
        .poll-opt:hover { background: #fafafa; border-color: #9ca3af; transform: translateY(-1px); }
        .poll-opt:active { transform: translateY(0); background: #f3f4f6; }
        .poll-opt-text { min-width: 0; flex: 1; line-height: 1.4; }
        .poll-opt-letter { flex-shrink: 0; width: 22px; height: 22px; border-radius: 6px; background: #f3f4f6; border: 1px solid #e5e7eb; color: #4b5563; font-size: 11px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center; }
        .poll-opt:hover .poll-opt-letter { border-color: #111827; color: #111827; }
        .poll-opt.other { border-style: dashed; color: #6b7280; }
        .poll-other-title { display: block; font-weight: 500; color: #4b5563; }
        .poll-other-sub { display: block; font-size: 11px; color: #9ca3af; margin-top: 1px; }
        .poll-manual { margin-top: 0.5rem; display: flex; gap: 0.5rem; align-items: center; }
        .poll-manual input { flex: 1; min-width: 0; border: 1px solid #d1d5db; border-radius: 999px; background: #ffffff; color: #1f2937; font-size: 13px; padding: 0.5rem 0.875rem; outline: none; transition: border-color 0.15s ease; font-family: inherit; }
        .poll-manual input:focus { border-color: #111827; }
        .poll-manual button { flex-shrink: 0; border: none; border-radius: 999px; background: #111827; color: #ffffff; font-size: 12px; font-weight: 600; padding: 0.5rem 0.9rem; cursor: pointer; }
        body.dark-mode .poll-manual input { background: #18181b; border-color: #3f3f46; color: #e5e7eb; }
        body.dark-mode .poll-manual input:focus { border-color: #e5e7eb; }
        body.dark-mode .poll-manual button { background: #e5e7eb; color: #111827; }
        .poll-ans { margin-top: 0.25rem; font-size: 12.5px; color: #15803d; }
        .poll-card-hint { font-size: 11.5px; color: #9ca3af; margin-top: 0.625rem; line-height: 1.5; }
        body.dark-mode .poll-card { background: transparent; border-color: transparent; }
        body.dark-mode .poll-head-title { color: #9ca3af; }
        body.dark-mode .poll-head-badge { background: #222226; border-color: #2c2c33; color: #9ca3af; }
        body.dark-mode .poll-head-badge.done { background: #e5e7eb; border-color: #e5e7eb; color: #111827; }
        body.dark-mode .poll-opt:hover { background: #1d1d21; border-color: #6b7280; }
        body.dark-mode .poll-opt:hover .poll-opt-letter { border-color: #e5e7eb; color: #e5e7eb; }
        body.dark-mode .poll-other-title { color: #9ca3af; }
        body.dark-mode .poll-other-sub { color: #6b7280; }
        body.dark-mode .poll-rail { background: #2a2a30; }
        body.dark-mode .poll-rail.done { background: #e5e7eb; }
        body.dark-mode .poll-node { background: #18181b; border-color: #3f3f46; color: #6b7280; }
        body.dark-mode .poll-step.active .poll-node { background: #e5e7eb; border-color: #e5e7eb; color: #111827; }
        body.dark-mode .poll-step.answered .poll-node { background: #e5e7eb; border-color: #e5e7eb; color: #111827; }
        body.dark-mode .poll-step-q { color: #e5e7eb; }
        body.dark-mode .poll-step.locked .poll-step-q { color: #9ca3af; }
        body.dark-mode .poll-opt { background: #18181b; border-color: #2c2c33; color: #e5e7eb; }
        body.dark-mode .poll-opt:hover { background: #222226; border-color: #3f3f46; }
        body.dark-mode .poll-opt-letter { background: #222226; border-color: #3f3f46; color: #9ca3af; }
        body.dark-mode .poll-ans { color: #2fbf71; }
        body.dark-mode .poll-card-hint { color: #6b7280; }
        /* Kartu SETUP APK & BUILD APK — kapsul input, ikon bulat, popover pengaturan.
           Netral ala poll-card (abu/hitam), tanpa biru default. */
        .apk-card { margin-top: 0.375rem; border: 1px solid #e5e7eb; border-radius: 14px; background: #ffffff; padding: 0.875rem; }
        .apk-card-head { display: flex; align-items: center; gap: 0.5rem; font-size: 12.5px; font-weight: 700; color: #111827; margin-bottom: 0.75rem; }

        .apk-icon-btn { position: relative; flex-shrink: 0; width: 64px; height: 64px; border-radius: 999px; border: 1.5px dashed #d1d5db; background: #f9fafb; display: inline-flex; align-items: center; justify-content: center; cursor: pointer; overflow: hidden; padding: 0; transition: border-color 0.15s ease; }
        .apk-icon-btn:hover { border-color: #111827; }
        .apk-icon-btn.has-icon { border-style: solid; }

        .apk-icon-btn i { font-size: 22px; color: #9ca3af; }
        .apk-icon-hint { font-size: 11.5px; color: #6b7280; line-height: 1.5; }
        /* Langkah LOGO — flat, tanpa kotak/card, sentris: bulatan di tengah, "Lewati" di bawahnya */
        .apk-logo-row { display: flex; flex-direction: column; align-items: center; gap: 0.625rem; margin: 0.75rem 0; }

        .apk-pill-btn.secondary { background: #f3f4f6; color: #111827; border: 1px solid #e5e7eb; }
        .apk-set-row { display: flex; align-items: center; gap: 0.5rem; margin-top: 0.625rem; flex-wrap: wrap; }
        .apk-set-chip { display: inline-flex; align-items: center; gap: 0.375rem; font-size: 11.5px; font-weight: 500; color: #4b5563; border: 1px solid #e5e7eb; background: #f9fafb; border-radius: 999px; padding: 0.3rem 0.7rem; cursor: pointer; font-family: inherit; }

        .apk-pop-row { display: flex; align-items: center; justify-content: space-between; gap: 0.5rem; font-size: 12.5px; color: #1f2937; }

        .apk-seg button.on { background: #111827; color: #ffffff; }

        (function () {
            var sheet = _sheetEl, handle = document.getElementById('chat-sheet-handle');
            if (!sheet || !handle) return;
            var startY = 0, lastY = 0, lastT = 0, curY = 0, vY = 0, dragging = false;
            function baseY() {
                var m = /translateY\((-?[0-9.]+)px\)/.exec(sheet.style.transform || '');
                if (m) return parseFloat(m[1]);
                return document.body.classList.contains('sheet-closed') ? sheet.offsetHeight * 1.15 : 0;
            }
            function onStart(e) { dragging = true; curYPrev = 0; startY = lastY = (e.touches ? e.touches[0].clientY : e.clientY); lastT = Date.now(); vY = 0; sheet.style.transition = 'none'; }
            function onMove(e) {
                if (!dragging) return;
                e.preventDefault();
                var y = (e.touches ? e.touches[0].clientY : e.clientY);
                curY = Math.max(0, baseY() + (y - lastY));
                var now = Date.now(), dt = now - lastT || 16; vY = (y - lastY) / dt; lastY = y; lastT = now;
                sheet.style.transform = 'translateY(' + curY + 'px)';
            }
            function onEnd() {
                if (!dragging) return; dragging = false;
                sheet.style.transition = ''; sheet.style.transform = ''; curY = 0;
                var h = sheet.offsetHeight || 500;
                if (vY > 0.6 || curYPrev > h * 0.25) window.chatSheetClose(); else window.chatSheetOpen();
            }
            var curYPrev = 0;
            function onMovePrev(e) { onMove(e); curYPrev = curY; }
            handle.addEventListener('touchstart', onStart, { passive: true });
            handle.addEventListener('touchmove', onMovePrev, { passive: false });
            handle.addEventListener('touchend', onEnd);
            handle.addEventListener('touchcancel', onEnd);
            // mouse utk tes di desktop devtools

        window.chatExportZip = function () {
    closeHeaderMenu();
    var pid = ''; try { pid = localStorage.getItem('clincoo_current_project_id') || ''; } catch (e) {}
    var key = 'clincoo_workspace_files_' + (pid || 'global');
    var byPath = {};
    var raw = null;
    try { raw = localStorage.getItem(key); } catch (e) {}
    if (!raw) { try { var legacy = localStorage.getItem('clincoo_workspace_files'); if (legacy) { localStorage.setItem(key, legacy); raw = legacy; } } catch (e) {} }
    try {
        var d = JSON.parse(raw) || {};
        Object.keys(d).forEach(function (k) {
            (d[k] || []).forEach(function (it) {
                if (it && it.path && it.type === 'file') byPath[it.path] = it.content || '';
            });
        });
    } catch (e) {}
    var WS_API = (['clincoo-be2.pages.dev', 'localhost', '127.0.0.1'].indexOf(location.hostname) === -1 ? 'https://clincoo-be2.pages.dev/api' : '/api') + '/project-files';
    var tk = ''; try { tk = localStorage.getItem('clincoo_auth_token') || localStorage.getItem('clincoo_token') || ''; } catch (e) {}
    var headers = tk ? { Authorization: 'Bearer ' + tk } : {};
    var filesFromMap = function () {
        return Object.keys(byPath).sort().map(function (p) { return { path: p, content: byPath[p] }; });
    };
    var finish = function (files) {
        if (!files.length) { alert('Tidak ada berkas di Workspace untuk dieksport.'); return; }
        var run = function () {
            var zip = new window.JSZip();
            files.forEach(function (f) { zip.file(f.path, f.content || ''); });
            zip.generateAsync({ type: 'blob' }).then(function (blob) {
                var a = document.createElement('a');
                a.href = URL.createObjectURL(blob);
                a.download = (pid || 'clincoo') + '.zip';
                document.body.appendChild(a);
                a.click();
                a.remove();
                setTimeout(function () { URL.revokeObjectURL(a.href); }, 500);
            });
        };
        if (window.JSZip) { run(); return; }
        var sc = document.createElement('script');
        sc.src = 'https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js';
        sc.onload = run;
        document.head.appendChild(sc);
    };
    if (!pid) { finish(filesFromMap()); return; }
    // Gabungkan file cloud (D1) supaya SEMUA berkas Workspace ikut terekspor.
    fetch(WS_API + '?project_id=' + encodeURIComponent(pid), { headers: headers })
        .then(function (r) { return r.ok ? r.json() : Promise.reject(); })
        .then(function (resp) {
            ((resp && resp.files) || []).forEach(function (f) {
                if (f && f.path && !(f.path in byPath)) byPath[f.path] = f.content || '';
            });
            finish(filesFromMap());
        })
        .catch(function () { finish(filesFromMap()); });
};

        function buildPromptChips() {
            const wrap = document.getElementById('prompt-chips');
            if (!wrap) return;
            if (isGenerating || (typeof quotaLocked !== 'undefined' && quotaLocked)) { stopPromptChipCycle(); wrap.classList.add('hidden'); return; }
            if (best === null && promptChipCycle) { stopPromptChipCycle(); }
            const vis = messages.filter(m => m && !m.isHidden && !m.silent && m.text);
            let txt = '';
            for (let i = Math.max(0, vis.length - 10); i < vis.length; i++) txt += ' ' + String(vis[i].text).toLowerCase();
            let best = null, bestScore = 0;
            PROMPT_CHIP_LIB.forEach(topic => {
                let score = 0;
                topic.keys.forEach(k => { if (txt.indexOf(k) !== -1) score += 1; });
                if (score > bestScore) { bestScore = score; best = topic; }
            });
            if (!best) { stopPromptChipCycle(); wrap.classList.add('hidden'); wrap.setAttribute('data-sig', ''); return; }
            const chips = best.chips.slice(0, 4);
            const sig = chips.join('|');
            if (wrap.getAttribute('data-sig') === sig) { wrap.classList.remove('hidden'); return; }
            wrap.setAttribute('data-sig', sig);
            stopPromptChipCycle();
            wrap.innerHTML = '';

        // --- Security helpers (anti-XSS) ---
        function escText(s) {
            return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
        }
        function escUrl(u) {
            const s = String(u || '');
            return (/^(https?:|data:image\/)/i.test(s)) ? escText(s) : '';
        }
        // Rapihin markdown "sloppy" dari model kecil (mis. model flash kecil) sebelum render:
        // penanda ** teks ** / * teks * / ~~ teks ~~ yang dipisah spasi (tidak valid
        // di CommonMark -> tampil bintang mentah), heading yang menjorok spasi, dan
        // blok JSON yang lepas tanpa fence code (tampil "keluar format json").
        // Konten di dalam ``` fence TIDAK disentuh. Fungsi idempoten (aman dipanggil
        // berulang oleh typewriter 15ms).
        function tidyMarkdown(src) {
            if (!src) return src;
            var parts = src.split(/(```[\s\S]*?```)/g);
            for (var i = 0; i < parts.length; i += 2) {
                var seg = parts[i];
                if (!seg) continue;
                seg = seg.replace(/(?:^|\n\n)[ \t]*([{[][\s\S]*?[}\]][ \t]*(?=\n\n|$))/g, function (m, json) {
                    return (m.charAt(0) === '\n' ? '\n\n' : '') + '```json\n' + json.trim() + '\n```';
                });
                // BUG LAMA: [\s\S]*? lintas baris bisa menyatukan "**" penutup di satu
                // baris dengan "**" pembuka di baris lain (lintas bullet/paragraf) ->
                // markdown rusak parah. Dibatasi SATU BARIS ([^\n]*?) karena bold
                // model AI selalu ditutup di baris yang sama.
                seg = seg.replace(/(^|\s)\*\*[ \t]+([^\n*]*?)[ \t]+\*\*/g, '$1**$2**');  // hanya PEMBUKA ** (didahului spasi/awal): '** a **'->'**a**'; tidak melintasi bold lain ('**x** dan **y**' utuh)
                // Model kadang menulis buka 3 bintang tapi tutup 2 (atau sebaliknya),
                // mis. "***TCP Connect:**" -> normalkan ke "**TCP Connect:**" agar
                // tidak muncul 1 bintang mentah tersisa saat dirender.
                seg = seg.replace(/\*{3}([^*\n]+?)\*{2}(?!\*)/g, '**$1**');
                seg = seg.replace(/(?<!\*)\*{2}([^*\n]+?)\*{3}/g, '**$1**');
                seg = seg.replace(/(^|[^\w*\\])\*[ \t]+([^*\n]*?)[ \t]+\*(?![*])/g, '$1*$2*');
                seg = seg.replace(/~~[ \t]+([^\n]*?)[ \t]+~~/g, '~~$1~~');  // sama: dibatasi satu baris
                // Penanda penutup (**/*/~~) nempel langsung ke huruf/angka berikutnya tanpa spasi
                // (mis. "**Orientasi:**Portrait") -> per CommonMark, penutup didahului tanda baca
                // (":") dan diikuti huruf GAGAL flank kanan, jadi dianggap teks biasa (bintang
                // mentah tampil, keluhan user). Sisipkan 1 spasi setelah penutup agar valid.
                seg = seg.replace(/\*\*([^*\n]+?)\*\*/g, function (m, p1, offset, full) {
                    var next = full.charAt(offset + m.length);
                    return (next && !/[\s*.,!?;:)\]}"'\u2019\u201d-]/.test(next)) ? '**' + p1 + '** ' : m;
                });
                seg = seg.replace(/(^|[^\w*])\*([^*\n]+?)\*(?!\*)/g, function (m, pre, p1, offset, full) {
                    var next = full.charAt(offset + m.length);
                    return (next && !/[\s*.,!?;:)\]}"'\u2019\u201d-]/.test(next)) ? pre + '*' + p1 + '* ' : m;
                });
                seg = seg.replace(/~~([^~\n]+?)~~/g, function (m, p1, offset, full) {
                    var next = full.charAt(offset + m.length);
                    return (next && !/[\s~.,!?;:)\]}"'\u2019\u201d-]/.test(next)) ? '~~' + p1 + '~~ ' : m;
                });
                seg = seg.replace(/^[ \t]{1,6}(#{1,6}[ \t])/gm, '$1');
                parts[i] = seg;
            }
            return parts.join('');
        }

        // Fallback ringan dipakai HANYA bila marked.js (self-hosted + CDN cadangan)
        // keduanya gagal dimuat (mis. jaringan user memblokir semua skrip eksternal).
        // Lebih baik tampil rapi dengan parser minimal ini daripada mentah dengan
        // tanda ** # - dsb terlihat apa adanya (keluhan user). Hanya tag aman
        // (b,i,code,pre,ul,ol,li,p,br,h1-3) -> tidak perlu DOMPurify untuk output ini.
        function fallbackMdInline(x) {
            return escText(x)
                .replace(/`([^`]+)`/g, '<code>$1</code>')
                .replace(/\*\*\*([^*]+)\*\*\*/g, '<b><i>$1</i></b>')
                .replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>')
                .replace(/(^|\s)\*([^*\n]+)\*(?!\*)/g, '$1<i>$2</i>')
                .replace(/\[([^\]]+)\]\((https?:[^)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
        }
        function fallbackMarkdownToHtml(md) {
            const lines = (md || '').split('\n');
            let html = '', inCode = false, codeBuf = [], listType = null;
            const closeList = () => { if (listType) { html += (listType === 'ul' ? '</ul>' : '</ol>'); listType = null; } };
            for (const raw of lines) {
                if (raw.trim().startsWith('```')) {
                    if (inCode) { html += '<pre>' + escText(codeBuf.join('\n')) + '</pre>'; codeBuf = []; inCode = false; }
                    else { closeList(); inCode = true; }
                    continue;
                }
                if (inCode) { codeBuf.push(raw); continue; }
                const t = raw.trim();
                if (!t) { closeList(); html += '<br>'; continue; }
                let m;
                if ((m = t.match(/^(#{1,3})\s+(.*)$/))) {
                    closeList();
                    const h = m[1].length + 1;
                    html += '<h' + h + '>' + fallbackMdInline(m[2]) + '</h' + h + '>';
                } else if (/^([-*•])\s+/.test(t)) {
                    if (listType !== 'ul') { closeList(); html += '<ul>'; listType = 'ul'; }
                    html += '<li>' + fallbackMdInline(t.replace(/^([-*•])\s+/, '')) + '</li>';
                } else if (/^\d+\.\s+/.test(t)) {
                    if (listType !== 'ol') { closeList(); html += '<ol>'; listType = 'ol'; }
                    html += '<li>' + fallbackMdInline(t.replace(/^\d+\.\s+/, '')) + '</li>';
                } else if (/^-{3,}$/.test(t)) {
                    closeList(); html += '<hr>';
                } else {
                    closeList();
                    html += '<p>' + fallbackMdInline(t) + '</p>';
                }
            }
            if (inCode && codeBuf.length) html += '<pre>' + escText(codeBuf.join('\n')) + '</pre>';
            closeList();
            return html;
        }
        function formatMarkdown(text) {
            if (!text) return '';
            try {
                if (!window.marked) return fallbackMarkdownToHtml(tidyMarkdown(text));
                const html = marked.parse(tidyMarkdown(text));
                // Perbaikan keamanan: jika DOMPurify gagal dimuat dari CDN, JANGAN
                // pernah render HTML mentah (pintu XSS). Pakai fallback aman di atas
                // (bukan escText polos) supaya tetap terformat rapi.
                if (!window.DOMPurify) return fallbackMarkdownToHtml(tidyMarkdown(text));
                return DOMPurify.sanitize(html);
            } catch (e) {
                try { return fallbackMarkdownToHtml(tidyMarkdown(text)); } catch (e2) { return escText(text); }
            }
        }

        // Teks polos tanpa sintaks markdown — dipakai untuk aiName/aiDesc proyek
        // (kartu proyek menampilkan teks apa adanya, bukan HTML terformat, jadi
        // '**tebal**' / '_miring_' / heading / tautan harus dibuang dulu).
        function stripMdSyntax(text) {
            if (!text) return '';
            return String(text)
                .replace(/```[\s\S]*?```/g, ' ')
                .replace(/`([^`]+)`/g, '$1')
                .replace(/!\[[^\]]*\]\([^)]*\)/g, '')
                .replace(/\[([^\]]+)\]\([^)]*\)/g, '$1')
                .replace(/^#{1,6}\s+/gm, '')
                .replace(/(\*\*|__)(.*?)\1/g, '$2')
                .replace(/(\*|_)(.*?)\1/g, '$2')
                .replace(/~~(.*?)~~/g, '$1')
                .replace(/^\s*[-*+]\s+/gm, '')
                .replace(/\s+/g, ' ')
                .trim();
        }

        function showGlobalTooltip(element, text) {
            document.querySelectorAll('.global-tooltip').forEach(el => el.remove());
            const rect = element.getBoundingClientRect();
            const tooltip = document.createElement('div');
            tooltip.className = 'global-tooltip fixed bg-black text-white text-[11px] font-semibold px-2.5 py-1.5 rounded shadow-lg whitespace-nowrap pointer-events-none z-[9999] fade-in';
            tooltip.innerText = text;
            const arrow = document.createElement('div');
            arrow.className = 'absolute top-full left-1/2 -translate-x-1/2 border-4 border-transparent border-t-black';
            tooltip.appendChild(arrow);
            document.body.appendChild(tooltip);
            const tooltipRect = tooltip.getBoundingClientRect();
            tooltip.style.left = `${rect.left + (rect.width / 2) - (tooltipRect.width / 2)}px`;
            tooltip.style.top = `${rect.top - tooltipRect.height - 8}px`;
            setTimeout(() => {
                tooltip.style.opacity = '0';
                tooltip.style.transition = 'opacity 0.2s ease-out';
                setTimeout(() => tooltip.remove(), 200);
            }, 1200);
        }

        // Delegasi klik utk tombol di code-block (run/preview/download/copy). WAJIB
        // pakai data-action + listener ini, BUKAN onclick inline -- karena HTML pesan
        // AI melewati DOMPurify.sanitize() yang selalu membuang semua atribut onXXX
        // (anti-XSS thd konten yang bisa disusupi), jadi onclick di tombol ini pun
        // ikut hilang walau tombolnya sendiri kita yang generate (dulu ini bug: icon
        // tampil tapi tak bisa diklik sama sekali).
        document.addEventListener('click', function (e) {
            const btn = e.target.closest('[data-action]');
            if (!btn) return;
            const action = btn.getAttribute('data-action');
            if (action === 'copy-code') { copyCodeBlock(btn); }
            else if (action === 'download-code') { downloadCode(btn, btn.getAttribute('data-lang') || 'txt'); }
            else if (action === 'run-code') { runCode(btn, btn.getAttribute('data-lang') || '', btn.getAttribute('data-block') || ''); }
            else if (action === 'preview-html') { previewHTML(btn, btn.getAttribute('data-block') || ''); }
        });

        function copyCodeBlock(btnElement) {
            const encodedCode = btnElement.getAttribute('data-code');
            const code = decodeURIComponent(encodedCode);
            const textArea = document.createElement("textarea");
            textArea.value = code;
            document.body.appendChild(textArea);
            textArea.select();
            try {
                document.execCommand('copy');
                showGlobalTooltip(btnElement, 'Disalin');
            } catch (err) {}
            document.body.removeChild(textArea);
        }

        function downloadCode(btnElement, lang) {
            const encodedCode = btnElement.getAttribute('data-code');
            const code = decodeURIComponent(encodedCode);
            const extMap = {
                'python': 'py', 'javascript': 'js', 'html': 'html', 'css': 'css', 
                'java': 'java', 'cpp': 'cpp', 'c': 'c', 'php': 'php', 'ruby': 'rb',
                'json': 'json', 'typescript': 'ts', 'bash': 'sh', 'shell': 'sh',
                'go': 'go', 'rust': 'rs', 'csv': 'csv', 'sql': 'sql', 'xml': 'xml'
            };
            const ext = extMap[lang.toLowerCase()] || 'txt';
            const filename = `generated_file.${ext}`;
            const blob = new Blob([code], { type: 'text/plain' });
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = filename;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            window.URL.revokeObjectURL(url);
        }

        function toggleCodeOutputView(btnElement, blockId, showOutput, isHtml = false) {
            const codeContainer = document.getElementById(`${blockId}-code-container`);
            const outputContainer = document.getElementById(`${blockId}-output-container`);
            
            if (showOutput) {
                if (codeContainer) codeContainer.classList.add('hidden');
                if (outputContainer) outputContainer.classList.remove('hidden');
                btnElement.innerHTML = '<i class="ph-bold ph-code text-[18px]"></i>';
                btnElement.setAttribute('title', 'Lihat Kode');
                btnElement.dataset.view = 'output';
            } else {
                if (outputContainer) outputContainer.classList.add('hidden');
                if (codeContainer) codeContainer.classList.remove('hidden');
                if (isHtml) {
                    btnElement.innerHTML = '<i class="ph-bold ph-eye text-[18px]"></i>';
                    btnElement.setAttribute('title', 'Preview UI / Animasi');
                } else {
                    btnElement.innerHTML = '<i class="ph-bold ph-play text-[18px]"></i>';
                    btnElement.setAttribute('title', 'Jalankan Kode');
                }
                btnElement.dataset.view = 'code';
            }
        }

        function previewHTML(btnElement, blockId) {
            const currentView = btnElement.dataset.view || 'code';
            
            if (currentView === 'output') {
                toggleCodeOutputView(btnElement, blockId, false, true);
                return;
            }

            toggleCodeOutputView(btnElement, blockId, true, true);

            const encodedCode = btnElement.getAttribute('data-code');
            const code = decodeURIComponent(encodedCode);
            const outputEl = document.getElementById(`${blockId}-output`);
            const iframeEl = document.getElementById(`${blockId}-iframe`);
            
            if (outputEl) outputEl.classList.add('hidden');
            if (iframeEl) {
                iframeEl.classList.remove('hidden');
                iframeEl.srcdoc = code;
            }
        }

        async function runCode(btnElement, lang, blockId) {
            const currentView = btnElement.dataset.view || 'code';
            
            if (currentView === 'output') {
                toggleCodeOutputView(btnElement, blockId, false, false);
                return;
            }

            toggleCodeOutputView(btnElement, blockId, true, false);

            const encodedCode = btnElement.getAttribute('data-code');
            const code = decodeURIComponent(encodedCode);
            const outputEl = document.getElementById(`${blockId}-output`);
            const iframeEl = document.getElementById(`${blockId}-iframe`);
            
            if (outputEl) outputEl.classList.remove('hidden');
            if (iframeEl) iframeEl.classList.add('hidden');

            outputEl.innerHTML = '<span class="text-blue-400 animate-pulse">Memuat eksekusi...</span>';
            const targetLang = lang.toLowerCase();

            try {
                outputEl.innerHTML = '<span class="text-blue-400 animate-pulse">Menyiapkan E2B Sandbox (e2b.dev)...</span>';
                // Eksekusi diproxy di server (/api/e2b-run): API key E2B tidak pernah
                // diunduh ke browser (perbaikan keamanan; dulu key dibagikan mentah).
                const runRes = await fetch(TOOL_API_BASE + '/api/e2b-run', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ code: code, language: targetLang })
                });
                if (!runRes.ok) {
                    throw new Error('Proxy sandbox gagal (HTTP ' + runRes.status + '), beralih ke fallback.');
                }
                const runJson = await runRes.json().catch(() => null);
                if (!runJson) throw new Error('Respons sandbox tidak valid, beralih ke fallback.');

                outputEl.innerHTML = '<span class="text-blue-400 animate-pulse">Mengeksekusi kode dalam Sandbox...</span>';

                let outputText = String(runJson.stdout || '');
                let errorText = String(runJson.stderr || '');
                if (runJson.error && runJson.error.value) {
                    errorText += (runJson.error.name ? runJson.error.name + ': ' : '') + runJson.error.value;
                }
                if (runJson.results && runJson.results.length) {
                    for (const res of runJson.results) {
                        if (res.text) outputText += res.text + "\n";
                    }
                }

                if (errorText) {
                    outputEl.innerHTML = `<span class="text-red-400">${errorText.replace(/</g, "&lt;").replace(/>/g, "&gt;")}</span>`;
                } else {
                    outputEl.innerHTML = `<span class="text-green-400">${(outputText || '').replace(/</g, "&lt;").replace(/>/g, "&gt;") || '(Tidak ada output/berhasil dieksekusi)'}</span>`;
                }

            } catch (e2bError) {
                console.warn("E2B execution failed, falling back to Piston Sandbox.", e2bError);
                outputEl.innerHTML = '<span class="text-yellow-400 animate-pulse">E2B Sandbox error/timeout. Melanjutkan eksekusi ke Piston Sandbox (Fallback)...</span>';
                
                const langMapPiston = {
                    'python': { language: 'python', version: '*' },
                    'javascript': { language: 'javascript', version: '*' },
                    'js': { language: 'javascript', version: '*' },
                    'java': { language: 'java', version: '*' },
                    'c': { language: 'c', version: '*' },
                    'cpp': { language: 'c++', version: '*' },
                    'php': { language: 'php', version: '*' },
                    'ruby': { language: 'ruby', version: '*' },
                    'go': { language: 'go', version: '*' },
                    'rust': { language: 'rust', version: '*' }
                };
                
                const runInfoPiston = langMapPiston[targetLang] || { language: targetLang, version: '*' };

                try {
                    const response = await fetch('https://emkc.org/api/v2/piston/execute', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            language: runInfoPiston.language,
                            version: runInfoPiston.version,
                            files: [{ content: code }]
                        })
                    });

                    const data = await response.json();
                    
                    if (data.compile && data.compile.code !== 0) {
                        outputEl.innerHTML = `<span class="text-red-400">${(data.compile.stderr || "").replace(/</g, "&lt;").replace(/>/g, "&gt;")}</span>`;
                    } else if (data.run) {
                        let out = (data.run.output || data.run.stdout || data.run.stderr || "").replace(/</g, "&lt;").replace(/>/g, "&gt;");
                        if (data.run.code !== 0) {
                             outputEl.innerHTML = `<span class="text-red-400">${out || 'Terjadi kesalahan eksekusi.'}</span>`;
                        } else {
                             outputEl.innerHTML = `<span class="text-green-400">${out || '(Tidak ada output/berhasil dieksekusi)'}</span>`;
                        }
                    } else {
                         outputEl.innerHTML = `<span class="text-red-400">Gagal menjalankan kode atau bahasa belum didukung server (versi).</span>`;
                    }
                } catch (err) {
                    outputEl.innerHTML = `<span class="text-red-400">Terjadi kesalahan jaringan pada sistem eksekusi Piston.</span>`;
                }
            }
        }

        // FIX: bug "tidak bisa scroll saat AI thinking, nempel di bawah" — sebelumnya
        // autoScrollActive hanya dimatikan lewat heuristik event 'scroll' (bandingkan posisi
        // sebelum/sesudah), yang gampang telat/kalah race saat konten terus tumbuh cepat
        // ketika AI sedang streaming/thinking (tiap render baru langsung menarik balik ke
        // bawah sebelum jari sempat menggeser). Sekarang gesture NAIK asli (jari geser ke
        // bawah / wheel ke atas) langsung mematikan auto-scroll di momen itu juga — tidak
        // menunggu event scroll berikutnya — supaya user selalu bisa baca pesan lama walau
        // AI masih mengetik.
        let touchStartY = 0;
        let momentumScrollWindow = false, momentumTimer = null;
        chatContainer.addEventListener('touchstart', (e) => {
            isUserInteracting = true;
            touchStartY = e.touches && e.touches[0] ? e.touches[0].clientY : 0;
        }, {passive: true});
        chatContainer.addEventListener('touchmove', (e) => {
            const y = e.touches && e.touches[0] ? e.touches[0].clientY : 0;
            if (touchStartY && y - touchStartY > 6) {
                // jari geser ke bawah -> isi discroll ke atas -> user sedang membaca ke atas
                autoScrollActive = false;
            }
            touchStartY = y;
        }, {passive: true});
        chatContainer.addEventListener('touchend', () => {
            isUserInteracting = false;
            // FIX momentum-scroll: setelah jari lepas, iOS/Android masih melanjutkan
            // scroll (momentum) beberapa ratus ms. Tanpa jendela ini, event 'scroll' saat
            // momentum tidak mematikan auto-scroll (isUserInteracting sudah false) —
            // sehingga render AI berikutnya langsung menarik tampilan balik ke bawah.
            momentumScrollWindow = true;
            clearTimeout(momentumTimer);
            momentumTimer = setTimeout(() => momentumScrollWindow = false, 800);
        }, {passive: true});
        chatContainer.addEventListener('mousedown', () => isUserInteracting = true);
        document.addEventListener('mouseup', () => isUserInteracting = false);
        chatContainer.addEventListener('wheel', (e) => {
            isUserInteracting = true;
            if (e.deltaY < 0) autoScrollActive = false; // scroll ke atas -> matikan auto-scroll seketika
            clearTimeout(chatContainer.wheelTimeout);
            chatContainer.wheelTimeout = setTimeout(() => isUserInteracting = false, 250);
        }, {passive: true});

        chatContainer.addEventListener('scroll', () => {
            const threshold = 15;
            const currentScrollTop = Math.ceil(chatContainer.scrollTop);
            const maxScrollTop = chatContainer.scrollHeight - chatContainer.clientHeight;

            if (maxScrollTop - currentScrollTop <= threshold) {
                autoScrollActive = true;
            } else if ((isUserInteracting || momentumScrollWindow) && currentScrollTop < lastScrollTop - 1) {
                // FIX: hanya matikan auto-scroll kalau user BENAR-BENAR sedang menyentuh/
                // scroll ke atas. Keyboard yang buka-tutup & perubahan tinggi konten membuat
                // browser meng-clamp scrollTop (terlihat seperti scroll ke atas padahal bukan
                // aksi user) — itu TIDAK boleh mematikan auto-scroll, karena dulu inilah
                // penyebab indikator "mengetik" di bawah tidak naik otomatis setelah kirim.
                autoScrollActive = false;
            }

            lastScrollTop = currentScrollTop <= 0 ? 0 : currentScrollTop;
        });

        function readAsDataURL(file) {
            return new Promise((resolve) => {
                const reader = new FileReader();
                reader.onload = e => resolve(e.target.result);
                reader.readAsDataURL(file);
            });
        }

        function readAsText(file) {
            return new Promise((resolve) => {
                const reader = new FileReader();
                reader.onload = e => resolve(e.target.result);
                reader.readAsText(file);
            });
        }

        async function loadPDF(file) {
            try {
                const arrayBuffer = await file.arrayBuffer();
                const pdf = await pdfjsLib.getDocument(arrayBuffer).promise;
                let maxPages = pdf.numPages;
                let text = "";
                for (let i = 1; i <= Math.min(maxPages, 10); i++) { 
                    const page = await pdf.getPage(i);
                    const content = await page.getTextContent();
                    text += content.items.map(item => item.str).join(' ') + "\n";
                }
                return text;
            } catch(err) {
                return "Gagal membaca file PDF.";
            }
        }

        // SPREADSHEET (xlsx/xls/xlsm/csv/ods): format biner — WAJIB diparse, readAsText
        // biasa hanya menghasilkan sampah karakter. SheetJS ubah tiap sheet jadi baris
        // "nilai | nilai | nilai" yang bisa dibaca AI.
        async function loadSpreadsheet(file) {
            try {
                const arrayBuffer = await file.arrayBuffer();
                const wb = XLSX.read(arrayBuffer, { type: 'array' });
                let text = '';
                wb.SheetNames.forEach(function (sheetName) {
                    const rows = XLSX.utils.sheet_to_csv(wb.Sheets[sheetName], { FS: ' | ' });
                    text += '[Sheet: ' + sheetName + ']\n' + rows + '\n\n';
                });
                return (text || '(sheet kosong)').substring(0, 50000);
            } catch (err) {
                return "Gagal membaca file spreadsheet.";
            }
        }
        // DOCX: format ZIP berisi XML — diparse via mammoth jadi teks bersih.
        async function loadDocx(file) {
            try {
                const arrayBuffer = await file.arrayBuffer();
                const result = await window.mammoth.extractRawText({ arrayBuffer: arrayBuffer });
                return (result.value || '').substring(0, 50000);
            } catch (err) {
                return "Gagal membaca file dokumen.";
            }
        }

        function formatSize(bytes) {
            if (bytes === 0) return '0 Bytes';
            const k = 1024;
            const sizes = ['Bytes', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return parseFloat((bytes / Math.pow(k, i)).toFixed(1)) + ' ' + sizes[i];
        }

        async function handleFileUpload(e) {
            const files = e.target.files;
            if (!files || files.length === 0) return;

            for (let i = 0; i < files.length; i++) {
                const file = files[i];
                let data = null;
                let text = null;
                let type = file.type.startsWith('image/') ? 'image' : 'document';
                let extension = file.name.split('.').pop().toLowerCase();

                if (type === 'image') {
                    data = await readAsDataURL(file);
                } else {
                    if (file.type === 'application/pdf' || extension === 'pdf') {
                        text = await loadPDF(file);
                    } else if (['xlsx', 'xls', 'xlsm', 'csv', 'ods'].includes(extension)) {
                        text = await loadSpreadsheet(file);
                    } else if (extension === 'docx') {
                        text = await loadDocx(file);
                    } else {
                        text = await readAsText(file);
                    }
                }

                currentAttachments.push({
                    id: generateId(),
                    file: file,
                    type: type,
                    name: file.name,
                    size: formatSize(file.size),
                    data: data,
                    text: text,
                    extension: extension
                });
            }

            showAttachmentPreview();
            try { closeUploadMenu(); } catch (e2) {}
            e.target.value = '';
        }

                'json': 'ph-file-code text-gray-500',
                'py': 'ph-file-code text-gray-500',
                'pdf': 'ph-file-pdf text-gray-500',
                'zip': 'ph-file-archive text-gray-500',
                'txt': 'ph-file-text text-gray-500',
                'csv': 'ph-file-csv text-gray-500',
                'xlsx': 'ph-file-xls text-gray-500',
                'xls': 'ph-file-xls text-gray-500',
                'xlsm': 'ph-file-xls text-gray-500',
                'ods': 'ph-file-xls text-gray-500',
                'docx': 'ph-file-doc text-gray-500',
                'doc': 'ph-file-doc text-gray-500',
                'png': 'ph-image text-gray-500',
                'jpg': 'ph-image text-gray-500',
                'jpeg': 'ph-image text-gray-500'
            };

        function showAttachmentPreview() {
            if (currentAttachments.length === 0) {
                filePreviewContainer.classList.add('hidden');
                filePreviewContainer.classList.remove('flex');
                filePreviewContainer.innerHTML = '';
                return;
            }

            filePreviewContainer.innerHTML = '';
            
            filePreviewContainer.classList.remove('hidden');
            filePreviewContainer.classList.add('flex');
            
            currentAttachments.forEach(att => {
                let iconHtml = '';
                if (att.type === 'image') {
                    iconHtml = `<img src="${escUrl(att.data)}" class="w-[18px] h-[18px] rounded-full object-cover">`;
                } else {
                    iconHtml = getFileIcon(att.extension);
                }

                const pill = document.createElement('div');
                pill.className = "flex items-center gap-1.5 bg-gray-100 border border-gray-200 rounded-xl px-3 py-1.5 max-w-[160px] flex-shrink-0 fade-in transition-colors shadow-sm";
                pill.innerHTML = `
                    <div class="flex items-center justify-center flex-shrink-0">
                        ${iconHtml}
                    </div>
                    <p class="text-xs font-medium text-gray-800 truncate leading-tight">${escText(att.name)}</p>
                    <button type="button" onclick="removeAttachment('${att.id}')" class="text-gray-400 hover:text-black transition-colors ml-0.5 focus:outline-none flex-shrink-0" title="Hapus">
                        <i class="ph-bold ph-x text-[12px]"></i>
                    </button>
                `;
                filePreviewContainer.appendChild(pill);

        function pinMessageToTop(msgId) {
            // autoScrollActive dimatikan: render berikutnya (jawaban AI yang sedang
            // streaming) TIDAK menarik scroll balik ke bawah — posisi pin ini yang jadi acuan,
            // persis seperti "pesan lama di-atasin sampai pesan baru saya".
            autoScrollActive = false;
            // Sediakan ruang scroll DI BAWAH pesan baru sebesar tinggi viewport supaya
            // scrollTo() di bawah tidak di-clamp browser ke posisi lebih rendah dari
            // target (yang membuat pesan lama tetap terlihat penuh di atas).
            pinSpacerPx = chatContainer.clientHeight;
            const spacerNow = document.getElementById('scroll-top-spacer');
            if (spacerNow) spacerNow.style.height = pinSpacerPx + 'px';
            requestAnimationFrame(() => {
                const el = document.getElementById('msg-row-' + msgId);
                if (!el) return;
                // FIX: pesan yang di-pin dulu menempel terlalu ke atas sampai KETUTUP
                // header fixed (~56px). Geser turun sebesar padding-top kontainer
                // supaya bubble muncul persis di bawah header, bukan di belakangnya.
                const padTop = parseFloat(getComputedStyle(chatContainer).paddingTop) || 80;
                const target = Math.max(0, el.offsetTop - padTop + 8);
                chatContainer.scrollTo({ top: target, behavior: 'smooth' });
            });
        }

        // Jawaban AI SELESAI -> kolaps spacer pin. Tanpa ini, spacer setinggi viewport
        // yang dipasang saat pesan user di-pin tetap ada setelah jawaban selesai, jadi
        // di bawah pesan AI terakhir tampak ruang kosong besar sampai ke kolom input.
        // Kolaps spacer membuat ujung jawaban "menempel" ke input tanpa jarak.
        function settleAfterAnswer() {
            if (!pinSpacerPx) return; // tidak sedang di-pin -> tidak ada jarak buatan
            pinSpacerPx = 0;
            const spacer = document.getElementById('scroll-top-spacer');
            if (spacer) spacer.style.height = '0px';
            requestAnimationFrame(function () {
                const max = Math.max(0, chatContainer.scrollHeight - chatContainer.clientHeight);
                // Dekat ekor jawaban -> scroll halus menempel ke input.
                // Sedang membaca pesan lama di atas -> TIDAK digeser (clamp alami saja).
                if (max - chatContainer.scrollTop < 600) chatContainer.scrollTo({ top: max, behavior: 'smooth' });
                autoScrollActive = true;
            });
        }

        function scrollToBottom(forceSmooth = false) {
            if (forceSmooth) {
                autoScrollActive = true;
                chatContainer.scrollTo({
                    top: chatContainer.scrollHeight,
                    behavior: 'smooth'
                });
                // FIX: konten markdown/gambar/kode sering menambah tinggi SETELAH scroll
                // selesai — pin ulang beberapa kali agar benar-benar sampai dasar.
                [150, 400, 800].forEach(function(ms) {
                    setTimeout(function() {
                        if (autoScrollActive) {
                            chatContainer.scrollTop = chatContainer.scrollHeight;
                        }
                    }, ms);
                });
            } else if (autoScrollActive && !isUserInteracting) {
                chatContainer.scrollTop = chatContainer.scrollHeight;
            }
        }

        // FIX KEYBOARD MOBILE: dulu pakai hack document.body.style.height = tinggi
        // viewport terlihat. Akibatnya composer (position:fixed bottom-0, yang tidak
        // ikut menyusut) berakhir MELAYANG MENIMPA area pesan seperti "card hitam"
        // saat keyboard terbuka (terlihat jelas di dark mode). Solusi yang benar:
        // (a) angkat composer persis ke atas keyboard via transform mengikuti
        //     visualViewport, dan (b) tambah padding bawah area chat sebesar keyboard
        //     supaya pesan terakhir tetap terlihat, bukan nyelip ke belakang keyboard.
        if (window.visualViewport) {
            const vv = window.visualViewport;
            const chatFooter = document.querySelector('footer.fixed');
            let vvRaf = null;
            const handleViewportResize = () => {
                cancelAnimationFrame(vvRaf);
                vvRaf = requestAnimationFrame(() => {
                    // tinggi area tertutup keyboard relatif layout viewport
                    const covered = Math.max(0, window.innerHeight - vv.height - vv.offsetTop);
                    if (covered > 24) {
                        if (chatFooter) chatFooter.style.transform = `translateY(${-covered}px)`;
                        chatContainer.style.paddingBottom = `${Math.round(covered + 8)}px`;
                    } else {
                        if (chatFooter) chatFooter.style.transform = '';
                        chatContainer.style.paddingBottom = '';
                    }
                    scrollToBottom(false);
                });
            };
            vv.addEventListener('resize', handleViewportResize);
            vv.addEventListener('scroll', handleViewportResize);
        }

        chatInput.addEventListener('focus', () => {
            setTimeout(() => {
                autoScrollActive = true;
                scrollToBottom(true);

        });
