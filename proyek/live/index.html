<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Live URL — Clincoo</title>
<meta name="description" content="Live preview per proyek Clincoo — subdomain preview yang ter-update otomatis dari workspace.">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0a0a0a">
<link rel="icon" href="../../favicon.svg" type="image/svg+xml">
<script>/* no-flash dark: hindari layar putih sesaat di tema gelap */(function(){try{var t=localStorage.getItem('clinqoo_theme')||'Sistem (Default)';var d=(t==='Gelap')||((t==='Sistem (Default)'||!t)&&window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches);if(d){document.documentElement.style.background='#0a0a0a';document.documentElement.style.colorScheme='dark';}}catch(e){}})();</script>
<style>
  html, body { margin: 0; height: 100%; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #ffffff; color: #18181b; display: flex; flex-direction: column; }
  html[data-dark] body { background: #0a0a0a; color: #e5e7eb; }
  #lv-bar { display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-bottom: 1px solid rgba(0,0,0,0.08); flex-shrink: 0; }
  html[data-dark] #lv-bar { border-bottom: 1px solid rgba(255,255,255,0.12); }
  #lv-dot { width: 9px; height: 9px; border-radius: 50%; background: #22c55e; flex-shrink: 0; animation: lv-pulse 2s infinite; }
  #lv-dot.err { background: #ef4444; animation: none; }
  #lv-dot.wait { background: #eab308; }
  @keyframes lv-pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.35; } }
  #lv-status { font-size: 12px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #lv-urlbox { flex: 1; min-width: 0; display: flex; align-items: center; gap: 6px; background: rgba(0,0,0,0.05); border-radius: 8px; padding: 5px 10px; font-size: 11px; color: inherit; }
  html[data-dark] #lv-urlbox { background: rgba(255,255,255,0.08); }
  #lv-url { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-family: ui-monospace, 'SF Mono', Menlo, monospace; opacity: 0.85; }
  #lv-copy { border: none; background: transparent; cursor: pointer; font-size: 11px; font-weight: 600; color: #2563eb; padding: 2px 4px; border-radius: 6px; flex-shrink: 0; }
  #lv-copy:hover { background: rgba(37,99,235,0.1); }
  html[data-dark] #lv-copy { color: #60a5fa; }
  #lv-frame { flex: 1; width: 100%; border: 0; background: #fff; }
  #lv-msg { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; padding: 24px; text-align: center; color: #71717a; background: inherit; z-index: 10; }
  #lv-msg .lv-icon { width: 46px; height: 46px; border-radius: 14px; background: #f4f4f5; display: flex; align-items: center; justify-content: center; color: #a1a1aa; }
  html[data-dark] #lv-msg .lv-icon { background: #18181b; color: #52525b; }
  #lv-msg h2 { font-size: 15px; font-weight: 600; margin: 0; }
  #lv-msg p { font-size: 13px; margin: 0; max-width: 420px; line-height: 1.5; }
  #lv-msg a, #lv-msg button { color: #2563eb; font-weight: 600; text-decoration: none; border: none; background: transparent; cursor: pointer; font-size: 13px; padding: 0; }
  html[data-dark] #lv-msg a, html[data-dark] #lv-msg button { color: #60a5fa; }
  .hidden { display: none !important; }
</style>
</head>
<body>
  <div id="lv-bar">
    <div id="lv-dot" class="wait"></div>
    <div id="lv-status">Menyambungkan…</div>
    <div id="lv-urlbox" class="hidden">
      <span id="lv-url"></span>
      <button id="lv-copy" type="button">Salin</button>
    </div>
  </div>
  <iframe id="lv-frame" title="Live preview proyek"></iframe>
  <div id="lv-msg">
    <div class="lv-icon">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>
    </div>
    <h2 id="lv-msg-title">Menyiapkan live preview…</h2>
    <p id="lv-msg-text">Mengambil file proyek dari cloud.</p>
    <a id="lv-msg-link" class="hidden" href="../../auth/">Masuk ke Clincoo</a>
    <button id="lv-msg-retry" class="hidden" type="button">Coba lagi</button>
  </div>
<script>
(function () {
  'use strict';
  // Tema: sama dengan halaman lain (localStorage + sistem)
  try {
    var t = localStorage.getItem('clinqoo_theme') || 'Sistem (Default)';
    var dark = (t === 'Gelap') || ((t === 'Sistem (Default)' || !t) && window.matchMedia('(prefers-color-scheme: dark)').matches);
    if (dark) { document.documentElement.setAttribute('data-dark', '1'); }
  } catch (e) {}

  var qs = new URLSearchParams(location.search);
  var pid = '';
  try { pid = qs.get('id') || localStorage.getItem('clinqoo_current_project_id') || ''; } catch (e) {}
  if (pid) { try { localStorage.setItem('clinqoo_current_project_id', pid); } catch (e) {} }

  var API = (['clincoo-be2.pages.dev', 'localhost', '127.0.0.1'].indexOf(location.hostname) === -1) ? 'https://clincoo-be2.pages.dev/api' : '/api';
  var frame = document.getElementById('lv-frame');
  var msg = document.getElementById('lv-msg');
  var msgTitle = document.getElementById('lv-msg-title');
  var msgText = document.getElementById('lv-msg-text');
  var msgLink = document.getElementById('lv-msg-link');
  var msgRetry = document.getElementById('lv-msg-retry');
  var dot = document.getElementById('lv-dot');
  var status = document.getElementById('lv-status');
  var urlbox = document.getElementById('lv-urlbox');
  var urlEl = document.getElementById('lv-url');
  var copyBtn = document.getElementById('lv-copy');
  var subdomainUrl = ''; // URL subdomain preview proyek (<nama>-prv.clinqoo.biz.id)
  var lastHash = null;
  var blobUrl = null;
  var pollTimer = null;
  var redirected = false;

  function authHeaders() {
    var tk = '';
    try { tk = localStorage.getItem('clinqoo_auth_token') || localStorage.getItem('clinqoo_token') || ''; } catch (e) {}
    return tk ? { Authorization: 'Bearer ' + tk } : {};
  }
  function token() {
    try { return localStorage.getItem('clinqoo_auth_token') || localStorage.getItem('clinqoo_token') || ''; } catch (e) { return ''; }
  }

  function setUrlBar(u) {
    if (!u) return;
    urlEl.textContent = u;
    urlbox.classList.remove('hidden');
  }
  copyBtn.onclick = function () {
    var u = subdomainUrl || location.href;
    try { navigator.clipboard.writeText(u).then(function () { copyBtn.textContent = 'Tersalin ✓'; setTimeout(function () { copyBtn.textContent = 'Salin'; }, 1600); }); }
    catch (e) { copyBtn.textContent = 'Salin manual'; }
  };

  function failState(title, text, showLogin) {
    msg.classList.remove('hidden');
    msgTitle.textContent = title;
    msgText.textContent = text;
    if (showLogin) { msgLink.classList.remove('hidden'); } else { msgLink.classList.add('hidden'); }
    dot.className = 'err';
    status.textContent = 'Terhenti';
  }

  // Pindah ke subdomain preview proyek (<nama>-prv.clinqoo.biz.id).
  // Subdomain itu ter-update otomatis tiap ada perubahan kode di workspace.
  function goSubdomain(u) {
    if (redirected || !u) return;
    redirected = true;
    dot.className = '';
    status.textContent = 'Membuka subdomain proyek…';
    try { localStorage.setItem('clinqoo_live_url_' + pid, u); } catch (e) {}
    location.replace(u);
  }

  function fetchJson(url, opts) {
    return fetch(url, opts).then(function (r) {
      if (r.status === 401) throw Object.assign(new Error('need_login'), { needLogin: true });
      if (!r.ok) return r.json().catch(function () { return {}; }).then(function (d) { throw new Error(d.error || ('HTTP ' + r.status)); });
      return r.json();
    });
  }

  // ===== ALUR UTAMA =====
  // 1) Cek status deploy: subdomain preview sudah aktif? -> langsung pindah.
  // 2) Belum: nyalakan preview (deploy ringan ke <nama>-prv) -> pindah begitu siap.
  // 3) Sementara menunggu / bila preview gagal: render cepat langsung dari file cloud.
  function main() {
    if (!pid) { failState('Tidak ada proyek aktif', 'Buka proyek dari daftar proyek Clincoo dulu, lalu pilih "Live preview" di menu di header.', false); return; }
    if (!token()) { failState('Masuk dulu untuk melihat live preview', 'Live URL proyek hanya bisa dibuka setelah masuk ke akun Clincoo Anda.', true); return; }
    fetchJson(API + '/deploy?project_id=' + encodeURIComponent(pid), { headers: authHeaders() })
      .then(function (st) {
        subdomainUrl = st.preview_url || ('https://' + (st.pages_project || '') + '-prv.clinqoo.biz.id');
        setUrlBar(subdomainUrl);
        if (st.preview_deployed && subdomainUrl) { goSubdomain(subdomainUrl); return null; }
        // Preview belum dinyalakan: aktifkan sekarang (deploy ringan ke subdomain -prv).
        return fetchJson(API + '/deploy', { method: 'POST', headers: Object.assign({ 'Content-Type': 'application/json' }, authHeaders()), body: JSON.stringify({ project_id: pid, preview: true }) })
          .then(function (d) {
            var u = d.preview_url || subdomainUrl;
            subdomainUrl = u || subdomainUrl;
            if (u) { goSubdomain(u); return null; }
            throw new Error('preview belum siap');
          });
      })
      .catch(function (err) {
        if (err && err.needLogin) { failState('Masuk dulu untuk melihat live preview', 'Live URL proyek hanya bisa dibuka setelah masuk ke akun Clincoo Anda.', true); return; }
        // Gagal menyalakan subdomain (mis. workspace kosong): render cepat dari file cloud.
        fallbackRender();
      });
  }

  // ===== Render cepat (fallback): sama seperti /proyek/preview/, dari file D1 =====
  function norm(p) { return String(p || '').replace(/^\.?\//, '').replace(/\/+/g, '/'); }
  function resolve(base, ref) {
    if (!ref || /^(https?:|data:|#|mailto:|javascript:|\/\/)/i.test(ref)) return null;
    var parts = norm(ref).split('/');
    var out = [];
    parts.forEach(function (part) {
      if (part === '.' || part === '') return;
      if (part === '..') { out.pop(); return; }
      out.push(part);
    });
    return out.join('/');
  }
  function fallbackRender() {
    fetchJson(API + '/project-files?project_id=' + encodeURIComponent(pid), { headers: authHeaders() })
      .then(function (d) {
        var files = (d && d.files) || [];
        if (!files.length) { failState('Workspace masih kosong', 'Belum ada file di proyek ini. Buat file di Workspace Clincoo dulu — subdomain live preview akan otomatis aktif setelahnya.', false); return; }
        msg.classList.add('hidden');
        dot.className = 'wait';
        status.textContent = 'Render cepat (subdomain belum aktif)';
        render(files);
        // Coba nyalakan subdomain lagi sesudah render (sekali saja)
        setTimeout(function () {
          fetchJson(API + '/deploy', { method: 'POST', headers: Object.assign({ 'Content-Type': 'application/json' }, authHeaders()), body: JSON.stringify({ project_id: pid, preview: true }) })
            .then(function (r) { if (r && r.preview_url) goSubdomain(r.preview_url); })
            .catch(function () {});
        }, 1500);
      })
      .catch(function (err) {
        if (err && err.needLogin) { failState('Masuk dulu untuk melihat live preview', 'Live URL proyek hanya bisa dibuka setelah masuk ke akun Clincoo Anda.', true); return; }
        failState('Tidak bisa terhubung', 'Periksa koneksi internet Anda lalu buka ulang halaman ini.', false);
        msgRetry.classList.remove('hidden');
        msgRetry.onclick = function () { location.reload(); };
      });
  }
  function buildMap(files) {
    var m = {};
    (files || []).forEach(function (f) {
      if (!f || !f.path) return;
      if (String(f.path).slice(-1) === '/') return;
      m[norm(f.path)] = f;
    });
    return m;
  }
  function render(files) {
    var map = buildMap(files);
    var keys = Object.keys(map);
    var entry = map['index.html'];
    if (!entry) {
      var htmls = keys.filter(function (p) { return /(^|\/)index\.html?$/i.test(p); });
      if (!htmls.length) { failState('Belum ada index.html', 'Live preview web membutuhkan file index.html di workspace proyek ini.', false); return; }
      entry = map[htmls[0]];
    }
    var basePath = norm(entry.path || 'index.html');
    var html = String(entry.content == null ? '' : entry.content);
    html = html.replace(/<link\b[^>]*>/gi, function (tag) {
      if (!/stylesheet/i.test(tag)) return tag;
      var m = tag.match(/href\s*=\s*["']([^"']+)["']/i);
      if (!m) return tag;
      var p = resolve(basePath, m[1]);
      var it = p && map[p];
      if (!it || it.content == null || typeof it.content !== 'string') return tag;
      return '<style>\n' + it.content + '\n</style>';
    });
    html = html.replace(/<script\b([^>]*)>\s*<\/script>/gi, function (tag, attrs) {
      var m = (attrs || '').match(/src\s*=\s*["']([^"']+)["']/i);
      if (!m) return tag;
      if (/^(https?:|\/\/)/i.test(m[1])) return tag;
      var p = resolve(basePath, m[1]);
      var it = p && map[p];
      if (!it || it.content == null || typeof it.content !== 'string') return tag;
      var keep = (attrs || '').replace(/\ssrc\s*=\s*["'][^"']*["']/i, '');
      return '<script' + keep + '>\n' + it.content + '\n<\/script>';
    });
    html = html.replace(/\b(src|href)\s*=\s*"([^"]*)"/gi, function (m0, attr, ref) {
      var p = resolve(basePath, ref);
      var it = p && map[p];
      if (!it || !it.content || typeof it.content !== 'string') return m0;
      if (it.content.indexOf('data:') === 0 || it.content.indexOf('http') === 0) return attr + '="' + it.content + '"';
      return m0;
    });
    if (blobUrl) { try { URL.revokeObjectURL(blobUrl); } catch (e) {} }
    blobUrl = URL.createObjectURL(new Blob([html], { type: 'text/html' }));
    frame.src = blobUrl;
  }

  main();
})();
</script>
</body>
</html>
