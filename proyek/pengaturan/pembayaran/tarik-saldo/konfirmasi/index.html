  <div class="max-w-md mx-auto px-5 pb-24 pt-6">
    <p class="text-xs text-gray-400 dark:text-gray-500 mb-6">Periksa detail sebelum konfirmasi.</p>

    <!-- Loading skeleton -->
    <div id="cf-loading" class="flex flex-col items-center py-14">
      <svg class="w-7 h-7 text-gray-300 dark:text-slate-600 animate-spin" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-90" fill="currentColor" d="M4 12a8 8 0 018-8v4a4 4 0 00-4 4H4z"></path></svg>
    </div>

    <!-- Detail penarikan -->
    <div id="cf-receipt" class="hidden">
      <p class="text-[11px] font-semibold uppercase tracking-wider text-gray-400 dark:text-gray-500 mb-2.5">Detail Penarikan</p>
      <div class="space-y-3 text-xs mb-7">
        <div class="flex items-center justify-between"><p class="text-gray-500 dark:text-gray-400">Nominal</p><p id="cf-amount" class="font-semibold font-mono text-gray-900 dark:text-white">Rp 0</p></div>
        <div class="flex items-center justify-between"><p class="text-gray-500 dark:text-gray-400">Biaya transfer</p><p id="cf-fee" class="font-semibold font-mono text-gray-900 dark:text-white">Rp 0</p></div>
        <div class="border-t border-dashed border-gray-200 dark:border-slate-700 my-1"></div>
        <div class="flex items-center justify-between"><p class="text-gray-500 dark:text-gray-400">Total potong saldo</p><p id="cf-total" class="font-bold font-mono text-gray-900 dark:text-white">Rp 0</p></div>
        <div class="flex items-center justify-between"><p class="text-gray-500 dark:text-gray-400">Tujuan</p><p id="cf-dest" class="font-semibold text-gray-900 dark:text-white">&mdash;</p></div>
        <div id="cf-recipient-row" class="hidden flex items-center justify-between"><p class="text-gray-500 dark:text-gray-400">Penerima</p><p id="cf-recipient" class="font-semibold text-gray-900 dark:text-white">&mdash;</p></div>
        <div class="flex items-center justify-between"><p class="text-gray-500 dark:text-gray-400">Metode</p><p class="font-semibold text-gray-900 dark:text-white">E-wallet</p></div>
        <div class="flex items-center justify-between"><p class="text-gray-500 dark:text-gray-400">Waktu</p><p id="cf-time" class="font-mono text-gray-900 dark:text-white">&mdash;</p></div>
      </div>
    </div>

    <p id="cf-error" class="hidden text-center text-xs text-red-500 mb-5"></p>

    <!-- Konfirmasi (hanya bila saldo cukup) -->
    <div id="cf-slider-wrap" class="hidden">
      <button type="button" id="cf-next" onclick="cfRequestOtp()" class="w-full h-12 text-sm font-semibold text-white bg-black dark:bg-white dark:text-black rounded-full transition-colors cursor-pointer disabled:opacity-40 disabled:cursor-not-allowed">
        Konfirmasi
      </button>
    </div>

    <div id="cf-insufficient" class="hidden text-center">
      <p class="text-sm font-semibold text-red-600 dark:text-red-400">Saldo tidak cukup</p>
      <p class="text-xs text-gray-400 dark:text-gray-500 mt-1 mb-6">Total potong saldo melebihi saldo tersedia.</p>
      <a href="../" class="inline-flex items-center justify-center px-6 h-12 text-sm font-semibold text-white bg-black dark:bg-white dark:text-black rounded-full transition-colors">Ubah Detail</a>
    </div>

    <div id="cf-done" class="hidden mx-auto max-w-[300px] text-center">
      <a href="../../" class="inline-flex items-center justify-center px-6 h-12 text-sm font-semibold text-white bg-black dark:bg-white dark:text-black rounded-full transition-colors">Kembali ke Pembayaran</a>
    </div>

  <script>
  var API_BASE = (['clincoo-be2.pages.dev','app.clincoo.buzz','localhost','127.0.0.1'].indexOf(location.hostname) === -1) ? 'https://app.clincoo.buzz/api' : '/api';
  var _apiToken = '';
  try { _apiToken = localStorage.getItem('clinqoo_auth_token') || localStorage.getItem('clinqoo_token') || ''; } catch (e) {}
  function _pid() { try { return localStorage.getItem('clinqoo_current_project_id') || ''; } catch (e) { return ''; } }
  function _rp(n) { return Number(n || 0).toLocaleString('id-ID'); }

  var _draft = null;
  try { _draft = JSON.parse(sessionStorage.getItem('clinqoo_wd_draft_' + _pid()) || 'null'); } catch (e) {}
  var _submitted = false;

  var EW_LABEL = { dana: 'DANA', ovo: 'OVO', gopay: 'GoPay', shopeepay: 'ShopeePay', linkaja: 'LinkAja' };

  function cfShow(id) {
    ['cf-loading', 'cf-receipt', 'cf-slider-wrap', 'cf-insufficient', 'cf-done'].forEach(function (x) {
      document.getElementById(x).classList.add('hidden');
    });
    document.getElementById(id).classList.remove('hidden');
    if (id !== 'cf-loading') document.getElementById('cf-receipt').classList.remove('hidden');
  }

  async function cfInit() {
    if (!_draft || !_draft.amount || !_draft.dest_type) { location.href = '../'; return; }
    if (!_apiToken) { location.href = '/akun/'; return; }
    // draft kadaluarsa 15 menit → mulai ulang
    if (Date.now() - (_draft.ts || 0) > 15 * 60 * 1000) { try { sessionStorage.removeItem('clinqoo_wd_draft_' + _pid()); } catch (e) {} location.href = '../'; return; }
    document.getElementById('cf-amount').textContent = 'Rp ' + _rp(_draft.amount);
    document.getElementById('cf-fee').textContent = 'Rp ' + _rp(_draft.fee || 0);
    document.getElementById('cf-total').textContent = 'Rp ' + _rp(_draft.amount + (_draft.fee || 0));
    document.getElementById('cf-dest').textContent = (EW_LABEL[_draft.dest_type] || _draft.dest_type) + ' · ' + _draft.dest_account;
    if (_draft.dest_recipient) {
      document.getElementById('cf-recipient').textContent = _draft.dest_recipient;
      document.getElementById('cf-recipient-row').classList.remove('hidden');
    }
    document.getElementById('cf-time').textContent = new Date().toLocaleString('id-ID', { day: 'numeric', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' });

    var saldo = 0, saldoOk = false;
    for (var i = 0; i < 3; i++) {
      try {
        var res = await fetch(API_BASE + '/pay?action=config&project_id=' + encodeURIComponent(_draft.project_id || _pid()), { headers: { Authorization: 'Bearer ' + _apiToken } });
        if (!res.ok) throw new Error('http ' + res.status);
        var data = await res.json();
        saldo = data.available || 0;
        saldoOk = true;
        break;
      } catch (e) { if (i < 2) await new Promise(function (r) { setTimeout(r, 900); }); }
    }
    // cek saldo hanya bila berhasil dimuat; bila gagal, biarkan server yang memvalidasi saat minta OTP
    if (saldoOk && _draft.amount + (_draft.fee || 0) > saldo) {
      cfShow('cf-insufficient');
      return;
    }
    cfShow('cf-slider-wrap');
  }

  // ===== Minta OTP ke email pemilik proyek =====
  async function cfRequestOtp() {
    if (_submitted) return;
    _submitted = true;
    var btn = document.getElementById('cf-next');
    var err = document.getElementById('cf-error');
    err.classList.add('hidden');
    btn.disabled = true;
    btn.textContent = '';
    btn.insertAdjacentHTML('beforeend', '<svg class="w-5 h-5 animate-spin mx-auto" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M21 12a9 9 0 1 1-6.219-8.56"></path></svg>');
    try {
      var res = await fetch(API_BASE + '/pay', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + _apiToken },
        body: JSON.stringify({ action: 'withdraw_otp', project_id: _draft.project_id || _pid(), amount: _draft.amount, dest_type: _draft.dest_type, dest_account: _draft.dest_account })
      });
      var data = await res.json().catch(function () { return {}; });
      if (!res.ok || !data.success) {
        _submitted = false;
        btn.disabled = false; btn.textContent = 'Konfirmasi';
        err.textContent = data.message || data.error || 'Gagal mengirim OTP.';
        err.classList.remove('hidden');
        return;
      }
      try { sessionStorage.setItem('clinqoo_wd_otp_' + _pid(), JSON.stringify({ otp_id: data.otp_id, sent_to: data.sent_to, expires_in: data.expires_in, ts: Date.now() })); } catch (e) {}
      location.href = '../otp/';
    } catch (e) {
      _submitted = false;
      btn.disabled = false; btn.textContent = 'Konfirmasi';
      err.textContent = 'Tidak dapat terhubung ke server.';
      err.classList.remove('hidden');
    }
  }

cfInit();
  </script>
