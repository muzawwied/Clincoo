<body class="text-gray-900 antialiased min-h-screen w-full bg-white pt-16">
  <script>(function(){var t=localStorage.getItem("clinqoo_theme")||"Sistem (Default)";var isDark=(t==="Gelap")||((!t||t==="Sistem (Default)")&&window.matchMedia&&window.matchMedia("(prefers-color-scheme: dark)").matches);if(isDark){document.body.classList.add("dark-mode");}})();</script>

  <!-- Header (seragam dengan dashboard deployment) -->
  <header class="bg-transparent flex justify-between items-center px-3 py-2 fixed top-0 w-full z-40 transition-colors">
    <button type="button" onclick="history.back()" class="w-10 h-10 flex items-center justify-center rounded-full bg-white border border-gray-100 hover:bg-gray-100 transition-all cursor-pointer text-gray-700 hover:text-black" aria-label="Kembali">

    </button>
  </header>

  <div class="max-w-md mx-auto px-5 pb-24 pt-6">
    <div id="rc-loading" class="flex flex-col items-center py-14">
      <svg class="w-7 h-7 text-gray-300 dark:text-slate-600 animate-spin" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-90" fill="currentColor" d="M4 12a8 8 0 018-8v4a4 4 0 00-4 4H4z"></path></svg>
    </div>

    <!-- Detail terima pembayaran -->
    <div id="rc-receipt" class="hidden">
      <p class="text-[11px] font-semibold uppercase tracking-wider text-gray-400 dark:text-gray-500 mb-2.5">Detail Pembayaran</p>
      <div class="space-y-3 text-xs mb-7">
        <div class="flex items-center justify-between"><p class="text-gray-500 dark:text-gray-400">Nominal</p><p id="rc-amount" class="font-semibold font-mono text-gray-900 dark:text-white">Rp 0</p></div>
        <div class="flex items-center justify-between"><p class="text-gray-500 dark:text-gray-400">Metode</p><p class="font-semibold text-gray-900 dark:text-white">QRIS</p></div>
        <div class="flex items-center justify-between"><p class="text-gray-500 dark:text-gray-400">Diterima di</p><p class="font-semibold text-gray-900 dark:text-white">Saldo proyek</p></div>
        <div class="flex items-center justify-between"><p class="text-gray-500 dark:text-gray-400">Waktu</p><p id="rc-time" class="font-mono text-gray-900 dark:text-white">&mdash;</p></div>
      </div>
      <p class="text-[11px] text-gray-400 dark:text-gray-500 mb-6">Kode QRIS berlaku 15 menit setelah dibuat. Dana masuk otomatis ke saldo proyek saat pembayaran terdeteksi.</p>
    </div>

    <p id="rc-error" class="hidden text-center text-xs text-red-500 mb-5"></p>

    <!-- Buat QRIS -->
    <div id="rc-cta" class="hidden">
      <button type="button" id="rc-create" onclick="rcCreate()" class="w-full h-12 text-sm font-semibold text-white bg-black dark:bg-white dark:text-black rounded-full transition-colors cursor-pointer disabled:opacity-40 disabled:cursor-not-allowed">
        Konfirmasi
      </button>
    </div>

    <div id="rc-done" class="hidden mx-auto max-w-[300px] text-center">
      <a href="../" class="inline-flex items-center justify-center px-6 h-12 text-sm font-semibold text-white bg-black dark:bg-white dark:text-black rounded-full transition-colors">Kembali ke Nominal</a>
    </div>
  </div>

  <script>
  var API_BASE = (['clincoo-be2.pages.dev','app.clincoo.buzz','localhost','127.0.0.1'].indexOf(location.hostname) === -1) ? 'https://app.clincoo.buzz/api' : '/api';
  var _apiToken = '';
  try { _apiToken = localStorage.getItem('clinqoo_auth_token') || localStorage.getItem('clinqoo_token') || ''; } catch (e) {}
  function _pid() { try { return localStorage.getItem('clinqoo_current_project_id') || ''; } catch (e) { return ''; } }
  function _rp(n) { return Number(n || 0).toLocaleString('id-ID'); }

  var _draft = null;
  try {
    var __amt = Number(new URLSearchParams(location.search).get('amount') || 0);
    if (__amt >= 1000 && __amt <= 100000000) _draft = { amount: __amt, ts: Date.now() };
  } catch (e) {}
  if (!_draft) { try { _draft = JSON.parse(sessionStorage.getItem('clinqoo_rc_draft_' + _pid()) || 'null'); } catch (e) {} }
  var _payKey = '';
  var _submitted = false;

  function rcShow(id) {
    ['rc-loading', 'rc-receipt', 'rc-cta', 'rc-done'].forEach(function (x) {
      document.getElementById(x).classList.add('hidden');
    });
    document.getElementById(id).classList.remove('hidden');
    if (id !== 'rc-loading') document.getElementById('rc-receipt').classList.remove('hidden');
  }

  async function rcInit() {
    if (!_draft || !_draft.amount) {
      document.getElementById('rc-error').textContent = 'Nominal tidak ditemukan. Mulai ulang dari halaman nominal.';
      document.getElementById('rc-error').classList.remove('hidden');
      rcShow('rc-done');
      return;
    }
    if (!_apiToken) { location.href = '/akun/'; return; }
    document.getElementById('rc-amount').textContent = 'Rp ' + _rp(_draft.amount);
    document.getElementById('rc-time').textContent = new Date().toLocaleString('id-ID', { day: 'numeric', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' });

    // ambil pay_key proyek lewat config (auth)
    for (var i = 0; i < 3; i++) {
      try {
        var res = await fetch(API_BASE + '/pay?action=config&project_id=' + encodeURIComponent(_pid()), { headers: { Authorization: 'Bearer ' + _apiToken } });
        var data = await res.json();
        if (res.ok && data.success && data.active && data.pay_key) {
          _payKey = data.pay_key;
          rcShow('rc-cta');
          return;
        }
        if (res.ok && data.success && !data.active) {
          document.getElementById('rc-error').textContent = 'Pembayaran proyek ini belum aktif.';
          document.getElementById('rc-error').classList.remove('hidden');
          rcShow('rc-done');
          return;
        }
      } catch (e) {}
      if (i < 2) await new Promise(function (r) { setTimeout(r, 900); });
    }
    document.getElementById('rc-error').textContent = 'Tidak dapat memuat status pembayaran.';
    document.getElementById('rc-error').classList.remove('hidden');
    rcShow('rc-done');
  }

  // ===== Buat transaksi QRIS =====
  async function rcCreate() {
    if (_submitted) return;
    _submitted = true;
    var btn = document.getElementById('rc-create');
    var err = document.getElementById('rc-error');
    err.classList.add('hidden');
    btn.disabled = true;
    btn.textContent = '';
    btn.insertAdjacentHTML('beforeend', '<svg class="w-5 h-5 animate-spin mx-auto" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M21 12a9 9 0 1 1-6.219-8.56"></path></svg>');
    try {
      var res = await fetch(API_BASE + '/pay', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ action: 'create', key: _payKey, amount: _draft.amount, description: 'Terima pembayaran' })
      });
      var data = await res.json().catch(function () { return {}; });
      if (!res.ok || !data.success) {
        _submitted = false;
        btn.disabled = false; btn.textContent = 'Konfirmasi';
        err.textContent = data.message || data.error || 'Gagal membuat QRIS.';
        err.classList.remove('hidden');
        return;
      }
      location.href = '../qris/?order_id=' + encodeURIComponent(data.order_id) + '&key=' + encodeURIComponent(_payKey) + '&amount=' + Number(data.amount) + '&total=' + Number(data.total_payment || data.amount) + '&img=' + encodeURIComponent(data.qr_image || '');
    } catch (e) {
      _submitted = false;
      btn.disabled = false; btn.textContent = 'Konfirmasi';
      err.textContent = 'Tidak dapat terhubung ke server.';
      err.classList.remove('hidden');
    }
  }

  rcInit();
  </script>
</body>
