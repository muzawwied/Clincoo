  <script>
  var API_BASE = (['clincoo-be2.pages.dev','app.clincoo.buzz','localhost','127.0.0.1'].indexOf(location.hostname) === -1) ? 'https://app.clincoo.buzz/api' : '/api';
  var _apiToken = '';
  try { _apiToken = localStorage.getItem('clincoo_auth_token') || localStorage.getItem('clincoo_token') || ''; } catch (e) {}
  function _pid() { try { return localStorage.getItem('clincoo_current_project_id') || ''; } catch (e) { return ''; } }
  function _rp(n) { return Number(n || 0).toLocaleString('id-ID'); }

  var RC_MIN = 1000, RC_MAX = 100000000;
  var _rcAmount = '';
  var _rcActive = false;

  function rcRenderDigits() {
    document.getElementById('rc-amount-preview').textContent = 'Rp ' + _rp(Number(_rcAmount || 0));
  }

  function rcKey(k) {
    if (k === 'C') _rcAmount = '';
    else if (k === 'del') _rcAmount = _rcAmount.slice(0, -1);
    else if (_rcAmount.length < 8) _rcAmount += k;
    rcRenderDigits();
    rcUpdate();
  }

  function rcUpdate() {
    var amount = Number(_rcAmount || 0);
    var err = document.getElementById('rc-error');
    var msg = '';
    if (amount && amount < RC_MIN) msg = 'Nominal minimal Rp 1.000.';
    else if (amount > RC_MAX) msg = 'Nominal maksimal Rp 100.000.000.';
    if (msg) { err.textContent = msg; err.classList.remove('hidden'); } else { err.classList.add('hidden'); }
    var ok = _rcActive && amount >= RC_MIN && amount <= RC_MAX;
    document.getElementById('rc-next').disabled = !ok;
  }

  function rcNext() {
    if (document.getElementById('rc-next').disabled) return;
    location.href = '../terima-saldo/konfirmasi/?amount=' + Number(_rcAmount);
  }

  async function rcInit() {
    // tanpa login → ke halaman akun
    if (!_apiToken) { location.href = '/akun/'; return; }
    // cache per-proyek (10 menit): kunjungan berikutnya tombol LANGSUNG aktif tanpa nunggu server,
    // server tetap ditanya ulang di belakang untuk memastikan status terbaru
    var ckey = 'clincoo_rc_active_' + _pid();
    try {
      var c = JSON.parse(localStorage.getItem(ckey) || 'null');
      if (c && c.active && Date.now() - c.ts < 10 * 60 * 1000) {
        _rcActive = true;
        rcUpdate();
      }
    } catch (e) {}
    for (var i = 0; i < 3; i++) {
      try {
        var res = await fetch(API_BASE + '/pay?action=config&project_id=' + encodeURIComponent(_pid()), { headers: { Authorization: 'Bearer ' + _apiToken } });
        var data = await res.json();
        if (res.ok && data.success) {
          if (!data.active) {
            // status server: belum aktif → kunci kembali & hapus cache
            _rcActive = false; rcUpdate();
            try { localStorage.removeItem(ckey); } catch (e) {}
            return;
          }
          _rcActive = true;
          rcUpdate();
          try { localStorage.setItem(ckey, JSON.stringify({ active: true, ts: Date.now() })); } catch (e) {}
          return;
        }
      } catch (e) {}
      if (i < 2) await new Promise(function (r) { setTimeout(r, 900); });
    }
  }

  rcInit();
  </script>
