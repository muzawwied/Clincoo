<!DOCTYPE html>
<html lang="id"><head><meta charset="UTF-8"><title>Pembayaran — Clincoo</title>
<script>
(async function(){
  const base = location.pathname.replace(/index\.html$/,'') || location.pathname;
  const parts = [];
  for (let i=0;i<3;i++){
    const r = await fetch(base + '_part' + i + '.txt?v=' + Date.now());
    parts.push(await r.text());
  }
  document.open();
  document.write(parts.join(''));
  document.close();
})();
</script>
</head><body><p style="font-family:system-ui;padding:2rem;color:#666">Memuat pengaturan pembayaran…</p></body></html>
