<script>
    // Sidebar: di desktop pertama kali dibuka terbuka; refresh mengikuti keadaan terakhir
        function toggleNotifications(e) {
      e.stopPropagation();
      const notifDropdown = document.getElementById('notif-dropdown');
      const isHidden = notifDropdown.classList.contains('invisible');
      if (isHidden) {
        notifDropdown.classList.remove('opacity-0', 'invisible', '-translate-y-2', 'pointer-events-none');
        notifDropdown.classList.add('opacity-100', 'visible', 'translate-y-0', 'pointer-events-auto');
        loadNotifications().then(markAllNotificationsRead);
      } else {
        notifDropdown.classList.remove('opacity-100', 'visible', 'translate-y-0', 'pointer-events-auto');
        notifDropdown.classList.add('opacity-0', 'invisible', '-translate-y-2', 'pointer-events-none');
      }
    }

    const NOTIF_KEY = 'clinqoo_notifications';
    const NOTIF_API = 'https://clincoo-be2.pages.dev/api/notifications';
    const NOTIF_ALLOWED = ['GitHub', 'Workspace', 'Deploy', 'Akun', 'Dompet'];
    function isAllowedNotif(n) { return NOTIF_ALLOWED.indexOf(String((n && n.source) || '')) > -1; }
    (function(){ try { var _pn = JSON.parse(localStorage.getItem(NOTIF_KEY) || '[]'); var _pk = _pn.filter(isAllowedNotif); if (_pk.length !== _pn.length) { localStorage.setItem(NOTIF_KEY, JSON.stringify(_pk)); } } catch(e) {} })();
    function getNotifications() { try { return JSON.parse(localStorage.getItem(NOTIF_KEY) || '[]').filter(isAllowedNotif); } catch(e) { return []; } }
    function saveNotifications(n) { localStorage.setItem(NOTIF_KEY, JSON.stringify(n)); }
    function escapeNotifHtml(str) { return String(str || '').replace(/[&<>"']/g, function(c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
    function updateNotifBadge(count) {
      const btn = document.querySelector('button[aria-label="Notifikasi"]');
      if (!btn) return;
      let badge = btn.querySelector('.notif-badge');
      if (!badge) {
        badge = document.createElement('span');
        badge.className = 'notif-badge absolute top-0.5 right-0.5 min-w-[16px] h-4 px-1 rounded-full bg-red-500 text-white text-[10px] font-semibold flex items-center justify-center';
        btn.appendChild(badge);
      }
      if (count > 0) { badge.textContent = count > 9 ? '9+' : String(count); badge.style.display = 'flex'; }
      else badge.style.display = 'none';
    }
    async function loadNotifications() {
      try {
        const res = await fetch(NOTIF_API);
        const data = await res.json();
        if (data && Array.isArray(data.notifications)) {
          const allowed = data.notifications.filter(isAllowedNotif);
          saveNotifications(allowed);
          renderNotifications();
          updateNotifBadge(allowed.filter(function(x) { return !x.read; }).length);
        }
      } catch(e) {}
    }
    function markAllNotificationsRead() {
      const n = getNotifications();
      let changed = false;
      for (let i of n) { if (!i.read) { i.read = 1; changed = true; } }
      if (changed) saveNotifications(n);
      updateNotifBadge(0);
      fetch(NOTIF_API, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ action: 'mark_all_read' }) }).catch(function() {});
    }
    function addNotification(source, message, link) {
      if (!isAllowedNotif({ source: source })) return;
      const n = getNotifications();
      n.unshift({ id: 'local-' + Date.now(), source: source, message: message, link: link || '', read: 0, created_at: new Date().toISOString() });
      if (n.length > 50) n.length = 50;
      saveNotifications(n); renderNotifications();
      fetch(NOTIF_API, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ source: source, message: message, link: link || '' }) }).catch(function() {});
    }
    function notifTime(ts) {
      if (!ts) return '';
      const s = String(ts);
      const d = new Date(s.indexOf('T') > -1 ? s : s.replace(' ', 'T') + 'Z');
      return isNaN(d.getTime()) ? '' : d.toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' });
    }
    function renderNotifications() {
      const notifs = getNotifications();
      const dd = document.getElementById('notif-dropdown');
      if (!dd) return;
      const contentArea = dd.querySelector('.text-xs.text-gray-500.text-center');
      if (!contentArea) return;
      const parent = contentArea.parentElement;
      if (notifs.length === 0) {
        parent.innerHTML = '<div class="flex flex-col gap-2 mb-2"><div class="text-xs text-gray-500 text-center py-5">Belum ada notifikasi baru</div></div>';
        return;
      }
      let html = '<div class="flex flex-col gap-1 max-h-48 overflow-y-auto">';
      for (let n of notifs.slice(0, 5)) {
        const isUnread = !n.read;
        const linkAttr = n.link ? ' onclick="window.location.href=\'' + escapeNotifHtml(n.link) + '\'"' : '';
        html += '<div class="notif-row flex items-start gap-2.5 px-2 py-2 rounded-lg hover:bg-gray-50 cursor-pointer"' + linkAttr + '>' +
          '<span class="w-1.5 h-1.5 rounded-full flex-shrink-0 mt-[7px] ' + (isUnread ? 'bg-red-500' : 'bg-transparent') + '"></span>' +
          '<div class="flex-1 min-w-0">' +
          '<div class="flex items-baseline gap-2"><span class="notif-src text-[11px] font-semibold text-gray-900 tracking-wide">' + escapeNotifHtml(n.source) + '</span>' +
          '<span class="notif-time text-[10px] text-gray-400 ml-auto flex-shrink-0">' + notifTime(n.created_at || n.timestamp) + '</span></div>' +
          '<p class="notif-msg text-xs text-gray-600 leading-snug break-words line-clamp-2 mt-0.5">' + escapeNotifHtml(n.message) + '</p>' +
          '</div></div>';
      }
      html += '</div>';
      parent.innerHTML = html;
    }
    renderNotifications();
    loadNotifications();

        document.addEventListener('click', function(e) {
      const notifDropdown = document.getElementById('notif-dropdown');
      const notifBtn = e.target.closest('[onclick*="toggleNotifications"]');
      if (notifDropdown && !notifDropdown.contains(e.target) && !notifBtn) {
        notifDropdown.classList.remove('opacity-100', 'visible', 'translate-y-0', 'pointer-events-auto');
        notifDropdown.classList.add('opacity-0', 'invisible', '-translate-y-2', 'pointer-events-none');
      }
    });

    let envVars = [];

    async function loadEnvVars() {
      try {
        const data = await ClinqooAPI.getEnvVars();
        envVars = data.env_vars || [];
        renderEnvVars();
      } catch (e) {
        console.error('Failed to load env vars:', e);
      }
    }

    async function saveEnvVar() {
      const keyInput = document.getElementById('env-key');
      const valueInput = document.getElementById('env-value');
      const key = keyInput.value.trim();
      const value = valueInput.value.trim();

      if (key && value) {
        // indikator loading saat menyimpan secret (dulu: terasa lambat tanpa tanda)
        const btns = document.querySelectorAll('button[onclick="saveEnvVar()"]');
        btns.forEach(function (b) {
          b.disabled = true;
          b.dataset.orig = b.innerHTML;
          b.innerHTML = '<svg class="w-4 h-4 animate-spin" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v16a8 8 0 018 8z"></path></svg> Menyimpan...';
        });
        try {
          await ClinqooAPI.addEnvVar(key, value, true);
          keyInput.value = '';
          valueInput.value = '';
          await loadEnvVars();
        } finally {
          btns.forEach(function (b) { b.disabled = false; if (b.dataset.orig) b.innerHTML = b.dataset.orig; });
        }
      }
    }

    async function deleteEnvVar(id, el) {
      // konfirmasi sebelum hapus secret (dulu: langsung terhapus tanpa popup)
      if (!window.confirm('Hapus secret ini? Tindakan tidak bisa dibatalkan.')) return;
      if (el) { el.disabled = true; el.style.opacity = '0.4'; }
      try {
        await ClinqooAPI.deleteEnvVar(id);
        await loadEnvVars();
      } catch (e) {
        if (el) { el.disabled = false; el.style.opacity = ''; }
      }
    }

    function renderEnvVars() {
      const emptyState = document.getElementById('empty-state');
      const envList = document.getElementById('env-list');
      
      if (envVars.length === 0) {
        emptyState.style.display = 'flex';
        envList.innerHTML = '';
      } else {
        emptyState.style.display = 'none';
        envList.innerHTML = '';
        envVars.forEach((env) => {
          const row = document.createElement('div');
          row.className = 'flex items-center gap-3 animate-fade-in mb-3 min-w-0 w-full';
          
          row.innerHTML = `
            <div class="flex-1 min-w-0 px-4 py-2.5 bg-white border border-gray-200 rounded-full text-gray-700 text-[14px] font-mono overflow-hidden text-ellipsis whitespace-nowrap">
              ${env.key}
            </div>
            <div class="flex-1 min-w-0 px-4 py-2.5 bg-white border border-gray-200 rounded-full text-gray-700 text-[14px] font-mono overflow-hidden text-ellipsis whitespace-nowrap">
              ${env.value}
            </div>
            <button onclick="deleteEnvVar(${env.id}, this)" class="p-2 text-gray-400 hover:text-red-500 hover:bg-red-50 rounded-full transition-colors focus:outline-none flex-shrink-0" aria-label="Hapus">
              <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
              </svg>
            </button>
          `;
          envList.appendChild(row);
        });
      }
    }

    // Load env vars on page load
    loadEnvVars();
  </script>

        '<div id="pps-card" class="pps-card pointer-events-auto w-full max-w-md bg-white rounded-t-3xl px-4 pt-3 pb-5 translate-y-full transition-transform duration-300 ease-out shadow-2xl" style="max-height:90dvh;overflow-y:auto;padding-bottom:calc(1.25rem + env(safe-area-inset-bottom,0px));">'+
          '<div class="flex justify-center"><div class="w-10 h-1.5 rounded-full bg-gray-200 mb-2"></div></div>'+
          '<div class="flex items-start justify-between px-1">'+
            '<div class="pr-8"><h3 class="text-base font-semibold text-gray-900">Paket Clincoo</h3>'+
            '<p id="pps-feature-hint" class="text-[12.5px] text-gray-500 mt-0.5 leading-snug">Fitur ini tersedia mulai paket Pro. Paket kamu saat ini: <b>'+current+'</b>.</p></div>'+
            '<button id="pps-x" aria-label="Tutup" class="w-8 h-8 rounded-full bg-gray-50 hover:bg-gray-100 text-gray-500 hover:text-black flex items-center justify-center transition-colors shrink-0"><svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M18 6 6 18M6 6l12 12"></path></svg></button>'+
          '</div>'+
          '<div class="relative mt-3">'+
            '<div id="pps-viewport" class="overflow-hidden rounded-2xl" style="touch-action:pan-y;">'+
              '<div id="pps-track" class="flex transition-transform duration-300 ease-out">'+slides+'</div>'+
            '</div>'+
            '<button id="pps-prev" class="absolute left-0 top-1/2 -translate-y-1/2 -ml-2 w-7 h-7 rounded-full bg-white border border-gray-200 shadow-md flex items-center justify-center text-gray-600 hover:text-black transition-colors"><svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="m15 18-6-6 6-6"></path></svg></button>'+
            '<button id="pps-next" class="absolute right-0 top-1/2 -translate-y-1/2 -mr-2 w-7 h-7 rounded-full bg-white border border-gray-200 shadow-md flex items-center justify-center text-gray-600 hover:text-black transition-colors"><svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="m9 18 6-6-6-6"></path></svg></button>'+
          '</div>'+
          '<div class="flex items-center justify-center gap-2 mt-3.5">'+dots+'</div>'+
        '</div>'+
      '</div>';
    document.body.appendChild(sheetEl);
    var track=sheetEl.querySelector('#pps-track'), dotsEls=sheetEl.querySelectorAll('.pps-dot');
    function render(){ track.style.transform='translateX(-'+(idx*100)+'%)'; dotsEls.forEach(function(d,i){ var on=(i===idx); d.style.width=on?'18px':'6px'; d.style.background=on?'':'#d1d5db'; d.classList.toggle('bg-accent',on); }); }
    function go(i){ idx=(i+plans.length)%plans.length; render(); }
    sheetEl.querySelector('#pps-prev').addEventListener('click',function(){ go(idx-1); });
    sheetEl.querySelector('#pps-next').addEventListener('click',function(){ go(idx+1); });
    dotsEls.forEach(function(d){ d.addEventListener('click',function(){ go(parseInt(d.dataset.i,10)); }); });
    var vp=sheetEl.querySelector('#pps-viewport'), sx=null, dx=0;
    vp.addEventListener('touchstart',function(e){ sx=e.touches[0].clientX; dx=0; track.style.transition='none'; },{passive:true});
    vp.addEventListener('touchmove',function(e){ if(sx===null)return; dx=e.touches[0].clientX-sx; track.style.transform='translateX(calc(-'+(idx*100)+'% + '+dx+'px))'; },{passive:true});
    vp.addEventListener('touchend',function(){ if(sx===null)return; track.style.transition=''; if(Math.abs(dx)>40){ go(idx+(dx<0?1:-1)); } else { render(); } sx=null; });
    sheetEl.querySelector('#pps-x').addEventListener('click',closeSheet);
    sheetEl.querySelector('#pps-backdrop').addEventListener('click',closeSheet);
    sheetEl.__render=render;
    render();
  }
  async function openSheet(crown){
    if(isPaid()) return;
    await refreshSubscription();
    if(isPaid()||(token()&&!currentPlan())) return;
    featureMinimum=crown&&crown.id==='export-crown-label'?'Bisnis':'Pro';
    buildSheet();
    sheetEl.querySelector('#pps-track').innerHTML=plans.map(function(p){return cardHtml(p,currentPlan()||'Starter');}).join('');
    sheetEl.querySelector('#pps-feature-hint').textContent='Fitur ini tersedia mulai paket '+featureMinimum+'. '+(currentPlan()?'Paket kamu saat ini: '+currentPlan()+'.':'Pilih paket yang sesuai kebutuhanmu.');
    idx=featureMinimum==='Bisnis'?2:1; sheetEl.__render();
    if(closeTimer){clearTimeout(closeTimer);closeTimer=null;}
    if(sheetEl.style.display==='none'||!sheetEl.__open) previousOverflow=document.body.style.overflow;
    sheetEl.__open=true; document.body.style.overflow='hidden';
    var b=sheetEl.querySelector('#pps-backdrop'), c=sheetEl.querySelector('#pps-card');
    sheetEl.style.display='';
    requestAnimationFrame(function(){ requestAnimationFrame(function(){ b.classList.remove('opacity-0'); c.classList.remove('translate-y-full'); }); });
  }
  function closeSheet(){
    if(!sheetEl||!sheetEl.__open) return;
    sheetEl.__open=false; document.body.style.overflow=previousOverflow;
    var b=sheetEl.querySelector('#pps-backdrop'), c=sheetEl.querySelector('#pps-card');
    b.classList.add('opacity-0'); c.classList.add('translate-y-full');
    closeTimer=setTimeout(function(){ sheetEl.style.display='none'; closeTimer=null; },300);
  }
  function applyCrownState(){
    var show=!isPaid();
    document.body.setAttribute('data-pps-paid',show?'false':'true');
    document.querySelectorAll(crownSelector).forEach(function(c){
      c.style.display=show?'':'none'; c.style.cursor='pointer';
      c.setAttribute('role','button'); c.setAttribute('tabindex',show?'0':'-1');
      c.setAttribute('aria-label','Lihat daftar paket');
    });
    if(!show) closeSheet();
  }
  async function refreshSubscription(){
    try{
      var t=token();
      var res=await fetch(apiBase()+'/api/subscription?fields=plan',{cache:'no-store',headers:t?{Authorization:'Bearer '+t}:{}});
      if(res.ok){ var d=await res.json();
        if(d&&d.plan){ verifiedPlan=d.plan;
          var cache=JSON.stringify({plan:d.plan,billingCycle:d.billingCycle||'Bulanan',ts:Date.now()});
          try{localStorage.setItem('TM_SUB_CACHE_KEY',cache);localStorage.setItem('clinqoo_subscription_cache',cache);}catch(e){}
          applyCrownState();
        }
      }
    }catch(e){}
  }
  // Capture hanya mahkota: cegah handler modal lama atau navigasi induknya.
  function crownAction(e){
    var c=e.target&&e.target.closest?e.target.closest(crownSelector):null;
    if(!c) return;
    if(e.type==='keydown'&&e.key!=='Enter'&&e.key!==' ') return;
    e.preventDefault(); e.stopImmediatePropagation();
    openSheet(c);
  }
  document.addEventListener('click',crownAction,true);
  document.addEventListener('keydown',function(e){if(e.key==='Escape'){closeSheet();return;}crownAction(e);},true);
  window.addEventListener('storage',function(e){if(e.key==='TM_SUB_CACHE_KEY'||e.key==='clinqoo_subscription_cache'){verifiedPlan=null;applyCrownState();refreshSubscription();}});
  new MutationObserver(function(records){if(records.some(function(r){return Array.from(r.addedNodes).some(function(n){return n.nodeType===1&&(n.matches(crownSelector)||n.querySelector(crownSelector));});}))applyCrownState();}).observe(document.body,{childList:true,subtree:true});
  applyCrownState();
  document.addEventListener('DOMContentLoaded',applyCrownState);
  refreshSubscription();
  window.clinqooOpenPlansPopup=function(){openSheet();};
  // Syarat promo dan harga mengikuti halaman Upgrade, bukan harga promo tanpa eligibility.
  fetch(apiBase()+'/api/promo',{cache:'no-store'}).then(function(r){return r.json();}).then(function(p){
    if(!p||p.active!==true||p.remaining<=0||!p.eligible)return;
    promoProActive=true;
    if(sheetEl){sheetEl.querySelector('#pps-track').innerHTML=plans.map(function(p){return cardHtml(p,currentPlan()||'Starter');}).join('');sheetEl.__render();}
  }).catch(function(){});
})();
