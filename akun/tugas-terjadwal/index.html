    <script>(function(){var t=localStorage.getItem("clinqoo_theme");var isDark=(t==="Gelap")||((!t||t==="Sistem (Default)")&&window.matchMedia&&window.matchMedia("(prefers-color-scheme: dark)").matches);if(isDark){document.body.classList.add("dark-mode");}})();</script>

        <h1 class="font-extrabold text-lg text-gray-900 tracking-tight">Tugas Terjadwal</h1>
        <button type="button" onclick="location.href='../tugas-terjadwal/tambah/'" aria-label="Buat tugas baru" class="top-2 right-5 w-10 h-10 flex items-center justify-center rounded-full bg-white border border-gray-100 hover:bg-gray-100 transition-all cursor-pointer text-gray-700 hover:text-black">

        </button>

    <main class="flex-1 w-full max-w-2xl mx-auto px-6 py-4 flex flex-col relative min-h-[80vh]">
        <!-- DAFTAR TUGAS -->
        <div id="task-list" class="w-full flex flex-col gap-3"></div>

        <!-- STATE KOSONG -->
        <div id="empty-state" class="hidden flex-col items-center justify-center py-16 text-center">
            <i data-lucide="calendar-clock" class="w-12 h-12 text-gray-300 mb-4"></i>
            <p class="text-base font-semibold text-gray-900">Belum ada tugas terjadwal</p>
            <p class="text-sm text-gray-500 mt-1 max-w-xs">Buat tugas otomatis: AI Clincoo akan menjalankannya sesuai jadwal dan mengirimkan hasilnya ke Anda.</p>
        </div>

    </main>

    <script>
        const API_BASE = ['clincoo-be2.pages.dev','localhost','127.0.0.1'].indexOf(location.hostname) === -1 ? 'https://clincoo-be2.pages.dev' : '';
        let tasks = [];

        function esc(s) {
            return String(s || '').replace(/[&<>"']/g, function (c) {
                return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
            });
        }

        async function loadTasks() {
            const list = document.getElementById('task-list');
            list.innerHTML = '<div class="py-8 flex justify-center"><i data-lucide="loader-2" class="w-6 h-6 text-gray-300 animate-spin"></i></div>';
            try { lucide.createIcons(); } catch (e) {}
            try {
                const res = await fetch(API_BASE + '/api/scheduled-tasks');
                const data = await res.json().catch(() => ({}));
                if (!res.ok) throw new Error(data.error || ('HTTP ' + res.status));
                tasks = data.tasks || [];
                _lastTaskSig = tasksSig(tasks);
                renderTasks();
            } catch (err) {
                list.innerHTML = '<p class="text-sm text-red-500 py-6 text-center">Gagal memuat tugas: ' + esc(err.message) + '</p>';
            }
        }

        // === REAL-TIME: otomasi yang dipasang AI (tool install_automation) muncul
        // otomatis tanpa reload — polling sunyi tiap 15 detik saat halaman terlihat. ===
        function tasksSig(t) {
            return (t || []).map(function (x) { return (x.id || 0) + ':' + (x.active ? 1 : 0) + ':' + (x.last_run_at || '') + ':' + (x.name || ''); }).join('|');
        }
        let _lastTaskSig = '';
        async function refreshTasksSilent() {
            try {
                const res = await fetch(API_BASE + '/api/scheduled-tasks');
                const data = await res.json().catch(() => ({}));
                if (!res.ok) return;
                const t = data.tasks || [];
                const sig = tasksSig(t);
                if (sig !== _lastTaskSig) {
                    _lastTaskSig = sig;
                    tasks = t;
                    renderTasks();
                }
            } catch (e) {}
        }
        setInterval(function () { if (!document.hidden) refreshTasksSilent(); }, 15000);

        function renderTasks() {
            const list = document.getElementById('task-list');
            const empty = document.getElementById('empty-state');
            list.innerHTML = '';
            if (!tasks.length) {
                empty.classList.remove('hidden'); empty.classList.add('flex');
                try { lucide.createIcons(); } catch (e) {}
                return;
            }
            empty.classList.add('hidden'); empty.classList.remove('flex');
            tasks.forEach(function (t) {
                const last = t.last_result;
                const card = document.createElement('div');
                card.className = 'w-full rounded-xl border border-gray-200 p-4 flex flex-col gap-3 transition-colors';
                card.innerHTML = `
                    <div class="flex items-start justify-between gap-3">
                        <div class="min-w-0">
                            <div class="flex items-center gap-2 flex-wrap">
                                <p class="text-[15px] font-semibold text-gray-900 truncate">${esc(t.name)}</p>
                            </div>
                            <p class="text-xs text-gray-500 mt-1 flex items-center gap-1.5">
                                <i data-lucide="clock" class="w-3.5 h-3.5"></i> ${esc(t.when_description)}
                            </p>
                        </div>
                        <label class="relative inline-flex items-center cursor-pointer shrink-0 pt-0.5" title="${t.active ? 'Nonaktifkan' : 'Aktifkan'}">
                            <input type="checkbox" class="sr-only peer" ${t.active ? 'checked' : ''} onchange="toggleTask(${t.id})">
                            <div class="w-11 h-6 bg-gray-200 peer-focus:outline-none rounded-full peer transition-colors peer-checked:bg-black"></div>
                            <div class="absolute left-1 top-1 w-4 h-4 bg-white rounded-full transition-transform peer-checked:translate-x-5"></div>
                        </label>
                    </div>
                    <p class="text-xs text-gray-600 bg-gray-50 rounded-lg px-3 py-2 border border-gray-100 leading-relaxed whitespace-pre-wrap">${esc(t.prompt)}</p>
                    ${last ? `
                    <div class="text-xs border-l-2 ${last.ok ? 'border-green-500' : 'border-red-500'} pl-3 py-1">
                        <p class="font-semibold text-gray-700 mb-0.5 flex items-center gap-1.5"><i data-lucide="${last.ok ? 'check-circle-2' : 'alert-circle'}" class="w-3.5 h-3.5"></i> Hasil terakhir (${esc(String(last.created_at || '').slice(0, 16).replace('T', ' '))} WIB)</p>
                        <p class="text-gray-600 leading-relaxed whitespace-pre-wrap">${esc((last.output || '').length > 500 ? (last.output || '').slice(0, 500) + '…' : (last.output || ''))}</p>
                    </div>` : '<p class="text-xs text-gray-400 italic">Belum pernah dijalankan.</p>'}
                    <div class="flex gap-2 justify-end pt-1">
                        <button type="button" onclick="runNow(${t.id})" class="px-3.5 py-1.5 text-xs font-semibold text-gray-700 bg-white border border-gray-200 hover:bg-gray-50 rounded-lg transition-all cursor-pointer flex items-center gap-1.5"><i data-lucide="play" class="w-3.5 h-3.5"></i> Jalankan</button>
                        <button type="button" onclick="deleteTask(${t.id})" class="px-3.5 py-1.5 text-xs font-semibold text-red-500 bg-white border border-red-200 hover:bg-red-50 rounded-lg transition-all cursor-pointer flex items-center gap-1.5"><i data-lucide="trash-2" class="w-3.5 h-3.5"></i> Hapus</button>
                    </div>
                `;
                list.appendChild(card);
            });
            try { lucide.createIcons(); } catch (e) {}
        }

        async function toggleTask(id) {
            try {
                await fetch(API_BASE + '/api/scheduled-tasks', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ action: 'toggle', id: id })
                });
                loadTasks();
            } catch (err) { console.warn('Gagal mengubah status tugas.'); }
        }

        async function deleteTask(id) {
            if (!confirm('Hapus tugas ini beserta seluruh riwayat hasilnya?')) return;
            try {
                await fetch(API_BASE + '/api/scheduled-tasks', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ action: 'delete', id: id })
                });
                loadTasks();
            } catch (err) { console.warn('Gagal menghapus tugas.'); }
        }

        async function runNow(id) {
            const card = event.target.closest('div.rounded-xl');
            if (card) { card.style.opacity = '0.6'; }
            try {
                const res = await fetch(API_BASE + '/api/scheduled-tasks', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ action: 'run_now', id: id })
                });
                const data = await res.json().catch(() => ({}));
                if (!res.ok) throw new Error(data.error || ('HTTP ' + res.status));
            } catch (err) {
                console.warn('Gagal menjalankan tugas: ' + (err && err.message ? err.message : 'kesalahan jaringan'));
            }
            loadTasks();
        }

        loadTasks();

        // Real-time: tugas bisa dipasang AI lewat chat (tool create_automation)
        // atau dibuat di tab lain — daftar memperbarui diri tanpa reload.
        document.addEventListener('visibilitychange', function () { if (!document.hidden) loadTasks(); });
        window.addEventListener('focus', function () { loadTasks(); });
        window.addEventListener('storage', function (e) { if (e.key === 'clinqoo_automations_updated') loadTasks(); });
        try {
            var _bcAuto = new BroadcastChannel('clinqoo_automations');
            _bcAuto.onmessage = function () { loadTasks(); };
        } catch (e) {}
        setInterval(function () { if (!document.hidden) loadTasks(); }, 10000);
    </script>

    if ('serviceWorker' in navigator) { window.addEventListener('load', function () { navigator.serviceWorker.register('../../sw.js').catch(function () {}); }); }
