    <script>
        // Tampilkan section profile (satu-satunya section di halaman ini)
        (function() {
            var pageId = 'page-profile';
            document.addEventListener('DOMContentLoaded', function() {
                var pages = document.querySelectorAll('.page-view');
                pages.forEach(function(p) {
                    if (p.id === pageId) {
                        p.classList.remove('hidden');
                        p.classList.add('flex');
                    } else {
                        p.classList.add('hidden');
                        p.classList.remove('flex');
                    }
                });
            });
        })();

    </main>    <script>
        try { lucide.createIcons(); } catch (e) {}
        let currentThemeMode = 'Sistem (Default)';
        let currentAccentName = 'Hitam (Default)';
        try {
            currentThemeMode = localStorage.getItem('clincoo_theme') || 'Sistem (Default)';
            currentAccentName = localStorage.getItem('clincoo_accent') || 'Hitam (Default)';
        } catch(e) {}
        function applyTheme() {
            const isDark = (currentThemeMode === 'Gelap') || 
                           (currentThemeMode === 'Sistem (Default)' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
            
            if (isDark) {
                document.body.classList.add('dark-mode');
                document.documentElement.style.background='#0a0a0a';
                document.documentElement.style.colorScheme='dark';
            } else {
                document.body.classList.remove('dark-mode');
                document.documentElement.style.background='';
                document.documentElement.style.colorScheme='light';
            }
        }
        function setTheme(themeName) {
            currentThemeMode = themeName;
            try { localStorage.setItem('clincoo_theme', themeName); } catch(e) {}
            const themeStatusText = document.getElementById('theme-status-text');
            const themeMenu = document.getElementById('theme-dropdown-menu');
            if (themeStatusText) {
                themeStatusText.textContent = themeName;
            }
            applyTheme();
            if (themeMenu) themeMenu.classList.add('hidden');
        }
        if (window.matchMedia) {
            window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => {
                if (currentThemeMode === 'Sistem (Default)') {
                    applyTheme();
                }
            });
        }
        const profileInput = document.getElementById('profile-pic-input');
        const profileDisplay = document.getElementById('profile-pic-display');
        try {
            const savedPic = localStorage.getItem('clincoo_profile_pic');
            if(savedPic && profileDisplay) {
                profileDisplay.style.backgroundImage = `url(${savedPic})`;
                profileDisplay.textContent = '';
            }
        } catch(e) {}

        // Sync name and email from localStorage (shared with ../profile/personal/)
        try {
            const savedName = localStorage.getItem('clincoo_fullname');
            const savedEmail = localStorage.getItem('clincoo_email');
            const nameEl = document.getElementById('profile-display-name');
            const emailEl = document.getElementById('profile-display-email');
            if (savedName && nameEl) nameEl.textContent = savedName;
            if (savedEmail && emailEl) emailEl.textContent = savedEmail;
            // Update avatar initial if name exists
            if (savedName && profileDisplay && !profileDisplay.style.backgroundImage) {
                profileDisplay.textContent = savedName.charAt(0).toUpperCase();
            }
        } catch(e) {}

        // ===== SINKRONISASI D1: Profile = sumber utama; data selalu real-time dari D1 =====
        var profileD1Seeded = false;
        function applyProfileData(d) {
            const nameEl = document.getElementById('profile-display-name');
            const emailEl = document.getElementById('profile-display-email');
            if (d.name) {
                try { localStorage.setItem('clincoo_fullname', d.name); } catch(e) {}
                if (nameEl && nameEl.textContent !== d.name) nameEl.textContent = d.name;
            }
            if (d.email) {
                try { localStorage.setItem('clincoo_email', d.email); } catch(e) {}
                if (emailEl && emailEl.textContent !== d.email) emailEl.textContent = d.email;
            }
            if (d.avatar) {
                try { localStorage.setItem('clincoo_profile_pic', d.avatar); } catch(e) {}
                if (profileDisplay) {
                    profileDisplay.style.backgroundImage = 'url(' + d.avatar + ')';
                    profileDisplay.textContent = '';
                }
            } else {
                const nm = d.name || (nameEl ? nameEl.textContent : '');
                if (nm && profileDisplay && !profileDisplay.style.backgroundImage) {
                    profileDisplay.textContent = nm.charAt(0).toUpperCase();
                }
            }
        }
        // Subtext menu Langganan = nama paket aktif (bukan teks statis).
        // 1) Tampilkan instan dari cache lokal (diisi halaman langganan/upgrade) — jangan tampilkan default 'Starter' palsu.
        // 2) Baru fetch ulang PAKAI token (tanpa token, API balikin paket global default 'Starter').
        // 3) Berhasil fetch = perbarui cache biar halaman lain ikut benar.
        (function () {
            var el = document.getElementById('menu-plan-sub');
            function readCachedPlan() {
                try {
                    var keys = ['TM_SUB_CACHE_KEY', 'clincoo_subscription_cache'];
                    var best = null;
                    keys.forEach(function (k) {
                        var c = JSON.parse(localStorage.getItem(k) || 'null');
                        if (c && c.plan && (!best || (c.ts || 0) > (best.ts || 0))) best = c;
                    });
                    return best;
                } catch (e) { return null; }
            }
            function setLabel(plan) { if (el && plan) el.textContent = plan; }
            var _c = readCachedPlan(); setLabel(_c ? _c.plan : null);
            async function refreshMenuPlanSub() {
                try {
                    var hdr = {};
                    var tok = localStorage.getItem('clincoo_auth_token') || localStorage.getItem('clincoo_token') || '';
                    if (tok) hdr['Authorization'] = 'Bearer ' + tok;
                    var d = await fetch('https://clincoo-be2.pages.dev/api/subscription', { headers: hdr }).then(function (r) { return r.json(); });
                    if (d && d.plan) {
                        setLabel(d.plan);
                        try { localStorage.setItem('TM_SUB_CACHE_KEY', JSON.stringify({ plan: d.plan, billingCycle: d.billingCycle || 'Bulanan', ts: Date.now() })); localStorage.setItem('clincoo_subscription_cache', JSON.stringify({ plan: d.plan, billingCycle: d.billingCycle || 'Bulanan', ts: Date.now() })); } catch (e) {}
                    }
                } catch (e) {}
            }
            refreshMenuPlanSub();
            window.addEventListener('storage', function (e) {
                if (e.key === 'TM_SUB_CACHE_KEY' || e.key === 'clincoo_subscription_cache') {
                    var c = readCachedPlan(); if (c) setLabel(c.plan);
                }
            });
        })();

        async function refreshProfileFromD1() {
            try {
                const d = await fetch('https://clincoo-be2.pages.dev/api/account-profile').then(function(r){ return r.json(); });
                if (!d || d.error) return;
                if (Object.keys(d).length > 0) {
                    applyProfileData(d);
                } else if (!profileD1Seeded) {
                    // D1 masih kosong: jadikan data Profile saat ini sebagai acuan (seed sekali)
                    profileD1Seeded = true;
                    const payload = {};
                    const nameEl = document.getElementById('profile-display-name');
                    const emailEl = document.getElementById('profile-display-email');
                    const nm = localStorage.getItem('clincoo_fullname') || (nameEl ? nameEl.textContent : '');
                    const em = localStorage.getItem('clincoo_email') || (emailEl ? emailEl.textContent : '');
                    const pc = localStorage.getItem('clincoo_profile_pic');
                    if (nm) payload.name = nm.trim();
                    if (em) payload.email = em.trim();
                    if (pc && pc.length < 700000) payload.avatar = pc;
                    if (Object.keys(payload).length > 0) {
                        fetch('https://clincoo-be2.pages.dev/api/account-profile', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify(payload)
                        }).catch(function(){});
                    }
                }
            } catch(e) {}
        }
        refreshProfileFromD1();
        setInterval(refreshProfileFromD1, 10000);
        document.addEventListener('visibilitychange', function() {
            if (!document.hidden) refreshProfileFromD1();
        });

        // Kompres avatar (maks 512px, JPEG) — sebelumnya foto >700KB diam2 tidak tersimpan ke D1
        // lalu polling 10 detik menimpanya kembali dengan avatar lama (foto "kembali sendiri")
        function compressAvatar(file) {
            return new Promise(function(resolve) {
                var reader = new FileReader();
                reader.onload = function(e) {
                    var img = new Image();
                    img.onload = function() {
                        try {
                            var maxDim = 512;
                            var scale = Math.min(1, maxDim / Math.max(img.width, img.height));
                            var canvas = document.createElement('canvas');
                            canvas.width = Math.max(1, Math.round(img.width * scale));
                            canvas.height = Math.max(1, Math.round(img.height * scale));
                            canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
                            resolve(canvas.toDataURL('image/jpeg', 0.85));
                        } catch (err) { resolve(e.target.result); }
                    };
                    img.onerror = function() { resolve(null); };
                    img.src = e.target.result;
                };
                reader.onerror = function() { resolve(null); };
                reader.readAsDataURL(file);
            });
        }

        if (profileInput) {
            profileInput.addEventListener('change', function(e) {
                const file = e.target.files[0];
                if (!file) return;
                compressAvatar(file).then(function(base64) {
                    if (!base64) return;
                    try { localStorage.setItem('clincoo_profile_pic', base64); } catch(err) {}
                    if (profileDisplay) {
                        profileDisplay.style.backgroundImage = 'url(' + base64 + ')';
                        profileDisplay.textContent = '';
                    }
                    fetch('https://clincoo-be2.pages.dev/api/account-profile', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ avatar: base64 })
                    }).catch(function(){});
                });
            });
        }
        // Bahasa (i18n)
        const LANG_NAMES = { id: 'Bahasa Indonesia', en: 'English', es: 'Español' };
        function currentLanguage() {
            try { const v = localStorage.getItem('clincoo_language'); if (v === 'en' || v === 'es' || v === 'id') return v; } catch (e) {}
            return 'id';
        }
        function setLanguage(code) {
            try { localStorage.setItem('clincoo_language', code === 'en' || code === 'es' ? code : 'id'); } catch (e) {}
            location.reload(); // re-render seluruh UI dalam bahasa baru
        }
        (function initLanguageUI() {
            const st = document.getElementById('language-status-text');
            if (st) st.textContent = LANG_NAMES[currentLanguage()] || LANG_NAMES.id;
            const menu = document.getElementById('language-dropdown-menu');
            if (menu) {
                const btns = menu.querySelectorAll('button');
                btns.forEach(function (b, i) {
                    const code = ['id', 'en', 'es'][i];
                    const chk = b.querySelector('.lang-check');
                    if (chk && code === currentLanguage()) chk.classList.remove('hidden');
                });
            }
        })();
        const themeBtn = document.getElementById('theme-dropdown-btn');
        const themeMenu = document.getElementById('theme-dropdown-menu');
        if (themeBtn && themeMenu) {
            themeBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                themeMenu.classList.toggle('hidden');
            });
        }
        document.addEventListener('click', (e) => {
            if (themeMenu && !themeMenu.contains(e.target) && themeBtn && !themeBtn.contains(e.target)) {
                themeMenu.classList.add('hidden');
            }
        });
        const langBtn = document.getElementById('language-dropdown-btn');
        const langMenu = document.getElementById('language-dropdown-menu');
        if (langBtn && langMenu) {
            langBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                langMenu.classList.toggle('hidden');
            });
        }
        document.addEventListener('click', (e) => {
            if (langMenu && !langMenu.contains(e.target) && langBtn && !langBtn.contains(e.target)) {
                langMenu.classList.add('hidden');
            }
        });
    </script>

</script>
