  <script>
    const API_BASE = (['clincoo-be2.pages.dev','localhost','127.0.0.1'].indexOf(location.hostname) === -1) ? 'https://clincoo-be2.pages.dev' : '';
    let allUsers = [];
    let pendingAction = null; // { action, user, requiresReason }

    function formatRupiah(v) { return 'Rp ' + Number(v || 0).toLocaleString('id-ID'); }
    function esc(t) { const d = document.createElement('div'); d.textContent = String(t ?? ''); return d.innerHTML; }
    function timeAgo(iso) {
      if (!iso) return '—';
      const diff = (Date.now() - new Date(iso.replace(' ', 'T') + 'Z').getTime()) / 1000;
      if (isNaN(diff)) return iso;
      if (diff < 3600) return Math.max(1, Math.floor(diff / 60)) + ' mnt lalu';
      if (diff < 86400) return Math.floor(diff / 3600) + ' jam lalu';
      return Math.floor(diff / 86400) + ' hari lalu';
    }

    function showToast(message, isError = false) {
      let toast = document.getElementById('clinqoo-toast');
      if (!toast) { toast = document.createElement('div'); toast.id = 'clinqoo-toast'; document.body.appendChild(toast); }
      toast.className = `fixed bottom-6 right-6 z-50 px-4 py-3 rounded-xl shadow-2xl text-sm font-medium transition-all duration-300 transform translate-y-0 opacity-100 flex items-center gap-2 ${
        isError ? 'bg-red-900 text-white border border-red-700' : 'bg-gray-900 dark:bg-gray-100 text-white dark:text-gray-900 border border-gray-700 dark:border-gray-300'}`;
      toast.innerHTML = (isError ? '<i data-lucide="alert-circle" class="w-4 h-4"></i>' : '<i data-lucide="check-circle-2" class="w-4 h-4"></i>') + `<span>${esc(message)}</span>`;
      if (window.lucide) lucide.createIcons();
      clearTimeout(window._toastTimer);
      window._toastTimer = setTimeout(() => { toast.classList.add('translate-y-10', 'opacity-0'); toast.classList.remove('translate-y-0', 'opacity-100'); }, 3000);
    }

    function redirectToProfile() {
      const profilePath = location.pathname.includes('/Clincoo.') ? '/Clincoo./akun/profile/' : '/akun/profile/';
      window.location.replace(profilePath);
    }

    async function checkAdminPing() {
      try {
        const token = (window.ClinqooAuth && ClinqooAuth.getToken) ? ClinqooAuth.getToken() : (function(){try{return localStorage.getItem('clinqoo_auth_token')||localStorage.getItem('clinqoo_token')||'';}catch(e){return '';}})();
        const res = await fetch(API_BASE + '/api/admin/ping', { headers: token ? { 'Authorization': 'Bearer ' + token } : {} });
        if (!res.ok) { redirectToProfile(); return false; }
        const data = await res.json();
        if (!data || !data.success || !data.is_admin) { redirectToProfile(); return false; }
        document.getElementById('admin-page-container').style.display = 'flex';
        return true;
      } catch (err) { redirectToProfile(); return false; }
    }

    function authHeaders() {
      const token = (window.ClinqooAuth && ClinqooAuth.getToken) ? ClinqooAuth.getToken() : (function(){try{return localStorage.getItem('clinqoo_auth_token')||localStorage.getItem('clinqoo_token')||'';}catch(e){return '';}})();
      return token ? { 'Authorization': 'Bearer ' + token } : {};
    }

    async function fetchUsers() {
      const spin = document.getElementById('refresh-spin-icon');
      if (spin) spin.classList.add('animate-spin');
      try {
        const res = await fetch(API_BASE + '/api/admin/users', { headers: authHeaders() });
        if (res.status === 403) { showToast('Akses ditolak (403)', true); redirectToProfile(); return; }
        if (!res.ok) throw new Error('Gagal mengambil data');
        const data = await res.json();
        if (!data || !data.success) throw new Error(data?.error || 'Gagal memuat data user');
        allUsers = data.users || [];
        document.getElementById('users-skeleton').classList.add('hidden');
        document.getElementById('users-list').classList.remove('hidden');
        buildPlanFilter();
        renderSummary();
        renderUserList();
        handleHashAction();
      } catch (err) {
        showToast(err.message || 'Gagal memuat data user', true);
      } finally {
        if (spin) spin.classList.remove('animate-spin');
      }
    }

    function refreshPageData() { fetchUsers(); }

    // Dari laporan GitHub (users-live.md): #suspend-<id> / #unsuspend-<id> / #delete-<id>
    // langsung buka dialog konfirmasi untuk user terkait.
    function handleHashAction() {
      const m = /^#(suspend|unsuspend|delete)-(\d+)$/.exec(location.hash || '');
      if (!m) return;
      const u = allUsers.find(x => Number(x.id) === Number(m[2]));
      history.replaceState(null, '', location.pathname + location.search);
      if (!u) { showToast('User #' + m[2] + ' tidak ditemukan', true); return; }
      askConfirm(m[1], u.id);
    }

    function buildPlanFilter() {
      const plans = [...new Set(allUsers.map(u => u.plan || 'Free'))].sort();
      const sel = document.getElementById('plan-filter');
      const cur = sel.value;
      sel.innerHTML = '<option value="all">Semua plan</option>' + plans.map(p => `<option value="${esc(p)}">${esc(p)}</option>`).join('');
      if ([...sel.options].some(o => o.value === cur)) sel.value = cur;
    }

    function renderSummary() {
      document.getElementById('sum-total').textContent = allUsers.length + ' user';
      document.getElementById('sum-active').textContent = allUsers.filter(u => u.status === 'active').length + ' aktif';
      document.getElementById('sum-suspended').textContent = allUsers.filter(u => u.status === 'suspended').length + ' suspended';
      document.getElementById('sum-balance').textContent = 'Saldo beredar: ' + formatRupiah(allUsers.reduce((a, u) => a + (u.balance || 0), 0));
    }

    function filteredUsers() {
      const q = (document.getElementById('user-search').value || '').toLowerCase().trim();
      const st = document.getElementById('status-filter').value;
      const pl = document.getElementById('plan-filter').value;
      return allUsers.filter(u =>
        (st === 'all' || u.status === st) &&
        (pl === 'all' || (u.plan || 'Free') === pl) &&
        (!q || (u.name || '').toLowerCase().includes(q) || (u.email || '').toLowerCase().includes(q))
      );
    }

    function avatarHtml(u) {
      const initial = esc(((u.name || u.email || '?')[0] || '?').toUpperCase());
      const fbClass = 'w-9 h-9 rounded-full bg-gray-100 dark:bg-[#1c1c1c] flex items-center justify-center text-xs font-bold text-gray-600 dark:text-gray-300 shrink-0';
      if (u.avatar_url) {
        const fb = '<div class="ava-fb hidden ' + fbClass + '">' + initial + '</div>';
        const img = '<img src="' + esc(u.avatar_url) + '" alt="" class="' + fbClass + '" style="object-fit:cover" onerror="this.style.display=\'none\';this.previousElementSibling.classList.remove(\'hidden\');">';
        return fb + img;
      }
      return '<div class="' + fbClass + '">' + initial + '</div>';
    }

    function statusBadge(u) {
      if (u.role === 'owner') return '<span class="px-2 py-0.5 text-[10px] font-bold uppercase rounded-md bg-black text-white dark:bg-white dark:text-black">Owner</span>';
      if (u.role === 'admin') return '<span class="px-2 py-0.5 text-[10px] font-bold uppercase rounded-md bg-black text-white dark:bg-white dark:text-black">Admin</span>';
      if (u.status === 'suspended') return '<span class="px-2 py-0.5 text-[10px] font-bold uppercase rounded-md bg-red-100 dark:bg-red-950/50 text-red-700 dark:text-red-400">Suspended</span>';
      if (u.status === 'deleted') return '<span class="px-2 py-0.5 text-[10px] font-bold uppercase rounded-md bg-gray-100 dark:bg-[#1c1c1c] text-gray-500">Dihapus</span>';
      return '<span class="px-2 py-0.5 text-[10px] font-bold uppercase rounded-md bg-gray-100 dark:bg-[#1c1c1c] text-gray-600 dark:text-gray-300">Aktif</span>';
    }

    function renderUserList() {
      const wrap = document.getElementById('users-list');
      const list = filteredUsers();
      document.getElementById('users-empty').classList.toggle('hidden', list.length > 0);

      wrap.innerHTML = list.map(u => {
        const isAdmin = u.role === 'admin' || u.role === 'owner'; // owner & admin tidak bisa di-suspend/hapus dari UI
        const canAct = !isAdmin;
        const suspendBtn = u.status === 'suspended'
          ? `<button onclick="askConfirm('unsuspend', ${u.id})" ${canAct ? '' : 'disabled'} class="text-xs font-semibold px-2.5 py-1.5 rounded-lg border border-gray-200 dark:border-[#262626] hover:bg-gray-50 dark:hover:bg-[#1a1a1a] transition-all flex items-center gap-1.5 cursor-pointer ${canAct ? '' : 'opacity-40 cursor-not-allowed'}"><i data-lucide="play" class="w-3.5 h-3.5"></i>Aktifkan</button>`
          : `<button onclick="askConfirm('suspend', ${u.id})" ${canAct ? '' : 'disabled'} class="text-xs font-semibold px-2.5 py-1.5 rounded-lg border border-red-200 dark:border-red-900/60 text-red-600 dark:text-red-400 hover:bg-red-50 dark:hover:bg-red-950/30 transition-all flex items-center gap-1.5 cursor-pointer ${canAct ? '' : 'opacity-40 cursor-not-allowed'}"><i data-lucide="pause" class="w-3.5 h-3.5"></i>Suspend</button>`;
        const delBtn = u.status === 'deleted'
          ? '<span class="text-[10px] text-gray-400 italic pr-1">terhapus</span>'
          : `<button onclick="askConfirm('delete', ${u.id})" ${canAct ? '' : 'disabled'} class="text-xs font-semibold px-2.5 py-1.5 rounded-lg border border-red-200 dark:border-red-900/60 text-red-600 dark:text-red-400 hover:bg-red-50 dark:hover:bg-red-950/30 transition-all flex items-center gap-1.5 cursor-pointer ${canAct ? '' : 'opacity-40 cursor-not-allowed'}"><i data-lucide="trash-2" class="w-3.5 h-3.5"></i>Hapus</button>`;
        const balBtn = `<button onclick="askConfirm('adjust_balance', ${u.id})" class="text-xs font-semibold px-2.5 py-1.5 rounded-lg border border-gray-200 dark:border-[#262626] hover:bg-gray-50 dark:hover:bg-[#1a1a1a] transition-all flex items-center gap-1.5 cursor-pointer"><i data-lucide="wallet" class="w-3.5 h-3.5"></i>Saldo</button>`;
        const reason = u.status === 'suspended' && u.suspend_reason
          ? `<p class="text-[11px] text-red-500 dark:text-red-400 mt-0.5 pl-12 sm:pl-[52px]">Alasan: ${esc(u.suspend_reason)}</p>` : '';

        return `
        <div class="px-4 py-3.5 rounded-lg border border-gray-100 dark:border-[#1c1c1c] hover:border-gray-200 dark:hover:border-[#333] transition-all bg-white dark:bg-transparent">
          <div class="flex items-center gap-3 flex-wrap sm:flex-nowrap">
            ${avatarHtml(u)}
            <div class="flex-1 min-w-0">
              <div class="flex items-center gap-2 flex-wrap">
                <span class="text-sm font-semibold text-gray-900 dark:text-white truncate">${esc(u.name || '(tanpa nama)')}</span>
                ${statusBadge(u)}
              </div>
              <p class="text-xs text-gray-500 dark:text-gray-400 truncate">${esc(u.email)}</p>
            </div>
            <div class="hidden lg:flex flex-col items-end text-xs">
              <span class="font-semibold text-gray-800 dark:text-gray-200">${formatRupiah(u.balance)}</span>
              <span class="text-gray-400">${esc(u.plan || 'Free')} · ${u.projects_count || 0} proyek</span>
              <span class="text-gray-400">${timeAgo(u.last_activity)}</span>
            </div>
            <div class="flex items-center gap-1.5 ml-auto lg:ml-0">
              ${balBtn}
              ${suspendBtn}
              ${delBtn}
            </div>
          </div>
          ${reason}
        </div>`;
      }).join('');

      if (window.lucide) lucide.createIcons();
    }

    // ==== Modal & aksi ====
    function findUser(id) { return allUsers.find(u => u.id === Number(id)); }

    function askConfirm(action, userId) {
      const u = findUser(userId);
      if (!u) return;
      pendingAction = { action, user: u };
      const isSuspend = action === 'suspend';
      const isDelete = action === 'delete';
      const isBalance = action === 'adjust_balance';
      document.getElementById('confirm-title').textContent = isSuspend ? 'Suspend akun?' : isDelete ? 'Hapus akun?' : isBalance ? 'Atur saldo' : 'Aktifkan akun?';
      document.getElementById('confirm-desc').textContent = isSuspend
        ? `${u.name || u.email} akan langsung dikeluarkan dari semua sesi dan tidak bisa login sampai diaktifkan kembali.`
        : isDelete ? `Akun ${u.name || u.email} dihapus (soft-delete): semua sesi dihapus, data historis disimpan untuk audit.`
        : isBalance ? `Saldo saat ini: ${formatRupiah(u.balance)}. Masukkan nominal penyesuaian (boleh negatif, mis. -10000).`
        : `${u.name || u.email} akan bisa login kembali seperti biasa.`;

      const reasonWrap = document.getElementById('confirm-reason-wrap');
      const reasonInput = document.getElementById('confirm-reason');
      reasonInput.value = '';
      if (isBalance) {
        reasonWrap.classList.remove('hidden');
        reasonInput.type = 'number';
        reasonInput.placeholder = 'mis. 10000 atau -5000';
        reasonInput.classList.remove('hidden');
      } else if (isSuspend) {
        reasonWrap.classList.remove('hidden');
        reasonInput.type = 'text';
        reasonInput.placeholder = 'mis. pelanggaran S&K pasal 5';
      } else {
        reasonWrap.classList.add('hidden');
      }
      document.getElementById('confirm-cta-text').textContent = isSuspend ? 'Suspend sekarang' : isDelete ? 'Ya, hapus' : isBalance ? 'Simpan saldo' : 'Ya, aktifkan';
      document.getElementById('confirm-modal').classList.remove('hidden');
      if (window.lucide) lucide.createIcons();
    }

    function closeConfirmModal() {
      document.getElementById('confirm-modal').classList.add('hidden');
      pendingAction = null;
    }

    async function executePendingAction() {
      if (!pendingAction) return;
      const { action, user } = pendingAction;
      const reasonInput = document.getElementById('confirm-reason');
      const cta = document.getElementById('confirm-cta');
      const ctaText = document.getElementById('confirm-cta-text');
      const spinner = document.getElementById('confirm-cta-spinner');
      const check = document.getElementById('confirm-cta-check');

      let body = { action, user_id: user.id };
      if (action === 'suspend') body.reason = reasonInput.value.trim() || 'Pelanggaran ketentuan';
      if (action === 'adjust_balance') {
        const amount = parseFloat(reasonInput.value);
        if (isNaN(amount)) { showToast('Nominal tidak valid', true); return; }
        body.amount = amount;
      }

      cta.disabled = true;
      ctaText.classList.add('hidden');
      spinner.classList.remove('hidden');
      try {
        const res = await fetch(API_BASE + '/api/admin/users', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', ...authHeaders() },
          body: JSON.stringify(body)
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok || !data.success) throw new Error(data?.error || 'Aksi gagal');

        spinner.classList.add('hidden');
        check.classList.remove('hidden');
        await new Promise(r => setTimeout(r, 700));
        closeConfirmModal();
        setTimeout(() => { spinner.classList.add('hidden'); check.classList.add('hidden'); ctaText.classList.remove('hidden'); cta.disabled = false; }, 300);
        showToast(action === 'adjust_balance' ? 'Saldo diperbarui' : action === 'unsuspend' ? 'Akun diaktifkan' : action === 'delete' ? 'Akun dihapus' : 'Akun disuspend');
        fetchUsers();
      } catch (err) {
        spinner.classList.add('hidden');
        ctaText.classList.remove('hidden');
        cta.disabled = false;
        showToast(err.message || 'Aksi gagal', true);
      }
    }

    document.getElementById('confirm-cta').addEventListener('click', executePendingAction);
    document.getElementById('confirm-modal').addEventListener('click', (e) => { if (e.target.id === 'confirm-modal') closeConfirmModal(); });

    document.addEventListener('DOMContentLoaded', async () => {
      const ok = await checkAdminPing();
      if (!ok) return;
      if (window.lucide) lucide.createIcons();
      fetchUsers();
      setInterval(fetchUsers, 30000);
      document.addEventListener('visibilitychange', () => { if (!document.hidden) fetchUsers(); });
    });
  </script>
