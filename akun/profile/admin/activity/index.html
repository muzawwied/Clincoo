  <div id="admin-page-container" style="display: none;" class="flex-1 flex flex-col min-h-screen">

              <i data-lucide="arrow-left" class="w-5 h-5"></i>

            <div>
              <div class="flex items-center gap-2">
                <h1 class="font-extrabold text-lg sm:text-xl text-gray-900 dark:text-white tracking-tight" style="font-family: 'Space Grotesk', sans-serif;">Aktivitas Sistem</h1>

    <main class="flex-1 w-full max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6">

      <div class="flex flex-col sm:flex-row gap-3 sm:items-center mb-5">
        <div class="relative flex-1">
          <i data-lucide="search" class="w-4 h-4 absolute left-3 top-1/2 -translate-y-1/2 text-gray-400"></i>
          <input id="act-search" type="text" placeholder="Filter aktivitas (mis. topup, admin_suspend, deploy)…" oninput="renderActivity()"
            class="w-full pl-9 pr-3 py-2.5 text-sm rounded-lg border border-gray-200 dark:border-[#262626] bg-gray-50 dark:bg-[#111] focus:outline-none focus:ring-2 focus:ring-gray-900 dark:focus:ring-white transition-all">
        </div>
        <select id="act-limit" onchange="fetchActivity()"
          class="px-3 py-2.5 text-sm rounded-lg border border-gray-200 dark:border-[#262626] bg-gray-50 dark:bg-[#111] focus:outline-none focus:ring-2 focus:ring-gray-900 dark:focus:ring-white cursor-pointer">

      <div id="act-list" class="hidden flex-col gap-2"></div>
      <div id="act-empty" class="hidden text-center py-16 text-sm text-gray-400">Tidak ada aktivitas yang cocok.</div>

  <script>
    const API_BASE = (['clincoo-be2.pages.dev','localhost','127.0.0.1'].indexOf(location.hostname) === -1) ? 'https://clincoo-be2.pages.dev' : '';
    let allActivities = [];

    function esc(t) { const d = document.createElement('div'); d.textContent = String(t ?? ''); return d.innerHTML; }
    function timeAgo(iso) {
      if (!iso) return '—';
      const diff = (Date.now() - new Date(iso.replace(' ', 'T') + 'Z').getTime()) / 1000;
      if (isNaN(diff)) return iso;
      if (diff < 60) return 'baru saja';
      if (diff < 3600) return Math.floor(diff / 60) + ' mnt lalu';
      if (diff < 86400) return Math.floor(diff / 3600) + ' jam lalu';
      return Math.floor(diff / 86400) + ' hari lalu';
    }

    function showToast(message, isError = false) {
      let toast = document.getElementById('clinqoo-toast');
      if (!toast) { toast = document.createElement('div'); toast.id = 'clinqoo-toast'; document.body.appendChild(toast); }
      toast.className = `fixed bottom-6 right-6 z-50 px-4 py-3 rounded-xl shadow-2xl text-sm font-medium transition-all duration-300 transform translate-y-0 opacity-100 flex items-center gap-2 ${
        isError ? 'bg-red-900 text-white border border-red-700' : 'bg-gray-900 dark:bg-gray-100 text-white dark:text-gray-900 border border-gray-700 dark:border-gray-300'}`;
      toast.innerHTML = (isError ? '<i data-lucide="alert-circle" class="w-4 h-4"></i>' : '<i data-lucide="check-circle-2" class="w-4 h-4"></i>') + `<span>${esc(message)}</span>`;
      if (window.lucide) lucide.createIcons();
      clearTimeout(window._toastTimer);
      window._toastTimer = setTimeout(() => { toast.classList.add('translate-y-10', 'opacity-0'); toast.classList.remove('translate-y-0', 'opacity-100'); }, 3000);
    }

    function redirectToProfile() {
      const profilePath = location.pathname.includes('/Clincoo.') ? '/Clincoo./akun/profile/' : '/akun/profile/';
      window.location.replace(profilePath);
    }

    async function checkAdminPing() {
      try {
        const token = (window.ClinqooAuth && ClinqooAuth.getToken) ? ClinqooAuth.getToken() : (function(){try{return localStorage.getItem('clinqoo_auth_token')||localStorage.getItem('clinqoo_token')||'';}catch(e){return '';}})();
        const res = await fetch(API_BASE + '/api/admin/ping', { headers: token ? { 'Authorization': 'Bearer ' + token } : {} });
        if (!res.ok) { redirectToProfile(); return false; }
        const data = await res.json();
        if (!data || !data.success || !data.is_admin) { redirectToProfile(); return false; }
        document.getElementById('admin-page-container').style.display = 'flex';
        return true;
      } catch (err) { redirectToProfile(); return false; }
    }

    function authHeaders() {
      const token = (window.ClinqooAuth && ClinqooAuth.getToken) ? ClinqooAuth.getToken() : (function(){try{return localStorage.getItem('clinqoo_auth_token')||localStorage.getItem('clinqoo_token')||'';}catch(e){return '';}})();
      return token ? { 'Authorization': 'Bearer ' + token } : {};
    }

    async function fetchActivity() {
      const spin = document.getElementById('refresh-spin-icon');
      if (spin) spin.classList.add('animate-spin');
      try {
        const limit = document.getElementById('act-limit').value;
        const res = await fetch(API_BASE + '/api/admin/activity?limit=' + limit, { headers: authHeaders() });
        if (res.status === 403) { showToast('Akses ditolak (403)', true); redirectToProfile(); return; }
        if (!res.ok) throw new Error('Gagal mengambil aktivitas');
        const data = await res.json();
        if (!data || !data.success) throw new Error(data?.error || 'Gagal memuat aktivitas');
        allActivities = data.activities || [];
        document.getElementById('act-skeleton').classList.add('hidden');
        document.getElementById('act-list').classList.remove('hidden');
        renderActivity();
      } catch (err) {
        showToast(err.message || 'Gagal memuat aktivitas', true);
      } finally {
        if (spin) spin.classList.remove('animate-spin');
      }
    }

    function refreshPageData() { fetchActivity(); }

    function actionIcon(action) {
      const a = String(action || '');
      if (a.indexOf('admin_') === 0) return { icon: 'shield', cls: 'text-gray-900 dark:text-white bg-gray-100 dark:bg-[#1c1c1c]' };
      if (a.indexOf('topup') >= 0 || a.indexOf('wallet') >= 0 || a.indexOf('balance') >= 0) return { icon: 'wallet', cls: 'text-gray-600 dark:text-gray-300 bg-gray-100 dark:bg-[#1c1c1c]' };
      if (a.indexOf('deploy') >= 0) return { icon: 'rocket', cls: 'text-gray-600 dark:text-gray-300 bg-gray-100 dark:bg-[#1c1c1c]' };
      if (a.indexOf('login') >= 0 || a.indexOf('register') >= 0 || a.indexOf('auth') >= 0) return { icon: 'log-in', cls: 'text-gray-600 dark:text-gray-300 bg-gray-100 dark:bg-[#1c1c1c]' };
      if (a.indexOf('chat') >= 0 || a.indexOf('ai') >= 0) return { icon: 'sparkles', cls: 'text-gray-600 dark:text-gray-300 bg-gray-100 dark:bg-[#1c1c1c]' };
      return { icon: 'dot', cls: 'text-gray-500 bg-gray-100 dark:bg-[#1c1c1c]' };
    }

    function renderActivity() {
      const q = (document.getElementById('act-search').value || '').toLowerCase().trim();
      const list = allActivities.filter(a => !q || String(a.action).toLowerCase().includes(q) || String(a.details || '').toLowerCase().includes(q) || String(a.user_email || '').toLowerCase().includes(q));
      const wrap = document.getElementById('act-list');
      document.getElementById('act-empty').classList.toggle('hidden', list.length > 0);
      wrap.innerHTML = list.map(a => {
        const meta = actionIcon(a.action);
        const iconHtml = meta.icon === 'dot'
          ? `<div class="w-8 h-8 rounded-lg ${meta.cls} flex items-center justify-center shrink-0"><span class="w-2 h-2 rounded-full bg-current"></span></div>`
          : `<div class="w-8 h-8 rounded-lg ${meta.cls} flex items-center justify-center shrink-0"><i data-lucide="${meta.icon}" class="w-4 h-4"></i></div>`;
        return `
        <div class="px-4 py-3 rounded-lg border border-gray-100 dark:border-[#1c1c1c] bg-white dark:bg-transparent flex items-start gap-3">
          ${iconHtml}
          <div class="min-w-0 flex-1">
            <div class="flex items-center gap-2 flex-wrap">
              <span class="text-sm font-semibold text-gray-900 dark:text-white font-mono text-[13px]">${esc(a.action)}</span>
            </div>
            ${a.details ? `<p class="text-xs text-gray-500 dark:text-gray-400 mt-0.5 break-words">${esc(a.details)}</p>` : ''}
            <p class="text-[11px] text-gray-400 mt-1">${esc(a.user_email || a.user_name || 'sistem')} · ${timeAgo(a.created_at)}</p>
          </div>
        </div>`;
      }).join('');
      if (window.lucide) lucide.createIcons();
    }

    document.addEventListener('DOMContentLoaded', async () => {
      const ok = await checkAdminPing();
      if (!ok) return;
      if (window.lucide) lucide.createIcons();
      fetchActivity();
      setInterval(fetchActivity, 30000);
      document.addEventListener('visibilitychange', () => { if (!document.hidden) fetchActivity(); });
    });
  </script>
