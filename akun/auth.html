        .cube { width: 130px; height: 130px; position: relative; transform-style: preserve-3d; animation: cube-spin 16s linear infinite; }
        /* Muka kubus HARUS opaque supaya cincin sisi belakang beneran ketutup (ilusi Saturnus) */
        .cube .face { position: absolute; inset: 0; border: 1.5px solid rgba(0,0,0,0.30); border-radius: 18px; background: #f2f2f2; }
        .cube .f-top { background: #ffffff; }
        .cube .f-front { background: #f7f7f7; }
        .cube .f-back { background: #e8e8e8; }
        .cube .f-left, .cube .f-right { background: #ededed; }
        .cube .f-bottom { background: #e0e0e0; }
        body.dark-mode .cube .face { border-color: rgba(255,255,255,0.22); background: #151515; }
        body.dark-mode .cube .f-top { background: #1d1d1d; }
        body.dark-mode .cube .f-front { background: #171717; }
        body.dark-mode .cube .f-back { background: #101010; }
        body.dark-mode .cube .f-left, body.dark-mode .cube .f-right { background: #121212; }
        body.dark-mode .cube .f-bottom { background: #0c0c0c; }
        .cube .f-front  { transform: rotateY(0deg) translateZ(65px); }
        .cube .f-back   { transform: rotateY(180deg) translateZ(65px); }
        .cube .f-left   { transform: rotateY(-90deg) translateZ(65px); }
        .cube .f-right  { transform: rotateY(90deg) translateZ(65px); }
        .cube .f-top    { transform: rotateX(90deg) translateZ(65px); }
        .cube .f-bottom { transform: rotateX(-90deg) translateZ(65px); }
        @keyframes cube-spin { from { transform: rotateX(-18deg) rotateY(0deg); } to { transform: rotateX(-18deg) rotateY(360deg); } }
        @media (prefers-reduced-motion: reduce) { .cube, .cube-sm, .ring, .hero-dot { animation: none; } }

        /* Kubus utama: bungkus agar bisa mengambang naik-turun */
        .cube-wrap { position: relative; transform-style: preserve-3d; animation: float-soft 6s ease-in-out infinite; }
        @keyframes float-soft { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-16px); } }

        /* Putaran kubus lebih hidup: kemiringan berganti-ganti halus */
        @keyframes cube-spin {
            0%   { transform: rotateX(-22deg) rotateY(0deg); }
            50%  { transform: rotateX(-12deg) rotateY(180deg); }
            100% { transform: rotateX(-22deg) rotateY(360deg); }
        }

        /* Bayangan elips di bawah kubus yang "bernapas" mengikuti float */
        .cube-shadow { position: absolute; bottom: -52px; left: 50%; width: 130px; height: 28px; margin-left: -65px; border-radius: 9999px; background: radial-gradient(ellipse, rgba(0,0,0,0.22), transparent 70%); filter: blur(3px); animation: shadow-breathe 6s ease-in-out infinite; }
        body.dark-mode .cube-shadow { background: radial-gradient(ellipse, rgba(0,0,0,0.9), transparent 70%); }
        @keyframes shadow-breathe { 0%, 100% { transform: scaleX(1); opacity: 0.75; } 50% { transform: scaleX(0.78); opacity: 0.4; } }

        /* Kubus kecil pendamping: 2 buah, melayang + berputar berlawanan */
        .cube-sm { width: 56px; height: 56px; position: absolute; transform-style: preserve-3d; }
        .cube-sm .face { border-width: 1px; border-radius: 10px; border: 1px solid rgba(0,0,0,0.30); background: #f2f2f2; }
        body.dark-mode .cube-sm .face { border-color: rgba(255,255,255,0.22); background: #151515; }
        .cube-sm .f-front  { transform: rotateY(0deg) translateZ(28px); }
        .cube-sm .f-back   { transform: rotateY(180deg) translateZ(28px); }
        .cube-sm .f-left   { transform: rotateY(-90deg) translateZ(28px); }
        .cube-sm .f-right  { transform: rotateY(90deg) translateZ(28px); }
        .cube-sm .f-top    { transform: rotateX(90deg) translateZ(28px); }
        .cube-sm .f-bottom { transform: rotateX(-90deg) translateZ(28px); }
        .cs-a { right: -108px; bottom: -70px; animation: cube-sm-a 9s ease-in-out infinite; }
        @keyframes cube-sm-a {
            0%, 100% { transform: translateY(0) rotateX(-28deg) rotateY(0deg); }
            50%      { transform: translateY(-14px) rotateX(-28deg) rotateY(-180deg); }
        }
        .cube-xs { width: 40px; height: 40px; position: absolute; transform-style: preserve-3d; }
        .cube-xs .face { border-width: 1px; border-radius: 8px; border: 1px solid rgba(0,0,0,0.30); background: #f2f2f2; }
        body.dark-mode .cube-xs .face { border-color: rgba(255,255,255,0.22); background: #151515; }
        .cube-xs .f-front  { transform: rotateY(0deg) translateZ(20px); }

        .cube-xs .f-left   { transform: rotateY(-90deg) translateZ(20px); }

        .cube-xs .f-top    { transform: rotateX(90deg) translateZ(20px); }
        .cube-xs .f-bottom { transform: rotateX(-90deg) translateZ(20px); }
        .cs-b { left: -96px; top: -34px; animation: cube-sm-b 11s ease-in-out infinite; }
        @keyframes cube-sm-b {
            0%, 100% { transform: translateY(0) rotateX(-20deg) rotateY(0deg); }
            50%      { transform: translateY(-12px) rotateX(-20deg) rotateY(360deg); }
        }

        /* Cincin orbit ala Saturnus: dibagi 2 setengah supaya keliatan MENGELILINGI kubus,
           bukan menembusnya. Setengah "back" (sisi jauh) digambar sebelum kubus,
           setengah "front" (sisi dekat) digambar setelah kubus. */
        .orbit-ring { position: absolute; top: 50%; left: 50%; border-radius: 9999px; }
        .orbit-ring.back  { clip-path: inset(0 0 50% 0); }
        .orbit-ring.front { clip-path: inset(50% 0 0 0); }
        .ring-a { width: 230px; height: 230px; margin: -115px 0 0 -115px; border: 1.5px dashed rgba(0,0,0,0.30); animation: ring-a-spin 16s ease-in-out infinite; }

        body.dark-mode .ring-b { border-color: rgba(255,255,255,0.14); }

        .fc-1 { top: -38px; left: -128px; animation: card-float 7s ease-in-out infinite; }

        /* Titik-titik mengambang */
        .hero-dot { position: absolute; border-radius: 9999px; background: rgba(0,0,0,0.30); }
        body.dark-mode .hero-dot { background: rgba(255,255,255,0.32); }
        .dot-1 { width: 8px; height: 8px; top: 18%; left: 16%; animation: float-y 7s ease-in-out infinite; }
        .dot-2 { width: 5px; height: 5px; top: 30%; right: 20%; animation: float-y 9s ease-in-out infinite 1.2s; }
        .dot-3 { width: 6px; height: 6px; bottom: 24%; left: 24%; animation: float-y 8s ease-in-out infinite 0.6s; }
        .dot-4 { width: 4px; height: 4px; bottom: 32%; right: 26%; animation: float-y 10s ease-in-out infinite 2s; }
        .dot-5 { width: 5px; height: 5px; top: 55%; left: 10%; animation: float-y 11s ease-in-out infinite 0.3s; }
        @keyframes float-y { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-18px); } }

        /* Chip fitur */
        .chip { font-size: 11px; font-weight: 600; letter-spacing: 0.04em; padding: 6px 14px; border-radius: 9999px; border: 1px solid rgba(0,0,0,0.14); color: rgba(0,0,0,0.65); background: rgba(255,255,255,0.45); }

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            try { lucide.createIcons(); } catch (e) {}
        });

        // ==== KONFIG AUTH ====
        const API_BASE = 'https://clincoo-be2.pages.dev/api/auth';
        const TOKEN_KEY = 'clincoo_auth_token';
        const GITHUB_CLIENT_ID = 'Ov23ctIBGjQBolR5PS2C';

        function saveSession(data) {
            try {
                localStorage.setItem(TOKEN_KEY, data.token);
                // simpan user lebih dulu -> data profil di bawah otomatis masuk namespace akun
                localStorage.setItem('clincoo_auth_user', JSON.stringify(data.user || {}));
                localStorage.setItem('clincoo_fullname', data.user.name || '');
                localStorage.setItem('clincoo_email', data.user.email || '');
                if (data.user.avatar_url) localStorage.setItem('clincoo_profile_pic', data.user.avatar_url);
            } catch (e) {}
        }


        // Helper cookie untuk state OAuth (lebih tahan redirect lintas-domain daripada
        // localStorage/sessionStorage di beberapa browser dengan anti bounce-tracking).
        function setOauthStateCookie(val, provider) {
            const payload = encodeURIComponent(JSON.stringify({ v: val, t: Date.now(), p: provider }));
            document.cookie = 'clincoo_oauth_state=' + payload + '; Max-Age=900; Path=' + window.location.pathname + '; SameSite=Lax; Secure';
        }
        function getOauthStateCookie() {
            const m = document.cookie.match(/(?:^|;\s*)clincoo_oauth_state=([^;]+)/);
            return m ? decodeURIComponent(m[1]) : null;
        }
        function clearOauthStateCookie() {
            document.cookie = 'clincoo_oauth_state=; Max-Age=0; Path=' + window.location.pathname + '; SameSite=Lax; Secure';
        }

        // ==== LOGIN SOSIAL (OAuth) ====
        // redirect_uri WAJIB persis alamat terdaftar di GitHub OAuth App & Google Console.
        // Halaman auth kini dilayani bersih di /auth/ (auth/index/), tapi callback
        // OAuth tetap diarahkan ke alamat lama yang terdaftar (akun/auth.html), yang
        // kini cuma pengalih ke sini — jadi tidak perlu daftar ulang di Google/GitHub.
        function oauthRedirectUri() {
            if (location.hostname === 'localhost' || location.hostname === '127.0.0.1')
                return window.location.origin + window.location.pathname;
            if (location.hostname === 'muzawwied.github.io')
                return 'https://muzawwied.github.io/Clincoo./akun/auth.html';
            // Dinamis ikut domain aktif — konsisten dengan auth/index.html.
            return location.origin + '/auth/';
        }
        // ==== ANTI-BOT Cloudflare Turnstile ====
        // Dormant sampai admin mengisi TURNSTILE_SITEKEY + TURNSTILE_SECRET di env_vars.
        // Begitu diisi: widget muncul otomatis & login wajib lolos verifikasi bot.
        let _tsSiteKey = null, _tsWidgetId = null, _tsToken = null;
        function setupTurnstile(siteKey) {
            return new Promise((resolve) => {
                _tsSiteKey = siteKey;
                if (!siteKey) { resolve(null); return; }
                const ensureBox = () => {
                    let box = document.getElementById('ts-widget');
                    if (!box) {
                        box = document.createElement('div');
                        box.id = 'ts-widget';
                        box.className = 'mt-5 flex justify-center';
                        const anchor = document.querySelector('[onclick^="startOAuth"]');
                        (anchor && anchor.parentElement ? anchor.parentElement : document.body).appendChild(box);
                    }
                    return box;
                };
                const render = () => {
                    try {
                        if (_tsWidgetId !== null && window.turnstile) { try { window.turnstile.remove(_tsWidgetId); } catch (e2) {} _tsWidgetId = null; }
                        _tsToken = null;
                        _tsWidgetId = window.turnstile.render(ensureBox(), {
                            sitekey: siteKey,
                            callback: (t) => { _tsToken = t; resolve(t); },
                            'expired-callback': () => { _tsToken = null; },
                            'error-callback': () => resolve(null)
                        });
                    } catch (e) { resolve(null); }
                };
                if (window.turnstile) { render(); return; }
                window.__tsReady = render;
                const s = document.createElement('script');
                s.src = 'https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit&onload=__tsReady';
                s.onerror = () => resolve(null);
                document.head.appendChild(s);
            });
        }

        function startOAuth(provider) {
            const redirectUri = oauthRedirectUri();
            // State acak per sesi — cegah serangan login-CSRF (callback jahat memaksa
            // korban login ke akun penyerang). Callback harus mengembalikan state ini.
            const st = (crypto.randomUUID ? crypto.randomUUID() : ('s' + Date.now() + Math.random())).replace(/-/g, '');
            // Cookie (bukan localStorage/sessionStorage) — beberapa browser (Samsung
            // Internet, Firefox, Brave) punya fitur anti "bounce tracking" yang otomatis
            // MENGHAPUS localStorage yang baru ditulis persis sebelum redirect ke domain
            // lain (github.com/accounts.google.com), jadi state selalu hilang saat kembali.
            // Cookie SameSite=Lax dikecualikan dari itu karena memang untuk alur ini.
            // Payload menyimpan provider (p) juga -> deteksi provider saat callback,
            // karena state sekarang acak, bukan literal 'github'/'google'.
            setOauthStateCookie(st, provider);
            if (provider === 'github') {
                window.location.href = 'https://github.com/login/oauth/authorize?client_id=' + GITHUB_CLIENT_ID +
                    '&scope=read:user%20user:email%20repo&state=' + st + '&redirect_uri=' + encodeURIComponent(redirectUri);
            } else {
                fetch(API_BASE + '/google')
                    .then(r => r.json())
                    .then(data => {
                        if (!data.client_id) throw new Error(data.error || 'Client ID Google tidak tersedia.');
                        window.location.href = 'https://accounts.google.com/o/oauth2/v2/auth?client_id=' + data.client_id +
                            '&redirect_uri=' + encodeURIComponent(redirectUri) +
                            '&response_type=code&scope=openid%20email%20profile&state=' + st + '&prompt=select_account';
                    })
                    .catch(err => showModal('Gagal Memulai Login Google', err.message, 'error'));
            }
        }

        async function handleOAuthCallback(code, provider) {
            const redirectUri = oauthRedirectUri();
            window.history.replaceState({}, document.title, window.location.pathname);
            try {
                const send = (tok) => fetch(API_BASE + '/' + provider, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(Object.assign({ code: code, redirect_uri: redirectUri }, tok ? { turnstile_token: tok } : {}))
                });
                let res = await send(_tsToken);
                let data = await res.json();
                // Token Turnstile bisa kedaluwarsa saat user lama di halaman Google/GitHub -> minta baru & ulang
                if (res.status === 403 && data && data.need_turnstile && _tsSiteKey) {
                    const t = await setupTurnstile(_tsSiteKey);
                    if (t) { res = await send(t); data = await res.json(); }
                }
                if (!res.ok || !data.token) throw new Error(data.error || 'Login ' + provider + ' gagal.');
                saveSession(data);
                setTimeout(() => { window.location.href = '../'; }, 400);
            } catch (err) {
                document.getElementById('oauth-loading').classList.add('hidden');
                showModal('Login ' + (provider === 'github' ? 'GitHub' : 'Google') + ' Gagal', err.message, 'error');
            }
        }

        // Handle callback OAuth & sesi aktif saat halaman dibuka
        document.addEventListener('DOMContentLoaded', () => {
            // Anti-bot: pramuat pengaturan Turnstile (diam bila belum dikonfigurasi)
            fetch(API_BASE + '/google').then(r => r.json())
                .then(d => { if (d && d.turnstile_sitekey) setupTurnstile(d.turnstile_sitekey); })
                .catch(() => {});
            const params = new URLSearchParams(window.location.search);
            const code = params.get('code');
            const oauthError = params.get('error');
            if (code) {
                // Deteksi provider dari state tersimpan (cookie). Tanpa validasi blokir:
                // selalu lanjut login, tanpa popup pemblokir.
                const savedRaw = getOauthStateCookie();
                let savedProvider = 'github';
                try {
                    const parsed = JSON.parse(savedRaw || 'null');
                    if (parsed && parsed.p === 'google') savedProvider = 'google';
                } catch (e) {}
                clearOauthStateCookie();
                document.getElementById('oauth-loading').classList.remove('hidden');
                handleOAuthCallback(code, savedProvider);
            } else if (oauthError) {
                showModal('Login Dibatalkan', 'Proses login dibatalkan atau gagal. Silakan coba lagi.', 'error');
            }

            // Kalau sesi masih aktif, langsung ke beranda
            (async () => {
                try {
                    const token = localStorage.getItem(TOKEN_KEY);
                    if (!token) return;
                    const res = await fetch(API_BASE + '/me', { headers: { 'Authorization': 'Bearer ' + token } });
                    if (res.ok) {
                        const d = await res.json();
                        if (d.authenticated) window.location.replace('../');
                    } else {
                        localStorage.removeItem(TOKEN_KEY);
                    }
                } catch (e) {}
            })();
        });

        // Fungsi Modal
        function showModal(title, message, type = 'success') {
        return;
    }

        function closeModal() {
            var modal = document.getElementById('system-modal');
            modal.classList.add('hidden');
            modal.classList.remove('flex');
        }
    </script>
