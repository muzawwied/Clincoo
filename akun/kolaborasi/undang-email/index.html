                    <button onclick="selectInviteRole('Viewer')" class="w-full text-left px-3 py-2 text-sm text-gray-700 dark:text-gray-300 hover:bg-gray-50 dark:hover:bg-[#222] flex items-center justify-between transition-colors focus:outline-none">

                    </button>
                    <button onclick="selectInviteRole('Admin')" class="w-full text-left px-3 py-2 text-sm text-gray-700 dark:text-gray-300 hover:bg-gray-50 dark:hover:bg-[#222] flex items-center justify-between transition-colors focus:outline-none">
                        <span>Admin</span>

        <button id="send-email-btn" onclick="sendEmailInvite()" class="w-full py-2.5 px-4 bg-gray-900 dark:bg-white text-white dark:text-gray-900 rounded-xl text-sm font-semibold hover:bg-black dark:hover:bg-gray-100 transition-colors focus:outline-none flex justify-center items-center shadow-lg shadow-gray-900/10 dark:shadow-white/5">
            Kirim Undangan
        </button>
        <p id="invite-error" class="hidden text-[12px] text-red-500 dark:text-red-400 mt-2 text-center leading-snug"></p>

    <script>
    var API_BASE = (['clincoo-be2.pages.dev','localhost','127.0.0.1'].indexOf(location.hostname) === -1) ? 'https://clincoo-be2.pages.dev/api' : '/api';
    const COLLAB_API = API_BASE + '/collab';

    // Header auth wajib untuk semua aksi kolaborasi (Bearer token login)
    function authHeaders() {
        var t = '';
        try { t = localStorage.getItem('clinqoo_auth_token') || localStorage.getItem('clinqoo_token') || ''; } catch (e) {}
        return t ? { Authorization: 'Bearer ' + t } : {};
    }
    const collabData = { members: [], pending: [] };

    // Konteks proyek dibawa dari halaman kolaborasi; tanpa proyek -> kembali
    const urlParams = new URLSearchParams(window.location.search);
    const projectId = (urlParams.get('project') || '').trim();
    const projectName = (urlParams.get('project_name') || '').trim();
    if (!projectId) { window.location.replace('../../kolaborasi/'); }
    var nameEl = document.getElementById('invite-project-name');
    if (nameEl) nameEl.innerText = projectName || 'Proyek Clincoo';

    try { lucide.createIcons(); } catch (e) {}

    function getInviterName() {
        try {
            var p = JSON.parse(localStorage.getItem('clinqoo_profile') || localStorage.getItem('clinqoo_user') || 'null');
            if (p && (p.display_name || p.username)) return p.display_name || p.username;
        } catch (e) {}
        return 'Pemilik proyek';
    }

    var INVITE_MAX_AGE_MS = 24 * 60 * 60 * 1000;
    function isInviteExpired(inv) {
        var raw = inv && inv.created_date ? String(inv.created_date).replace(' ', 'T') : '';
        if (!raw) return false;
        if (raw.charAt(raw.length - 1) !== 'Z') raw += 'Z';
        var d = new Date(raw);
        if (isNaN(d.getTime())) return false;
        return (Date.now() - d.getTime()) > INVITE_MAX_AGE_MS;
    }

    (function loadCollabForValidation() {
        fetch(COLLAB_API, {
            method: 'POST',
            headers: Object.assign({ 'Content-Type': 'application/json' }, authHeaders()),
            body: JSON.stringify({ action: 'list', project_id: projectId })
        })
        .then(function(r) { return r.json(); })
        .then(function(res) {
            if (res && res.success) {
                collabData.members = res.members || [];
                collabData.pending = (res.pending || []).filter(function(p) { return !isInviteExpired(p); });
            }
        })
        .catch(function() {});
    })();

    function toggleInviteRoleDropdown() {
        const dropdown = document.getElementById('invite-role-dropdown');
        if (dropdown) {
            dropdown.classList.toggle('hidden');
            updateInviteRoleChecks();
        }
    }

    function closeInviteRoleDropdown() {
        const dropdown = document.getElementById('invite-role-dropdown');
        if (dropdown && !dropdown.classList.contains('hidden')) {
            dropdown.classList.add('hidden');
        }
    }

    function selectInviteRole(role) {
        document.getElementById('selected-invite-role').innerText = role;
        closeInviteRoleDropdown();
    }

    function updateInviteRoleChecks() {
        const currentRole = document.getElementById('selected-invite-role').innerText;
        document.querySelectorAll('#invite-role-dropdown [data-lucide="check"]').forEach(icon => {
            if (icon.getAttribute('data-invite-role') === currentRole) {
                icon.classList.remove('hidden');
            } else {
                icon.classList.add('hidden');
            }
        });
    }

    document.addEventListener('click', (e) => {
        const container = document.getElementById('invite-role-container');
        if (container && !container.contains(e.target)) closeInviteRoleDropdown();
    });

    function checkDuplicateInviteEmail(email) {
        var e = String(email || '').toLowerCase();
        var isMember = (collabData.members || []).some(function(m) { return (m.email || '').toLowerCase() === e; });
        if (isMember) return 'Email ini sudah terdaftar sebagai anggota proyek.';
        var isPending = (collabData.pending || []).some(function(p) { return (p.email || '').toLowerCase() === e; });
        if (isPending) return 'Email ini sudah diundang sebelumnya dan masih menunggu diterima.';
        return null;
    }

    function showInviteEmailError(msg) {
        var errEl = document.getElementById('invite-error');
        if (errEl) { errEl.textContent = msg; errEl.classList.remove('hidden'); }
    }

    function hideInviteEmailError() {
        var errEl = document.getElementById('invite-error');
        if (errEl) { errEl.textContent = ''; errEl.classList.add('hidden'); }
    }

    (function() {
        var inp = document.getElementById('invite-email');
        if (inp) {
            inp.addEventListener('input', function() {
                var v = inp.value.trim();
                if (!v || !v.includes('@')) { hideInviteEmailError(); return; }
                var msg = checkDuplicateInviteEmail(v);
                if (msg) showInviteEmailError(msg); else hideInviteEmailError();
            });
        }
    })();

    function sendEmailInvite() {
        const emailInput = document.getElementById('invite-email');
        const errEl = document.getElementById('invite-error');
        errEl.classList.add('hidden');
        errEl.textContent = '';

        const email = emailInput.value.trim();
        if (!email || !email.includes('@')) {
            showInviteEmailError('Masukkan alamat email yang valid.');
            emailInput.focus();
            return;
        }
        var dupMsg = checkDuplicateInviteEmail(email);
        if (dupMsg) {
            showInviteEmailError(dupMsg);
            emailInput.focus();
            return;
        }

        var roleEl = document.getElementById('selected-invite-role'); var role = ((roleEl && roleEl.textContent) || 'Viewer').trim();
        const btn = document.getElementById('send-email-btn');

        btn.innerText = "Mengirim...";
        btn.disabled = true;

        fetch(COLLAB_API, {
            method: 'POST',
            headers: Object.assign({ 'Content-Type': 'application/json' }, authHeaders()),
            body: JSON.stringify({ action: 'invite', project_id: projectId, email: email, role: role, channel: 'email' })
        })
        .then(r => r.json())
        .then(res => {
            if (res.success && res.email_sent) return done();
            if (res.success && res.invite_url) {
                // Undangan tersimpan; server email D1 belum terpasang -> kirim via jalur cadangan (Base44/Resend)
                return fetch('https://koda-da05205d.base44.app/functions/sendInviteEmail', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ to: email, role: role, project: (projectName || 'Clincoo'), link: res.invite_url, inviter: getInviterName() })
                })
                .then(r2 => r2.json())
                .then(res2 => { if (res2.success) done(); else fail(res2.message || 'Gagal mengirim undangan. Coba lagi.'); })
                .catch(function() { fail('Undangan tersimpan, namun email gagal dikirim. Coba lagi beberapa saat.'); });
            }
            fail(res.error || res.message || 'Gagal mengirim undangan. Coba lagi.');
        })
        .catch(function(err) {
            fail((err && err.message) ? err.message : 'Tidak dapat terhubung ke server. Periksa koneksi Anda.');
        });

        function done() {
            btn.innerText = "Terkirim!";
            btn.classList.replace('bg-gray-900', 'bg-green-600');
            btn.classList.replace('dark:bg-white', 'dark:bg-green-500');
            btn.classList.replace('dark:text-gray-900', 'dark:text-white');
            setTimeout(function() { window.ClinqooBack('../../kolaborasi/?project=' + encodeURIComponent(projectId)); }, 1200);
        }
        function fail(msg) {
            btn.innerText = "Kirim Undangan";
            btn.disabled = false;
            errEl.textContent = msg;
            errEl.classList.remove('hidden');
        }
    }
    </script>
