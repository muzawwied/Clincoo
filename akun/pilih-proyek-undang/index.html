<body class="min-h-screen flex flex-col text-gray-900 pt-16 pb-28 bg-[#ffffff]">
    <script>(function(){var t=localStorage.getItem("clincoo_theme");var isDark=(t==="Gelap")||((!t||t==="Sistem (Default)")&&window.matchMedia&&window.matchMedia("(prefers-color-scheme: dark)").matches);if(isDark){document.body.classList.add("dark-mode");}})();</script>

    <main class="flex-1 w-full max-w-md mx-auto px-6 py-8 flex flex-col">

        <!-- Daftar Proyek -->
        <div id="project-list" class="mt-8 flex flex-col gap-2.5"></div>

    <!-- CTA Konfirmasi: muncul setelah proyek dipilih -->
    <div id="cta-bar" class="cta-bar cta-hidden fixed bottom-0 left-0 right-0 z-40">
        <div class="max-w-md mx-auto px-6 pb-6 pt-3 bg-gradient-to-t from-white via-white to-transparent dark:from-black dark:via-black">
            <button type="button" onclick="confirmProject()" id="cta-btn" class="w-full flex items-center justify-center gap-2 py-3.5 bg-gray-900 text-white rounded-full font-bold text-sm hover:bg-gray-800 transition-all shadow-md hover:shadow-lg active:scale-[0.98]">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="w-4 h-4"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>
                <span id="cta-text">Lanjut ke Email</span>
            </button>
        </div>
    </div>

    <script>
        var API_BASE = (['clincoo-be2.pages.dev','localhost','127.0.0.1'].indexOf(location.hostname) === -1) ? 'https://clincoo-be2.pages.dev/api' : '/api';
        var selected = null; // { id, title }

        function goBack() {
            window.ClincooBack('../kolaborasi/');
        }

        function refreshIcons(attempt) {
            try { if (window.lucide) { lucide.createIcons(); return; } } catch (e) {}
            if ((attempt || 0) < 30) setTimeout(function () { refreshIcons((attempt || 0) + 1); }, 100);
        }

        function esc(s) {
            return String(s || '').replace(/[&<>"']/g, function (c) {
                return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
            });
        }

        function projCacheKey() {
            var u = null;
            try { u = JSON.parse(localStorage.getItem('clincoo_auth_user') || 'null'); } catch (e) {}
            // v2: cache lama pernah tersimpan KOSONG karena bug request lama — dibuang
            return 'clincoo_pu_cache_v2_' + (u && u.id ? u.id : 'anon');
        }

        function skeletonList() {
            return '<div class="flex flex-col gap-2.5">' +
                '<div class="h-16 rounded-2xl border border-gray-100 dark:border-[#222] bg-gray-50 dark:bg-[#0f0f0f] animate-pulse"></div>' +
                '<div class="h-16 rounded-2xl border border-gray-100 dark:border-[#222] bg-gray-50 dark:bg-[#0f0f0f] animate-pulse"></div>' +
                '<div class="h-16 rounded-2xl border border-gray-100 dark:border-[#222] bg-gray-50 dark:bg-[#0f0f0f] animate-pulse"></div>' +
            '</div>';
        }

        async function loadProjects() {
            var list = document.getElementById('project-list');
            var t0 = Date.now();

            // 1) Render instan HANYA dari cache segar (maks 5 menit) dan berisi proyek —
            //    cache lama yang pernah tersimpan kosong diabaikan supaya skeleton tetap tampil
            var cached = null;
            try { cached = JSON.parse(localStorage.getItem(projCacheKey()) || 'null'); } catch (e) {}
            var cacheFresh = !!(cached && Array.isArray(cached.projects) && cached.projects.length &&
                (Date.now() - (cached.t || 0)) < 5 * 60 * 1000);
            if (cacheFresh) {
                renderProjects(cached.projects);
            } else {
                // Tampilkan animasi loading (skeleton) selama data asli diambil
                list.innerHTML = skeletonList();
            }

            // 2) Ambil data real-time dari server
            //    /projects: GET = daftar proyek (POST hanya utk upsert/delete) + wajib Bearer token
            try {
                var tok = '';
                try { tok = localStorage.getItem('clincoo_auth_token') || localStorage.getItem('clincoo_token') || ''; } catch (e) {}
                var res = await fetch(API_BASE + '/projects', {
                    method: 'GET',
                    headers: tok ? { Authorization: 'Bearer ' + tok } : {}
                });
                var data = await res.json().catch(function () { return {}; });
                if (!res.ok) throw new Error((data && data.error) || ('HTTP ' + res.status));
                var projects = (data && data.projects) || [];
                // Skeleton minimal terlihat 600ms supaya animasi tidak berkedip sekejap
                var elapsed = Date.now() - t0;
                if (!cacheFresh && elapsed < 600) {
                    await new Promise(function (r) { setTimeout(r, 600 - elapsed); });
                }
                renderProjects(projects);
                try { localStorage.setItem(projCacheKey(), JSON.stringify({ projects: projects, t: Date.now() })); } catch (e) {}
            } catch (err) {
                if (!cacheFresh) {
                    list.innerHTML = '<p class="text-sm text-red-500 py-6 text-center">Gagal memuat proyek: ' + esc(err.message) + '</p>';
                }
            }
        }

        function renderProjects(projects) {
            var list = document.getElementById('project-list');
            if (!projects.length) {
                list.innerHTML =
                    '<div class="flex flex-col items-center text-center py-10">' +
                        '<i data-lucide="folder-open" class="w-12 h-12 text-gray-300 dark:text-gray-600 mb-4"></i>' +
                        '<p class="text-base font-semibold text-gray-900">Belum ada proyek</p>' +
                        '<p class="text-sm text-gray-500 mt-1.5 max-w-xs">Buat proyek terlebih dahulu di halaman Proyek, lalu kembali ke sini untuk mengundang rekan tim.</p>' +
                    '</div>';
                refreshIcons()
                return;
            }
            list.innerHTML = projects.map(function (p, i) {
                return '<button type="button" id="proj-' + esc(p.id) + '" style="animation-delay:' + Math.min(i * 60, 360) + 'ms" onclick="selectProject(\'' + esc(p.id) + '\', this.getAttribute(\'data-title\'))" data-title="' + esc(p.title || 'Proyek tanpa nama') + '" ' +
                    'class="proj-item w-full flex items-center gap-3.5 px-4 py-4 rounded-2xl border border-gray-200 dark:border-[#222] bg-white dark:bg-[#0a0a0a] text-left transition-all cursor-pointer hover:border-gray-400 dark:hover:border-gray-600 focus:outline-none">' +
                    '<span class="w-10 h-10 rounded-full bg-gray-100 dark:bg-[#151515] flex items-center justify-center shrink-0">' +
                        '<i data-lucide="folder" class="w-[18px] h-[18px] text-gray-500 dark:text-gray-400"></i>' +
                    '</span>' +
                    '<span class="flex-1 min-w-0">' +
                        '<span class="block text-[15px] font-semibold text-gray-900 truncate">' + esc(p.title || 'Proyek tanpa nama') + '</span>' +
                        '<span class="block text-xs text-gray-400 mt-0.5">Diperbarui ' + esc(String(p.updatedAt || p.createdAt || '').slice(0, 10)) + '</span>' +
                    '</span>' +
                    '<span class="check-wrap w-5 h-5 shrink-0 opacity-0 transition-opacity">' +
                        '<i data-lucide="check-circle-2" class="w-5 h-5 text-gray-900 dark:text-white"></i>' +
                    '</span>' +
                '</button>';
            }).join('');
            refreshIcons()
        }

        function selectProject(id, title) {
            selected = { id: String(id), title: title };
            document.querySelectorAll('.proj-item').forEach(function (el) {
                var isSel = el.id === 'proj-' + id;
                el.classList.toggle('border-black', isSel);
                el.classList.toggle('selected-dark', isSel);
                el.classList.toggle('dark:bg-[#111]', isSel);
                var chk = el.querySelector('.check-wrap');
                if (chk) chk.style.opacity = isSel ? '1' : '0';
            });
            var ctaText = document.getElementById('cta-text');
            if (ctaText) ctaText.innerText = 'Lanjut ke Email';
            var bar = document.getElementById('cta-bar');
            if (bar) { bar.classList.remove('cta-hidden'); refreshIcons() }
        }

        function confirmProject() {
            if (!selected) return;
            var url = '../kolaborasi/undang-email/?project=' + encodeURIComponent(selected.id) + '&project_name=' + encodeURIComponent(selected.title);
            window.location.href = url;
        }

        loadProjects();
    </script>
