<!-- Toast -->
<div id="toast" class="fixed bottom-5 left-1/2 -translate-x-1/2 z-[70] hidden">
    <div class="bg-accent text-white text-[13px] font-semibold rounded-full px-4 py-2.5 shadow-lg pop" id="toast-msg"></div>
</div>

<script>
function goBack() { if (history.length > 1) history.back(); else location.href = '/'; }

// ==== Data real-time dari server (BUKAN localStorage) ====
// /api/kredit membaca ai_packs + ai_usage — tabel yang sama dengan yang
// dipotong /api/chat — jadi saldo selalu sinkron dengan pemakaian nyata.
// Sinkron antar tab: BroadcastChannel 'clincoo_kredit_sync' (chat menyiarkan
// tiap AI selesai menjawab) + poll ringan sebagai fallback.
var state = { saldo: 0, terpakai: 0, riwayat: [], chatLog: [], integrasi: [], email: '' };

function fmt(n) {
    var v = Number(n || 0);
    if (!isFinite(v)) v = 0;
    // [9 Okt, arahan pemilik] kredit dipatok harga provider per 2000 token
    // (GLM 0,003 / Haiku 0,002): tampil sampai 6 desimal, nol buntut dibuang.
    if (Math.abs(v - Math.round(v)) < 0.0000005) return Math.round(v).toLocaleString('id-ID');
    var s = v.toFixed(6).replace(/0+$/, '').replace(/[.,]$/, '');
    return s.replace('.', ',');
}
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
var toastTimer = null;
function toast(msg) {
    var t = document.getElementById('toast');
    document.getElementById('toast-msg').textContent = msg;
    t.classList.remove('hidden');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { t.classList.add('hidden'); }, 2200);
}

function render(saldoChanged) {
    var vs = document.getElementById('v-saldo');
    vs.textContent = fmt(state.saldo);
    if (saldoChanged) { vs.classList.remove('saldo-pop'); void vs.offsetWidth; vs.classList.add('saldo-pop'); }
    document.getElementById('v-terpakai').textContent = state.terpakai > 0
        ? fmt(state.terpakai) + ' kredit terpakai sejauh ini'
        : 'Belum ada kredit terpakai';

    // Tab Transaksi — tabel lengkap: sumber, kredit, harga, status, masa aktif, waktu
    var el = document.getElementById('panel-transaksi');
    if (!state.riwayat.length) {
        el.innerHTML = emptyBlock('Belum ada riwayat kredit.', 'history');
    } else {
        el.innerHTML = '<div class="overflow-x-auto"><table class="w-full text-left border-collapse"><thead><tr class="text-[10px] font-bold text-gray-400 uppercase tracking-wider border-b border-gray-100"><th class="py-2.5 pr-2">Sumber</th><th class="py-2.5 text-right">Kredit</th><th class="py-2.5 px-3 text-right">Sisa</th><th class="py-2.5 px-3 text-right">Harga</th><th class="py-2.5 px-3 text-center">Status</th><th class="py-2.5 pl-4 text-right">Waktu</th></tr></thead><tbody class="divide-y divide-gray-100">' +
            state.riwayat.map(function (r) {
                var on = r.status === 'Aktif';
                return '<tr>' +
                    '<td class="py-3 pr-2 whitespace-nowrap text-[13px] font-semibold text-gray-900">' + esc(r.sumber) + '</td>' +
                    '<td class="py-3 text-right whitespace-nowrap text-[13px] font-bold text-emerald-600 mono">+' + fmt(r.kredit) + '</td>' +
                    '<td class="py-3 px-3 text-right whitespace-nowrap text-[13px] font-medium text-gray-700 mono">' + fmt(r.sisa) + '</td>' +
                    '<td class="py-3 px-3 text-right whitespace-nowrap text-[13px] font-bold text-gray-900 mono">' + esc(r.harga) + '</td>' +
                    // [9 Okt 2026, arahan pemilik] label status TANPA card: teks polos;
                    // "hingga" nempel satu baris di sebelahnya, semua baris tabel cuma satu baris.
                    '<td class="py-3 px-3 text-center whitespace-nowrap"><span class="text-[10px] font-bold ' + (on ? 'text-emerald-600' : 'text-gray-400') + '">' + esc(r.status) + '</span>' + (on && r.hingga ? '<span class="text-[10px] text-gray-400 font-medium ml-1.5">hingga ' + esc(r.hingga) + '</span>' : '') + '</td>' +
                    '<td class="py-3 pl-4 text-right text-[12px] text-gray-400 font-medium whitespace-nowrap">' + esc(r.waktu) + '</td></tr>';
            }).join('') + '</tbody></table></div>';
    }

    // Tab Chat — per pesan: Tanggal | Nama | Input | Output | Status | Kredit
    var pc = document.getElementById('panel-chat');
    var chat = state.chatLog || [];
    if (chat.length) {
        pc.innerHTML = '<div class="overflow-x-auto"><table class="w-full text-left border-collapse"><thead><tr class="text-[10px] font-bold text-gray-400 uppercase tracking-wider border-b border-gray-100"><th class="py-2.5 pr-2">Tanggal</th><th class="py-2.5 px-3">Nama</th><th class="py-2.5 px-3 text-right">Input</th><th class="py-2.5 px-3 text-right">Output</th><th class="py-2.5 px-3 text-center">Status</th><th class="py-2.5 pl-4 text-right">Kredit</th></tr></thead><tbody class="divide-y divide-gray-100">' +
            chat.map(function (c) {
                return '<tr>' +
                    '<td class="py-2.5 pr-2 text-[13px] font-semibold text-gray-900 whitespace-nowrap">' + esc(c.tanggal) + '</td>' +
                    '<td class="py-2.5 px-3 text-[13px] font-medium text-gray-700 whitespace-nowrap">' + esc(c.nama) + '</td>' +
                    '<td class="py-2.5 px-3 text-right text-[13px] font-medium text-gray-700 mono whitespace-nowrap">' + fmt(c.input) + '</td>' +
                    '<td class="py-2.5 px-3 text-right text-[13px] font-medium text-gray-700 mono whitespace-nowrap">' + fmt(c.output) + '</td>' +
                    // [9 Okt 2026, arahan pemilik] label "Berhasil" TANPA card: teks polos
                    '<td class="py-2.5 px-3 text-center whitespace-nowrap"><span class="text-[10px] font-bold text-emerald-600">' + esc(c.status) + '</span></td>' +
                    '<td class="py-2.5 pl-4 text-right text-[13px] font-bold text-gray-900 mono whitespace-nowrap">' + fmt(c.kredit) + '</td></tr>';
            }).join('') + '</tbody></table></div>';
    } else {
        pc.innerHTML = emptyBlock('Belum ada penggunaan kredit.', 'history');
    }

    // Tab Integrasi AI — per fitur Clincoo (tanpa nama provider)
    var pi = document.getElementById('panel-integrasi');
    var intg = state.integrasi || [];
    if (intg.length) {
        pi.innerHTML = '<table class="w-full text-left border-collapse"><thead><tr class="text-[10px] font-bold text-gray-400 uppercase tracking-wider border-b border-gray-100"><th class="py-2.5 pr-2">Integrasi</th><th class="py-2.5 text-center">Status</th><th class="py-2.5 px-3 text-center">Pesan</th><th class="py-2.5 pl-4 text-right">Kredit Terpakai</th></tr></thead><tbody class="divide-y divide-gray-100">' +
            intg.map(function (i) {
                var on = i.status === 'Aktif';
                return '<tr><td class="py-2.5 pr-2 text-[13px] font-semibold text-gray-900 whitespace-nowrap">' + esc(i.nama) + '</td>' +
                    '<td class="py-2.5 text-center whitespace-nowrap"><span class="text-[10px] font-bold ' + (on ? 'text-emerald-600' : 'text-gray-400') + '">' + esc(i.status) + '</span></td>' +
                    '<td class="py-2.5 px-3 text-center text-[13px] font-medium text-gray-700 mono whitespace-nowrap">' + fmt(i.pesan) + '</td>' +
                    '<td class="py-2.5 pl-4 text-right text-[13px] font-bold text-gray-900 mono whitespace-nowrap">' + fmt(i.kredit) + '</td></tr>';
            }).join('') + '</tbody></table>';
    } else {
        pi.innerHTML = emptyBlock('Belum ada penggunaan kredit.', 'history');
    }
    lucide.createIcons();
}

function emptyBlock(msg, icon) {
    return '<div class="flex flex-col items-center py-8">' +
        '<i data-lucide="' + icon + '" class="w-6 h-6 text-gray-400"></i>' +
        '<p class="text-[12px] text-gray-400 font-medium mt-3">' + msg + '</p></div>';
}

// ==== Tab riwayat ====
var curTab = 'transaksi';
function switchTab(t) {
    curTab = t;
    document.querySelectorAll('.tab-panel').forEach(function (p) { p.classList.add('hidden'); });
    document.getElementById('panel-' + t).classList.remove('hidden');
    document.querySelectorAll('.tab-btn').forEach(function (b) {
        b.classList.remove('text-gray-900');
        b.classList.add('text-gray-400');
        b.querySelector('.tab-line').classList.add('opacity-0');
    });
    var btn = document.getElementById('tab-' + t);
    btn.classList.remove('text-gray-400');
    btn.classList.add('text-gray-900');
    btn.querySelector('.tab-line').classList.remove('opacity-0');
}

// ==== Muat data real-time ====
var loading = false;
async function load(isRefresh) {
    if (loading) return;
    loading = true;
    try {
        var res = await fetch('/api/kredit', { headers: { 'Content-Type': 'application/json' } });
        if (res.status === 401) { location.href = '/auth/?next=' + encodeURIComponent(location.pathname); return; }
        var data = await res.json();
        var oldSaldo = state.saldo;
        state.saldo = data.saldo || 0;
        state.terpakai = data.terpakai || 0;
        state.riwayat = data.riwayat || [];
        state.chatLog = data.chatLog || [];
        state.integrasi = data.integrasi || [];
        state.email = data.email || '';
        // [8 Okt 2026, arahan pemilik] Top Up sepenuhnya di dalam Clincoo —
        // tidak lagi membuka situs kredit-ai.pages.dev. Grant otomatis ke akun login.
        document.getElementById('btn-topup').href = '/akun/kredit/topup/';
        render(isRefresh && oldSaldo !== state.saldo);
        if (isRefresh && oldSaldo !== state.saldo) toast('Saldo kredit diperbarui');
    } catch (e) {
        document.getElementById('v-terpakai').textContent = 'Gagal memuat data — coba lagi sebentar.';
    } finally {
        loading = false;
    }
}

// Sinkron antar tab: chat/saldo berubah di tab lain -> langsung segarkan di sini
try {
    var bc = new BroadcastChannel('clincoo_kredit_sync');
    bc.onmessage = function (ev) { load(true); };
} catch (e) {}
// Fallback + sinkron perangkat lain: poll ringan tiap 5 detik
setInterval(function () { if (document.visibilityState === 'visible') load(true); }, 5000);
document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'visible') load(true); });

switchTab('transaksi');
load(false);
lucide.createIcons();
</script>
</body>
