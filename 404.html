<script>
// GitHub Pages tidak mendukung rewrite server. Halaman ini memulihkan URL lama/virtual
// yang dikenal, dan selain itu OTOMATIS mengalihkan ke halaman utama (ala repo Wallet).
(function () {
    var base = location.hostname.indexOf('github.io') !== -1 ? '/Clincoo.' : '';
    document.getElementById('home').href = base + '/';
    var p = decodeURIComponent(location.pathname), m, q = location.search, h = location.hash;
    // pola lama: /Clincoo./<seg>.html -> /Clincoo./<seg>/
    m = p.match(/^(.*?)([A-Za-z0-9_-]+)\.html$/);
    if (m) { location.replace(m[1] + m[2] + '/' + q + h); return; }
    // selain pola yang dikenal -> halaman utama (location.replace: tanpa entri history baru)
    setTimeout(function () { location.replace(base + '/'); }, 800);
})();
</script>
