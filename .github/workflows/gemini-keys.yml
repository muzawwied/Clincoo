name: Set Gemini keys
on:
  workflow_dispatch: {}
jobs:
  set-keys:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Patch Build mode to Gemini 3.6 Flash
        run: |
          set -e
          python3 << 'PY'
          with open("functions/api/chat.js") as f:
              c = f.read()
          if "Gemini-build-3.6" in c:
              print("Already patched")
              raise SystemExit(0)
          old = """      if (buildMode && (!r || r.error)) {
        const mr = await withTimeout(tryModelRouterText(mrKeys, workMessages, toolDecls, MODELROUTER_MODELS, streamSend ? ((tx) => streamSend({ t: 'delta', text: tx })) : null, mrUsageAcc), 90000, 'ModelRouter').catch(e => ({ error: e.message }));
        if (mr && !mr.error) r = mr;
      }"""
          new = """      // [9 Okt sementara] MODE BUILD -> Gemini AI Studio 3.6 Flash UTAMA
      if (buildMode && (!r || r.error)) {
        try {
          const gKeys = await getGeminiKeys(env);
          if (gKeys && gKeys.length) {
            const { systemInstruction, contents } = toGeminiPayload(workMessages);
            const gem = await withTimeout(tryModels(gKeys, systemInstruction, contents, gTools, streamSend ? ((tx) => streamSend({ t: 'delta', text: tx })) : null), 90000, 'Gemini-build-3.6').catch(e => ({ error: e.message }));
            if (gem && !gem.error && (gem.text || gem.tool_calls)) r = gem;
          }
        } catch (e) {}
        if ((!r || r.error) && mrKeys.length) {
          const mr = await withTimeout(tryModelRouterText(mrKeys, workMessages, toolDecls, MODELROUTER_MODELS, streamSend ? ((tx) => streamSend({ t: 'delta', text: tx })) : null, mrUsageAcc), 90000, 'ModelRouter').catch(e => ({ error: e.message }));
          if (mr && !mr.error) r = mr;
        }
      }"""
          old_gate = "const buildMode = ENABLE_BUILD_ROUTE && (body.mode === 'build' || (!explicitChat && detectBuildIntent(body.messages))) && !isGuest && !!mrKeys.length && !hasImages;"
          new_gate = "const buildMode = ENABLE_BUILD_ROUTE && (body.mode === 'build' || (!explicitChat && detectBuildIntent(body.messages))) && !isGuest && !hasImages; // sementara Gemini 3.6"
          assert old in c, "build block missing"
          c = c.replace(old, new)
          if old_gate in c:
              c = c.replace(old_gate, new_gate)
          open("functions/api/chat.js", "w").write(c)
          print("patched OK", len(c))
          PY
          git config user.name Clincoo
          git config user.email halo@clincoo.buzz
          git add functions/api/chat.js
          git commit -m "temp: Build mode -> Gemini 3.6 Flash AI Studio" || echo nothing
          git push origin main || true
      - name: Upsert kunci Gemini ke D1 + project-level Pages env
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          K1: ${{ secrets.GEMINI_KEY_1 }}
          K2: ${{ secrets.GEMINI_KEY_2 }}
          K3: ${{ secrets.GEMINI_KEY_3 }}
        run: |
          set -euo pipefail
          npm i -g wrangler@latest >/dev/null 2>&1
          export CLOUDFLARE_API_TOKEN=$CF_API_TOKEN CLOUDFLARE_ACCOUNT_ID=$CF_ACCOUNT_ID
          echo "--- Upsert 3 kunci (dengan prefiks AQ.) ke D1 env_vars:"
          for PAIR in "GEMINI_API_KEY:$K1" "GEMINI_API_KEY_2:$K2" "GEMINI_API_KEY_3:$K3"; do
            NAME="${PAIR%%:*}"; VAL="${PAIR#*:}"
            if [ -z "$VAL" ]; then echo "$NAME: skip (secret kosong)"; continue; fi
            cat > /tmp/key.sql <<SQL
          DELETE FROM env_vars WHERE key = '$NAME';
          INSERT INTO env_vars (key, value, is_secret, updated_at) VALUES ('$NAME', '$VAL', 1, datetime('now'));
          SQL
            if wrangler d1 execute clincoo-db --remote --file /tmp/key.sql >/tmp/wr.out 2>&1; then
              echo "$NAME: tersimpan di D1 (len ${#VAL})"
            else
              echo "$NAME: GAGAL:"; tail -20 /tmp/wr.out; exit 1
            fi
            rm -f /tmp/key.sql
          done
          echo "--- Verifikasi baris terbaca:"
          wrangler d1 execute clincoo-db --remote --json --command "SELECT key, length(value) AS len FROM env_vars WHERE key LIKE 'GEMINI_API_KEY%'" | python3 -c "import json,sys; d=json.load(sys.stdin); print([ [r['key'], r['len']] for r in d[0]['results']])" || true
          echo "--- Patch env var project-level GEMINI_API_KEY (production) dengan kunci utama:"
          if [ -n "$K1" ]; then
            BODY=$(printf '{"deployment_configs":{"production":{"env_vars":{"GEMINI_API_KEY":{"type":"secret_text","value":"%s"}}}}}' "$K1")
            RES=$(curl -s -X PATCH "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT_ID/pages/projects/clincoo" -H "Authorization: Bearer $CF_API_TOKEN" -H 'Content-Type: application/json' -d "$BODY")
            echo "$RES" | jq -r '"success: \(.success)" + (if .success then "" else " errors: \(.errors)" end)'
          fi
