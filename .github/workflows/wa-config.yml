name: Konfigurasi WA Gateway (D1)

on:
  workflow_dispatch:

concurrency:
  group: wa-config-clincoo
  cancel-in-progress: true

jobs:
  set-wa-env:
    name: Tulis env WhatsApp ke D1 clincoo-db
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout kode
        uses: actions/checkout@v4

      - name: Pasang wrangler
        run: npm install -g wrangler

      - name: Tulis WHATSAPP_PHONE_NUMBER_ID / WABA_ID / VERIFY_TOKEN
        run: |
          npx wrangler d1 execute clincoo-db --remote --command "CREATE TABLE IF NOT EXISTS env_vars (id INTEGER PRIMARY KEY AUTOINCREMENT, key TEXT NOT NULL UNIQUE, value TEXT NOT NULL, is_secret INTEGER DEFAULT 0, created_at TEXT DEFAULT (datetime('now')), updated_at TEXT DEFAULT (datetime('now'))); INSERT OR REPLACE INTO env_vars (key, value, is_secret, created_at, updated_at) VALUES ('WHATSAPP_PHONE_NUMBER_ID', '$PNID', 0, datetime('now'), datetime('now')), ('WHATSAPP_WABA_ID', '$WABA', 0, datetime('now'), datetime('now')), ('WHATSAPP_VERIFY_TOKEN', '$VTOK', 0, datetime('now'), datetime('now')), ('WHATSAPP_TOKEN', '$WTOK', 1, datetime('now'), datetime('now'));"
        env:
          PNID: ${{ secrets.WA_PNID }}
          WABA: ${{ secrets.WA_WABA }}
          VTOK: ${{ secrets.WA_VTOK }}
          WTOK: ${{ secrets.WA_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Verifikasi nilai tersimpan
        run: npx wrangler d1 execute clincoo-db --remote --command "SELECT key, length(value) AS len FROM env_vars WHERE key LIKE 'WHATSAPP_%' ORDER BY key"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
