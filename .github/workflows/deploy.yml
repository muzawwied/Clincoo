name: Deploy Cloudflare Pages

on:
  push:
    branches: [main]
    # Push yang hanya dokumen (.md / docs/) tidak perlu deploy ulang situs —
    # hindari pergantian deployment tiap jam dari laporan audit AGENTS.md.
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:

concurrency:
  group: pages-deploy-clincoo
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout kode
        uses: actions/checkout@v4

      - name: Bersihkan artefak repo (tidak ikut di-publish)
        run: rm -rf .git .github tests node_modules .wrangler package.json package-lock.json .gitignore debug debug-notif

      - name: Pasang wrangler
        run: npm install -g wrangler

      - name: Deploy ke Cloudflare Pages
        run: npx wrangler pages deploy . --project-name=clincoo --branch=main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  deploy-agent-worker:
    name: Deploy Agent Worker (Cloudflare Workflows)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout kode
        uses: actions/checkout@v4

      - name: Pasang wrangler
        run: npm install -g wrangler

      - name: Deploy clincoo-agent (Workflows + cron)
        run: npx wrangler deploy
        working-directory: agent-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
