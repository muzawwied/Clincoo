name: Dump ai_router_logs (diagnosa)

# [21 Okt] Diagnosa one-off: ambil 15 baris terakhir tabel ai_router_logs
# dari D1 clincoo-db untuk melihat error nyata saat chat gagal.

on:
  workflow_dispatch: {}

jobs:
  dump:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Cek binding D1 + env project Pages clincoo
        env:
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          RESP=$(curl -sS "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT}/pages/projects/clincoo" -H "Authorization: Bearer ${CF_TOKEN}")
          echo "$RESP" | python3 -c "
          import sys, json
          d = json.load(sys.stdin)
          if not d.get('success'):
              print('CF error:', d.get('errors')); sys.exit(0)
          r = d['result']
          print('project:', r.get('name'), '| domains:', r.get('domains', []))
          for env_name, cfg in (r.get('deployment_configs') or {}).items():
              b = (cfg.get('d1_databases') or {}).get('binding') or cfg.get('d1_databases') or {}
              ev = cfg.get('env_vars') or {}
              print('ENV', env_name, '| d1:', json.dumps(b), '| env_var keys:', sorted(ev.keys()))
          "

      - name: Intip wallet-db + domain-db (key MR & log hari ini)
        env:
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          for DB in 59e17832-235d-4bb4-b09e-a7f5f9c1f8db 13c62b09-ecda-427f-b75f-5c1cc6fb91b3; do
            echo "== DB $DB"
            curl -sS -X POST "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT}/d1/database/${DB}/query" -H "Authorization: Bearer ${CF_TOKEN}" -H "Content-Type: application/json" --data '{"sql": "SELECT key, length(value) AS len, substr(value,1,7) AS head, substr(value,-4) AS tail, updated_at FROM env_vars WHERE key = '\''MODELROUTER_API_KEY'\''"}' | python3 -c "
          import sys, json
          d = json.load(sys.stdin)
          print('  MR key:', json.dumps((d.get('result') or [{}])[0].get('results', [])) if d.get('success') else d.get('errors'))
          "
            curl -sS -X POST "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT}/d1/database/${DB}/query" -H "Authorization: Bearer ${CF_TOKEN}" -H "Content-Type: application/json" --data '{"sql": "SELECT ts, model, err FROM ai_router_logs ORDER BY id DESC LIMIT 6"}' | python3 -c "
          import sys, json
          d = json.load(sys.stdin)
          rs = (d.get('result') or [{}])[0].get('results', []) if d.get('success') else []
          for r in rs: print('  LOG:', r.get('ts'), '|', r.get('model'), '|', str(r.get('err'))[:60])
          if not rs: print('  LOG: (kosong)')
          "
          done

      - name: Inventaris D1 + Pages projects
        env:
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          curl -sS "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT}/d1/database" -H "Authorization: Bearer ${CF_TOKEN}" | python3 -c "
          import sys, json
          d = json.load(sys.stdin)
          for x in d.get('result') or []:
              print('D1:', x.get('uuid'), '|', x.get('name'), '|', x.get('created_at'))
          "
          curl -sS "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT}/pages/projects" -H "Authorization: Bearer ${CF_TOKEN}" | python3 -c "
          import sys, json
          d = json.load(sys.stdin)
          for x in d.get('result') or []:
              print('PAGES:', x.get('name'), '|', [dm for dm in x.get('domains', []) if '.buzz' in dm or '.pages.dev' in dm])
          "

      - name: SELECT 15 log terakhir
        env:
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          DB_ID: 49b6fed3-a237-46e3-ab2b-b0de31cc862b
        run: |
          RESP=$(curl -sS -X POST \
            "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT}/d1/database/${DB_ID}/query" \
            -H "Authorization: Bearer ${CF_TOKEN}" \
            -H "Content-Type: application/json" \
            --data '{"sql": "SELECT ts, model, ms, err FROM ai_router_logs ORDER BY id DESC LIMIT 15"}')
          echo "$RESP" | python3 -c "
          import sys, json
          d = json.load(sys.stdin)
          if not d.get('success'):
              print('D1 error:', d.get('errors')); sys.exit(1)
          for r in (d.get('result') or [{}])[0].get('results', []):
              print(r.get('ts'), '|', r.get('model'), '|', r.get('ms'), 'ms |', (r.get('err') or '')[:200])
          "
