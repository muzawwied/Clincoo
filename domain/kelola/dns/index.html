</div>

<div id="toast" class="toast hidden fixed bottom-6 left-1/2 -translate-x-1/2 z-[90] rounded-full px-4 py-2 text-[13px] font-semibold" role="status"></div>

<!-- Popover aksi record (titik tiga tiduran) -->
<div id="row-backdrop" class="hidden fixed inset-0 z-[55]" onclick="closeRowMenu()"></div>
<div id="row-menu" class="act-menu hidden fixed z-[60]" style="top:0; left:0;">
    <div id="row-menu-list" class="flex flex-col gap-0.5"></div>
</div>

<script>
const domain = (new URLSearchParams(location.search).get('domain') || '').toLowerCase();
let records = [];
let simMode = false;

function pinKey() { return 'clincoo_pinned_dns_' + domain; }
function getPinned() { try { return JSON.parse(localStorage.getItem(pinKey())) || []; } catch (e) { return []; } }
function isPinned(id) { return getPinned().includes(id); }
function togglePin(id) {
    const p = getPinned();
    const i = p.indexOf(id);
    if (i === -1) p.push(id); else p.splice(i, 1);
    localStorage.setItem(pinKey(), JSON.stringify(p));
    renderDns();
}

function goBack() { location.href = '../../detail/?domain=' + encodeURIComponent(domain); }
function esc(s) { return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function banner(html, kind) {
    const el = document.getElementById('zone-banner');
    el.className = 'banner ' + (kind === 'error' ? 'banner-err' : 'banner-warn');
    el.innerHTML = html;
}

let lastDnsRes = null;
async function renderDns(useCache) {
    const res = (useCache && lastDnsRes) ? lastDnsRes : await store.listDns(domain);
    lastDnsRes = res;
    const listEl = document.getElementById('dns-list');
    if (!res || !res.ok) {
        simMode = false;
        const msg = (res && res.message) || 'Record DNS tidak dapat dimuat.';
        listEl.innerHTML = '';
        banner(esc(msg), 'error');
        lucide.createIcons();
        return;
    }
    simMode = !!res.simulated;
    records = res.records || [];

    // Domain tidak dikelola Cloudflare (mis. sudah di akun CF lain) -> mode lokal.
    // Zona ada tapi masih pending -> record belum aktif sampai nameserver diarahkan.
    const verifHref = (location.pathname.includes('/kelola/dns/')) ? '../../verifikasi/?domain=' + encodeURIComponent(domain) : 'verifikasi/?domain=' + encodeURIComponent(domain);
    if (res.managed === false) {
        banner(esc(res.message || 'Domain ini tidak dikelola lewat Clincoo. Salin record ke penyedia DNS-mu agar aktif.'));
    } else if (res.zone_status === 'pending') {
        banner('Record belum aktif. Arahkan nameserver domain-mu ke Clincoo, atau salin record ini ke penyedia DNS-mu. <a href="' + verifHref + '" class="underline font-semibold">Lihat nameserver</a>');
    } else {
        document.getElementById('zone-banner').classList.add('hidden');
    }

    const suffix = '.' + domain;
    const shortName = n => n === domain ? '@' : (n.endsWith(suffix) ? n.slice(0, -suffix.length) : n);
    const meta = r => r.local
        ? 'Tersimpan di Clincoo — terapkan juga di penyedia DNS domain-mu'
        : (r.proxied === true
            ? 'Tersambung ke jaringan Clincoo'
            : 'TTL ' + (r.ttl === 1 ? 'otomatis' : r.ttl + ' detik'));

    const sorted = records.length
        ? [...records].sort((a, b) => {
            const pinDiff = isPinned(b.id) - isPinned(a.id);
            if (pinDiff) return pinDiff;
            const ka = (a.name === domain ? '' : a.name) + '|' + a.type;
            const kb = (b.name === domain ? '' : b.name) + '|' + b.type;
            return ka.localeCompare(kb);
          })
        : [];

    const q = (document.getElementById('dns-search').value || '').toLowerCase().trim();
    const shown = q ? sorted.filter(r => [r.type, r.name, shortName(r.name), r.content].some(v => String(v == null ? '' : v).toLowerCase().includes(q))) : sorted;
    listEl.innerHTML = shown.length ? shown.map(r => `
        <tr class="group hover:bg-gray-50/60 transition-colors">
            <td class="py-3.5 pr-4 align-top">
                <span class="mono inline-block min-w-[44px] text-center text-[10.5px] font-bold uppercase tracking-wide bg-gray-100 text-gray-600 rounded-full px-2 py-1">${esc(r.type)}</span>
            </td>
            <td class="py-3.5 pr-4 align-top">
                <p class="mono text-[13px] font-semibold text-gray-900 truncate max-w-[120px]" title="${esc(shortName(r.name))}">${esc(shortName(r.name))}</p>
            </td>
            <td class="py-3.5 pr-4 align-top">
                <p class="mono text-[12px] text-gray-700 truncate max-w-[300px]">${esc(r.content)}</p>
                <p class="text-[10px] text-gray-400 font-medium mt-0.5">${esc(meta(r))}</p>
            </td>
            <td class="py-3.5 text-right align-top">
                <div class="inline-flex items-center justify-end gap-0.5">
                    ${isPinned(r.id) ? '<i data-lucide="pin" class="w-3.5 h-3.5 text-accent shrink-0 fill-current" title="Disematkan"></i>' : ''}
                    <button onclick="openRowMenu(event, '${r.id}')" class="w-8 h-8 inline-flex items-center justify-center cursor-pointer bg-transparent transition-colors hover:bg-gray-100 rounded-full" title="Aksi lainnya">
                        <i data-lucide="more-horizontal" class="w-[18px] h-[18px] text-gray-400"></i>
                    </button>
                </div>
            </td>
        </tr>`).join('') : '<tr><td colspan="4" class="text-[13px] text-gray-500 py-3">' + (records.length ? 'Tidak ada record yang cocok dengan pencarian.' : 'Belum ada record DNS.') + '</td></tr>';
    lucide.createIcons();
}

const DNS_LIMIT = 200; // batas record per domain, sesuaikan dengan paket
const DNS_TYPES = ['A', 'AAAA', 'CNAME', 'TXT', 'MX'];
function renderTypePopover() {
    const current = document.getElementById('dns-type-label').textContent;
    document.getElementById('dns-type-popover').innerHTML = DNS_TYPES.map(t => `
        <button type="button" onclick="selectDnsType('${t}')" class="act-it${t === current ? ' sel' : ''}">${t}</button>`).join('');
}
function toggleTypePopover() {
    renderTypePopover();
    document.getElementById('dns-type-popover').classList.toggle('hidden');
}
// Placeholder nilai per tipe + isian prioritas khusus MX
const DNS_PLACEHOLDER = {
    A: '192.0.2.1',
    AAAA: '2001:db8::1',
    CNAME: 'target.example.com',
    TXT: 'v=spf1 include:_spf.example.com ~all',
    MX: 'mail.example.com'
};
function applyTypeUi(t) {
    document.getElementById('dns-content').placeholder = DNS_PLACEHOLDER[t] || '';
    document.getElementById('dns-priority-wrap').classList.toggle('hidden', t !== 'MX');
}
function selectDnsType(t) {
    document.getElementById('dns-type-label').textContent = t;
    document.getElementById('dns-type-popover').classList.add('hidden');
    showAddError('');
    applyTypeUi(t);
}

// Validasi sederhana per tipe. Mengembalikan pesan galat, atau '' bila valid.
const HOST_RE = /^([a-z0-9_]([a-z0-9_-]{0,61}[a-z0-9_])?\.)+[a-z]{2,63}\.?$/i;
function validateRecord(type, content, priority) {
    if (type === 'A') {
        const p = content.split('.');
        const ok = p.length === 4 && p.every(x => /^\d{1,3}$/.test(x) && Number(x) <= 255);
        return ok ? '' : 'Tipe A harus berisi alamat IPv4, contoh 192.0.2.1.';
    }
    if (type === 'AAAA') {
        const ok = /^[0-9a-f:.]+$/i.test(content) && (content.match(/:/g) || []).length >= 2;
        return ok ? '' : 'Tipe AAAA harus berisi alamat IPv6, contoh 2001:db8::1.';
    }
    if (type === 'CNAME') {
        return HOST_RE.test(content) ? '' : 'Tipe CNAME harus berisi nama host tujuan, contoh target.example.com.';
    }
    if (type === 'MX') {
        if (!HOST_RE.test(content)) return 'Tipe MX harus berisi nama host mail server, contoh mail.example.com.';
        if (priority !== '' && !(/^\d{1,5}$/.test(priority) && Number(priority) <= 65535)) return 'Prioritas harus berupa angka 0–65535.';
    }
    return '';
}

// Pesan singkat (toast) untuk konfirmasi aksi kecil
let toastTimer = null;
function showToast(text) {
    const el = document.getElementById('toast');
    el.textContent = text;
    el.classList.remove('hidden');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.classList.add('hidden'), 1600);
}
document.addEventListener('click', (e) => {
    const pop = document.getElementById('dns-type-popover');
    const trigger = document.getElementById('dns-type-trigger');
    if (!pop || pop.classList.contains('hidden')) return;
    if (!pop.contains(e.target) && !trigger.contains(e.target)) pop.classList.add('hidden');
});
function openAddRecord() {
    document.getElementById('dns-type-label').textContent = 'A';
    document.getElementById('dns-type-popover').classList.add('hidden');
    document.getElementById('dns-name').value = '';
    document.getElementById('dns-content').value = '';
    document.getElementById('dns-priority').value = '';
    applyTypeUi('A');
    showAddError('');
    const m = document.getElementById('add-record-modal');
    m.classList.remove('hidden'); m.classList.add('flex');
    lucide.createIcons();
    document.getElementById('dns-name').focus();
}
// [19 Okt] Ikon loading untuk CTA modal record: teks -> spinner, lebar tombol dikunci.
function setCtaLoading(btn) {
    if (!btn) return;
    btn.dataset.ctaLabel = btn.textContent;
    btn.style.minWidth = Math.max(btn.offsetWidth, 64) + 'px';
    btn.style.minHeight = btn.offsetHeight + 'px';
    btn.innerHTML = '<svg class="btn-spin" width="15" height="15" viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="2.5" opacity=".18"/><path d="M21 12a9 9 0 0 0-9-9" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/></svg>';
    btn.disabled = true;
}
function setCtaIdle(btn) {
    if (!btn) return;
    btn.disabled = false;
    btn.style.minWidth = '';
    btn.style.minHeight = '';
    if (btn.dataset.ctaLabel) btn.textContent = btn.dataset.ctaLabel;
}
function closeAddRecord() {
    document.getElementById('dns-type-popover').classList.add('hidden');
    const m = document.getElementById('add-record-modal');
    m.classList.add('hidden'); m.classList.remove('flex');
}
function showAddError(text) {
    const el = document.getElementById('dns-add-error');
    el.textContent = text || '';
    el.classList.toggle('hidden', !text);
}
let adding = false;
async function addRecord() {
    if (adding) return;
    const type = document.getElementById('dns-type-label').textContent;
    const name = document.getElementById('dns-name').value.trim();
    const content = document.getElementById('dns-content').value.trim();
    const priority = document.getElementById('dns-priority').value.trim();
    if (!name || !content) { showAddError('Isi nama dan nilai record.'); return; }
    const invalid = validateRecord(type, content, priority);
    if (invalid) { showAddError(invalid); return; }
    showAddError('');
    adding = true;
    setCtaLoading([...document.querySelectorAll('button')].find(b => b.getAttribute('onclick') === 'addRecord()')); // [19 Okt] teks -> ikon loading
    const payload = { type, name, content };
    if (type === 'MX') payload.priority = priority === '' ? 10 : Number(priority);
    const res = await store.addDns(domain, payload);
    adding = false;
    if (!res || !res.ok) {
        const msg = (res && res.message) || 'Record gagal ditambahkan.';
        setCtaIdle([...document.querySelectorAll('button')].find(b => b.getAttribute('onclick') === 'addRecord()'));
        showAddError(msg);
        return;
    }
    closeAddRecord(); renderDns();
}
function openRowMenu(evt, id) {
    const r = records.find(x => x.id === id); if (!r) return;
    document.getElementById('row-menu-list').innerHTML = `
        <button onclick="closeRowMenu(); togglePin('${r.id}')" class="act-it">${isPinned(r.id) ? 'Lepas Sematan' : 'Sematkan'}</button>
        <button onclick="closeRowMenu(); copyRecordValue('${r.id}')" class="act-it">Salin Nilai</button>
        <button onclick="closeRowMenu(); askDeleteRecord('${r.id}')" class="act-it danger">Hapus</button>`;
    const menu = document.getElementById('row-menu');
    const backdrop = document.getElementById('row-backdrop');
    menu.classList.remove('hidden'); backdrop.classList.remove('hidden');
    const btn = evt.currentTarget.getBoundingClientRect();
    const menuW = menu.offsetWidth;
    let left = btn.right - menuW;
    if (left < 8) left = 8;
    if (left + menuW > window.innerWidth - 8) left = window.innerWidth - 8 - menuW;
    let top = btn.bottom + 6;
    const menuH = menu.offsetHeight;
    if (top + menuH > window.innerHeight - 8) top = btn.top - menuH - 6;
    menu.style.left = left + 'px';
    menu.style.top = top + 'px';
}
function closeRowMenu() {
    document.getElementById('row-menu').classList.add('hidden');
    document.getElementById('row-backdrop').classList.add('hidden');
}
function copyRecordValue(id) {
    const r = records.find(x => x.id === id);
    if (!r) return;
    navigator.clipboard.writeText(r.content)
        .then(() => showToast('Nilai tersalin'))
        .catch(() => showToast('Gagal menyalin'));
}
let confirmDeleteId = null;
function askDeleteRecord(id) {
    const r = records.find(x => x.id === id); if (!r) return;
    confirmDeleteId = id;
    document.getElementById('confirm-detail').textContent = r.type + ' · ' + r.name + ' · ' + r.content;
    document.getElementById('confirm-modal').classList.remove('hidden');
}
function closeConfirm() {
    document.getElementById('confirm-modal').classList.add('hidden');
    confirmDeleteId = null;
}
async function doDeleteRecord() {
    const delBtn = [...document.querySelectorAll('button')].find(b => b.getAttribute('onclick') === 'doDeleteRecord()');
    if (confirmDeleteId) {
        setCtaLoading(delBtn); // [19 Okt] teks -> ikon loading
        await store.deleteDns(domain, confirmDeleteId);
        setCtaIdle(delBtn);
    }
    closeConfirm();
    renderDns();
}
// Esc menutup lapisan paling atas lebih dulu
document.addEventListener('keydown', (e) => {
    if (e.key !== 'Escape') return;
    const isOpen = id => !document.getElementById(id).classList.contains('hidden');
    if (isOpen('confirm-modal')) { closeConfirm(); return; }
    if (isOpen('row-menu')) { closeRowMenu(); return; }
    if (isOpen('dns-type-popover')) { document.getElementById('dns-type-popover').classList.add('hidden'); return; }
    if (isOpen('add-record-modal')) closeAddRecord();
});
if (!domain) { location.replace('../../'); }
else {
    const vd = document.getElementById('v-domain');
    vd.textContent = 'untuk ';
    const vdName = document.createElement('span');
    vdName.className = 'text-gray-900 font-semibold';
    vdName.textContent = domain;
    vd.appendChild(vdName);
    store.ready.then(renderDns);
    lucide.createIcons();
}
</script>
<script>try { lucide.createIcons(); } catch (e) {}</script>
<script src="../../../../js/cta-loading.js?v=1"></script>
</body>
