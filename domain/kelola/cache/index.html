<main class="flex-1 w-full max-w-2xl mx-auto pb-16 flex-col justify-start relative">

                </div>
                <button id="purge-btn" onclick="purgeCache()" class="shrink-0 text-[13px] font-semibold text-accent cursor-pointer hover:underline decoration-2 underline-offset-4">Hapus Cache</button>

                <button onclick="toggleSetting('devmode', this)" class="setting-toggle relative w-11 h-6 rounded-full bg-gray-200 transition-colors cursor-pointer shrink-0"></button>
            </div>
            <div class="flex items-center justify-between py-4">
                <div>
                    <p class="text-[14px] font-semibold text-gray-900">Tingkat Cache</p>
                    <p class="text-[12px] text-gray-500 mt-0.5">Seberapa agresif konten di-cache server</p>
                </div>
                <div class="relative shrink-0">
                    <button id="cache-trigger" type="button" onclick="toggleCachePopover()" class="flex items-center gap-1.5 bg-gray-50 border border-gray-200 rounded-lg px-2.5 py-1.5 text-[13px] font-medium text-gray-900 cursor-pointer">
                        <span id="cache-label"><span class="shim h-2 w-14"></span></span>
                        <i data-lucide="chevron-down" class="w-3.5 h-3.5 text-gray-400"></i>
                    </button>
                    <div id="cache-popover" class="hidden absolute right-0 mt-1.5 bg-white border border-gray-200 rounded-lg shadow-lg z-[70] py-1 w-32"></div>
                </div>
            </div>

<script>
const domain = (new URLSearchParams(location.search).get('domain') || '').toLowerCase();
const CACHE_OPTIONS = [{v:'basic',l:'Standard'},{v:'simplified',l:'Sederhana'},{v:'aggressive',l:'Agresif'}];
function renderCachePopover() {
    const current = getSetting('cache_level', 'basic');
    document.getElementById('cache-popover').innerHTML = CACHE_OPTIONS.map(o => `
        <button type="button" onclick="selectCacheLevel('${o.v}')" class="w-full text-left px-3 py-2 text-[13px] font-medium cursor-pointer transition-colors hover:bg-gray-50 ${o.v === current ? 'text-accent' : 'text-gray-800'}">${o.l}</button>`).join('');
}
function toggleCachePopover() {
    renderCachePopover();
    document.getElementById('cache-popover').classList.toggle('hidden');
}
function selectCacheLevel(v) {
    const opt = CACHE_OPTIONS.find(o => o.v === v);
    document.getElementById('cache-label').textContent = opt.l;
    saveSetting('cache_level', v);
    document.getElementById('cache-popover').classList.add('hidden');
}
document.addEventListener('click', (e) => {
    const p = document.getElementById('cache-popover');
    const t = document.getElementById('cache-trigger');
    if (!p || p.classList.contains('hidden')) return;
    if (!p.contains(e.target) && !t.contains(e.target)) p.classList.add('hidden');
});

function goBack() { location.href = '../../detail/?domain=' + encodeURIComponent(domain); }
function esc(s) { return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
let settings = {};
function getSetting(k, def) { return (k in settings) ? settings[k] : def; }
function saveSetting(k, v) { settings[k] = String(v); store.setSetting(domain, k, v); }
function paintToggle(btn, on) {
    btn.classList.toggle('bg-gray-200', !on);
    btn.classList.toggle('bg-accent', on);
    btn.innerHTML = '<span class="absolute top-0.5 w-5 h-5 rounded-full bg-white shadow transition-all ' + (on ? 'left-[22px]' : 'left-0.5') + '"></span>';
}
function toggleSetting(key, btn) {
    const on = getSetting(key, 'off') === 'on';
    saveSetting(key, on ? 'off' : 'on');
    paintToggle(btn, !on);
}
function initToggles() {
    document.querySelectorAll('.setting-toggle').forEach(btn => {
        const key = btn.getAttribute('onclick').match(/'([^']+)'/)[1];
        paintToggle(btn, getSetting(key, 'off') === 'on');
    });
}

function fmtDateTime(iso) {
    const d = new Date(iso);
    return d.toLocaleString('id-ID', { day: 'numeric', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' });
}
function showPurgedAt() {
    const t = getSetting('purged_at', '');
    const el = document.getElementById('purged-at');
    if (t) { el.textContent = 'Terakhir dibersihkan: ' + fmtDateTime(t); el.classList.remove('hidden'); }
}
function purgeCache() {
    const btn = document.getElementById('purge-btn');
    const prev = btn.textContent;
    btn.textContent = 'Membersihkan…';
    btn.style.pointerEvents = 'none';
    setTimeout(() => {
        saveSetting('purged_at', new Date().toISOString());
        btn.textContent = 'Cache dibersihkan';
        showPurgedAt();
        setTimeout(() => { btn.textContent = prev; btn.style.pointerEvents = ''; }, 2000);
    }, 1000);
}
if (!domain) { location.replace('../../'); }
else {
    document.getElementById('v-domain').textContent = domain;
    store.getSettings(domain, { cache_level: 'basic', devmode: 'off', purged_at: '' }).then(s => {
        settings = s;
        initToggles();
        document.getElementById('cache-label').textContent = CACHE_OPTIONS.find(o => o.v === getSetting('cache_level', 'basic')).l;
        showPurgedAt();
        lucide.createIcons();
    });
}
</script>
<script>try { lucide.createIcons(); } catch (e) {}</script>
