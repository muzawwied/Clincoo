    :root { --accent-color: #000000; --accent-hover: #1f2937; --accent-text: #ffffff; }
    .bg-accent { background-color: var(--accent-color) !important; }
    .text-accent { color: var(--accent-color) !important; }
    .border-accent { border-color: var(--accent-color) !important; }
    .hover\:bg-accent-hover:hover { background-color: var(--accent-hover) !important; }
    body.dark-mode { background-color: #000000; color: #ffffff; }
    body.dark-mode .bg-white { background-color: #0a0a0a !important; }
    body.dark-mode .bg-gray-50 { background-color: #141414 !important; }
    body.dark-mode .bg-gray-100 { background-color: #222222 !important; }
    body.dark-mode .border-gray-100, body.dark-mode .border-gray-200, body.dark-mode .border-gray-300 { border-color: #222222 !important; }
    body.dark-mode .text-accent { color: #ffffff !important; }
    body.dark-mode .text-gray-900, body.dark-mode .text-gray-800, body.dark-mode .text-black { color: #ffffff !important; }
    body.dark-mode .text-gray-700, body.dark-mode .text-gray-600, body.dark-mode .text-gray-500 { color: #888888 !important; }
    body.dark-mode .text-gray-400 { color: #666666 !important; }
    body.dark-mode .bg-accent { background-color: #ffffff !important; color: #000000 !important; }
    body.dark-mode .bg-accent.text-white { color: #000000 !important; }
    body.dark-mode .bg-accent.text-white svg { color: #000000 !important; stroke: #000000 !important; }
    body.dark-mode button[onclick="goBack()"] { background-color: #000000 !important; border: 1.5px solid rgba(255,255,255,0.4) !important; color: #ffffff !important; }
    body.dark-mode button[onclick="goBack()"]:hover { background-color: #1a1a1a !important; border-color: rgba(255,255,255,0.7) !important; }
    body.dark-mode button[onclick="goBack()"] svg { color: #ffffff !important; stroke: #ffffff !important; }

    input:focus, select:focus, textarea:focus { outline: none!important; box-shadow: none!important; }

/* Shimmer skeleton */
.shim{position:relative;overflow:hidden;background:#ececef;border-radius:999px;display:inline-block;vertical-align:middle;opacity:.78}
.shim::after{content:"";position:absolute;inset:0;transform:translateX(-110%);background:linear-gradient(90deg,transparent 25%,rgba(255,255,255,.72) 50%,transparent 75%);animation:shim 1.55s ease-in-out infinite}

<body class="min-h-screen flex flex-col text-gray-900 pt-20">
<script>(function(){try{var t=localStorage.getItem('clincoo_theme')||'Sistem (Default)';var d=(t==='Gelap')||(t==='Sistem (Default)'&&window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches);if(d)document.body.classList.add('dark-mode');var a=localStorage.getItem('clincoo_accent')||'Hitam (Default)';var am={'Hitam (Default)':{m:'#000000',h:'#1f2937'},'Biru':{m:'#2563eb',h:'#1d4ed8'},'Hijau':{m:'#059669',h:'#047857'},'Ungu':{m:'#9333ea',h:'#7e22ce'},'Merah':{m:'#dc2626',h:'#b91c1c'}};var c=am[a]||am['Hitam (Default)'];document.documentElement.style.setProperty('--accent-color',c.m);document.documentElement.style.setProperty('--accent-hover',c.h);}catch(e){}})();</script>

<main class="flex-1 w-full max-w-2xl mx-auto pb-16 flex-col justify-start relative">
    <button onclick="goBack()" class="fixed top-3 left-3 w-10 h-10 flex items-center justify-center rounded-full bg-white backdrop-blur border border-gray-100 shadow-sm hover:bg-gray-50 transition-all cursor-pointer text-gray-700 hover:text-black z-50" aria-label="Kembali">
        <i data-lucide="arrow-left" class="w-5 h-5"></i>
    </button>
    <div class="flex flex-col px-7 pb-2 relative">
        <h2 class="text-[24px] font-extrabold text-gray-900 tracking-tight">Pengaturan Zone</h2>
        <p id="v-domain" class="text-[14px] text-gray-500 font-medium mt-0.5">memuat…</p>
    </div>

    <div class="px-7">
        <h3 class="text-[12px] font-bold text-gray-400 uppercase tracking-wider mt-6">Pengaturan Zone</h3>
        <div class="mt-2 border-t border-gray-100 divide-y divide-gray-100">
            <div class="flex items-center justify-between py-4">
                <div>
                    <p class="text-[14px] font-semibold text-gray-900">Status Zone</p>
                    <p id="zone-status" class="text-[12px] text-gray-500 mt-0.5"><span class="shim h-2 w-12"></span></p>
                </div>
                <button id="zone-toggle-btn" onclick="toggleZone()" class="text-[13px] font-semibold text-red-600 cursor-pointer hover:underline decoration-2 underline-offset-4 hidden"></button>
            </div>
            <div class="py-4">
                <p class="text-[14px] font-semibold text-gray-900">Nameservers</p>
                <div id="zone-ns"><p class="mono text-[12px] text-gray-500 mt-1"><span class="shim h-2 w-32"></span></p></div>
            </div>
            <div class="py-4">
                <p class="text-[14px] font-semibold text-gray-900">Plan</p>
                <p id="zone-plan" class="text-[12px] text-gray-500 mt-1"><span class="shim h-2 w-10"></span></p>
            </div>
        </div>
    </div>
</main>

<script>
const domain = (new URLSearchParams(location.search).get('domain') || '').toLowerCase();

function goBack() { location.href = '../../detail/?domain=' + encodeURIComponent(domain); }
function esc(s) { return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
let settings = {};
function getSetting(k, def) { return (k in settings) ? settings[k] : def; }
function saveSetting(k, v) { settings[k] = String(v); store.setSetting(domain, k, v); }
function paintToggle(btn, on) {
    btn.classList.toggle('bg-gray-200', !on);
    btn.classList.toggle('bg-accent', on);
    btn.innerHTML = '<span class="absolute top-0.5 w-5 h-5 rounded-full bg-white shadow transition-all ' + (on ? 'left-[22px]' : 'left-0.5') + '"></span>';
}
function toggleSetting(key, btn) {
    const on = getSetting(key, 'off') === 'on';
    saveSetting(key, on ? 'off' : 'on');
    paintToggle(btn, !on);
}
function initToggles() {
    document.querySelectorAll('.setting-toggle').forEach(btn => {
        const key = btn.getAttribute('onclick').match(/'([^']+)'/)[1];
        paintToggle(btn, getSetting(key, 'off') === 'on');
    });
}

let zonePaused = null; // status live dari Cloudflare (bukan asumsi lokal)
function toggleZone() {
    if (zonePaused === null) return;
    const willPause = !zonePaused;
    if (willPause && !confirm('Jeda zona domain ini? Semua DNS domain berhenti dijawab sampai zona diaktifkan lagi.')) return;
    document.getElementById('zone-status').textContent = 'Menyimpan…';
    store.setSetting(domain, 'zone', willPause ? 'paused' : 'active').then(() => {
        zonePaused = willPause;
        paintZone();
    }).catch(() => { document.getElementById('zone-status').textContent = 'Gagal menyimpan'; });
}
function paintZone() {
    const statusEl = document.getElementById('zone-status');
    const toggleEl = document.getElementById('zone-toggle-btn');
    if (zonePaused === null) return;
    if (zonePaused) {
        statusEl.textContent = 'Dijeda (paused)';
        toggleEl.textContent = 'Aktifkan';
        toggleEl.classList.remove('text-red-600'); toggleEl.classList.add('text-accent');
    } else {
        statusEl.textContent = 'Aktif';
        toggleEl.textContent = 'Pause';
        toggleEl.classList.add('text-red-600'); toggleEl.classList.remove('text-accent');
    }
    toggleEl.classList.remove('hidden');
}
if (!domain) { location.replace('../../'); }
else {
    document.getElementById('v-domain').textContent = domain;
    fetch('/api/domains/' + encodeURIComponent(domain) + '/zone', { credentials: 'include' })
        .then(r => r.json())
        .then(d => {
            const z = d && d.zone;
            const nsEl = document.getElementById('zone-ns');
            const planEl = document.getElementById('zone-plan');
            if (!z) {
                nsEl.innerHTML = '<p class="text-[12px] text-gray-400">Belum tersedia</p>';
                planEl.textContent = '-';
                document.getElementById('zone-status').textContent = 'Belum terhubung ke jaringan Clincoo';
                return;
            }
            nsEl.innerHTML = (z.name_servers || []).map(n => '<p class="mono text-[12px] text-gray-500 mt-1">' + esc(n) + '</p>').join('') || '<p class="text-[12px] text-gray-400">-</p>';
            planEl.textContent = z.plan || 'Free';
            zonePaused = !!z.paused;
            if (!z.paused && z.status === 'pending') {
                document.getElementById('zone-status').textContent = 'Menunggu nameserver diarahkan';
                return;
            }
            paintZone();
            lucide.createIcons();
        })
        .catch(() => {
            document.getElementById('zone-status').textContent = 'Gagal memuat';
        });
}
</script>
<script>try { lucide.createIcons(); } catch (e) {}</script>
</body>
