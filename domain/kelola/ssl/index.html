<main class="flex-1 w-full max-w-2xl mx-auto pb-16 flex-col justify-start relative">

    <div class="flex flex-col px-7 pb-2 relative">

    <div class="px-7">
        <h3 class="text-[12px] font-bold text-gray-400 uppercase tracking-wider mt-6">Mode Enkripsi SSL/TLS</h3>
        <div id="ssl-modes" class="mt-2 border-t border-gray-100 divide-y divide-gray-100"><div class="flex items-center justify-between py-4"><span class="shim h-2.5 w-28"></span><span class="shim h-2 w-3.5"></span></div><div class="flex items-center justify-between py-4"><span class="shim h-2.5 w-28"></span><span class="shim h-2 w-3.5"></span></div><div class="flex items-center justify-between py-4"><span class="shim h-2.5 w-28"></span><span class="shim h-2 w-3.5"></span></div></div>

        <div class="mt-7 pt-5 border-t border-gray-100 flex items-center justify-between">
            <div>
                <p class="text-[14px] font-semibold text-gray-900">Selalu Gunakan HTTPS</p>
                <p class="text-[12px] text-gray-500 mt-0.5">Redirect semua permintaan HTTP ke HTTPS</p>
            </div>
            <button onclick="toggleSetting('https', this)" class="setting-toggle relative w-11 h-6 rounded-full bg-gray-200 transition-colors cursor-pointer shrink-0"></button>
        </div>
        <div class="mt-4 pt-5 border-t border-gray-100 flex items-center justify-between">
            <div>
                <p class="text-[14px] font-semibold text-gray-900">Minimum TLS Version</p>
                <p class="text-[12px] text-gray-500 mt-0.5">Versi TLS terendah yang diterima</p>
            </div>
            <div class="relative shrink-0">
                <button id="tls-trigger" type="button" onclick="toggleTlsPopover()" class="flex items-center gap-1.5 bg-gray-50 border border-gray-200 rounded-lg px-2.5 py-1.5 text-[13px] font-medium text-gray-900 cursor-pointer">
                    <span id="tls-label"><span class="shim h-2 w-12"></span></span>
                    <i data-lucide="chevron-down" class="w-3.5 h-3.5 text-gray-400"></i>
                </button>
                <div id="tls-popover" class="hidden absolute right-0 mt-1.5 bg-white border border-gray-200 rounded-lg shadow-lg z-[70] py-1 w-28"></div>
            </div>
        </div>
    </div>

<script>
const domain = (new URLSearchParams(location.search).get('domain') || '').toLowerCase();
const TLS_OPTIONS = [{v:'1.0',l:'TLS 1.0'},{v:'1.1',l:'TLS 1.1'},{v:'1.2',l:'TLS 1.2'},{v:'1.3',l:'TLS 1.3'}];
function renderTlsPopover() {
    const current = getSetting('min_tls', '1.2');
    document.getElementById('tls-popover').innerHTML = TLS_OPTIONS.map(o => `
        <button type="button" onclick="selectTls('${o.v}')" class="w-full text-left px-3 py-2 text-[13px] font-medium cursor-pointer transition-colors hover:bg-gray-50 ${o.v === current ? 'text-accent' : 'text-gray-800'}">${o.l}</button>`).join('');
}
function toggleTlsPopover() {
    renderTlsPopover();
    document.getElementById('tls-popover').classList.toggle('hidden');
}
function selectTls(v) {
    const opt = TLS_OPTIONS.find(o => o.v === v);
    document.getElementById('tls-label').textContent = opt.l;
    saveSetting('min_tls', v);
    document.getElementById('tls-popover').classList.add('hidden');
}
document.addEventListener('click', (e) => {
    const p = document.getElementById('tls-popover');
    const t = document.getElementById('tls-trigger');
    if (!p || p.classList.contains('hidden')) return;
    if (!p.contains(e.target) && !t.contains(e.target)) p.classList.add('hidden');
});
const SSL_MODES = [
    { id: 'off', label: 'Off', desc: 'Tidak ada enkripsi — pengunjung melihat HTTP biasa.' },
    { id: 'flexible', label: 'Flexible', desc: 'HTTPS ke pengunjung, HTTP ke server asal.' },
    { id: 'full', label: 'Full', desc: 'HTTPS end-to-end, sertifikat asal boleh self-signed.' },
    { id: 'strict', label: 'Full (strict)', desc: 'HTTPS end-to-end dengan sertifikat asal tepercaya. Direkomendasikan.' }
];

function goBack() { location.href = '../../detail/?domain=' + encodeURIComponent(domain); }
function esc(s) { return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
let settings = {};
function getSetting(k, def) { return (k in settings) ? settings[k] : def; }
function saveSetting(k, v) { settings[k] = String(v); store.setSetting(domain, k, v); }
function paintToggle(btn, on) {
    btn.classList.toggle('bg-gray-200', !on);
    btn.classList.toggle('bg-accent', on);
    btn.innerHTML = '<span class="absolute top-0.5 w-5 h-5 rounded-full bg-white shadow transition-all ' + (on ? 'left-[22px]' : 'left-0.5') + '"></span>';
}
function toggleSetting(key, btn) {
    const on = getSetting(key, 'off') === 'on';
    saveSetting(key, on ? 'off' : 'on');
    paintToggle(btn, !on);
}
function initToggles() {
    document.querySelectorAll('.setting-toggle').forEach(btn => {
        const key = btn.getAttribute('onclick').match(/'([^']+)'/)[1];
        paintToggle(btn, getSetting(key, 'off') === 'on');
    });
}

function renderSsl() {
    const current = getSetting('ssl_mode', 'strict');
    document.getElementById('ssl-modes').innerHTML = SSL_MODES.map(m => `
        <button onclick="setSslMode('${m.id}')" class="w-full flex items-start justify-between gap-3 text-left py-4 cursor-pointer">
            <span>
                <span class="block text-[14px] font-semibold ${m.id === current ? 'text-accent' : 'text-gray-900'}">${m.label}</span>
                <span class="block text-[12px] text-gray-500 mt-0.5">${m.desc}</span>
            </span>
            <i data-lucide="check" class="w-4 h-4 mt-1 shrink-0 ${m.id === current ? 'text-accent' : 'text-transparent'}"></i>
        </button>`).join('');
    lucide.createIcons();
}
function setSslMode(id) { saveSetting('ssl_mode', id); renderSsl(); }
if (!domain) { location.replace('../../'); }
else {
    document.getElementById('v-domain').textContent = domain;
    store.getSettings(domain, { ssl_mode: 'strict', min_tls: '1.2', https: 'off' }).then(s => {
        settings = s;
        renderSsl();
        initToggles();
        document.getElementById('tls-label').textContent = TLS_OPTIONS.find(o => o.v === getSetting('min_tls', '1.2')).l;
        lucide.createIcons();
    });
}
</script>
<script>try { lucide.createIcons(); } catch (e) {}</script>
</body>
