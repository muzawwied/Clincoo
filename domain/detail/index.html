<body class="min-h-screen flex flex-col text-gray-900 pt-20">
<script>(function(){try{var t=localStorage.getItem('clincoo_theme')||'Sistem (Default)';var d=(t==='Gelap')||(t==='Sistem (Default)'&&window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches);if(d)document.body.classList.add('dark-mode');var a=localStorage.getItem('clincoo_accent')||'Hitam (Default)';var am={'Hitam (Default)':{m:'#000000',h:'#1f2937'},'Biru':{m:'#2563eb',h:'#1d4ed8'},'Hijau':{m:'#059669',h:'#047857'},'Ungu':{m:'#9333ea',h:'#7e22ce'},'Merah':{m:'#dc2626',h:'#b91c1c'}};var c=am[a]||am['Hitam (Default)'];document.documentElement.style.setProperty('--accent-color',c.m);document.documentElement.style.setProperty('--accent-hover',c.h);}catch(e){}})();</script>

<div id="bg-glow"></div>

<main class="flex-1 w-full max-w-2xl mx-auto pb-16 flex-col justify-start relative z-10">
    <button onclick="goBack()" class="hdr-back" aria-label="Kembali">
        <i data-lucide="arrow-left" class="w-5 h-5"></i>
    </button>
    <div class="flex flex-col px-7 pb-4 relative">
        <h2 class="pg-title">Detail Domain</h2>
        <p id="v-domain" class="text-[14px] text-gray-500 font-medium mt-1.5">memuat…</p>
    </div>

    <div class="px-7">
        <!-- Info -->
        <h3 class="text-[11px] font-semibold text-gray-400 uppercase tracking-wider mt-1">Informasi</h3>
        <div class="mt-2 row-list">
            <div class="flex items-center justify-between gap-3 py-3.5">
                <p class="text-[11px] font-semibold text-gray-400 uppercase tracking-wider shrink-0">Status</p>
                <p id="d-status" class="text-[13px] font-semibold text-right"><span class="shim h-2 w-20"></span></p>
            </div>
            <div class="flex items-center justify-between gap-3 py-3.5">
                <p class="text-[11px] font-semibold text-gray-400 uppercase tracking-wider shrink-0">Ditambahkan</p>
                <p id="d-created" class="text-[13px] text-gray-700 text-right"><span class="shim h-2 w-24"></span></p>
            </div>
            <div class="flex items-center justify-between gap-3 py-3.5">
                <p class="text-[11px] font-semibold text-gray-400 uppercase tracking-wider shrink-0">Terakhir Diubah</p>
                <p id="d-updated" class="text-[13px] text-gray-700 text-right"><span class="shim h-2 w-24"></span></p>
            </div>
            <div class="flex items-start justify-between gap-3 py-3.5">
                <p class="text-[11px] font-semibold text-gray-400 uppercase tracking-wider shrink-0">Catatan</p>
                <p id="d-note" class="text-[13px] text-gray-700 text-right min-w-0 break-words leading-relaxed">—</p>
            </div>
        </div>

        <!-- Kelola -->
        <h3 class="text-[11px] font-semibold text-gray-400 uppercase tracking-wider mt-8">Kelola</h3>
        <div class="mt-2 row-list">
            <a href="#" id="lk-dns" class="flex items-center justify-between py-3.5 group transition-opacity active:opacity-60">
                <span class="text-[14.5px] font-medium text-gray-900">Kelola DNS</span>
                <i data-lucide="chevron-right" class="w-4 h-4 text-gray-300 group-hover:text-gray-900 transition-colors"></i>
            </a>
            <a href="#" id="lk-ssl" class="flex items-center justify-between py-3.5 group transition-opacity active:opacity-60">
                <span class="text-[14.5px] font-medium text-gray-900">SSL/TLS</span>
                <i data-lucide="chevron-right" class="w-4 h-4 text-gray-300 group-hover:text-gray-900 transition-colors"></i>
            </a>
            <a href="#" id="lk-cache" class="flex items-center justify-between py-3.5 group transition-opacity active:opacity-60">
                <span class="text-[14.5px] font-medium text-gray-900">Cache</span>
                <i data-lucide="chevron-right" class="w-4 h-4 text-gray-300 group-hover:text-gray-900 transition-colors"></i>
            </a>
            <a href="#" id="lk-zone" class="flex items-center justify-between py-3.5 group transition-opacity active:opacity-60">
                <span class="text-[14.5px] font-medium text-gray-900">Pengaturan Zone</span>
                <i data-lucide="chevron-right" class="w-4 h-4 text-gray-300 group-hover:text-gray-900 transition-colors"></i>
            </a>
        </div>

        <!-- Aksi -->
        <h3 class="text-[11px] font-semibold text-gray-400 uppercase tracking-wider mt-8">Aksi</h3>
        <div class="mt-3 flex flex-col gap-2.5">
            <a id="d-verify" href="#" class="act-btn hidden bg-accent text-white hover:bg-accent-hover">Verifikasi Domain</a>
            <button onclick="openDelete()" class="act-btn act-danger">Hapus Domain</button>
        </div>
    </div>
</main>

<!-- Modal hapus -->
<div id="delete-modal" class="cf-ov hidden fixed inset-0 z-[60] flex items-center justify-center p-6" onclick="if(event.target===this)closeModal('delete-modal')">
    <div class="cf-box">
        <h3 class="cf-title">Hapus Domain?</h3>
        <p id="delete-domain-name" class="cf-text"></p>
        <div class="cf-bar">
            <button onclick="closeModal('delete-modal')" class="cf-btn cf-cancel">Batal</button>
            <button onclick="confirmDelete()" class="cf-btn cf-ok danger">Hapus</button>
        </div>
    </div>
</div>

<script>
try { lucide.createIcons(); } catch (e) {}

const dName = (new URLSearchParams(location.search).get('domain') || '').trim().toLowerCase();
function goBack() { location.href = '../'; }
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function fmtDate(v) {
    if (!v) return '—';
    const d = new Date(v);
    if (isNaN(d)) return '—';
    return d.toLocaleDateString('id-ID', { day: 'numeric', month: 'short', year: 'numeric' });
}
function openModal(id) { document.getElementById(id).classList.remove('hidden'); document.getElementById(id).classList.add('flex'); }
function closeModal(id) { document.getElementById(id).classList.add('hidden'); document.getElementById(id).classList.remove('flex'); }

let domain = null;
store.ready.then(async () => {
    if (!dName) { location.replace('../'); return; }
    const list = await store.list();
    domain = (list || []).find(d => d.name === dName);
    if (!domain) { location.replace('../'); return; }
    document.getElementById('v-domain').textContent = domain.name;
    document.getElementById('d-status').innerHTML = domain.status === 'aktif'
        ? '<span class="pill pill-ok">Aktif</span>'
        : '<span class="pill pill-bad">Belum terverifikasi</span>';
    document.getElementById('d-created').textContent = fmtDate(domain.created_at || domain.created);
    document.getElementById('d-updated').textContent = fmtDate(domain.updated_at || domain.created_at || domain.created);
    document.getElementById('d-note').textContent = domain.note || '—';
    const enc = encodeURIComponent(domain.name);
    document.getElementById('lk-dns').href = '../kelola/dns/?domain=' + enc;
    document.getElementById('lk-ssl').href = '../kelola/ssl/?domain=' + enc;
    document.getElementById('lk-cache').href = '../kelola/cache/?domain=' + enc;
    document.getElementById('lk-zone').href = '../kelola/zone/?domain=' + enc;
    if (domain.status !== 'aktif') {
        const v = document.getElementById('d-verify');
        v.href = '../verifikasi/?domain=' + enc;
        v.classList.remove('hidden');
    }
    document.title = domain.name + ' — Detail Domain';
});

function openDelete() {
    if (!domain) return;
    document.getElementById('delete-domain-name').textContent = '"' + domain.name + '" akan dihapus dari daftar. Tindakan ini tidak dapat dibatalkan.';
    openModal('delete-modal');
}
function confirmDelete() {
    if (!domain) return;
    store.remove(domain.name).then(() => { closeModal('delete-modal'); location.href = '../'; });
}
</script>
