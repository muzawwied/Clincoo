<main class="flex-1 w-full max-w-2xl mx-auto pb-12 flex-col justify-start relative">

    <button onclick="location.href='../'" class="fixed top-3 left-3 w-10 h-10 flex items-center justify-center rounded-full bg-white backdrop-blur border border-gray-100 shadow-sm hover:bg-gray-50 transition-all cursor-pointer text-gray-700 hover:text-black z-50" aria-label="Kembali">

            <input id="domain-input" type="text" inputmode="url" autocomplete="off" spellcheck="false" placeholder="contoh.com"
                class="w-full bg-gray-50 border border-gray-200 rounded-full pl-11 pr-5 py-2.5 text-[15px] font-medium text-gray-900 placeholder-gray-400 focus:outline-none focus:border-gray-400 transition-colors">

        <p id="domain-error" class="hidden text-[12px] text-red-600 font-medium mt-1.5">Format domain tidak valid. Periksa kembali penulisan domain-mu.</p>
        <p id="domain-exists" class="hidden text-[12px] text-amber-600 font-medium mt-1.5">Domain ini sudah ada di daftarmu.</p>

    </div>

    <!-- CTA Lanjutkan — muncul saat input terisi domain valid -->
    <div class="fixed bottom-0 inset-x-0 z-40 pointer-events-none">
        <div id="cta-bar-bg" class="max-w-2xl mx-auto px-5 pb-5 pt-8 bg-gradient-to-t from-white via-white/90 to-transparent pointer-events-auto">
            <button id="cta-next" onclick="goNext()" class="hidden-cta w-full bg-accent text-white rounded-full py-3.5 text-[15px] font-bold hover:bg-accent-hover transition-all active:scale-[0.98] cursor-pointer shadow-md hover:shadow-lg flex items-center justify-center gap-2">

<script>
const input = document.getElementById('domain-input');
const cta = document.getElementById('cta-next');
const errEl = document.getElementById('domain-error');
const existsEl = document.getElementById('domain-exists');
let existingNames = [];
store.list().then(l => { existingNames = l.map(d => d.name); }).catch(() => {});

function isValidDomain(v) {
    const s = v.trim().toLowerCase();
    if (!s || /\s/.test(s)) return false;
    if (s.length > 253) return false;
    if (!/^[a-z0-9.-]+$/.test(s)) return false;
    const parts = s.split('.');
    if (parts.length < 2) return false;
    const tld = parts[parts.length - 1];
    if (!/^[a-z]{2,}$/.test(tld)) return false;
    return parts.every(p => p && p.length <= 63 && /^[a-z0-9]([a-z0-9-]*[a-z0-9])?$/.test(p));
}
function domainExists(name) {
    return existingNames.includes(name);
}
function check() {
    const v = input.value.trim().toLowerCase();
    const valid = isValidDomain(v);
    const exists = valid && domainExists(v);
    errEl.classList.toggle('hidden', !v || valid);
    existsEl.classList.toggle('hidden', !exists);
    cta.classList.toggle('hidden-cta', !valid || exists);
}
function goNext() {
    const v = input.value.trim().toLowerCase();
    if (!isValidDomain(v)) { check(); return; }
    if (domainExists(v)) { check(); return; }
    location.href = '../verifikasi/?domain=' + encodeURIComponent(v);
}
input.addEventListener('input', check);
input.addEventListener('keydown', e => { if (e.key === 'Enter' && !cta.classList.contains('hidden-cta')) goNext(); });
lucide.createIcons();
input.focus();
</script>
<script>try { lucide.createIcons(); } catch (e) {}</script>
