<script>
try { lucide.createIcons(); } catch (e) {}

let deletingId = null;

function goBack() { location.href = '../'; }

function fmtDate(iso) {
    const d = new Date(iso);
    return d.toLocaleDateString('id-ID', { day: 'numeric', month: 'short', year: 'numeric' });
}

let sortKey = 'created', sortDir = 'desc';
function sortBy(key) {
    if (sortKey === key) sortDir = sortDir === 'desc' ? 'asc' : 'desc';
    else { sortKey = key; sortDir = 'desc'; }
    render();
}
function updateSortIndicators() {
    const c = document.getElementById('sort-created'), u = document.getElementById('sort-updated');
    if (c) c.textContent = sortKey === 'created' ? (sortDir === 'desc' ? '\u2193' : '\u2191') : '';
    if (u) u.textContent = sortKey === 'updated' ? (sortDir === 'desc' ? '\u2193' : '\u2191') : '';
}

const PIN_KEY = 'clincoo_pinned_domains';
function getPinned() { try { return JSON.parse(localStorage.getItem(PIN_KEY)) || []; } catch (e) { return []; } }
function isPinned(name) { return getPinned().includes(name); }
function togglePin(name) {
    const p = getPinned();
    const i = p.indexOf(name);
    if (i === -1) p.push(name); else p.splice(i, 1);
    localStorage.setItem(PIN_KEY, JSON.stringify(p));
    render();
}

async function render() {
    const raw = await store.list();
    const skel = document.getElementById('table-skeleton');
    if (skel) skel.classList.add('hidden');
    updateSortIndicators();
    const list = raw.map(d => ({ id: d.id, name: d.name, note: d.note || '', status: d.status, created: d.created_at || d.created, updated: d.updated_at || d.created_at || d.created })).sort((a, b) => (isPinned(b.name) - isPinned(a.name)) || ((new Date(a[sortKey] || 0) - new Date(b[sortKey] || 0)) * (sortDir === 'desc' ? -1 : 1)));
    const q = (document.getElementById('search-input').value || '').toLowerCase().trim();
    const shown = q ? list.filter(d => d.name.toLowerCase().includes(q) || (d.note || '').toLowerCase().includes(q)) : list;
    const tbody = document.getElementById('domain-tbody');
    const empty = document.getElementById('empty-state');
    const card = document.getElementById('table-card');
    const searchWrap = document.getElementById('search-wrap');
    const noMatch = document.getElementById('no-match');
    const aktif = list.filter(d => d.status === 'aktif').length;
    const pending = list.length - aktif;
    if (!list.length) {
        empty.classList.remove('hidden'); empty.classList.add('flex');
        card.classList.add('hidden'); card.classList.remove('block');
        searchWrap.classList.add('hidden');
        noMatch.classList.add('hidden');
        lucide.createIcons();
        return;
    }
    empty.classList.add('hidden'); empty.classList.remove('flex');
    searchWrap.classList.remove('hidden');
    card.classList.remove('hidden'); card.classList.add('block');
    noMatch.classList.toggle('hidden', shown.length > 0);
    card.classList.toggle('hidden', shown.length === 0);
    lastList = list;
    if (!shown.length) { lucide.createIcons(); return; }
    {
        tbody.innerHTML = shown.map(d => `
            <tr class="group hover:bg-gray-50/60 transition-colors cursor-pointer" onclick="goDomain(this)">
                <td class="py-3.5 pr-4">
                    <div class="flex items-center gap-3">
                        <i data-lucide="globe" class="w-[18px] h-[18px] text-gray-400 shrink-0"></i>
                        <div class="min-w-0">
                            <p class="text-[15px] font-semibold text-gray-900 truncate"><a data-domain data-name="${esc(d.name)}" href="https://${d.name}" target="_blank" rel="noopener" onclick="event.stopPropagation()" class="hover:underline decoration-2 underline-offset-4 truncate">${d.name}</a></p>
                            ${d.note ? `<p class="text-[12px] text-gray-500 truncate mt-0.5">${esc(d.note)}</p>` : ''}
                        </div>
                    </div>
                </td>
                <td class="py-3.5 pr-4">
                    ${d.status === 'aktif' ? `
                    <span class="pill pill-ok">Aktif</span>` : `
                    <span class="pill pill-bad">Belum terverifikasi</span>`}
                </td>
                <td class="py-3.5 pr-4 text-[13px] text-gray-500 whitespace-nowrap">${fmtDate(d.created)}</td>
                <td class="py-3.5 pr-4 text-[13px] text-gray-500 whitespace-nowrap">${fmtDate(d.updated)}</td>
                <td class="py-3.5 text-right">
                    <div class="inline-flex items-center justify-end gap-0.5">
                        ${isPinned(d.name) ? '<i data-lucide="pin" class="w-3.5 h-3.5 text-accent shrink-0 fill-current" title="Disematkan"></i>' : ''}
                        <button onclick="openActions(event, '${d.id}')" class="w-8 h-8 inline-flex items-center justify-center cursor-pointer bg-transparent transition-colors hover:bg-gray-100 rounded-full" title="Aksi lainnya">
                            <i data-lucide="more-horizontal" class="w-[18px] h-[18px] text-gray-400"></i>
                        </button>
                    </div>
                </td>
            </tr>`).join('');
    }
    lucide.createIcons();
}

function goDomain(row) {
    const a = row.querySelector('a[data-domain]');
    if (!a) return;
    location.href = 'detail/?domain=' + encodeURIComponent(a.dataset.name);
}

function esc(s) { return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }

let actioningId = null;
let lastList = [];
let deleteName = null;
function openActions(evt, id) {
    evt.stopPropagation();
    const d = lastList.find(x => x.id === id); if (!d) return;
    actioningId = id;
    const rows = [];
    rows.push({ label: 'Detail Domain', action: `location.href='detail/?domain=' + encodeURIComponent('${esc(d.name)}')` });
    rows.push({ label: isPinned(d.name) ? 'Lepas Sematan' : 'Sematkan', action: `togglePin('${esc(d.name)}')` });
    if (d.status !== 'aktif') {
        rows.push({ label: 'Verifikasi Domain', action: `location.href='verifikasi/?domain=' + encodeURIComponent('${esc(d.name)}')` });
    }
    rows.push({ label: 'Kelola DNS', action: `location.href='kelola/dns/?domain=' + encodeURIComponent('${esc(d.name)}')` });
    rows.push({ label: 'SSL/TLS', action: `location.href='kelola/ssl/?domain=' + encodeURIComponent('${esc(d.name)}')` });
    rows.push({ label: 'Cache', action: `location.href='kelola/cache/?domain=' + encodeURIComponent('${esc(d.name)}')` });
    rows.push({ label: 'Pengaturan Zone', action: `location.href='kelola/zone/?domain=' + encodeURIComponent('${esc(d.name)}')` });
    rows.push({ label: 'Hapus Domain', action: `openDelete('${d.id}')`, danger: true });
    document.getElementById('actions-list').innerHTML = rows.map((r, i) => `
        <button onclick="closeActions(); ${r.action}" class="act-it${r.danger ? ' danger' : ''}">${r.label}</button>`).join('');

    const menu = document.getElementById('actions-menu');
    const backdrop = document.getElementById('actions-backdrop');
    menu.classList.remove('hidden'); backdrop.classList.remove('hidden');
    const btn = evt.currentTarget.getBoundingClientRect();
    const menuW = menu.offsetWidth;
    let left = btn.right - menuW;
    if (left < 8) left = 8;
    if (left + menuW > window.innerWidth - 8) left = window.innerWidth - 8 - menuW;
    let top = btn.bottom + 6;
    const menuH = menu.offsetHeight;
    if (top + menuH > window.innerHeight - 8) top = btn.top - menuH - 6;
    menu.style.left = left + 'px';
    menu.style.top = top + 'px';
}
function closeActions() {
    document.getElementById('actions-menu').classList.add('hidden');
    document.getElementById('actions-backdrop').classList.add('hidden');
}

function openDelete(id) {
    const d = lastList.find(x => x.id === id); if (!d) return;
    deletingId = id;
    deleteName = d.name;
    document.getElementById('delete-domain-name').textContent = '"' + d.name + '" akan dihapus dari daftar. Tindakan ini tidak dapat dibatalkan.';
    openModal('delete-modal');
}
function confirmDelete() {
    const name = deleteName || '';
    store.remove(name).then(() => { closeModal('delete-modal'); render(); });
}

function openModal(id) { document.getElementById(id).classList.remove('hidden'); document.getElementById(id).classList.add('flex'); }
function closeModal(id) { document.getElementById(id).classList.add('hidden'); document.getElementById(id).classList.remove('flex'); }

// Esc menutup lapisan paling atas lebih dulu
document.addEventListener('keydown', (e) => {
    if (e.key !== 'Escape') return;
    const isOpen = id => !document.getElementById(id).classList.contains('hidden');
    if (isOpen('delete-modal')) { closeModal('delete-modal'); return; }
    if (isOpen('actions-menu')) closeActions();
});

store.ready.then(render);
</script>
<script src="../../js/cta-loading.js?v=1"></script>
</body>
</html>
