        /* Scrollbar halaman disembunyikan — bar vertikal abu-abu di tepi kanan mengganggu tampilan */
        html, body { scrollbar-width: none; -ms-overflow-style: none; }

        :root{--bg:#fff;--fg:#0a0a0a;--mut:#5f6673;--line:#e8eaee;--card:#f6f7f9;--inv:#0a0a0a;--invfg:#fff;--glass:rgba(255,255,255,.82);--glow:rgba(99,102,241,.14)}
        /* Tema Gelap Dasar */
        body.dark-mode{--bg:#0a0a0a;--fg:#fff;--mut:#9aa1ad;--line:#232323;--card:#121212;--inv:#fff;--invfg:#0a0a0a;--glass:rgba(10,10,10,.82);--glow:rgba(129,140,248,.16)}
        body{font-family:'Plus Jakarta Sans',system-ui,sans-serif;background:var(--bg);color:var(--fg);line-height:1.6;-webkit-font-smoothing:antialiased;transition:background-color .3s ease,color .3s ease}
        .logo{display:flex;align-items:center;gap:.55rem;font-weight:700;font-size:1.25rem;letter-spacing:-.02em}
        .grad{font-style:normal;background:linear-gradient(90deg,#6366f1,#ec4899);-webkit-background-clip:text;background-clip:text;color:transparent}
        .btn{display:inline-flex;align-items:center;justify-content:center;gap:.55rem;min-height:3.1rem;padding:0 1.5rem;border-radius:9999px;font-weight:600;font-size:.95rem;border:1px solid var(--line);background:transparent;color:var(--fg);cursor:pointer;transition:transform .2s,opacity .2s,background .2s}
        .btn:hover{transform:translateY(-1px)}
        .btn:active{transform:scale(.98)}
        .btn.g:hover{background:var(--card)}
        .btn.p{background:var(--inv);color:var(--invfg);border-color:var(--inv)}
        .btn.p:hover{opacity:.85}
        .btn:disabled:hover{transform:none}
        .note{font-size:.78rem;line-height:1.6;color:var(--mut);margin:1.4rem auto 0;max-width:19rem;text-align:center;text-wrap:balance}

        body.dark-mode #hero-panel::before{background:linear-gradient(180deg,var(--glass) 0%,var(--bg) 92%),url('https://app.clincoo.buzz/assets/backgrounds/bg-dark-night2.webp') 70% 30%/cover}
        
        /* Menghilangkan panah pada input number & auto-fill styling */
        input:-webkit-autofill,
        input:-webkit-autofill:hover, 
        input:-webkit-autofill:focus, 
        input:-webkit-autofill:active{
            -webkit-box-shadow: 0 0 0 30px transparent inset !important;
            transition: background-color 5000s ease-in-out 0s;
        }
        body.dark-mode input:-webkit-autofill {
            -webkit-text-fill-color: #fff !important;
        }

        /* Animasi */
        .animate-fade-in { animation: fadeIn 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        @keyframes fadeIn { 
            from { opacity: 0; transform: translateY(8px); } 
            to { opacity: 1; transform: translateY(0); } 
        }

        /* Loader */
        .loader {
            border: 2.5px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top: 2.5px solid #fff;
            width: 18px;
            height: 18px;
            animation: spin 0.8s linear infinite;
            display: inline-block;
        }
        body.dark-mode .loader {
            border: 2.5px solid rgba(0,0,0,0.2);
            border-top: 2.5px solid #000;
        }
        .loader-lg {
            border: 3px solid rgba(0,0,0,0.15);
            border-radius: 50%;
            border-top: 3px solid #000;
            width: 40px;
            height: 40px;
            animation: spin 0.8s linear infinite;
            display: inline-block;
        }
        body.dark-mode .loader-lg {
            border: 3px solid rgba(255,255,255,0.25);
            border-top: 3px solid #fff;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        /* ==== Panel Hero 3D (split-screen login ala Cloudflare) ==== */
        .hero-grid {
            background-image: linear-gradient(to right, var(--line) 1px, transparent 1px), linear-gradient(to bottom, var(--line) 1px, transparent 1px);
            background-size: 48px 48px;
            -webkit-mask-image: radial-gradient(ellipse at center, black 30%, transparent 75%);
            mask-image: radial-gradient(ellipse at center, black 30%, transparent 75%);
        }
        body.dark-mode .hero-grid {
            background-image: linear-gradient(to right, rgba(255,255,255,0.05) 1px, transparent 1px), linear-gradient(to bottom, rgba(255,255,255,0.05) 1px, transparent 1px);
        }
        .hero-glow { background: radial-gradient(circle, rgba(99,102,241,.22), transparent 65%); }
        .hero-glow2 { background: radial-gradient(circle, rgba(236,72,153,.16), transparent 65%); }
        body.dark-mode .hero-glow { background: radial-gradient(circle, rgba(129,140,248,.26), transparent 65%); }
        body.dark-mode .hero-glow2 { background: radial-gradient(circle, rgba(236,72,153,.20), transparent 65%); }
        .scene { perspective: 900px; }
        .cube { width: 130px; height: 130px; position: relative; transform-style: preserve-3d; animation: cubeSpin 18s linear infinite; }
        /* Muka kubus HARUS opaque supaya cincin sisi belakang beneran ketutup (ilusi Saturnus) */
        .cube .face { position: absolute; inset: 0; border: 1.5px solid rgba(99,102,241,.35); border-radius: 18px; background: #e0e7ff; }
        .cube .f-top { background: #eef1ff; }
        .cube .f-front { background: #e0e7ff; }
        .cube .f-back { background: #d2dafb; }
        .cube .f-left, .cube .f-right { background: #dae1fd; }
        .cube .f-bottom { background: #ccd5f6; }
        body.dark-mode .cube .face { border-color: rgba(165,180,252,.35); background: #1d1f30; }
        body.dark-mode .cube .f-top { background: #24273d; }
        body.dark-mode .cube .f-front { background: #1d1f30; }
        body.dark-mode .cube .f-back { background: #14151f; }
        body.dark-mode .cube .f-left, body.dark-mode .cube .f-right { background: #191b29; }
        body.dark-mode .cube .f-bottom { background: #101119; }
        .cube .f-front  { transform: rotateY(0deg) translateZ(65px); }
        .cube .f-back   { transform: rotateY(180deg) translateZ(65px); }
        .cube .f-left   { transform: rotateY(-90deg) translateZ(65px); }
        .cube .f-right  { transform: rotateY(90deg) translateZ(65px); }
        .cube .f-top    { transform: rotateX(90deg) translateZ(65px); }
        .cube .f-bottom { transform: rotateX(-90deg) translateZ(65px); }
        @media (prefers-reduced-motion: reduce) { .cube, .cube-wrap, .cube-sm, .cube-xs, .cube-shadow, .float-card, .hero-dot { animation: none !important; } }

        /* Kubus utama: bungkus agar bisa mengambang naik-turun */
        .cube-wrap { position: relative; transform-style: preserve-3d; animation: floatY 6s ease-in-out infinite; }
        /* Putaran kubus lebih hidup: kemiringan berganti-ganti halus */
        /* Bayangan elips di bawah kubus yang "bernapas" mengikuti float */
        .cube-shadow { position: absolute; bottom: -52px; left: 50%; width: 130px; height: 28px; margin-left: -65px; border-radius: 9999px; background: radial-gradient(ellipse, rgba(0,0,0,0.22), transparent 70%); filter: blur(3px); animation: shadowBreath 6s ease-in-out infinite; }
        body.dark-mode .cube-shadow { background: radial-gradient(ellipse, rgba(0,0,0,0.9), transparent 70%); }
        /* Kubus kecil pendamping: 2 buah, melayang + berputar berlawanan */
        .cube-sm { width: 56px; height: 56px; position: absolute; transform-style: preserve-3d; }
        .cube-sm .face { border-width: 1px; border-radius: 10px; border: 1px solid rgba(139,92,246,.40); background: #ede9fe; }
        body.dark-mode .cube-sm .face { border-color: rgba(167,139,250,.40); background: #211b3a; }
        .cube-sm .f-front  { transform: rotateY(0deg) translateZ(28px); }
        .cube-sm .f-back   { transform: rotateY(180deg) translateZ(28px); }
        .cube-sm .f-left   { transform: rotateY(-90deg) translateZ(28px); }
        .cube-sm .f-right  { transform: rotateY(90deg) translateZ(28px); }
        .cube-sm .f-top    { transform: rotateX(90deg) translateZ(28px); }
        .cube-sm .f-bottom { transform: rotateX(-90deg) translateZ(28px); }
        .cs-a { right: -108px; bottom: -70px; animation: spinRev 14s linear infinite; }
        .cube-xs { width: 40px; height: 40px; position: absolute; transform-style: preserve-3d; }
        .cube-xs .face { border-width: 1px; border-radius: 8px; border: 1px solid rgba(236,72,153,.38); background: #fce7f3; }
        body.dark-mode .cube-xs .face { border-color: rgba(244,114,182,.40); background: #2d1526; }
        .cube-xs .f-front  { transform: rotateY(0deg) translateZ(20px); }
        .cube-xs .f-back   { transform: rotateY(180deg) translateZ(20px); }
        .cube-xs .f-left   { transform: rotateY(-90deg) translateZ(20px); }
        .cube-xs .f-right  { transform: rotateY(90deg) translateZ(20px); }
        .cube-xs .f-top    { transform: rotateX(90deg) translateZ(20px); }
        .cube-xs .f-bottom { transform: rotateX(-90deg) translateZ(20px); }
        .cs-b { left: -96px; top: -34px; animation: spinFwd 11s linear infinite; }
        /* Cincin orbit ala Saturnus: dibagi 2 setengah supaya keliatan MENGELILINGI kubus,
           bukan menembusnya. Setengah "back" (sisi jauh) digambar sebelum kubus,
           setengah "front" (sisi dekat) digambar setelah kubus. */
        .orbit-ring { position: absolute; top: 50%; left: 50%; border-radius: 9999px; }
        .orbit-ring.back  { clip-path: inset(0 0 50% 0); }
        .orbit-ring.front { clip-path: inset(50% 0 0 0); }
        .ring-a { width: 230px; height: 230px; margin: -115px 0 0 -115px; border: 1.5px dashed rgba(99,102,241,.45);  }
        body.dark-mode .ring-a { border-color: rgba(165,180,252,.40); }
        .ring-b { width: 172px; height: 172px; margin: -86px 0 0 -86px; border: 1px solid rgba(99,102,241,.22);  }
        body.dark-mode .ring-b { border-color: rgba(165,180,252,.20); }
        /* Kartu mini melayang (ala Vercel marketing) */
        .float-card { position: absolute; display: flex; align-items: center; gap: 8px; padding: 8px 14px; border-radius: 9999px; background: var(--bg); border: 1px solid var(--line); box-shadow: 0 10px 28px var(--glow); font-size: 12px; font-weight: 500; color: var(--fg); white-space: nowrap; }
        body.dark-mode .float-card { box-shadow: 0 10px 28px rgba(0,0,0,0.55); }
        .float-card svg { width: 14px; height: 14px; color: #6366f1; }
        body.dark-mode .float-card svg { color: #818cf8; }
        .fc-1 { top: -38px; left: -128px; animation: floatY 5s ease-in-out infinite; }
        .fc-2 { top: 34px; right: -142px; animation: floatY 6.5s ease-in-out -2s infinite; }
        .fc-3 { bottom: -44px; left: -72px; animation: floatY 7s ease-in-out -4s infinite; }
        /* Titik-titik mengambang */
        .hero-dot { position: absolute; border-radius: 9999px; background: rgba(99,102,241,.45); }
        body.dark-mode .hero-dot { background: rgba(165,180,252,.50); }
        .dot-1 { width: 8px; height: 8px; top: 18%; left: 16%; animation: dotDrift 7s ease-in-out infinite; }
        .dot-2 { width: 5px; height: 5px; top: 30%; right: 20%; animation: dotDrift 9s ease-in-out -3s infinite; }
        .dot-3 { width: 6px; height: 6px; bottom: 24%; left: 24%; animation: dotDrift 8s ease-in-out -5s infinite; }
        .dot-4 { width: 4px; height: 4px; bottom: 32%; right: 26%; animation: dotDrift 10s ease-in-out -2s infinite; }
        .dot-5 { width: 5px; height: 5px; top: 55%; left: 10%; animation: dotDrift 9s ease-in-out -6s infinite; }
        /* Chip fitur */
        .chip { font-size: 12px; font-weight: 500; padding: 7px 16px; border-radius: 9999px; border: 1px solid var(--line); color: var(--fg); background: var(--bg); }
        body.dark-mode .chip { background: var(--bg); }

        /* Keyframes animasi hero */
        @keyframes cubeSpin { 0% { transform: rotateX(-22deg) rotateY(0deg); } 50% { transform: rotateX(-14deg) rotateY(180deg); } 100% { transform: rotateX(-22deg) rotateY(360deg); } }
        @keyframes spinFwd { from { transform: rotateX(24deg) rotateY(0deg); } to { transform: rotateX(24deg) rotateY(360deg); } }
        @keyframes spinRev { from { transform: rotateX(-18deg) rotateY(360deg); } to { transform: rotateX(-18deg) rotateY(0deg); } }
        @keyframes floatY { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-12px); } }
        @keyframes shadowBreath { 0%, 100% { transform: scaleX(1); opacity: 1; } 50% { transform: scaleX(0.8); opacity: 0.6; } }
        @keyframes dotDrift { 0%, 100% { transform: translate(0, 0); opacity: 0.5; } 50% { transform: translate(6px, -10px); opacity: 1; } }

        /* Fokus keyboard terlihat */
        :focus-visible { outline: 2px solid #111; outline-offset: 3px; }
        body.dark-mode :focus-visible { outline-color: #fff; }

        /* Tombol login: state nonaktif + spinner kecil yang ikut warna teks */
        button:disabled { opacity: 0.6; cursor: not-allowed; }
        .loader-btn { width: 20px; height: 20px; border: 2px solid currentColor; border-top-color: transparent; border-radius: 50%; animation: spin 0.8s linear infinite; display: inline-block; flex-shrink: 0; }

        /* Tinggi layar dinamis di HP (address bar naik-turun) */
        @supports (height: 100dvh) { html .min-h-screen { min-height: 100dvh; } }
    </style>

            <!-- Sistem Modal -->
    <div id="system-modal" class="fixed inset-0 z-50 hidden items-center justify-center px-4">
        <div class="absolute inset-0 bg-black/40 dark:bg-black/70 backdrop-blur-sm" onclick="closeModal()"></div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            try { lucide.createIcons(); } catch (e) {}
        });


        
        // ==== KONFIG AUTH ====
        const API_BASE = 'https://clincoo-be2.pages.dev/api/auth';
        const TOKEN_KEY = 'clincoo_auth_token';
        // ?next= ditangkap sekali di awal (sebelum replaceState menghapus query).
        // Hanya path same-origin diterima (mulai '/', bukan '//' dan tanpa '://').
        const CLINCOO_NEXT = (function () {
            try {
                var n = new URLSearchParams(window.location.search).get('next');
                if (n && n.charAt(0) === '/' && n.charAt(1) !== '/' && n.indexOf('://') === -1) return n;
            } catch (e) {}
            return '';
        })();
        function clincooNextTarget(def) { return CLINCOO_NEXT || def || '../'; }
        const GITHUB_CLIENT_ID = 'Ov23ctIBGjQBolR5PS2C';

        function saveSession(data) {
            try {
                localStorage.setItem(TOKEN_KEY, data.token);
                // simpan user lebih dulu -> data profil di bawah otomatis masuk namespace akun
                localStorage.setItem('clincoo_auth_user', JSON.stringify(data.user || {}));
                localStorage.setItem('clincoo_fullname', data.user.name || '');
                localStorage.setItem('clincoo_email', data.user.email || '');
                if (data.user.avatar_url) localStorage.setItem('clincoo_profile_pic', data.user.avatar_url);
            } catch (e) {}
        }


        // Helper cookie untuk state OAuth (lebih tahan redirect lintas-domain daripada
        // localStorage/sessionStorage di beberapa browser dengan anti bounce-tracking).
        function setOauthStateCookie(val, provider) {
            const payload = encodeURIComponent(JSON.stringify({ v: val, t: Date.now(), p: provider }));
            document.cookie = 'clincoo_oauth_state=' + payload + '; Max-Age=900; Path=' + window.location.pathname + '; SameSite=Lax; Secure';
        }
        function getOauthStateCookie() {
            const m = document.cookie.match(/(?:^|;\s*)clincoo_oauth_state=([^;]+)/);
            return m ? decodeURIComponent(m[1]) : null;
        }
        function clearOauthStateCookie() {
            document.cookie = 'clincoo_oauth_state=; Max-Age=0; Path=' + window.location.pathname + '; SameSite=Lax; Secure';
        }

        // ==== LOGIN SOSIAL (OAuth) ====
        // redirect_uri WAJIB persis alamat terdaftar di GitHub OAuth App & Google Console.
        // Halaman auth kini dilayani bersih di /auth/ (auth/index/), tapi callback
        // OAuth tetap diarahkan ke alamat lama yang terdaftar (akun/auth.html), yang
        // kini cuma pengalih ke sini — jadi tidak perlu daftar ulang di Google/GitHub.
        function oauthRedirectUri() {
            if (location.hostname === 'localhost' || location.hostname === '127.0.0.1')
                return window.location.origin + window.location.pathname;
            if (location.hostname === 'muzawwied.github.io')
                return 'https://muzawwied.github.io/Clincoo./akun/auth.html';
            // Dinamis ikut domain aktif (app.clincoo.buzz, clincoo.pages.dev, dst) —
            // WAJIB semua domain yang dipakai didaftarkan di Google Console & GitHub OAuth App.
            return location.origin + '/auth/';
        }
        // ==== ANTI-BOT Cloudflare Turnstile ====
        // Dormant sampai admin mengisi TURNSTILE_SITEKEY + TURNSTILE_SECRET di env_vars.
        // Begitu diisi: widget muncul otomatis & login wajib lolos verifikasi bot.
        let _tsSiteKey = null, _tsWidgetId = null, _tsToken = null;
        function setupTurnstile(siteKey) {
            return new Promise((resolve) => {
                _tsSiteKey = siteKey;
                if (!siteKey) { resolve(null); return; }
                const ensureBox = () => {
                    let box = document.getElementById('ts-widget');
                    if (!box) {
                        box = document.createElement('div');
                        box.id = 'ts-widget';
                        box.className = 'mt-5 flex justify-center';
                        const anchor = document.querySelector('[onclick^="startOAuth"]');
                        (anchor && anchor.parentElement ? anchor.parentElement : document.body).appendChild(box);
                    }
                    return box;
                };
                const render = () => {
                    try {
                        if (_tsWidgetId !== null && window.turnstile) { try { window.turnstile.remove(_tsWidgetId); } catch (e2) {} _tsWidgetId = null; }
                        _tsToken = null;
                        _tsWidgetId = window.turnstile.render(ensureBox(), {
                            sitekey: siteKey,
                            callback: (t) => { _tsToken = t; resolve(t); },
                            'expired-callback': () => { _tsToken = null; },
                            'error-callback': () => resolve(null)
                        });
                    } catch (e) { resolve(null); }
                };
                if (window.turnstile) { render(); return; }
                window.__tsReady = render;
                const s = document.createElement('script');
                s.src = 'https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit&onload=__tsReady';
                s.onerror = () => resolve(null);
                document.head.appendChild(s);
            });
        }

        // State loading tombol login: cegah klik ganda + beri umpan balik
        function setOAuthBusy(provider) {
            document.querySelectorAll('[onclick^="startOAuth"]').forEach(function (b) {
                b.disabled = true;
                if (b.getAttribute('onclick').indexOf("'" + provider + "'") !== -1) {
                    b.setAttribute('aria-busy', 'true');
                    b.dataset.html = b.innerHTML;
                    var svg = b.querySelector('svg');
                    if (svg) svg.outerHTML = '<span class="loader-btn" aria-hidden="true"></span>';
                }
            });
        }
        function resetOAuthButtons() {
            document.querySelectorAll('[onclick^="startOAuth"]').forEach(function (b) {
                b.disabled = false;
                b.removeAttribute('aria-busy');
                if (b.dataset.html) { b.innerHTML = b.dataset.html; delete b.dataset.html; }
            });
        }
        // Tombol "Kembali" browser (bfcache) -> pulihkan tombol
        window.addEventListener('pageshow', function (e) { if (e.persisted) resetOAuthButtons(); });

        function startOAuth(provider) {
            setOAuthBusy(provider);
            const redirectUri = oauthRedirectUri();
            // State acak per sesi — cegah serangan login-CSRF (callback jahat memaksa
            // korban login ke akun penyerang). Callback harus mengembalikan state ini.
            const st = (crypto.randomUUID ? crypto.randomUUID() : ('s' + Date.now() + Math.random())).replace(/-/g, '');
            // Cookie (bukan localStorage/sessionStorage) — beberapa browser (Samsung
            // Internet, Firefox, Brave) punya fitur anti "bounce tracking" yang otomatis
            // MENGHAPUS localStorage yang baru ditulis persis sebelum redirect ke domain
            // lain (github.com/accounts.google.com), jadi state selalu hilang saat kembali.
            // Cookie SameSite=Lax dikecualikan dari itu karena memang untuk alur ini.
            // Payload menyimpan provider (p) juga -> deteksi provider saat callback,
            // karena state sekarang acak, bukan literal 'github'/'google'.
            setOauthStateCookie(st, provider);
            if (provider === 'github') {
                window.location.href = 'https://github.com/login/oauth/authorize?client_id=' + GITHUB_CLIENT_ID +
                    '&scope=read:user%20user:email%20repo&state=' + st + '&redirect_uri=' + encodeURIComponent(redirectUri);
            } else {
                fetch(API_BASE + '/google')
                    .then(r => r.json())
                    .then(data => {
                        if (!data.client_id) throw new Error(data.error || 'Client ID Google tidak tersedia.');
                        window.location.href = 'https://accounts.google.com/o/oauth2/v2/auth?client_id=' + data.client_id +
                            '&redirect_uri=' + encodeURIComponent(redirectUri) +
                            '&response_type=code&scope=openid%20email%20profile&state=' + st + '&prompt=select_account';
                    })
                    .catch(err => {
                        resetOAuthButtons();
                        // [11 Okt] server deployment sedang ditingkatkan (config OAuth tidak terbaca):
                        // arahkan SEKALI ke halaman tunggu + game offline; halaman itu otomatis kembali
                        // ke Clincoo begitu sistem normal. Jangan loop: pakai penanda sesi.
                        var _isDown = /belum dikonfigurasi|tidak tersedia|gangguan/i.test(String(err.message || ''));
                        if (_isDown && !sessionStorage.getItem('clincoo_maint_bounce')) {
                            sessionStorage.setItem('clincoo_maint_bounce', '1');
                            window.location.href = '/maintenance.html';
                            return;
                        }
                        showModal('Gagal Memulai Login Google', err.message, 'error');
                    });
            }
        }

        async function handleOAuthCallback(code, provider) {
            const redirectUri = oauthRedirectUri();
            window.history.replaceState({}, document.title, window.location.pathname);
            try {
                const send = (tok) => fetch(API_BASE + '/' + provider, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(Object.assign({ code: code, redirect_uri: redirectUri }, tok ? { turnstile_token: tok } : {}))
                });
                let res = await send(_tsToken);
                let data = await res.json();
                // Token Turnstile bisa kedaluwarsa saat user lama di halaman Google/GitHub -> minta baru & ulang
                if (res.status === 403 && data && data.need_turnstile && _tsSiteKey) {
                    const t = await setupTurnstile(_tsSiteKey);
                    if (t) { res = await send(t); data = await res.json(); }
                }
                if (!res.ok || !data.token) throw new Error(data.error || 'Login ' + provider + ' gagal.');
                saveSession(data);

                setTimeout(() => { window.location.href = clincooNextTarget(); }, 400);
            } catch (err) {
                document.getElementById('oauth-loading').classList.add('hidden');
                showModal('Login ' + (provider === 'github' ? 'GitHub' : 'Google') + ' Gagal', err.message, 'error');
            }
        }

        // Handle callback OAuth & sesi aktif saat halaman dibuka
        document.addEventListener('DOMContentLoaded', () => {
            // Anti-bot: pramuat pengaturan Turnstile (diam bila belum dikonfigurasi)
            fetch(API_BASE + '/google').then(r => r.json())
                .then(d => { if (d && d.turnstile_sitekey) setupTurnstile(d.turnstile_sitekey); })
                .catch(() => {});
            const params = new URLSearchParams(window.location.search);
            const code = params.get('code');
            const oauthError = params.get('error');

            // ==== KONEKTOR GOOGLE DRIVE (halaman Plugin) ====
            // OAuth Drive memakai redirect_uri /auth/ yang SUDAH terdaftar di Google
            // Console. Cookie state khusus (Path=/) menandai callback ini sebagai alur
            // KONEKTOR, bukan login Clincoo -> kirim code balik ke halaman Plugin.
            // Konektor Google (Drive / Calendar) — cookie state khusus menandai alur KONEKTOR.
            const connCookie = (function (names) {
                for (const nm of names) {
                    const m = document.cookie.match(new RegExp('(?:^|;\\s*)' + nm + '=([^;]+)'));
                    if (m) return { name: nm, raw: decodeURIComponent(m[1]) };
                }
                return null;
            })(['clincoo_drive_state', 'clincoo_calendar_state']);
            if ((code || oauthError) && connCookie) {
                let dc = null; try { dc = JSON.parse(connCookie.raw); } catch (e) {}
                document.cookie = connCookie.name + '=; Max-Age=0; Path=/; SameSite=Lax; Secure';
                window.history.replaceState({}, document.title, window.location.pathname);
                const back = (dc && dc.back) || '/integrasi/';
                const sep = back.indexOf('?') === -1 ? '?' : '&';
                const pfx = connCookie.name.indexOf('calendar') !== -1 ? 'calendar' : 'drive';
                window.location.replace(back + sep + (code ? pfx + '_code=' + encodeURIComponent(code) : pfx + '_error=' + encodeURIComponent(oauthError || 'dibatalkan')));
                return;
            }

            if (code) {
                // Deteksi provider dari state tersimpan (cookie). Tanpa validasi blokir:
                // selalu lanjut login, tanpa popup pemblokir.
                const savedRaw = getOauthStateCookie();
                let savedProvider = 'github';
                try {
                    const parsed = JSON.parse(savedRaw || 'null');
                    if (parsed && parsed.p === 'google') savedProvider = 'google';
                } catch (e) {}
                clearOauthStateCookie();
                document.getElementById('oauth-loading').classList.remove('hidden');
                handleOAuthCallback(code, savedProvider);
            } else if (oauthError) {
                showModal('Login Dibatalkan', 'Proses login dibatalkan atau gagal. Silakan coba lagi.', 'error');
            }

            // Kalau sesi masih aktif, langsung ke beranda
            (async () => {
                try {
                    const token = localStorage.getItem(TOKEN_KEY);
                    if (!token) return;
                    const res = await fetch(API_BASE + '/me', { headers: { 'Authorization': 'Bearer ' + token } });
                    if (res.ok) {
                        const d = await res.json();
                        if (d.authenticated) window.location.replace(clincooNextTarget());
                    } else {
                        localStorage.removeItem(TOKEN_KEY);
                    }
                } catch (e) {}
            })();
        });

                // Fungsi Modal
        function showModal(title, message, type = 'success') {
            var modal = document.getElementById('system-modal');
            if (!modal) return;
            document.getElementById('modal-title').textContent = title;
            document.getElementById('modal-message').textContent = message;
            var iconWrap = document.getElementById('modal-icon-wrap');
            var icons = { success: 'check-circle', error: 'alert-circle', info: 'info' };
            var colors = {
                success: 'bg-emerald-50 dark:bg-emerald-500/10 text-emerald-600 dark:text-emerald-400',
                error: 'bg-red-50 dark:bg-red-500/10 text-red-600 dark:text-red-400',
                info: 'bg-blue-50 dark:bg-blue-500/10 text-blue-600 dark:text-blue-400'
            };
            var t = colors[type] ? type : 'success';
            iconWrap.className = 'w-12 h-12 rounded-full flex items-center justify-center mb-4 mx-auto ' + colors[t];
            iconWrap.innerHTML = '<i data-lucide="' + icons[t] + '" class="w-6 h-6"></i>';
            try { lucide.createIcons(); } catch (e) {}
            modal.classList.remove('hidden');
            modal.classList.add('flex');
        }

        function closeModal() {
            var modal = document.getElementById('system-modal');
            modal.classList.add('hidden');
            modal.classList.remove('flex');
        }
    </script>
