<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Sesi uji</title>
</head>
<body style="background:#000;color:#888;font-family:system-ui,sans-serif;padding:40px;text-align:center">
<p>Menyiapkan sesi uji…</p>
<script>
// HALAMAN BANTU UJI SATU KALI — dihapus setelah verifikasi.
// Token datang dari fragment URL (tidak pernah dikirim ke server).
(function () {
  try {
    var m = location.hash.match(/[#&]t=([a-f0-9]{16,128})/);
    var pid = (location.hash.match(/[#&]p=([A-Za-z0-9_\-]+)/) || [])[1] || '';
    if (!m) { document.body.innerHTML = 'Token sesi uji tidak ditemukan.'; return; }
    localStorage.setItem('clincoo_auth_token', m[1]);
    localStorage.setItem('clincoo_fullname', 'Devconium');
    localStorage.setItem('clincoo_email', 'devconium@gmail.com');
    localStorage.setItem('clincoo_auth_user', JSON.stringify({ id: 6, name: 'Devconium', email: 'devconium@gmail.com' }));
    location.replace('/proyek/chat/' + (pid ? '?id=' + encodeURIComponent(pid) : ''));
  } catch (e) { document.body.innerHTML = 'Gagal: ' + e.message; }
})();
</script>
</body>
</html>
